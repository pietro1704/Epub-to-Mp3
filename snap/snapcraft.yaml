name: epub-to-mp3
version: '0.1.0'
summary: Convert EPUB/PDF ebooks into MP3 audiobooks
description: |
  Epub to Mp3 converts EPUB and PDF ebooks into MP3 audiobooks using neural
  text-to-speech engines. Supports Edge-TTS (cloud), Kokoro (local neural),
  and Piper (fully offline) with automatic fallback between engines.

  Features:
  - EPUB and PDF support with full TOC hierarchy
  - Three TTS engines with automatic fallback
  - Smart text cache — repeated conversions skip re-parsing
  - Per-chapter progress tracking and streaming playback
  - Batch conversion of multiple books

confinement: strict
grade: stable
base: core22
compression: lzo

apps:
  epub-to-mp3:
    command: bin/epub-to-mp3
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-bind
      - audio-playback

parts:
  # ── Python sidecar (PyInstaller) ──────────────────────────────────────────
  python-sidecar:
    plugin: nil
    source: .
    build-packages:
      - python3.11
      - python3.11-dev
      - python3-pip
      - libssl-dev
      - pkg-config
    override-build: |
      pip3 install --quiet pyinstaller
      pip3 install --quiet -r requirements-desktop.txt
      pyinstaller desktop.spec --noconfirm --clean
      mkdir -p $SNAPCRAFT_PART_INSTALL/lib/epub-to-mp3
      cp dist/epub-to-mp3-server $SNAPCRAFT_PART_INSTALL/lib/epub-to-mp3/
      chmod +x $SNAPCRAFT_PART_INSTALL/lib/epub-to-mp3/epub-to-mp3-server

  # ── Tauri app (Rust) ──────────────────────────────────────────────────────
  tauri-app:
    after: [python-sidecar]
    plugin: rust
    source: desktop
    rust-channel: stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libappindicator3-dev
      - librsvg2-dev
      - patchelf
      - libssl-dev
      - pkg-config
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libappindicator3-1
      - librsvg2-2
    override-build: |
      # Place sidecar where Tauri expects it before building
      TRIPLE=$(rustc -Vv | grep "^host" | cut -d' ' -f2)
      mkdir -p src-tauri/binaries
      cp $SNAPCRAFT_STAGE/lib/epub-to-mp3/epub-to-mp3-server \
         src-tauri/binaries/epub-to-mp3-server-${TRIPLE}
      chmod +x src-tauri/binaries/epub-to-mp3-server-${TRIPLE}
      cargo build --release --manifest-path src-tauri/Cargo.toml
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp src-tauri/target/release/epub-to-mp3 $SNAPCRAFT_PART_INSTALL/bin/
      chmod +x $SNAPCRAFT_PART_INSTALL/bin/epub-to-mp3

  # ── Desktop metadata and icon ─────────────────────────────────────────────
  desktop-files:
    plugin: nil
    source: .
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/share/applications
      mkdir -p $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/128x128/apps
      cp flatpak/io.github.pietro1704.EpubToMp3.desktop \
         $SNAPCRAFT_PART_INSTALL/share/applications/
      cp desktop/src-tauri/icons/128x128.png \
         $SNAPCRAFT_PART_INSTALL/share/icons/hicolor/128x128/apps/io.github.pietro1704.EpubToMp3.png
