<!DOCTYPE html>
<html>
<head>
    <title>Test Upload</title>
</head>
<body>
    <h1>Test API Upload</h1>
    <input type="file" id="fileInput" accept=".epub,.pdf">
    <button onclick="testUpload()">Upload</button>
    <div id="result"></div>

    <script>
        async function testUpload() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                alert('Select a file first');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('engine', 'edge');
            formData.append('voice', 'pt-BR-FranciscaNeural');

            try {
                console.log('Sending request to /api/convert...');
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                document.getElementById('result').innerHTML = `
                    <h2>Success!</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <h2>Error!</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
