org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The app embeds only the ARM64 converter runtime. Keep Flutter from adding
# other ABIs from transitive plugin dependencies to the default NDK filters.
disable-abi-filtering=true
# Flutter 3.47 supports built-in Kotlin while retaining the legacy AGP DSL.
android.newDsl=false
android.builtInKotlin=true
