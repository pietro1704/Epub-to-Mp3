<html xmlns="http://www.w3.org/1999/xhtml" lang="pt-BR">
<head><title>Structured chapter</title><style>p { text-indent: 1em; } em { font-style: italic; }</style></head>
<body><h1 id="chapter">A chapter with structure</h1>
<p>First paragraph with <em>emphasis</em>, <strong>strong text</strong> and ação 🐧.</p>
<p>A repeated passage. A repeated passage.</p>
<p>Read the <a href="#note">footnote</a> and <a href="#chapter">return to the heading</a>.</p>
<blockquote>Quoted prose remains a separate block.</blockquote>
<ol><li>First entry</li><li>Second entry</li></ol>
<aside id="note"><p>A note with its own source anchor.</p></aside>
</body></html>
