name: flutter_app
description: "Epub to MP3 audiobook reader+player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  web_socket_channel: ^3.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  convert: ^3.1.2
  crypto: ^3.0.8
  ffi: ^2.2.0
  file_picker: ^13.3.2
  archive: ^4.6.0
  xml: ^7.1.0
  uuid: ^4.6.0
  flutter_html: ^3.0.0
  html: 0.15.6
  pdfrx: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

# flutter_html 3.0.0 imports html's internal matches function, removed in 0.15.7.
# Keep the latest compatible release until the renderer uses the public API.
dependency_overrides:
  html: 0.15.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Legacy compatibility assets. Active Android/Linux/Windows conversion
    # uses embedded Rust bindings; Python/Chaquopy is not a runtime dependency.
    # Keeping these assets does not select a Python conversion backend.
    - assets/python_app/src/
