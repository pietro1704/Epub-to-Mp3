name: flutter_app
description: "Epub to MP3 audiobook reader+player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  just_audio_media_kit:
    path: vendor/just_audio_media_kit
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.19
  dbus: ^0.8.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  convert: ^3.1.2
  crypto: ^3.0.8
  ffi: ^2.2.0
  file_picker: ^13.3.2
  archive: ^4.6.0
  xml: ^7.1.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  flutter_html: ^3.0.0
  html: 0.15.6
  pdfrx: ^2.12.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1
  just_audio_platform_interface: ^4.6.0
  plugin_platform_interface: ^2.1.8
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

# flutter_html 3.0.0 imports html's internal matches function, removed in 0.15.7.
# Keep the latest compatible release until the renderer uses the public API.
dependency_overrides:
  html: 0.15.6

flutter:
  uses-material-design: true
  generate: true
