name: flutter_app
description: "Epub to MP3 audiobook reader+player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  crypto: ^3.0.7
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Synced from python_app/src/ by
    # flutter_app/scripts/bootstrap-desktop-python.sh. Bundled into
    # Linux / Windows desktop builds and extracted to a tmp dir at
    # runtime so PYTHONPATH can point at it. Android uses Chaquopy
    # (android/app/src/main/python/) and macOS/iOS use the SwiftUI app,
    # so the asset is harmless on those platforms.
    - assets/python_app/src/
