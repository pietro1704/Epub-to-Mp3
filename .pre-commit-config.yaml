repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes"]
        files: "\\.py$"
      - id: ruff-format
        files: "\\.py$"
  # Reuse the stable versions resolved by web/package-lock.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: mise exec -- web/node_modules/.bin/prettier
        args: ["--write", "--config", "web/.prettierrc.json"]
        files: "^web/.*\\.(ts|tsx|js|jsx|json|css|md|html)$"
      - id: eslint
        name: eslint
        language: system
        entry: mise exec -- web/node_modules/.bin/eslint
        args: ["--fix", "--config", "web/eslint.config.js", "--max-warnings=0", "web/src"]
        files: "^web/.*\\.(ts|tsx|js|jsx)$"
