# Flathub submission manifest — builds from source.
# To submit: open a PR at https://github.com/flathub/flathub with this file
# renamed to io.github.pietro1704.EpubToMp3.yaml in a new branch.
#
# Before submitting to Flathub you must:
#  1. Generate cargo sources:
#       pip install aiohttp toml
#       python3 flatpak-builder-tools/cargo/flatpak-cargo-generator.py \
#         desktop/src-tauri/Cargo.lock -o flatpak/generated-cargo-sources.json
#  2. Generate npm sources:
#       python3 flatpak-builder-tools/node/flatpak-node-generator.py \
#         npm web/package-lock.json -o flatpak/generated-npm-sources.json
#  3. Commit both generated JSON files alongside this manifest.
#
# Tools: https://github.com/flatpak/flatpak-builder-tools

app-id: io.github.pietro1704.EpubToMp3
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: epub-to-mp3

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/epub-to-mp3/cargo
    npm_config_cache: /run/build/epub-to-mp3/npm-cache

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home

modules:
  # ── Python sidecar (PyInstaller bundle) ──────────────────────────────────────
  # For Flathub, download the pre-built sidecar from GitHub Releases.
  # (PyInstaller source builds inside Flatpak SDK are not supported on Flathub.)
  - name: epub-to-mp3-server
    buildsystem: simple
    build-commands:
      - install -Dm755 epub-to-mp3-server /app/lib/epub-to-mp3/epub-to-mp3-server
    sources:
      - type: file
        url: https://github.com/pietro1704/Epub-to-Mp3/releases/download/v0.1.0/epub-to-mp3-server-x86_64-unknown-linux-gnu
        sha256: REPLACE_WITH_SHA256
        dest-filename: epub-to-mp3-server

  # ── React frontend ────────────────────────────────────────────────────────────
  - name: web-dist
    buildsystem: simple
    build-commands:
      - npm ci --offline
      - npm run build
      - mkdir -p /app/share/epub-to-mp3/web
      - cp -r dist/* /app/share/epub-to-mp3/web/
    sources:
      - type: git
        url: https://github.com/pietro1704/Epub-to-Mp3.git
        tag: v0.1.0
        dest: .
      - generated-npm-sources.json

  # ── Tauri (Rust) binary ───────────────────────────────────────────────────────
  - name: epub-to-mp3
    buildsystem: simple
    build-commands:
      - cargo build --release --manifest-path desktop/src-tauri/Cargo.toml
      - install -Dm755 desktop/src-tauri/target/release/epub-to-mp3 /app/bin/epub-to-mp3
      - install -Dm644 flatpak/io.github.pietro1704.EpubToMp3.desktop /app/share/applications/io.github.pietro1704.EpubToMp3.desktop
      - install -Dm644 flatpak/io.github.pietro1704.EpubToMp3.metainfo.xml /app/share/metainfo/io.github.pietro1704.EpubToMp3.metainfo.xml
      - install -Dm644 desktop/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.pietro1704.EpubToMp3.png
    sources:
      - type: git
        url: https://github.com/pietro1704/Epub-to-Mp3.git
        tag: v0.1.0
      - generated-cargo-sources.json
