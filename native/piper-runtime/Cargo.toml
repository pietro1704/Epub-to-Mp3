[package]
name = "piper-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "piper_runtime"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
onnxruntime = ["dep:ort"]
piper-inference = ["dep:piper-rs", "dep:espeak-rs"]
heavy-runtime-tests = []

[dependencies]
ort = { version = "=2.0.0-rc.11", optional = true, default-features = false, features = ["ndarray", "download-binaries", "tls-rustls"] }
piper-rs = { version = "0.2.0", optional = true, default-features = false, features = ["compile-espeak-intonations"] }
espeak-rs = { version = "0.2.0", optional = true, default-features = false }
serde_json = "1"
