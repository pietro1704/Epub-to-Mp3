name: Output download confinement contracts

on:
  push:
    branches: [feature/output-download-confinement]

permissions:
  contents: read

jobs:
  python-codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze actual Python without changing code-scanning state
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: ${{ runner.temp }}/output-download-codeql
      - uses: actions/upload-artifact@v6
        with:
          name: output-download-python-codeql-${{ github.sha }}
          path: ${{ runner.temp }}/output-download-codeql/*.sarif
          if-no-files-found: error
  output-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: python
      R2_OPTIONAL: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install managed Python
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: pip-
      - uses: actions/cache/restore@v6
        with:
          path: .venv
          key: python-venv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: python-venv-${{ runner.os }}-
      - name: Install the existing Python requirements
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          mise exec -- python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r python_app/requirements.txt
      - name: Exercise the actual output endpoint
        run: >-
          mise exec -- python -m pytest -v --tb=short
          python_app/tests/test_server_conversion.py::test_download_output_rejects_symlink_to_foreign_file
          python_app/tests/test_server_conversion.py::test_download_output_serves_confined_nested_member
          python_app/tests/test_server_conversion.py::test_download_output_skips_foreign_member_before_valid_match
          python_app/tests/test_server_conversion.py::test_download_output_serves_named_file_from_job_directory
          python_app/tests/test_download_range.py
