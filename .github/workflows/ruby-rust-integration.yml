name: Ruby Rust Integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: false
      - name: Install Ruby gateway dependencies
        working-directory: ruby_app
        run: bundle install --jobs 4 --retry 3
      - name: Install Rails gateway dependencies
        working-directory: ruby_app/rails_gateway
        run: bundle install --jobs 4 --retry 3
      - name: Ruby gateway tests
        working-directory: ruby_app
        run: bundle exec ruby -I. test/rust_client_test.rb
      - name: Rails gateway tests
        working-directory: ruby_app/rails_gateway
        run: bundle exec rails test
