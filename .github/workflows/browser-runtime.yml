name: Browser Piper runtime

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-runtime:
    name: Faber real browser runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MISE_ENABLE_TOOLS: python,rust,node,npm,cargo:wasm-bindgen-cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install
      - name: Test browser server ownership and process cleanup
        run: mise exec -- node --test web/scripts/browser-server.node-tests.mjs
      - name: Build fresh browser WASM
        run: |
          mise exec -- rustup target add wasm32-unknown-unknown
          mise run web:wasm-build
      - name: Verify fresh WASM voice and locale contracts
        run: mise run web:wasm-contract:test
      - name: Install browser prerequisites and build production assets
        working-directory: web
        run: |
          mise exec -- npm ci --no-audit --no-fund
          mise exec -- npx playwright install --with-deps chromium
          mise exec -- npm run build
      - name: Explicitly install checksum-pinned Faber test model
        run: |
          mkdir -p models
          base='https://huggingface.co/rhasspy/piper-voices/resolve/c10ece1aade47bb51c153c893d14e5bf8e5b7117/pt/pt_BR/faber/medium'
          curl --fail --location --retry 3 "$base/pt_BR-faber-medium.onnx" -o models/pt_BR-faber-medium.onnx
          curl --fail --location --retry 3 "$base/pt_BR-faber-medium.onnx.json" -o models/pt_BR-faber-medium.onnx.json
          printf '%s  %s\n' \
            '858555e3a064209c57088fe6bd70c4c3dc54d03eaa00c45d5ecaf43a33f95aa7' 'models/pt_BR-faber-medium.onnx' \
            '7e694de195ae3fc36dd732c445eb04fb49b649854893cb5506b978f0d50a1d6f' 'models/pt_BR-faber-medium.onnx.json' \
            | sha256sum --check
      - name: Exercise real browser storage and development inference
        run: |
          mise exec -- node web/scripts/verify-browser-store.mjs
          mise exec -- node web/scripts/verify-browser-tts.mjs
      - name: Exercise real production inference
        env:
          TTS_BROWSER_MODE: production
        run: mise exec -- node web/scripts/verify-browser-tts.mjs
      - name: Retain browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: faber-browser-runtime
          path: .reports/tts-preferences
          if-no-files-found: warn
