name: Instruction update regression

on:
  push:
    branches: [master]
    paths:
      - 'scripts/update_instruction.rb'
      - 'scripts/test_update_instruction.rb'
      - '.github/workflows/instruction-update-regression.yml'
  pull_request:
    paths:
      - 'scripts/update_instruction.rb'
      - 'scripts/test_update_instruction.rb'
      - '.github/workflows/instruction-update-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instruction-update:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install the scoped Ruby toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Exercise baseline, symlink, concurrent edit and CLI contracts
        run: mise exec -- ruby scripts/test_update_instruction.rb
