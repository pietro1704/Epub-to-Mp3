name: Native device workflow

on:
  push:
    branches: [master, develop, 'feature/**', 'hotfix/**', 'release/**']
    paths:
      - 'tools/DeviceWorkflow/**'
      - 'scripts/device-workflow.sh'
      - 'scripts/test_device_workflow_entrypoint.rb'
      - 'scripts/device_workflow_receipt.rb'
      - 'scripts/native_build_preflight.rb'
      - 'scripts/test_native_build_preflight.rb'
      - '.github/workflows/device-workflow.yml'
  pull_request:
    paths:
      - 'tools/DeviceWorkflow/**'
      - 'scripts/device-workflow.sh'
      - 'scripts/test_device_workflow_entrypoint.rb'
      - 'scripts/device_workflow_receipt.rb'
      - 'scripts/native_build_preflight.rb'
      - 'scripts/test_native_build_preflight.rb'
      - '.github/workflows/device-workflow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-device-workflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-host-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test explicit device workflow preparation boundary
        run: ruby scripts/test_device_workflow_entrypoint.rb
      - name: Test native build preflight without native processes
        run: ruby scripts/test_native_build_preflight.rb
      - name: Test native workflow without a device or TTS requests
        run: xcrun swift test --package-path tools/DeviceWorkflow --jobs 1
