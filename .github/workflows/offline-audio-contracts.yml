name: Offline audio contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install deterministic audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install pytest
      - name: Verify real MP3 postprocess and explicit network consent policy
        env:
          RUN_LIVE_EDGE_AUDIO_TESTS: '0'
        run: python -m pytest -q python_app/tests/test_audio_pause_integration.py python_app/tests/test_audio_pause_policy.py
