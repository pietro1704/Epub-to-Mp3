name: iOS TestFlight

on:
  push:
    branches:
      - master
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  SCHEME: EpubToMp3
  PROJECT: ios/EpubToMp3/EpubToMp3.xcodeproj
  ARCHIVE_PATH: ${{ github.workspace }}/build/EpubToMp3.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/build/export

jobs:
  archive-and-upload:
    name: Archive and upload iOS build
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # iOS 27 devices require a current Xcode toolchain. The app is built on
      # GitHub's macOS runner, so developers do not need Xcode locally.
      - name: Select current stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show selected toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen through mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install aqua:yonaskolb/XcodeGen

      - name: Bootstrap embedded Python runtime
        run: bash ios/EpubToMp3/scripts/bootstrap-ios-python.sh

      - name: Generate Xcode project
        working-directory: ios/EpubToMp3
        run: mise exec -- xcodegen generate

      # The API key must be an App Store Connect key with access to Certificates,
      # Identifiers & Profiles. Each target needs a profile for its own explicit
      # App ID and App Group entitlement.
      - name: Download host-app provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.pietrocode.epubtomp3
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Download share-extension provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.pietrocode.epubtomp3.share
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Download widget provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: com.pietrocode.epubtomp3.widget
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Archive signed iOS app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM='HHRZ35A37Y' \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export App Store IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>HHRZ35A37Y</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpubToMp3-iOS-IPA
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.upload_to_testflight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.EXPORT_PATH }}/EpubToMp3.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
