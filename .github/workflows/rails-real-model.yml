name: Rails browser real model

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion:
    name: Verified Faber install and real browser conversion
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: ruby,node,npm,rust,github:wasm-bindgen/wasm-bindgen
      RAILS_ENV: test
      CONVERTER_RUNTIME: built
      REAL_BROWSER_MODEL: '1'
      BROWSER_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          install: false
      - name: Install the pinned toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Build the browser runtime
        run: |
          mise exec -- rustup target add wasm32-unknown-unknown
          mise run rails:web:runtime-build
      - name: Exercise the explicit install and sample conversion
        working-directory: ruby_app/rails_gateway
        run: |
          mise exec -- bundle install --jobs 4 --retry 3
          mise exec -- bin/rails db:prepare
          mise exec -- bin/rails test test/system/real_browser_model_test.rb
          test -s tmp/real-browser-model.json
      - name: Retain checked artifact identities and playback evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rails-browser-faber
          retention-days: 7
          path: |
            ruby_app/rails_gateway/tmp/real-browser-model.json
            ruby_app/rails_gateway/tmp/screenshots/
          if-no-files-found: warn
