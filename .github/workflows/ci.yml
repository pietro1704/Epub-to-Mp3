name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install toolchain via mise
        run: mise run install

      - name: Run Python tests
        run: mise exec -- python -m pytest -v --tb=short

      - name: Run web tests
        working-directory: web
        run: mise exec -- npm test -- --runInBand

      - name: Run sample conversion smoke
        env:
          R2_OPTIONAL: "true"
          EDGE_CHUNK_CHARS: "4000"
          EDGE_MAX_CONCURRENCY: "1"
          EDGE_ENABLE_PARALLEL: "false"
          EDGE_AUTO_TUNE: "false"
        run: |
          mise exec -- python -m python_app.main convert web/public/sample.epub --engine edge --chapters 1 --no-parallel --verbose
