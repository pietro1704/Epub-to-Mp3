name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the complete runtime validation after integration
        type: boolean
        default: false
      base_sha:
        description: Exact PR base SHA required for scoped manual validation
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected runtimes
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
      flutter: ${{ steps.scope.outputs.flutter }}
      python: ${{ steps.scope.outputs.python }}
      wasm: ${{ steps.scope.outputs.wasm }}
      contracts: ${{ steps.scope.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the actual PR diff conservatively
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation == true }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        shell: ruby {0}
        run: |
          require 'open3'
          scopes = %w[rust web flutter python wasm].to_h { |name| [name, false] }
          contracts = true
          if ENV.fetch('FULL_VALIDATION') == 'true'
            scopes.transform_values! { true }
          else
            abort 'A scoped run requires a pull request base' unless %w[pull_request workflow_dispatch].include?(ENV.fetch('EVENT_NAME')) && ENV.fetch('BASE_SHA').match?(/\A[0-9a-f]{40}\z/)
            changed, status = Open3.capture2('git', 'diff', '--no-renames', '--name-only', '-z', "#{ENV.fetch('BASE_SHA')}...HEAD")
            abort 'Cannot establish the actual PR diff' unless status.success?
            paths = changed.split("\0")
            contracts = paths.empty? || paths.any? do |path|
              !((path.start_with?('docs/') && path.end_with?('.md')) || %w[README.md CHANGELOG.md].include?(path))
            end
            paths.each do |path|
              shared = path.match?(/\A(?:Cargo\.(?:toml|lock)|mise\.toml|\.mise\.toml|rust-toolchain(?:\.toml)?|native\/|crates\/(?:converter-core|converter-ffi)\/)/)
              scopes['rust'] ||= shared || path.start_with?('crates/') || path.end_with?('.rs')
              scopes['web'] ||= path.start_with?('web/', 'crates/converter-wasm/') || path.match?(/\Ascripts\/(?:build_web|check_direct_runtime)/)
              scopes['flutter'] ||= path.start_with?('flutter_app/') || path.match?(/\Ascripts\/(?:build_flutter|build_converter_ffi_android|package_converter_ffi_android|check_direct_runtime)/)
              scopes['python'] ||= path.start_with?('python_app/', 'tests/') || path.match?(/\A(?:requirements[^\/]*\.txt|pyproject\.toml|pytest\.ini|setup\.cfg|scripts\/.*\.py)\z/)
              scopes['wasm'] ||= path.start_with?('crates/converter-wasm/', 'web/src/wasm/') || path == 'scripts/build_web_wasm.sh'
            end
          end
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |file| scopes.merge('contracts' => contracts).each { |name, value| file.puts "#{name}=#{value}" } }
  production-packaging-guard:
    needs: changes
    name: Production packaging guard
    timeout-minutes: 7
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: node,python
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check production packaging boundary
        run: bash scripts/guard_no_python_production.sh

      - name: Require explicit host contract selection
        env:
          HOST_CONTRACTS: ${{ needs.changes.outputs.contracts }}
        run: |
          case "$HOST_CONTRACTS" in
            true|false) ;;
            *) echo "Missing host contract selection" >&2; exit 1 ;;
          esac

      - name: Set up Ruby for host workflow checks
        if: needs.changes.outputs.contracts == 'true'
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: "4.0"
          bundler-cache: false

      - name: Install host test dependency
        if: needs.changes.outputs.contracts == 'true'
        run: gem install minitest --version 6.0.6 --no-document --bindir "$RUNNER_TEMP/minitest-bin"

      - name: Set up mise for task metadata checks
        if: needs.changes.outputs.contracts == 'true'
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false

      - name: Install scoped host contract tools
        if: needs.changes.outputs.contracts == 'true'
        run: mise install

      - name: Install fixture-only Python dependencies
        if: needs.changes.outputs.contracts == 'true'
        run: mise exec -- python -m pip install pytest

      - name: Verify host workflow guards and collaboration regressions
        if: needs.changes.outputs.contracts == 'true'
        run: mise exec -- ruby scripts/run_ci_contracts.rb --output .reports/ci-contracts/production-guard
      - name: Retain fixture contract diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-contract-diagnostics-${{ github.sha }}
          path: .reports/ci-contracts/
          if-no-files-found: warn
          retention-days: 7

  python-tests:
    if: needs.changes.outputs.python == 'true'
    name: Python tests
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    env:
      MISE_ENABLE_TOOLS: python
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false

      - name: Check Python toolchain scope
        run: |
          mise ls --current --json | python3 -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python"}:
              sys.exit(f"Unexpected Python CI tools: {sorted(tools)}")
          print("Python CI tools: python")
          '

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Install lightweight legacy validation dependencies
        if: inputs.full_validation != true
        run: mise exec -- python -m pip install pytest pytest-asyncio 'starlette>=1.9.0' ruff==0.6.9
      - name: Validate legacy syntax, lint and offline consent contracts
        if: inputs.full_validation != true
        run: |
          mise exec -- python -m compileall -q python_app tests scripts
          mise exec -- ruff check python_app tests
          mise exec -- python -m pytest --noconftest -q python_app/tests/test_audio_pause_policy.py
      - name: Exercise legacy HTTP response lifecycle
        if: inputs.full_validation != true
        run: timeout --signal=TERM --kill-after=10s 60s mise exec -- python -m pytest -v --tb=short --maxfail=1 -o faulthandler_timeout=10 python_app/tests/test_stream_http_observation.py
      - name: Verify current documentation and publication contracts
        if: inputs.full_validation != true
        run: mise exec -- python -m pytest --noconftest -q python_app/tests/test_engine_documentation_contract.py python_app/tests/test_sync_hf_workflow.py

      - name: Cache pip
        if: inputs.full_validation == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: pip-

      - name: Cache Python virtualenv
        if: inputs.full_validation == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv
          key: python-venv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: python-venv-${{ runner.os }}-

      - name: Install system dependencies
        if: inputs.full_validation == true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        if: inputs.full_validation == true
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          mise exec -- python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r python_app/requirements.txt ruff
          bash scripts/install_piper_binary.sh

      - name: Bootstrap iOS embedded Python vendor
        if: inputs.full_validation == true
        working-directory: ios/EpubToMp3
        run: bash scripts/bootstrap-ios-python.sh

      - name: Run Python tests
        if: inputs.full_validation == true
        run: timeout --signal=TERM --kill-after=30s 20m mise exec -- python -m pytest -v --tb=short -o faulthandler_timeout=60

      - name: Run Python lint
        if: inputs.full_validation == true
        run: mise exec -- ruff check python_app tests

      - name: Install explicit pinned Faber model for offline CLI smoke
        if: inputs.full_validation == true
        run: |
          model_dir="$RUNNER_TEMP/legacy-piper-model"
          mkdir -p "$model_dir"
          model_base="https://huggingface.co/rhasspy/piper-voices/resolve/c10ece1aade47bb51c153c893d14e5bf8e5b7117/pt/pt_BR/faber/medium"
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx" -o "$model_dir/pt_BR-faber-medium.onnx"
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx.json" -o "$model_dir/pt_BR-faber-medium.onnx.json"
          printf '%s  %s\n' \
            '858555e3a064209c57088fe6bd70c4c3dc54d03eaa00c45d5ecaf43a33f95aa7' "$model_dir/pt_BR-faber-medium.onnx" \
            '7e694de195ae3fc36dd732c445eb04fb49b649854893cb5506b978f0d50a1d6f' "$model_dir/pt_BR-faber-medium.onnx.json" \
            | sha256sum --check --status
          echo "PIPER_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - name: Run offline sample conversion smoke
        if: inputs.full_validation == true
        env:
          R2_OPTIONAL: "true"
          PIPER_MAX_PROCS: "1"
        run: |
          mise exec -- python -m python_app.main convert web/public/sample.epub \
            --engine piper --model "$PIPER_MODEL_DIR/pt_BR-faber-medium.onnx" \
            --fallback-engine none --chapter 1 --no-parallel --force-reprocess \
            --output-dir "$RUNNER_TEMP/legacy-piper-smoke" --verbose

      - name: Run offline external worker pool E2E smoke
        if: inputs.full_validation == true
        env:
          R2_OPTIONAL: "true"
          PIPER_MAX_PROCS: "1"
          CHAPTER_PARALLEL_COUNT: "1"
        run: |
          mise exec -- python scripts/external_worker_pool.py web/public/sample.epub \
            --workers 1 \
            --forward-args "--engine piper --model $PIPER_MODEL_DIR/pt_BR-faber-medium.onnx --fallback-engine none --chapter 1 --no-parallel --force-reprocess --output-dir $RUNNER_TEMP/legacy-piper-pool-smoke --stage-pipeline"

  rust:
    if: needs.changes.outputs.rust == 'true'
    name: Rust
    needs: [changes]
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: python,rust
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify vendored phoneme source assets
        working-directory: native/vendor/espeak-rs-sys
        run: sha256sum --check phsource-wav.sha256
      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false
      - name: Check Rust toolchain scope
        run: |
          mise ls --current --json | python3 -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python", "rust"}:
              sys.exit(f"Unexpected Rust CI tools: {sorted(tools)}")
          print("Rust CI tools: python, rust")
          '
      - name: Install Rust toolchain
        run: mise install
      - name: Test vendored source cache refresh
        run: |
          mise exec -- rustc --edition=2021 --test native/vendor/espeak-rs-sys/source_copy.rs -o "$RUNNER_TEMP/espeak-source-copy-tests"
          "$RUNNER_TEMP/espeak-source-copy-tests"
      - name: Install ONNX Runtime smoke-test library
        if: inputs.full_validation == true
        run: |
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-1.24.4.tgz"
          curl --fail --location --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-linux-x64-1.24.4.tgz \
            --output "$archive"
          echo '3a211fbea252c1e66290658f1b735b772056149f28321e71c308942cdb54b747  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/onnxruntime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/onnxruntime"
          runtime_library="$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.24.4/lib/libonnxruntime.so"
          test -f "$runtime_library"
          echo "ORT_DYLIB_PATH=$runtime_library" >> "$GITHUB_ENV"
      - name: Identify the actual Rust compiler
        id: rust-toolchain
        run: echo "identity=$(mise exec -- rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native/piper-runtime/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', 'native/piper-runtime/Cargo.lock', '**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'native/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', 'native/piper-runtime/Cargo.lock', '**/Cargo.toml') }}
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-
      - name: Install audio tools and eSpeak-NG phoneme data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng-data
          phoneme_table="$(dpkg -L espeak-ng-data | sed -n '/\/espeak-ng-data\/phontab$/p' | head -n 1)"
          test -n "$phoneme_table"
          test -f "$phoneme_table"
          data_directory="${phoneme_table%/phontab}"
          echo "PIPER_ESPEAKNG_DATA_DIRECTORY=${data_directory%/espeak-ng-data}" >> "$GITHUB_ENV"
      - name: Run migration build gate
        if: inputs.full_validation == true
        run: mise run migration:build-and-gate
      - name: Test Rust workspace
        run: mise exec -- cargo test --workspace --locked
      - name: Rust formatting
        run: mise exec -- cargo fmt --all -- --check
      - name: Install Piper smoke model
        if: inputs.full_validation == true
        run: |
          mkdir -p models/piper
          model_base="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium"
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx" -o models/piper/pt_BR-faber-medium.onnx
          printf '%s  %s\n' \
            '858555e3a064209c57088fe6bd70c4c3dc54d03eaa00c45d5ecaf43a33f95aa7' \
            'models/piper/pt_BR-faber-medium.onnx' | sha256sum --check --status
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx.json" -o models/piper/pt_BR-faber-medium.onnx.json
      - name: Piper Embedded runtime smoke test
        if: inputs.full_validation == true
        run: mise exec -- cargo test --manifest-path native/piper-runtime/Cargo.toml --features onnxruntime,piper-inference,heavy-runtime-tests piper_inference_generates_valid_wav_from_vendored_model -- --nocapture
  web:
    if: needs.changes.outputs.web == 'true'
    name: Web
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: ${{ needs.changes.outputs.wasm == 'true' && 'python,node,npm,rust,cargo:wasm-bindgen-cli' || 'python,node,npm' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false
      - name: Check Web toolchain scope
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          BUILD_WASM: ${{ needs.changes.outputs.wasm }}
        run: |
          mise ls --current --json | python3 -c '
          import json, os, sys
          tools = set(json.load(sys.stdin))
          expected = {"python", "node", "npm"}
          if os.environ["BUILD_WASM"] == "true":
              expected.update({"rust", "cargo:wasm-bindgen-cli"})
          if tools != expected:
              sys.exit(f"Unexpected Web CI tools: {sorted(tools)}")
          print(f"Web CI tools: {sorted(tools)}")
          '
      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Install Rust WASM target
        if: needs.changes.outputs.wasm == 'true'
        run: rustup target add wasm32-unknown-unknown
      - name: Build direct Rust WASM adapter
        if: needs.changes.outputs.wasm == 'true'
        run: mise run web:wasm-build
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install web dependencies
        working-directory: web
        run: mise exec -- npm ci --prefer-offline --no-audit --no-fund
      - name: Run full web tests
        working-directory: web
        run: mise exec -- npm test -- --maxWorkers=2
      - name: Run web lint
        working-directory: web
        run: mise exec -- npm run lint
      - name: Run web build
        working-directory: web
        run: mise exec -- npm run build

  flutter:
    if: needs.changes.outputs.flutter == 'true'
    name: Flutter
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: python,flutter
      EPUB_DART_FABER_INTEGRATION: '0'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false

      - name: Check Flutter toolchain scope
        run: |
          mise ls --current --json | python3 -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python", "flutter"}:
              sys.exit(f"Unexpected Flutter CI tools: {sorted(tools)}")
          print("Flutter CI tools: python, flutter")
          '

      - name: Cache Flutter SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: mise exec -- flutter pub get


      - name: Run Flutter tests
        working-directory: flutter_app
        run: mise exec -- flutter test

      - name: Run Flutter analyzer
        working-directory: flutter_app
        run: mise exec -- flutter analyze


  pr-gate:
    name: PR gate
    needs: [changes, production-packaging-guard, python-tests, rust, flutter, web]
    if: always()
    timeout-minutes: 1
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected runtime and reject missing scope evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: ruby {0}
        run: |
          require 'json'
          needs = JSON.parse(ENV.fetch('NEEDS_JSON'))
          %w[changes production-packaging-guard].each { |job| abort "Required job failed: #{job}" unless needs.fetch(job).fetch('result') == 'success' }
          { 'python-tests' => 'python', 'rust' => 'rust', 'flutter' => 'flutter', 'web' => 'web' }.each do |job, scope|
            selected = needs.fetch('changes').fetch('outputs').fetch(scope)
            abort "Missing scope evidence: #{scope}" unless %w[true false].include?(selected)
            expected = selected == 'true' ? 'success' : 'skipped'
            abort "Unexpected runtime result: #{job}" unless needs.fetch(job).fetch('result') == expected
          end
