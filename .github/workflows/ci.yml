name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the complete runtime validation after integration
        type: boolean
        default: false
      base_sha:
        description: Exact PR base SHA required for scoped manual validation
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected runtimes
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      flutter: ${{ steps.scope.outputs.flutter }}
      android: ${{ steps.scope.outputs.android }}
      apple: ${{ steps.scope.outputs.apple }}
      contracts: ${{ steps.scope.outputs.contracts }}
      rails: ${{ steps.scope.outputs.rails }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the actual PR diff conservatively
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation == true }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        shell: ruby {0}
        run: |
          require 'open3'
          scopes = %w[rust flutter android apple rails].to_h { |name| [name, false] }
          contracts = true
          if ENV.fetch('FULL_VALIDATION') == 'true'
            scopes.transform_values! { true }
          else
            abort 'A scoped run requires a pull request base' unless %w[pull_request workflow_dispatch].include?(ENV.fetch('EVENT_NAME')) && ENV.fetch('BASE_SHA').match?(/\A[0-9a-f]{40}\z/)
            changed, status = Open3.capture2('git', 'diff', '--no-renames', '--name-only', '-z', "#{ENV.fetch('BASE_SHA')}...HEAD")
            abort 'Cannot establish the actual PR diff' unless status.success?
            paths = changed.split("\0")
            contracts = paths.empty? || paths.any? do |path|
              !((path.start_with?('docs/') && path.end_with?('.md')) || %w[README.md CHANGELOG.md].include?(path))
            end
            paths.each do |path|
              # Shared contracts select their consumers, not only the owning crate.
              orchestration = %w[mise.toml .mise.toml mise.lock .mise.lock .github/workflows/ci.yml .github/workflows/post-merge-validation.yml].include?(path)
              shared_build = %w[Cargo.toml Cargo.lock rust-toolchain rust-toolchain.toml .github/workflows/faber-integration.yml].include?(path) || path.start_with?('.github/actions/rust-build-cache/')
              shared_core = path.start_with?('crates/converter-core/')
              native_abi = path.start_with?('native/', 'crates/converter-ffi/') || path == '.github/workflows/converter-ffi.yml'
              scopes['rust'] ||= orchestration || shared_build || native_abi || path.start_with?('crates/') || path.end_with?('.rs')
              scopes['flutter'] ||= orchestration || shared_build || shared_core || native_abi || path.start_with?('flutter_app/') || path.match?(/\Ascripts\/(?:build_flutter|build_converter_ffi_android|package_converter_ffi_android|check_direct_runtime)/)
              scopes['android'] ||= orchestration || shared_build || native_abi || path.start_with?('flutter_app/android/') || %w[flutter_app/pubspec.yaml flutter_app/pubspec.lock].include?(path) || path.match?(/\Ascripts\/(?:build_flutter_android|build_converter_ffi_android|package_converter_ffi_android|fetch_onnxruntime_android|android_jni_exports)/)
              scopes['rails'] ||= orchestration || shared_build || shared_core || path.start_with?('ruby_app/', 'crates/converter-wasm/') || %w[Dockerfile .dockerignore .hf-runtime].include?(path)
              scopes['apple'] ||= orchestration || shared_build || shared_core || native_abi || path.start_with?('ios/EpubToMp3/')
            end
          end
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |file| scopes.merge('contracts' => contracts).each { |name, value| file.puts "#{name}=#{value}" } }
  production-packaging-guard:
    needs: changes
    name: Production packaging guard
    timeout-minutes: 7
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: node
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check production packaging boundary
        run: bash scripts/guard_no_python_production.sh

      - name: Require explicit host contract selection
        env:
          HOST_CONTRACTS: ${{ needs.changes.outputs.contracts }}
        run: |
          case "$HOST_CONTRACTS" in
            true|false) ;;
            *) echo "Missing host contract selection" >&2; exit 1 ;;
          esac

      - name: Set up Ruby for host workflow checks
        if: needs.changes.outputs.contracts == 'true'
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: false

      - name: Install host test dependency
        if: needs.changes.outputs.contracts == 'true'
        run: gem install minitest --version 6.1.0 --no-document --bindir "$RUNNER_TEMP/minitest-bin"

      - name: Set up mise for task metadata checks
        if: needs.changes.outputs.contracts == 'true'
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Install scoped host contract tools
        if: needs.changes.outputs.contracts == 'true'
        run: mise install

      - name: Verify host workflow guards and collaboration regressions
        if: needs.changes.outputs.contracts == 'true'
        run: mise exec -- ruby scripts/run_ci_contracts.rb --output .reports/ci-contracts/production-guard
      - name: Retain fixture contract diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-contract-diagnostics-${{ github.sha }}
          path: .reports/ci-contracts/
          if-no-files-found: warn
          retention-days: 7

  rust:
    if: needs.changes.outputs.rust == 'true'
    name: Rust
    needs: [changes]
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: rust
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify vendored phoneme source assets
        working-directory: native/vendor/espeak-rs-sys
        run: sha256sum --check phsource-wav.sha256
      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false
      - name: Check Rust toolchain scope
        run: |
          tools="$(mise ls --current --json | jq -c 'keys')"
          if [ "$tools" != '["rust"]' ]; then
            echo "Unexpected Rust CI tools: $tools" >&2
            exit 1
          fi
          echo "Rust CI tools: rust"
      - name: Install Rust toolchain
        run: |
          mise install
          mise exec -- rustup component add rustfmt
      # Formatting needs no build; fail before the cache restore and test build.
      - name: Rust formatting
        run: mise exec -- cargo fmt --all -- --check
      - name: Test vendored source cache refresh
        run: |
          mise exec -- rustc --edition=2021 --test native/vendor/espeak-rs-sys/source_copy.rs -o "$RUNNER_TEMP/espeak-source-copy-tests"
          "$RUNNER_TEMP/espeak-source-copy-tests"
      - name: Install ONNX Runtime smoke-test library
        if: inputs.full_validation == true
        run: |
          bash scripts/fetch_onnxruntime_linux.sh "$RUNNER_TEMP/onnxruntime"
          runtime_library="$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.24.4/lib/libonnxruntime.so"
          test -f "$runtime_library"
          echo "ORT_DYLIB_PATH=$runtime_library" >> "$GITHUB_ENV"
      - name: Identify the actual Rust compiler
        id: rust-toolchain
        run: echo "identity=$(mise exec -- rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Pull requests restore master's entries; only master saves (cache quota).
      - name: Restore Rust build artifacts
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native/piper-runtime/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-
      # Rust audio runs in process; the only test that requires ffmpeg runs in
      # native-fallback.yml, which installs it there.
      - name: Install eSpeak-NG phoneme data
        timeout-minutes: 4
        run: |
          set -euo pipefail
          sudo /usr/bin/ruby scripts/normalize_ubuntu_package_mirror.rb
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends espeak-ng-data
          phoneme_table="$(dpkg -L espeak-ng-data | sed -n '/\/espeak-ng-data\/phontab$/p' | head -n 1)"
          test -n "$phoneme_table"
          test -f "$phoneme_table"
          data_directory="${phoneme_table%/phontab}"
          echo "PIPER_ESPEAKNG_DATA_DIRECTORY=${data_directory%/espeak-ng-data}" >> "$GITHUB_ENV"
      - name: Run migration build gate
        if: inputs.full_validation == true
        run: mise run migration:build-and-gate
      - name: Test Rust workspace
        run: mise exec -- cargo test --workspace --locked
      - name: Install Piper smoke model
        if: inputs.full_validation == true
        run: |
          mkdir -p models/piper
          model_base="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium"
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors "$model_base/pt_BR-faber-medium.onnx" -o models/piper/pt_BR-faber-medium.onnx
          printf '%s  %s\n' \
            '858555e3a064209c57088fe6bd70c4c3dc54d03eaa00c45d5ecaf43a33f95aa7' \
            'models/piper/pt_BR-faber-medium.onnx' | sha256sum --check --status
          curl --fail --location --retry 8 --retry-delay 15 --retry-all-errors "$model_base/pt_BR-faber-medium.onnx.json" -o models/piper/pt_BR-faber-medium.onnx.json
      - name: Piper Embedded runtime smoke test
        if: inputs.full_validation == true
        run: mise exec -- cargo test --manifest-path native/piper-runtime/Cargo.toml --features onnxruntime,piper-inference,heavy-runtime-tests piper_inference_generates_valid_wav_from_vendored_model -- --nocapture
      - name: Save Rust build artifacts on master
        if: github.ref == 'refs/heads/master' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native/piper-runtime/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  rails-web:
    if: needs.changes.outputs.rails == 'true'
    name: Rails web
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 15 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: ruby,node,npm,rust,github:wasm-bindgen/wasm-bindgen
      RAILS_ENV: test
      # Tests run against the runtime tree built below, not the local fixture module.
      CONVERTER_RUNTIME: built
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false
      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-rails-web-${{ runner.os }}-${{ hashFiles('ruby_app/rails_gateway/browser_runtime/package-lock.json') }}
          restore-keys: npm-rails-web-${{ runner.os }}-
      - name: Build the browser runtime tree from Rust and the pinned TTS libraries
        run: |
          git status --porcelain=v1 -z --untracked-files=all > "$RUNNER_TEMP/runtime-tree.before"
          mise run rails:web:runtime-build
      - name: Verify that the build only produced ignored artifacts
        run: |
          git status --porcelain=v1 -z --untracked-files=all > "$RUNNER_TEMP/runtime-tree.after"
          cmp "$RUNNER_TEMP/runtime-tree.before" "$RUNNER_TEMP/runtime-tree.after"
          test -z "$(git ls-files -- ruby_app/rails_gateway/config/runtime_manifest.json ruby_app/rails_gateway/public/runtime)"
          test -s ruby_app/rails_gateway/config/runtime_manifest.json
      - name: Install gateway gems
        working-directory: ruby_app/rails_gateway
        run: mise exec -- bundle install --jobs 4 --retry 3
      - name: Prepare the test database
        working-directory: ruby_app/rails_gateway
        run: mise exec -- bin/rails db:prepare
      - name: Run Rails and browser runtime build tests against the built runtime
        run: mise run rails:web:test

  flutter:
    if: needs.changes.outputs.flutter == 'true'
    name: Flutter
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: flutter
      EPUB_DART_FABER_INTEGRATION: '0'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Check Flutter toolchain scope
        run: |
          tools="$(mise ls --current --json | jq -c 'keys')"
          if [ "$tools" != '["flutter"]' ]; then
            echo "Unexpected Flutter CI tools: $tools" >&2
            exit 1
          fi
          echo "Flutter CI tools: flutter"

      # Key tool caches by the installed versions, not by unrelated mise.toml task edits.
      - name: Identify cached toolchain versions
        id: tool-versions
        run: |
          set -euo pipefail
          tools="$(mise ls --current --json)"
          echo "mise=$(mise --version | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "flutter=$(jq -er '.flutter[0].version' <<< "$tools")" >> "$GITHUB_OUTPUT"

      - name: Cache Flutter SDK
        id: flutter-sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-mise-${{ steps.tool-versions.outputs.mise }}-flutter-${{ steps.tool-versions.outputs.flutter }}

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Retain installed Flutter SDK
        if: github.ref == 'refs/heads/master' && steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-mise-${{ steps.tool-versions.outputs.mise }}-flutter-${{ steps.tool-versions.outputs.flutter }}

      - name: Restore Pub downloads
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.tool-versions.outputs.flutter }}-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.tool-versions.outputs.flutter }}-

      - name: Install Flutter dependencies
        id: flutter-dependencies
        working-directory: flutter_app
        run: mise exec -- flutter pub get

      - name: Save Pub downloads on master
        if: github.ref == 'refs/heads/master' && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Run Flutter analyzer
        id: flutter-analyze
        run: |
          set -o pipefail
          mkdir -p .reports/flutter
          mise run flutter:analyze 2>&1 | tee .reports/flutter/analyze.log

      - name: Run Flutter tests
        if: ${{ !cancelled() && steps.flutter-dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p .reports/flutter
          mise run flutter:test 2>&1 | tee .reports/flutter/tests.log

      - name: Retain Flutter failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-diagnostics-${{ github.sha }}
          path: .reports/flutter/
          if-no-files-found: warn
          retention-days: 7

  android-jvm:
    # The integrated Faber APK job already executes the same JVM suite.
    # Post-merge validation arrives as push or workflow_dispatch (GITHUB_TOKEN
    # merges); in a called workflow github.workflow_ref names the caller.
    if: needs.changes.outputs.android == 'true' && !(inputs.full_validation == true && github.ref == 'refs/heads/master' && contains(github.workflow_ref, '/.github/workflows/post-merge-validation.yml@'))
    name: Android JVM tests
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 12 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: ruby,flutter,java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false
      # Key tool caches by the installed versions, not by unrelated mise.toml task edits.
      - name: Identify cached toolchain versions
        id: tool-versions
        run: |
          set -euo pipefail
          tools="$(mise ls --current --json)"
          echo "mise=$(mise --version | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "flutter=$(jq -er '.flutter[0].version' <<< "$tools")" >> "$GITHUB_OUTPUT"
          echo "java=$(jq -er '.java[0].version' <<< "$tools")" >> "$GITHUB_OUTPUT"
      - name: Cache Flutter SDK
        id: flutter-sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-mise-${{ steps.tool-versions.outputs.mise }}-flutter-${{ steps.tool-versions.outputs.flutter }}
      - name: Install scoped project tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Retain installed Flutter SDK
        if: github.ref == 'refs/heads/master' && steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-mise-${{ steps.tool-versions.outputs.mise }}-flutter-${{ steps.tool-versions.outputs.flutter }}
      # Restore only: post-merge master skips this job; the Flutter job and the
      # Faber Android APK job save these entries on master.
      - name: Restore Pub downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.tool-versions.outputs.flutter }}-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.tool-versions.outputs.flutter }}-
      - name: Restore Gradle dependency downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.tool-versions.outputs.flutter }}-java-${{ steps.tool-versions.outputs.java }}-${{ hashFiles('flutter_app/android/**/*.gradle.kts', 'flutter_app/android/gradle.properties', 'flutter_app/android/gradle/wrapper/gradle-wrapper.properties', 'flutter_app/pubspec.lock') }}
          restore-keys: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve Flutter plugins and hosted Android SDK
        run: |
          mise exec -- ruby -e 'File.write("flutter_app/android/local.properties", "sdk.dir=#{ENV.fetch("ANDROID_HOME")}\nflutter.sdk=#{ARGV.fetch(0)}\n")' "$(mise where flutter)"
          cd flutter_app
          mise exec -- flutter pub get
      - name: Bootstrap the ignored wrapper from the pinned Flutter SDK
        run: |
          wrapper="$(mise where flutter)/bin/cache/artifacts/gradle_wrapper"
          install -m 755 "$wrapper/gradlew" flutter_app/android/gradlew
          install -m 644 "$wrapper/gradle/wrapper/gradle-wrapper.jar" flutter_app/android/gradle/wrapper/gradle-wrapper.jar
      - name: Run Android JVM tests without packaging Flutter assets
        working-directory: flutter_app/android
        # Unit tests do not load Flutter assets or JNI. APK builds retain the
        # complete embedded-input guard and audit in the Faber workflow.
        run: mise exec -- ruby ../../scripts/native_build_command.rb -- mise exec -- ./gradlew :app:testDebugUnitTest -x :app:copyFlutterAssetsDebug --max-workers=1 --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m'
      - name: Require executed Android JVM cases
        run: |
          mise exec -- ruby - <<'RUBY'
          require 'rexml/document'
          reports = Dir.glob('flutter_app/build/app/test-results/testDebugUnitTest/TEST-*.xml')
          abort 'Missing Android JVM test results' if reports.empty?
          counts = %w[tests failures errors skipped].to_h { |name| [name, 0] }
          reports.each do |report|
            suite = REXML::Document.new(File.read(report)).root
            counts.each_key { |name| counts[name] += Integer(suite.attributes[name] || raise(KeyError, "#{report}: #{name}"), 10) }
          end
          if counts['tests'] <= 0 || counts.values_at('failures', 'errors', 'skipped').any? { |count| count != 0 }
            abort "Android JVM tests did not all execute successfully: #{counts}"
          end
          puts "ANDROID_JVM_TESTS #{counts}"
          RUBY
      - name: Retain Android JVM test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-jvm-results-${{ github.sha }}
          path: |
            flutter_app/build/app/reports/tests/
            flutter_app/build/app/test-results/
          if-no-files-found: warn
          retention-days: 7

  apple-app:
    name: Apple app tests
    needs: [changes]
    if: needs.changes.outputs.apple == 'true' && !(inputs.full_validation == true && github.ref == 'refs/heads/master' && contains(github.workflow_ref, '/.github/workflows/post-merge-validation.yml@'))
    uses: ./.github/workflows/faber-integration.yml
    with:
      macos_only: true
    permissions:
      contents: read
      actions: read

  pr-gate:
    name: PR gate
    needs: [changes, production-packaging-guard, rust, flutter, android-jvm, apple-app, rails-web]
    if: always()
    timeout-minutes: 1
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected runtime and reject missing scope evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          INTEGRATED_VALIDATION: ${{ inputs.full_validation == true && github.ref == 'refs/heads/master' && contains(github.workflow_ref, '/.github/workflows/post-merge-validation.yml@') }}
        shell: ruby {0}
        run: |
          require 'json'
          needs = JSON.parse(ENV.fetch('NEEDS_JSON'))
          integrated = ENV.fetch('INTEGRATED_VALIDATION')
          abort 'Missing validation mode' unless %w[true false].include?(integrated)
          %w[changes production-packaging-guard].each { |job| abort "Required job failed: #{job}" unless needs.fetch(job).fetch('result') == 'success' }
          scopes = needs.fetch('changes').fetch('outputs')
          { 'rust' => 'rust', 'flutter' => 'flutter', 'android-jvm' => 'android', 'apple-app' => 'apple', 'rails-web' => 'rails' }.each do |job, scope|
            selected = scopes.fetch(scope)
            abort "Missing scope evidence: #{scope}" unless %w[true false].include?(selected)
            # Full post-merge validation already requires the complete Faber matrix.
            required = selected == 'true' && !(%w[apple-app android-jvm].include?(job) && integrated == 'true')
            expected = required ? 'success' : 'skipped'
            abort "Unexpected runtime result: #{job}" unless needs.fetch(job).fetch('result') == expected
          end
