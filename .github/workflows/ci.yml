name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the complete runtime validation after integration
        type: boolean
        default: false
      base_sha:
        description: Exact PR base SHA required for scoped manual validation
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected runtimes
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
      flutter: ${{ steps.scope.outputs.flutter }}
      android: ${{ steps.scope.outputs.android }}
      python: ${{ steps.scope.outputs.python }}
      wasm: ${{ steps.scope.outputs.wasm }}
      apple: ${{ steps.scope.outputs.apple }}
      contracts: ${{ steps.scope.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the actual PR diff conservatively
        id: scope
        env:
          FULL_VALIDATION: ${{ inputs.full_validation == true }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        shell: ruby {0}
        run: |
          require 'open3'
          scopes = %w[rust web flutter android python wasm apple].to_h { |name| [name, false] }
          contracts = true
          if ENV.fetch('FULL_VALIDATION') == 'true'
            scopes.transform_values! { true }
          else
            abort 'A scoped run requires a pull request base' unless %w[pull_request workflow_dispatch].include?(ENV.fetch('EVENT_NAME')) && ENV.fetch('BASE_SHA').match?(/\A[0-9a-f]{40}\z/)
            changed, status = Open3.capture2('git', 'diff', '--no-renames', '--name-only', '-z', "#{ENV.fetch('BASE_SHA')}...HEAD")
            abort 'Cannot establish the actual PR diff' unless status.success?
            paths = changed.split("\0")
            contracts = paths.empty? || paths.any? do |path|
              !((path.start_with?('docs/') && path.end_with?('.md')) || %w[README.md CHANGELOG.md].include?(path))
            end
            paths.each do |path|
              # Shared contracts select their consumers, not only the owning crate.
              orchestration = %w[mise.toml .mise.toml mise.lock .mise.lock .github/workflows/ci.yml .github/workflows/post-merge-validation.yml].include?(path)
              shared_build = %w[Cargo.toml Cargo.lock rust-toolchain rust-toolchain.toml .github/workflows/faber-integration.yml].include?(path) || path.start_with?('.github/actions/rust-build-cache/')
              shared_core = path.start_with?('crates/converter-core/')
              native_abi = path.start_with?('native/', 'crates/converter-ffi/') || path == '.github/workflows/converter-ffi.yml'
              wasm = orchestration || shared_build || shared_core || path.start_with?('crates/converter-wasm/', 'web/src/wasm/') || %w[scripts/build_web_wasm.sh .github/workflows/browser-runtime.yml].include?(path)
              scopes['rust'] ||= orchestration || shared_build || native_abi || path.start_with?('crates/') || path.end_with?('.rs')
              scopes['web'] ||= wasm || path.start_with?('web/') || path.match?(/\Ascripts\/(?:build_web|check_direct_runtime)/)
              scopes['flutter'] ||= orchestration || shared_build || shared_core || native_abi || path.start_with?('flutter_app/') || path.match?(/\Ascripts\/(?:build_flutter|build_converter_ffi_android|package_converter_ffi_android|check_direct_runtime)/)
              scopes['android'] ||= orchestration || shared_build || native_abi || path.start_with?('flutter_app/android/') || %w[flutter_app/pubspec.yaml flutter_app/pubspec.lock].include?(path) || path.match?(/\Ascripts\/(?:build_flutter_android|build_converter_ffi_android|package_converter_ffi_android|fetch_onnxruntime_android|android_jni_exports)/)
              scopes['python'] ||= orchestration || path.start_with?('python_app/', 'tests/') || path.match?(/\A(?:[^\/]+\.py|requirements[^\/]*\.txt|pyproject\.toml|pytest\.ini|setup\.cfg|(?:scripts|\.github\/scripts)\/.*\.py)\z/)
              scopes['wasm'] ||= wasm
              scopes['apple'] ||= orchestration || shared_build || shared_core || native_abi || path.start_with?('ios/EpubToMp3/')
            end
          end
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |file| scopes.merge('contracts' => contracts).each { |name, value| file.puts "#{name}=#{value}" } }
  production-packaging-guard:
    needs: changes
    name: Production packaging guard
    timeout-minutes: 7
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: node,python
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check production packaging boundary
        run: bash scripts/guard_no_python_production.sh

      - name: Require explicit host contract selection
        env:
          HOST_CONTRACTS: ${{ needs.changes.outputs.contracts }}
        run: |
          case "$HOST_CONTRACTS" in
            true|false) ;;
            *) echo "Missing host contract selection" >&2; exit 1 ;;
          esac

      - name: Set up Ruby for host workflow checks
        if: needs.changes.outputs.contracts == 'true'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0.7"
          bundler-cache: false

      - name: Install host test dependency
        if: needs.changes.outputs.contracts == 'true'
        run: gem install minitest --version 6.1.0 --no-document --bindir "$RUNNER_TEMP/minitest-bin"

      - name: Set up mise for task metadata checks
        if: needs.changes.outputs.contracts == 'true'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false

      - name: Install scoped host contract tools
        if: needs.changes.outputs.contracts == 'true'
        run: mise install

      - name: Install fixture-only Python dependencies
        if: needs.changes.outputs.contracts == 'true'
        run: mise exec -- python -m pip install pytest

      - name: Verify host workflow guards and collaboration regressions
        if: needs.changes.outputs.contracts == 'true'
        run: mise exec -- ruby scripts/run_ci_contracts.rb --output .reports/ci-contracts/production-guard
      - name: Retain fixture contract diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-contract-diagnostics-${{ github.sha }}
          path: .reports/ci-contracts/
          if-no-files-found: warn
          retention-days: 7

  python-tests:
    if: needs.changes.outputs.python == 'true'
    name: Python tests
    needs: [changes]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    env:
      MISE_ENABLE_TOOLS: python
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false

      - name: Check Python toolchain scope
        run: |
          mise ls --current --json | python3 -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python"}:
              sys.exit(f"Unexpected Python CI tools: {sorted(tools)}")
          print("Python CI tools: python")
          '

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Install lightweight legacy validation dependencies
        if: inputs.full_validation != true
        run: mise exec -- python -m pip install pytest pytest-asyncio 'starlette>=1.9.0' ruff==0.17.4
      - name: Resolve and verify the current pandas requirement
        if: inputs.full_validation != true
        run: |
          pandas_requirement=$(sed -n '/^pandas[<>=]/p' requirements.txt)
          test -n "$pandas_requirement"
          mise exec -- python -m pip install --only-binary=:all: "$pandas_requirement"
          mise exec -- python -m pytest --noconftest -q python_app/tests/test_requirements_consistency.py
      - name: Validate legacy syntax, lint and offline consent contracts
        if: inputs.full_validation != true
        run: |
          mise exec -- python -m compileall -q python_app tests scripts
          mise exec -- ruff check python_app tests
          mise exec -- python -m pytest --noconftest -q python_app/tests/test_audio_pause_policy.py
      - name: Exercise legacy HTTP response lifecycle
        if: inputs.full_validation != true
        run: timeout --signal=TERM --kill-after=10s 60s mise exec -- python -m pytest -v --tb=short --maxfail=1 -o faulthandler_timeout=10 python_app/tests/test_stream_http_observation.py
      - name: Verify current documentation and publication contracts
        if: inputs.full_validation != true
        run: mise exec -- python -m pytest --noconftest -q python_app/tests/test_engine_documentation_contract.py python_app/tests/test_sync_hf_workflow.py python_app/tests/test_mise_python_environment.py

      - name: Cache pip
        if: inputs.full_validation == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: pip-

      - name: Cache Python virtualenv
        if: inputs.full_validation == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: python-venv-${{ runner.os }}-3.14.10-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: python-venv-${{ runner.os }}-3.14.10-

      - name: Install system dependencies
        if: inputs.full_validation == true
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        if: inputs.full_validation == true
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          "$(mise where python)/bin/python" -m venv .venv
          test "$(mise exec -- python --version)" = 'Python 3.14.10'
          .venv/bin/python -m pip install -r requirements.txt -r python_app/requirements.txt ruff==0.17.4
          bash scripts/install_piper_binary.sh

      - name: Bootstrap iOS embedded Python vendor
        if: inputs.full_validation == true
        working-directory: ios/EpubToMp3
        run: bash scripts/bootstrap-ios-python.sh

      - name: Run Python tests
        if: inputs.full_validation == true
        run: timeout --signal=TERM --kill-after=30s 20m mise exec -- python -m pytest -v --tb=short -o faulthandler_timeout=60

      - name: Run Python lint
        if: inputs.full_validation == true
        run: mise exec -- ruff check python_app tests

      - name: Install explicit pinned Faber model for offline CLI smoke
        if: inputs.full_validation == true
        run: |
          model_dir="$RUNNER_TEMP/legacy-piper-model"
          mkdir -p "$model_dir"
          model_base="https://huggingface.co/rhasspy/piper-voices/resolve/c10ece1aade47bb51c153c893d14e5bf8e5b7117/pt/pt_BR/faber/medium"
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx" -o "$model_dir/pt_BR-faber-medium.onnx"
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx.json" -o "$model_dir/pt_BR-faber-medium.onnx.json"
          printf '%s  %s\n' \
            '858555e3a064209c57088fe6bd70c4c3dc54d03eaa00c45d5ecaf43a33f95aa7' "$model_dir/pt_BR-faber-medium.onnx" \
            '7e694de195ae3fc36dd732c445eb04fb49b649854893cb5506b978f0d50a1d6f' "$model_dir/pt_BR-faber-medium.onnx.json" \
            | sha256sum --check --status
          echo "PIPER_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - name: Run offline sample conversion smoke
        if: inputs.full_validation == true
        env:
          R2_OPTIONAL: "true"
          PIPER_MAX_PROCS: "1"
        run: |
          mise exec -- python -m python_app.main convert web/public/sample.epub \
            --engine piper --model "$PIPER_MODEL_DIR/pt_BR-faber-medium.onnx" \
            --fallback-engine none --chapter 1 --no-parallel --force-reprocess \
            --output-dir "$RUNNER_TEMP/legacy-piper-smoke" --verbose

      - name: Run offline external worker pool E2E smoke
        if: inputs.full_validation == true
        env:
          R2_OPTIONAL: "true"
          PIPER_MAX_PROCS: "1"
          CHAPTER_PARALLEL_COUNT: "1"
        run: |
          mise exec -- python scripts/external_worker_pool.py web/public/sample.epub \
            --workers 1 \
            --forward-args "--engine piper --model $PIPER_MODEL_DIR/pt_BR-faber-medium.onnx --fallback-engine none --chapter 1 --no-parallel --force-reprocess --output-dir $RUNNER_TEMP/legacy-piper-pool-smoke --stage-pipeline"

      - name: Set up the explicit optional Coqui interpreter
        if: inputs.full_validation == true
        id: coqui-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'

      - name: Verify optional Coqui numerical ABI and dependency resolution
        if: inputs.full_validation == true
        env:
          COQUI_PYTHON: ${{ steps.coqui-python.outputs.python-path }}
        run: |
          "$COQUI_PYTHON" -m venv "$RUNNER_TEMP/coqui-compatibility"
          coqui_python="$RUNNER_TEMP/coqui-compatibility/bin/python"
          "$coqui_python" -m pip install --only-binary=:all: 'numpy>=1.26.4,<2' 'pandas>=1.5.3,<2' numba==0.68.1 llvmlite==0.50.0
          "$coqui_python" -c 'import numpy, pandas, numba, llvmlite; print(numpy.__version__, pandas.__version__, numba.__version__, llvmlite.__version__)'
          mkdir -p .reports/python-compatibility
          "$coqui_python" -m pip install --dry-run --report .reports/python-compatibility/coqui-resolution.json -r requirements-coqui.txt

      - name: Retain optional Python compatibility evidence
        if: always() && inputs.full_validation == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-compatibility-${{ github.sha }}
          path: .reports/python-compatibility/
          if-no-files-found: warn

  rust:
    if: needs.changes.outputs.rust == 'true'
    name: Rust
    needs: [changes]
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: python,rust
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored phoneme source assets
        working-directory: native/vendor/espeak-rs-sys
        run: sha256sum --check phsource-wav.sha256
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false
      - name: Check Rust toolchain scope
        run: |
          mise ls --current --json | python3 -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python", "rust"}:
              sys.exit(f"Unexpected Rust CI tools: {sorted(tools)}")
          print("Rust CI tools: python, rust")
          '
      - name: Install Rust toolchain
        run: |
          mise install
          mise exec -- rustup component add rustfmt
      - name: Test vendored source cache refresh
        run: |
          mise exec -- rustc --edition=2021 --test native/vendor/espeak-rs-sys/source_copy.rs -o "$RUNNER_TEMP/espeak-source-copy-tests"
          "$RUNNER_TEMP/espeak-source-copy-tests"
      - name: Install ONNX Runtime smoke-test library
        if: inputs.full_validation == true
        run: |
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-1.24.4.tgz"
          curl --fail --location --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-linux-x64-1.24.4.tgz \
            --output "$archive"
          echo '3a211fbea252c1e66290658f1b735b772056149f28321e71c308942cdb54b747  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/onnxruntime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/onnxruntime"
          runtime_library="$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.24.4/lib/libonnxruntime.so"
          test -f "$runtime_library"
          echo "ORT_DYLIB_PATH=$runtime_library" >> "$GITHUB_ENV"
      - name: Identify the actual Rust compiler
        id: rust-toolchain
        run: echo "identity=$(mise exec -- rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native/piper-runtime/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', 'native/piper-runtime/Cargo.lock', '**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'native/**/*.rs') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-${{ hashFiles('Cargo.lock', 'native/piper-runtime/Cargo.lock', '**/Cargo.toml') }}
            rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.identity }}-
      - name: Install audio tools and eSpeak-NG phoneme data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng-data
          phoneme_table="$(dpkg -L espeak-ng-data | sed -n '/\/espeak-ng-data\/phontab$/p' | head -n 1)"
          test -n "$phoneme_table"
          test -f "$phoneme_table"
          data_directory="${phoneme_table%/phontab}"
          echo "PIPER_ESPEAKNG_DATA_DIRECTORY=${data_directory%/espeak-ng-data}" >> "$GITHUB_ENV"
      - name: Run migration build gate
        if: inputs.full_validation == true
        run: mise run migration:build-and-gate
      - name: Test Rust workspace
        run: mise exec -- cargo test --workspace --locked
      - name: Rust formatting
        run: mise exec -- cargo fmt --all -- --check
      - name: Install Piper smoke model
        if: inputs.full_validation == true
        run: |
          mkdir -p models/piper
          model_base="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium"
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx" -o models/piper/pt_BR-faber-medium.onnx
          printf '%s  %s\n' \
            '858555e3a064209c57088fe6bd70c4c3dc54d03eaa00c45d5ecaf43a33f95aa7' \
            'models/piper/pt_BR-faber-medium.onnx' | sha256sum --check --status
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx.json" -o models/piper/pt_BR-faber-medium.onnx.json
      - name: Piper Embedded runtime smoke test
        if: inputs.full_validation == true
        run: mise exec -- cargo test --manifest-path native/piper-runtime/Cargo.toml --features onnxruntime,piper-inference,heavy-runtime-tests piper_inference_generates_valid_wav_from_vendored_model -- --nocapture
  web:
    if: needs.changes.outputs.web == 'true'
    name: Web
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: ${{ needs.changes.outputs.wasm == 'true' && 'python,node,npm,rust,github:wasm-bindgen/wasm-bindgen' || 'python,node,npm' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false
      - name: Check Web toolchain scope
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          BUILD_WASM: ${{ needs.changes.outputs.wasm }}
        run: |
          mise ls --current --json | python3 -c '
          import json, os, sys
          tools = set(json.load(sys.stdin))
          expected = {"python", "node", "npm"}
          if os.environ["BUILD_WASM"] == "true":
              expected.update({"rust", "github:wasm-bindgen/wasm-bindgen"})
          if tools != expected:
              sys.exit(f"Unexpected Web CI tools: {sorted(tools)}")
          print(f"Web CI tools: {sorted(tools)}")
          '
      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Install Rust WASM target
        if: needs.changes.outputs.wasm == 'true'
        run: rustup target add wasm32-unknown-unknown
      - name: Build direct Rust WASM adapter
        if: needs.changes.outputs.wasm == 'true'
        run: mise run web:wasm-build
      - name: Verify generated WASM runtime contracts
        if: needs.changes.outputs.wasm == 'true'
        run: mise run web:wasm-contract:test
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install web dependencies
        working-directory: web
        run: mise exec -- npm ci --prefer-offline --no-audit --no-fund
      - name: Run full web tests
        working-directory: web
        run: mise exec -- npm test -- --maxWorkers=2
      - name: Run web lint
        working-directory: web
        run: mise exec -- npm run lint
      - name: Run web build
        working-directory: web
        run: mise exec -- npm run build

  flutter:
    if: needs.changes.outputs.flutter == 'true'
    name: Flutter
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: python,flutter
      EPUB_DART_FABER_INTEGRATION: '0'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false

      - name: Check Flutter toolchain scope
        run: |
          mise ls --current --json | python3 -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python", "flutter"}:
              sys.exit(f"Unexpected Flutter CI tools: {sorted(tools)}")
          print("Flutter CI tools: python, flutter")
          '

      - name: Cache Flutter SDK
        id: flutter-sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Retain installed Flutter SDK
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}

      - name: Cache Pub downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-

      - name: Install Flutter dependencies
        id: flutter-dependencies
        working-directory: flutter_app
        run: mise exec -- flutter pub get

      - name: Run Flutter analyzer
        id: flutter-analyze
        run: |
          set -o pipefail
          mkdir -p .reports/flutter
          mise run flutter:analyze 2>&1 | tee .reports/flutter/analyze.log

      - name: Run Flutter tests
        if: ${{ !cancelled() && steps.flutter-dependencies.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p .reports/flutter
          mise run flutter:test 2>&1 | tee .reports/flutter/tests.log

      - name: Retain Flutter failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-diagnostics-${{ github.sha }}
          path: .reports/flutter/
          if-no-files-found: warn
          retention-days: 7

  android-jvm:
    # The integrated Faber APK job already executes the same JVM suite.
    if: needs.changes.outputs.android == 'true' && !(inputs.full_validation == true && github.event_name == 'push' && github.ref == 'refs/heads/master')
    name: Android JVM tests
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 12 }}
    runs-on: ubuntu-24.04
    env:
      MISE_ENABLE_TOOLS: python,ruby,flutter,java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false
      - name: Cache Flutter SDK
        id: flutter-sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Install scoped project tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Retain installed Flutter SDK
        if: steps.flutter-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs/flutter
          key: flutter-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - name: Cache Pub downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}-
      - name: Cache Gradle dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'flutter_app/android/**/*.gradle.kts', 'flutter_app/android/gradle.properties', 'flutter_app/android/gradle/wrapper/gradle-wrapper.properties', 'flutter_app/pubspec.lock') }}
          restore-keys: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Resolve Flutter plugins and hosted Android SDK
        run: |
          mise exec -- ruby -e 'File.write("flutter_app/android/local.properties", "sdk.dir=#{ENV.fetch("ANDROID_HOME")}\nflutter.sdk=#{ARGV.fetch(0)}\n")' "$(mise where flutter)"
          cd flutter_app
          mise exec -- flutter pub get
      - name: Bootstrap the ignored wrapper from the pinned Flutter SDK
        run: |
          wrapper="$(mise where flutter)/bin/cache/artifacts/gradle_wrapper"
          install -m 755 "$wrapper/gradlew" flutter_app/android/gradlew
          install -m 644 "$wrapper/gradle/wrapper/gradle-wrapper.jar" flutter_app/android/gradle/wrapper/gradle-wrapper.jar
      - name: Run Android JVM tests without packaging Flutter assets
        working-directory: flutter_app/android
        # Unit tests do not load Flutter assets or JNI. APK builds retain the
        # complete embedded-input guard and audit in the Faber workflow.
        run: mise exec -- ruby ../../scripts/native_build_command.rb -- mise exec -- ./gradlew :app:testDebugUnitTest -x :app:copyFlutterAssetsDebug --max-workers=1 --no-daemon --console=plain '-Dorg.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m'
      - name: Require executed Android JVM cases
        run: |
          mise exec -- python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('flutter_app/build/app/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('Missing Android JVM test results')
          counts = {name: 0 for name in ('tests', 'failures', 'errors', 'skipped')}
          for report in reports:
              suite = ET.parse(report).getroot()
              for name in counts:
                  counts[name] += int(suite.attrib[name])
          if counts['tests'] <= 0 or any(counts[name] for name in ('failures', 'errors', 'skipped')):
              raise SystemExit(f'Android JVM tests did not all execute successfully: {counts}')
          print(f'ANDROID_JVM_TESTS {counts}')
          PY
      - name: Retain Android JVM test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-jvm-results-${{ github.sha }}
          path: |
            flutter_app/build/app/reports/tests/
            flutter_app/build/app/test-results/
          if-no-files-found: warn
          retention-days: 7

  apple-app:
    name: Apple app tests
    needs: [changes]
    if: needs.changes.outputs.apple == 'true' && !(inputs.full_validation == true && github.event_name == 'push' && github.ref == 'refs/heads/master')
    uses: ./.github/workflows/faber-integration.yml
    with:
      macos_only: true
    permissions:
      contents: read
      actions: read

  apple-foundation:
    if: needs.changes.outputs.apple == 'true'
    name: Apple Foundation tests
    needs: [changes]
    timeout-minutes: ${{ inputs.full_validation == true && 30 || 7 }}
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MISE_ENABLE_TOOLS: ruby
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Xcode 16.4 without launching a device
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
          install: false
      - name: Install scoped Ruby toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Test the Foundation-only Apple production seam
        run: |
          set -o pipefail
          mkdir -p .reports/apple-foundation
          mise run apple:foundation:test 2>&1 | tee .reports/apple-foundation/test.log
      - name: Require the conversion history regression suite
        shell: ruby {0}
        run: |
          log = File.read('.reports/apple-foundation/test.log')
          suites = log.scan(/Test Suite 'ConversionHistoryReaderTests' passed[^\n]*\n\s*Executed (\d+) tests?, with 0 failures/)
          abort 'Foundation history must execute without failures or skips' if suites.empty? || suites.any? { |counts| counts.first.to_i.zero? }
          abort 'Foundation history contains a skipped or failing case' if log.match?(/Test Case '[^'\n]*ConversionHistoryReaderTests[^'\n]*' (?:skipped|failed)/)
          puts "FOUNDATION_HISTORY_XCTEST total=#{suites.sum { |counts| counts.first.to_i }} failed=0 skipped=0"


  pr-gate:
    name: PR gate
    needs: [changes, production-packaging-guard, python-tests, rust, flutter, android-jvm, web, apple-foundation, apple-app]
    if: always()
    timeout-minutes: 1
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected runtime and reject missing scope evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          INTEGRATED_VALIDATION: ${{ inputs.full_validation == true && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        shell: ruby {0}
        run: |
          require 'json'
          needs = JSON.parse(ENV.fetch('NEEDS_JSON'))
          integrated = ENV.fetch('INTEGRATED_VALIDATION')
          abort 'Missing validation mode' unless %w[true false].include?(integrated)
          %w[changes production-packaging-guard].each { |job| abort "Required job failed: #{job}" unless needs.fetch(job).fetch('result') == 'success' }
          scopes = needs.fetch('changes').fetch('outputs')
          wasm = scopes.fetch('wasm')
          abort 'Missing scope evidence: wasm' unless %w[true false].include?(wasm)
          abort 'WASM validation requires the Web job' if wasm == 'true' && scopes.fetch('web') != 'true'
          { 'python-tests' => 'python', 'rust' => 'rust', 'flutter' => 'flutter', 'android-jvm' => 'android', 'web' => 'web', 'apple-foundation' => 'apple', 'apple-app' => 'apple' }.each do |job, scope|
            selected = scopes.fetch(scope)
            abort "Missing scope evidence: #{scope}" unless %w[true false].include?(selected)
            # Full post-merge validation already requires the complete Faber matrix.
            required = selected == 'true' && !(%w[apple-app android-jvm].include?(job) && integrated == 'true')
            expected = required ? 'success' : 'skipped'
            abort "Unexpected runtime result: #{job}" unless needs.fetch(job).fetch('result') == expected
          end
