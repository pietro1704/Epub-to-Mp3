name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-packaging-guard:
    name: Production packaging guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false

      - name: Check production packaging boundary
        run: mise run guard:no-python-production

  python:
    name: Python
    needs: production-packaging-guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: pip-

      - name: Cache Python virtualenv
        uses: actions/cache@v6
        with:
          path: .venv
          key: python-venv-${{ runner.os }}-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: python-venv-${{ runner.os }}-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          mise exec -- python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r python_app/requirements.txt ruff
          bash scripts/install_piper_binary.sh

      - name: Bootstrap iOS embedded Python vendor
        working-directory: ios/EpubToMp3
        run: bash scripts/bootstrap-ios-python.sh

      - name: Run Python tests
        run: mise exec -- python -m pytest -v --tb=short

      - name: Run Python lint
        run: mise exec -- ruff check python_app tests

      - name: Run sample conversion smoke
        env:
          R2_OPTIONAL: "true"
          EDGE_CHUNK_CHARS: "4000"
          EDGE_MAX_CONCURRENCY: "1"
          EDGE_ENABLE_PARALLEL: "false"
          EDGE_AUTO_TUNE: "false"
        run: |
          mise exec -- python -m python_app.main convert web/public/sample.epub --engine edge --chapter 1 --no-parallel --verbose

      - name: Run external worker pool E2E smoke
        env:
          R2_OPTIONAL: "true"
          EDGE_MAX_CONCURRENCY: "1"
          EDGE_ENABLE_PARALLEL: "false"
          EDGE_AUTO_TUNE: "false"
          CHAPTER_PARALLEL_COUNT: "1"
        run: |
          mise exec -- python scripts/external_worker_pool.py web/public/sample.epub \
            --workers 1 \
            --forward-args "--engine edge --chapter 1 --no-parallel --no-validate-text --no-validate-audio --stage-pipeline"

  rust:
    name: Rust
    needs: production-packaging-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install Rust toolchain
        run: mise install
      - name: Install ONNX Runtime smoke-test library
        run: |
          archive="$RUNNER_TEMP/onnxruntime-linux-x64-1.24.4.tgz"
          curl --fail --location --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-linux-x64-1.24.4.tgz \
            --output "$archive"
          echo '3a211fbea252c1e66290658f1b735b772056149f28321e71c308942cdb54b747  '"$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/onnxruntime"
          tar -xzf "$archive" -C "$RUNNER_TEMP/onnxruntime"
          runtime_library="$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-1.24.4/lib/libonnxruntime.so"
          test -f "$runtime_library"
          echo "ORT_DYLIB_PATH=$runtime_library" >> "$GITHUB_ENV"
      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native/piper-runtime/target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'native/piper-runtime/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Check Rust workspace
        run: mise exec -- cargo check --workspace
      - name: Run migration build gate
        run: mise run migration:build-and-gate
      - name: Test Rust workspace
        run: mise exec -- cargo test --workspace
      - name: Rust formatting
        run: mise exec -- cargo fmt --all -- --check
      - name: Install Piper smoke model
        run: |
          mkdir -p models/piper
          model_base="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium"
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx" -o models/piper/pt_BR-faber-medium.onnx
          printf '%s  %s\n' \
            '858555e3a064209c57088fe6bd70c4c3dc54d03eaa00c45d5ecaf43a33f95aa7' \
            'models/piper/pt_BR-faber-medium.onnx' | sha256sum --check --status
          curl --fail --location --retry 3 "$model_base/pt_BR-faber-medium.onnx.json" -o models/piper/pt_BR-faber-medium.onnx.json
      - name: Install eSpeak-NG phoneme data
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends espeak-ng-data
          phoneme_table="$(dpkg -L espeak-ng-data | sed -n '/\/espeak-ng-data\/phontab$/p' | head -n 1)"
          test -n "$phoneme_table"
          test -f "$phoneme_table"
          data_directory="${phoneme_table%/phontab}"
          echo "PIPER_ESPEAKNG_DATA_DIRECTORY=${data_directory%/espeak-ng-data}" >> "$GITHUB_ENV"
      - name: Piper Embedded runtime smoke test
        run: mise exec -- cargo test --manifest-path native/piper-runtime/Cargo.toml --features onnxruntime,piper-inference,heavy-runtime-tests piper_inference_generates_valid_wav_from_vendored_model -- --nocapture
  web:
    name: Web
    needs: production-packaging-guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install toolchain
        run: mise install
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Build direct Rust WASM adapter
        run: mise run web:wasm-build
      - name: Install web dependencies
        working-directory: web
        run: mise exec -- npm ci --prefer-offline --no-audit --no-fund
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json', 'web/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Run web tests
        working-directory: web
        run: mise exec -- npm test
      - name: Run web lint
        working-directory: web
        run: mise exec -- npm run lint
      - name: Run web build
        working-directory: web
        run: mise exec -- npm run build

  flutter:
    name: Flutter
    needs: production-packaging-guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Run Flutter tests
        working-directory: flutter_app
        run: mise exec -- flutter test

      - name: Run Flutter analyzer
        working-directory: flutter_app
        run: mise exec -- flutter analyze
