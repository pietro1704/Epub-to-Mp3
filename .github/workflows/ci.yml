name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt', 'python_app/requirements.txt') }}
          restore-keys: pip-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          mise exec -- python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r python_app/requirements.txt ruff
          bash scripts/install_piper_binary.sh

      - name: Bootstrap iOS vendor (for drift tests)
        run: bash ios/EpubToMp3/scripts/bootstrap-ios-python.sh

      - name: Run Python tests
        run: mise exec -- python -m pytest -v --tb=short

      - name: Run Python lint
        run: mise exec -- ruff check .

      - name: Run sample conversion smoke
        env:
          R2_OPTIONAL: "true"
          EDGE_CHUNK_CHARS: "4000"
          EDGE_MAX_CONCURRENCY: "1"
          EDGE_ENABLE_PARALLEL: "false"
          EDGE_AUTO_TUNE: "false"
        run: |
          mise exec -- python -m python_app.main convert web/public/sample.epub --engine edge --chapter 1 --no-parallel --verbose

      - name: Run external worker pool E2E smoke
        env:
          R2_OPTIONAL: "true"
          EDGE_MAX_CONCURRENCY: "1"
          EDGE_ENABLE_PARALLEL: "false"
          EDGE_AUTO_TUNE: "false"
          CHAPTER_PARALLEL_COUNT: "1"
        run: |
          mise exec -- python scripts/external_worker_pool.py web/public/sample.epub \
            --workers 1 \
            --forward-args "--engine edge --chapter 1 --no-parallel --no-validate-text --no-validate-audio --stage-pipeline"

  web:
    name: Web
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-

      - name: Install web dependencies
        working-directory: web
        run: mise exec -- npm install

      - name: Run web tests
        working-directory: web
        run: mise exec -- npm test

      - name: Run web lint
        working-directory: web
        run: mise exec -- npm run lint

      - name: Run web build
        working-directory: web
        run: mise exec -- npm run build
