name: Release Desktop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Required so mise can activate the .venv from mise.toml (virtualenv feature)
  MISE_EXPERIMENTAL: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.checkout_ref != '' && inputs.checkout_ref || format('refs/tags/{0}', inputs.tag)) || github.ref }}

on:
  # Versioned release: git tag v1.2.3
  push:
    tags:
      - "v*.*.*"

  # Manual trigger or rolling rebuild from auto-release
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
      checkout_ref:
        description: "Git ref to checkout (empty = tag ref, 'master' = latest code)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write   # required for ghcr.io Docker push

# Cancel in-progress runs for the same ref or manual dispatch.
concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Docker image → ghcr.io ────────────────────────────────────────────────────
  docker:
    name: docker
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Sync release version manifests
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 - <<'PY' "$VERSION"
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          package_path = Path("web/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/epub-to-mp3
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Epub to Mp3
            org.opencontainers.image.description=EPUB/PDF to MP3 audiobook converter

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Android APK (Flutter) ─────────────────────────────────────────────────────
  android:
    name: android
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Build APK (release)
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename APK
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk EpubToMp3_android.apk

      - name: Upload APK — versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          fail_on_unmatched_files: false
          files: EpubToMp3_android.apk

  # ──────────────────────────────────────────────────────────────────────
  # SwiftUI native Apple build (macOS .app + iOS .ipa unsigned)
  #
  # Builds the official Apple client out of `ios/EpubToMp3/`. Builds the
  # PyInstaller sidecar inline (no longer reused from a Tauri build).
  # The iOS build is unsigned — users sideload via AltStore.
  # ──────────────────────────────────────────────────────────────────────
  swiftui-apple:
    name: SwiftUI · Apple
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build PyInstaller sidecar
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install pyinstaller --quiet
          pip install -r requirements-desktop.txt --quiet
          pyinstaller desktop.spec --noconfirm --clean
          ls -lh dist/epub-to-mp3-server

      - name: Generate Xcode project
        working-directory: ios/EpubToMp3
        run: xcodegen generate

      - name: Build macOS .app
        working-directory: ios/EpubToMp3
        run: |
          xcodebuild \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3 \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package macOS .app into .zip
        working-directory: ios/EpubToMp3
        run: |
          APP_PATH="build/Build/Products/Release/EpubToMp3.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App bundle missing at $APP_PATH"
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "EpubToMp3-macos-${RELEASE_TAG}.zip"

      - name: Build iOS .ipa (unsigned)
        working-directory: ios/EpubToMp3
        run: |
          xcodebuild \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3 \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build-ios/EpubToMp3.xcarchive || echo "::warning::iOS archive failed; continuing with macOS-only release"

      - name: Upload macOS .zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ios/EpubToMp3/EpubToMp3-macos-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Flutter desktop builds (Linux + Windows)
  #
  # Official non-Apple desktop client. macOS/iOS are NOT supported by
  # the Flutter app — the SwiftUI app owns Apple platforms.
  # ──────────────────────────────────────────────────────────────────────
  flutter-desktop:
    name: Flutter · ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            target: linux
          - label: windows-x64
            os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Enable desktop platform
        working-directory: flutter_app
        run: |
          flutter config --enable-${{ matrix.target }}-desktop

      - name: Build
        working-directory: flutter_app
        shell: bash
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --release

      - name: Package Linux build
        if: runner.os == 'Linux'
        working-directory: flutter_app
        run: |
          cd build/linux/x64/release/bundle
          tar czf "../../../../../EpubToMp3-flutter-linux-${RELEASE_TAG}.tar.gz" .

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: flutter_app
        shell: pwsh
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath "..\..\..\..\..\..\EpubToMp3-flutter-windows-${env:RELEASE_TAG}.zip"

      - name: Upload Flutter desktop artefact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            flutter_app/EpubToMp3-flutter-*.tar.gz
            flutter_app/EpubToMp3-flutter-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
