name: Release Desktop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Keep mise experimental features enabled for the release jobs
  MISE_EXPERIMENTAL: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.checkout_ref != '' && inputs.checkout_ref || format('refs/tags/{0}', inputs.tag)) || github.ref }}

on:
  # Versioned release: git tag v1.2.3
  push:
    tags:
      - "v*.*.*"

  # Explicit manual publication of an already validated tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
      checkout_ref:
        description: "Source ref (empty = tag); must resolve to the same validated tag commit"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize publication for a version; never cancel a partially published release.
concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Resolve and require a validated tagged merge
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ env.RELEASE_REF }}
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --tag "$VERSION_TAG"

  native-notices:
    needs: gate
    uses: ./.github/workflows/release-native-notices.yml
    with:
      source_sha: ${{ needs.gate.outputs.sha }}

  # Build only commits present in the trusted master snapshot on each runner.
  # Keep shared Actions caches out of release builds, including tool setup.
  # ── Docker image → ghcr.io ────────────────────────────────────────────────────
  docker:
    needs: gate
    name: docker
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - name: Select the validated release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.gate.outputs.sha }}
        run: bash scripts/checkout_validated_release_source.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/epub-to-mp3
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},prefix=
          labels: |
            org.opencontainers.image.title=Epub to Mp3
            org.opencontainers.image.description=EPUB/PDF to MP3 audiobook converter

      - name: Build Docker image without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/release-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-docker
          path: ${{ runner.temp }}/release-image.tar
          if-no-files-found: error
          retention-days: 7

  # ── Android APK (Flutter) ─────────────────────────────────────────────────────
  android:
    needs: [gate, native-notices]
    name: android
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      # Java, the Android SDK and Rust come from the project mise toolchain, like
      # the validated Android build in faber-integration.yml.
      MISE_ENABLE_TOOLS: ruby,ninja,flutter,java,android-sdk,rust
    steps:
      - name: Checkout trusted source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - name: Select the validated release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.gate.outputs.sha }}
        run: bash scripts/checkout_validated_release_source.sh

      - name: Require official Android signing inputs
        env:
          ANDROID_SIGNING_AVAILABLE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
        run: |
          if [[ "$ANDROID_SIGNING_AVAILABLE" != true ]]; then
            echo '::error::Official Android signing reference is unavailable.'
            exit 1
          fi
          if [[ ! -f scripts/verify_android_release_signature.rb ]]; then
            echo '::error::The validated source predates official Android signing.'
            exit 1
          fi

      - name: Set up native build tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_ENABLE_TOOLS: ruby,ninja,flutter,java,android-sdk,rust
        with:
          version: 2026.11.3
          experimental: true
          cache: false

      - name: Install native Android prerequisites
        timeout-minutes: 10
        run: bash scripts/ci_apt_install.sh clang libclang-dev cmake pkg-config

      # The runner image no longer puts an Android SDK on PATH (v0.9.0 failed with
      # "sdkmanager: command not found"); use the mise-managed SDK.
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | mise exec -- sdkmanager --licenses
          result=${PIPESTATUS[1]}
          exit "$result"

      - name: Install project Android target dependencies
        run: |
          mise run android:embedded-deps
          mise exec -- rustup target add aarch64-linux-android

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-third-party-notices
          path: flutter_app/android/app/src/main/assets/ThirdPartyNotices

      - name: Build APK (release)
        env:
          MISE_EXPERIMENTAL: "1"
          EPUBTOPMP3_ANDROID_OFFICIAL_RELEASE: "1"
        run: mise run flutter:build-apk

      - name: Sign and verify the official Android APK
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/keystore"
          unset APK_KEYSTORE_BASE64
          mise exec -- apksigner sign --ks "$signing_dir/keystore" --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass env:APK_STORE_PASSWORD --key-pass env:APK_KEY_PASSWORD --v4-signing-enabled false \
            --out "$signing_dir/EpubToMp3_android.apk" flutter_app/build/app/outputs/flutter-apk/app-release.apk
          unset APK_STORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS
          mise exec -- ruby scripts/verify_android_release_signature.rb "$signing_dir/EpubToMp3_android.apk"
          mv "$signing_dir/EpubToMp3_android.apk" EpubToMp3_android.apk

      - name: Verify signed APK native notices
        run: |
          path=assets/ThirdPartyNotices/SOURCE.md
          unzip -p EpubToMp3_android.apk "$path" | cmp - "flutter_app/android/app/src/main/$path"

      - name: Retain APK for publication after all builds succeed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: EpubToMp3_android.apk
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  # The AppKit client embeds converter-ffi. Signed iOS release is handled by
  # ios-testflight.yml, and converter-ffi-ios-prebuilt.yml owns validation archives.
  # ──────────────────────────────────────────────────────────────────────
  macos-native:
    needs: [gate, native-notices]
    name: macOS native
    runs-on: ${{ matrix.os }}
    # Release builds are uncached; the Intel image compiles Rust much slower.
    timeout-minutes: 180
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    env:
      MACOS_ARCH: ${{ matrix.arch }}
      # mise has no precompiled Ruby for macos-x64 and compiling it is slow: only Rust
      # comes from mise, and `mise exec -- ruby` falls through to the runner's Ruby.
      MISE_ENABLE_TOOLS: rust
    steps:
      - name: Checkout trusted source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - name: Select the validated release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.gate.outputs.sha }}
        run: bash scripts/checkout_validated_release_source.sh

      - name: Install xcodegen
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew install xcodegen

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install rust

      - name: Build the embedded Rust library
        run: mise run converter-ffi:build

      - name: Generate Xcode project
        working-directory: ios/EpubToMp3
        run: xcodegen generate

      - name: Build macOS .app
        working-directory: ios/EpubToMp3
        run: |
          # The Rust build produces one slice, and ONNX packaging needs that same slice.
          ffi_arch="$(lipo -archs ../../target/release/libconverter_ffi.dylib)"
          case "$ffi_arch" in
            arm64|x86_64) ;;
            *)
              echo "::error::Expected one macOS converter-ffi architecture, got: $ffi_arch" >&2
              exit 1
              ;;
          esac
          # macOS bundle metadata uses the numeric core of the validated release tag.
          release_version="${RELEASE_TAG#v}"
          xcodebuild \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3 \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="$ffi_arch" \
            MARKETING_VERSION="${release_version%%[-+]*}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-third-party-notices
          path: ios/EpubToMp3/build/Build/Products/Release/EpubToMp3.app/Contents/Resources/ThirdPartyNotices

      - name: Seal macOS .app
        working-directory: ios/EpubToMp3
        run: |
          APP_PATH="build/Build/Products/Release/EpubToMp3.app"
          # Intel linkers leave dylibs unsigned; sign only those that carry no signature.
          for library in "$APP_PATH"/Contents/Frameworks/*.dylib; do
            if [[ -f "$library" ]] && ! codesign --display "$library" 2>/dev/null; then
              codesign --force --sign - --timestamp=none "$library"
            fi
          done
          # Seal the outer bundle after embedding. Verify the existing nested signatures.
          # Without the app entitlements the app runs unsandboxed and misses its container.
          codesign --force --sign - --timestamp=none \
            --entitlements EpubToMp3/Resources/EpubToMp3.entitlements "$APP_PATH"
          codesign --verify --deep --strict --all-architectures "$APP_PATH"

      - name: Package macOS .app into .zip
        working-directory: ios/EpubToMp3
        run: |
          APP_PATH="build/Build/Products/Release/EpubToMp3.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App bundle missing at $APP_PATH"
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          expected_bundle_version="${release_version%%[-+]*}"
          bundle_version="$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Contents/Info.plist")"
          if [[ "$bundle_version" != "$expected_bundle_version" ]]; then
            echo "::error::Expected macOS app version $expected_bundle_version, got $bundle_version" >&2
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "EpubToMp3-macos-${RELEASE_TAG}-${MACOS_ARCH}.zip"

      - name: Retain macOS package for publication after all builds succeed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apple-${{ matrix.arch }}
          path: ios/EpubToMp3/EpubToMp3-macos-*.zip
          if-no-files-found: error
          retention-days: 7

  # Official non-Apple desktop client. Builds the Rust-backed Flutter client;
  # macOS/iOS are NOT supported by the Flutter app — the native Apple app
  # owns those platforms.
  # ──────────────────────────────────────────────────────────────────────
  flutter-desktop:
    needs: [gate, native-notices]
    name: Flutter · ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            target: linux
            tools: flutter,rust
            package_root: flutter_app/build/linux/x64/release/bundle
          - label: windows-x64
            os: windows-2025
            target: windows
            tools: flutter
            package_root: flutter_app/build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    env:
      MISE_ENABLE_TOOLS: ${{ matrix.tools }}
    steps:
      - name: Checkout trusted source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/master
          fetch-depth: 0
          persist-credentials: false
      - name: Select the validated release commit
        shell: bash
        env:
          VALIDATED_SHA: ${{ needs.gate.outputs.sha }}
        run: bash scripts/checkout_validated_release_source.sh

      - name: Linux desktop deps
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/ci_apt_install.sh --install-recommends clang libclang-dev cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev unzip binutils

      - name: Provision the pinned Linux ONNX Runtime
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash scripts/fetch_onnxruntime_linux.sh "$RUNNER_TEMP/release-linux-ort"
          runtime="$RUNNER_TEMP/release-linux-ort/onnxruntime-linux-x64-1.24.4/lib"
          test -f "$runtime/libonnxruntime.so.1"
          {
            echo "ORT_LIB_LOCATION=$runtime"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "ORT_SKIP_DOWNLOAD=1"
          } >> "$GITHUB_ENV"

      - name: Setup desktop toolchains
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false

      # The helper comes from master, not from the tag being built, so a tag that
      # predates it (v0.9.0) still gets the pinned runtime.
      - name: Checkout trusted release helpers
        if: runner.os == 'Windows'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: release-helpers
          sparse-checkout: scripts/provision_onnxruntime_windows.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Provision the pinned ONNX Runtime and libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./release-helpers/scripts/provision_onnxruntime_windows.ps1 -Owned (Join-Path $env:RUNNER_TEMP 'release-windows')
          "ORT_PREFER_DYNAMIC_LINK=1" >> $env:GITHUB_ENV
          "ORT_SKIP_DOWNLOAD=1" >> $env:GITHUB_ENV

      - name: Enable desktop platform
        working-directory: flutter_app
        run: |
          mise exec -- flutter config --enable-${{ matrix.target }}-desktop

      - name: Build
        working-directory: flutter_app
        shell: bash
        run: |
          mise exec -- flutter pub get
          mise exec -- flutter build ${{ matrix.target }} --release

      - name: Verify Linux Rust runtime bundle
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bundle_lib=flutter_app/build/linux/x64/release/bundle/lib
          library="$bundle_lib/libconverter_ffi.so"
          onnxruntime="$bundle_lib/libonnxruntime.so.1"
          test -s "$library"
          cmp "$ORT_LIB_LOCATION/libonnxruntime.so.1" "$onnxruntime"
          LC_ALL=C readelf -d "$library" | grep -F 'Shared library: [libonnxruntime.so.1]'
          linkage=$(env -u LD_LIBRARY_PATH -u LD_PRELOAD LC_ALL=C ldd -r "$library" 2>&1)
          printf '%s\n' "$linkage"
          if grep -Eq 'not found|undefined symbol' <<<"$linkage"; then
            echo "::error::The Linux converter library has unresolved dependencies."
            exit 1
          fi
          grep -F "libonnxruntime.so.1 => $(realpath "$bundle_lib")/libonnxruntime.so.1 " <<<"$linkage"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-third-party-notices
          path: ${{ matrix.package_root }}/ThirdPartyNotices

      - name: Package Linux build
        if: runner.os == 'Linux'
        working-directory: flutter_app
        run: |
          cd build/linux/x64/release/bundle
          tar czf "../../../../../EpubToMp3-flutter-linux-${RELEASE_TAG}.tar.gz" .

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: flutter_app
        shell: pwsh
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath "..\..\..\..\..\EpubToMp3-flutter-windows-${env:RELEASE_TAG}.zip"

      - name: Retain desktop package for publication after all builds succeed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.label }}
          path: |
            flutter_app/EpubToMp3-flutter-*.tar.gz
            flutter_app/EpubToMp3-flutter-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [gate, docker, android, macos-native, flutter-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Revalidate immutable source and tag before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ needs.gate.outputs.sha }}
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --tag "$VERSION_TAG"
      - name: Set up Android signature verification tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_ENABLE_TOOLS: ruby,java,android-sdk
        with:
          version: 2026.11.3
          experimental: true
          cache: false
      # The mise android-sdk plugin ships no build-tools; apksigner comes from the same
      # build-tools version that the android job installs through android:embedded-deps.
      - name: Install Android build-tools for APK signature verification
        env:
          MISE_ENABLE_TOOLS: ruby,java,android-sdk
        run: |
          set +o pipefail
          yes | mise exec -- sdkmanager --licenses
          result=${PIPESTATUS[1]}
          set -o pipefail
          [ "$result" -eq 0 ]
          mise exec -- sdkmanager "build-tools;35.0.0"
          mise exec -- apksigner --version
      - name: Verify the downloaded official Android APK before publication
        env:
          MISE_ENABLE_TOOLS: ruby,java,android-sdk
        run: mise exec -- ruby scripts/verify_android_release_signature.rb release-assets/EpubToMp3_android.apk
      - name: Load the already built Docker image
        run: docker load --input release-assets/release-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish built image and release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ needs.gate.outputs.sha }}
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --tag "$VERSION_TAG"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/epub-to-mp3"
          version="${VERSION_TAG#v}"
          docker tag "$image:$VERSION_TAG" "$image:latest"
          docker tag "$image:$VERSION_TAG" "$image:${version%.*}"
          docker tag "$image:$VERSION_TAG" "$image:$version"
          docker push "$image:$version"
          docker push "$image:${version%.*}"
          docker push "$image:latest"
          # The version tag must already exist and still identify the tested merge.
          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" --verify-tag --title "$VERSION_TAG" --generate-notes
          fi
          gh release upload "$VERSION_TAG" release-assets/EpubToMp3_android.apk release-assets/*.zip release-assets/*.tar.gz --clobber
