name: Release Desktop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Required so mise can activate the .venv from mise.toml (virtualenv feature)
  MISE_EXPERIMENTAL: "1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.checkout_ref != '' && inputs.checkout_ref || format('refs/tags/{0}', inputs.tag)) || github.ref }}

on:
  # Versioned release: git tag v1.2.3
  push:
    tags:
      - "v*.*.*"

  # Explicit manual publication of an already validated tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
      checkout_ref:
        description: "Source ref (empty = tag); must resolve to the same validated tag commit"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize publication for a version; never cancel a partially published release.
concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
      - name: Resolve and require a validated tagged merge
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ env.RELEASE_REF }}
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --tag "$VERSION_TAG"
  # ── Docker image → ghcr.io ────────────────────────────────────────────────────
  docker:
    needs: gate
    name: docker
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/epub-to-mp3
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},prefix=
          labels: |
            org.opencontainers.image.title=Epub to Mp3
            org.opencontainers.image.description=EPUB/PDF to MP3 audiobook converter

      - name: Build Docker image without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/release-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-docker
          path: ${{ runner.temp }}/release-image.tar
          if-no-files-found: error

  # ── Android APK (Flutter) ─────────────────────────────────────────────────────
  android:
    needs: gate
    name: android
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - name: Set up native build tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        env:
          MISE_ENABLE_TOOLS: ruby,ninja
        with:
          experimental: true

      - name: Install native Android prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config
          sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build APK (release)
        env:
          MISE_ENABLE_TOOLS: ruby,ninja
          MISE_EXPERIMENTAL: "1"
        run: mise run flutter:build-apk

      - name: Rename APK
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk EpubToMp3_android.apk

      - name: Retain APK for publication after all builds succeed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-android
          path: EpubToMp3_android.apk
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # SwiftUI native Apple build (macOS .app + iOS .ipa unsigned)
  #
  # Builds the official Apple client out of `ios/EpubToMp3/`. macOS embeds
  # the Rust converter-server. Legacy Python bridge sources remain in the
  # repository as oracle tests but are excluded from the production target.
  # The iOS build is unsigned — users sideload via AltStore.
  # ──────────────────────────────────────────────────────────────────────
  swiftui-apple:
    needs: gate
    name: SwiftUI · Apple
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Install xcodegen
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew install xcodegen

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build Rust macOS sidecar
        run: |
          cargo build --release -p converter-server
          mkdir -p dist
          cp target/release/converter-server dist/epub-to-mp3-server
          chmod 755 dist/epub-to-mp3-server
          ls -lh dist/epub-to-mp3-server

      - name: Generate Xcode project
        working-directory: ios/EpubToMp3
        run: xcodegen generate

      - name: Build macOS .app
        working-directory: ios/EpubToMp3
        run: |
          xcodebuild \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3 \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package macOS .app into .zip
        working-directory: ios/EpubToMp3
        run: |
          APP_PATH="build/Build/Products/Release/EpubToMp3.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App bundle missing at $APP_PATH"
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "EpubToMp3-macos-${RELEASE_TAG}.zip"

      - name: Build iOS .ipa (unsigned)
        working-directory: ios/EpubToMp3
        run: |
          xcodebuild \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3 \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build-ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive -archivePath build-ios/EpubToMp3.xcarchive || echo "::warning::iOS archive failed; continuing with macOS-only release"

      - name: Retain Apple package for publication after all builds succeed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-apple
          path: ios/EpubToMp3/EpubToMp3-macos-*.zip
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # Flutter desktop builds (Linux + Windows)
  #
  # Official non-Apple desktop client. Builds the Rust-backed Flutter client;
  # macOS/iOS are NOT supported by the Flutter app — the native Apple app
  # owns those platforms.
  # ──────────────────────────────────────────────────────────────────────
  flutter-desktop:
    needs: gate
    name: Flutter · ${{ matrix.label }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-22.04
            target: linux
          - label: windows-x64
            os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Enable desktop platform
        working-directory: flutter_app
        run: |
          flutter config --enable-${{ matrix.target }}-desktop

      - name: Build
        working-directory: flutter_app
        shell: bash
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --release

      - name: Verify Linux Rust runtime bundle
        if: runner.os == 'Linux'
        run: test -s flutter_app/build/linux/x64/release/bundle/lib/libconverter_ffi.so

      - name: Package Linux build
        if: runner.os == 'Linux'
        working-directory: flutter_app
        run: |
          cd build/linux/x64/release/bundle
          tar czf "../../../../../EpubToMp3-flutter-linux-${RELEASE_TAG}.tar.gz" .

      - name: Package Windows build
        if: runner.os == 'Windows'
        working-directory: flutter_app
        shell: pwsh
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath "..\..\..\..\..\EpubToMp3-flutter-windows-${env:RELEASE_TAG}.zip"

      - name: Retain desktop package for publication after all builds succeed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.label }}
          path: |
            flutter_app/EpubToMp3-flutter-*.tar.gz
            flutter_app/EpubToMp3-flutter-*.zip
          if-no-files-found: error

  publish:
    needs: [gate, docker, android, swiftui-apple, flutter-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Revalidate immutable source and tag before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ needs.gate.outputs.sha }}
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --tag "$VERSION_TAG"
      - name: Load the already built Docker image
        run: docker load --input release-assets/release-image.tar
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish built image and release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ needs.gate.outputs.sha }}
          VERSION_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --tag "$VERSION_TAG"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/epub-to-mp3"
          version="${VERSION_TAG#v}"
          docker tag "$image:$VERSION_TAG" "$image:latest"
          docker tag "$image:$VERSION_TAG" "$image:${version%.*}"
          docker tag "$image:$VERSION_TAG" "$image:$version"
          docker push "$image:$version"
          docker push "$image:${version%.*}"
          docker push "$image:latest"
          # The version tag must already exist and still identify the tested merge.
          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" --verify-tag --title "$VERSION_TAG" --generate-notes
          fi
          gh release upload "$VERSION_TAG" release-assets/*.apk release-assets/*.zip release-assets/*.tar.gz --clobber
