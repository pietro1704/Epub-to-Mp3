name: CodeQL Swift host contracts

on:
  pull_request:
    paths:
      - 'mise.toml'
      - 'scripts/apple_target_clang.sh'
      - 'scripts/codeql_swift_build.sh'
      - 'scripts/test_codeql_swift_build.rb'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/codeql-swift-contracts.yml'
  push:
    paths:
      - 'mise.toml'
      - 'scripts/apple_target_clang.sh'
      - 'scripts/codeql_swift_build.sh'
      - 'scripts/test_codeql_swift_build.rb'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/codeql-swift-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-host-contracts:
    name: Swift build environment and argument contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install the project-pinned Ruby only
        run: mise install ruby
      - name: Exercise build contracts with isolated fake tools
        run: mise exec -- ruby scripts/test_codeql_swift_build.rb
