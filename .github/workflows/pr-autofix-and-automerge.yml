name: PR Autofix Dispatcher
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: write
  pull-requests: read
concurrency:
  group: pr-autofix-dispatch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  dispatch:
    # No activation is performed by this preparation slice.
    if: vars.PR_REPAIR_WRITERS_ENABLED == 'true' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: node .github/scripts/pr-repair-dispatch.cjs
