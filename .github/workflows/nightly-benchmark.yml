name: Nightly Benchmark

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install toolchain via mise
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: mise run install

      - name: Restore nightly baseline cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/telemetry/ci-speed-baseline-nightly.json
          key: nightly-benchmark-baseline-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nightly-benchmark-baseline-${{ github.ref_name }}-

      - name: Run nightly speed benchmark (regression gate)
        id: nightly_benchmark
        continue-on-error: true
        env:
          ENGINE_CHAIN_FALLBACK: "1"
          # Edge-TTS rate-limits GitHub Actions shared IPs; allow
          # timeout/network errors without failing the whole workflow.
          EDGE_MAX_CONCURRENCY: "1"
          CHAPTER_PARALLEL_COUNT: "1"
        run: |
          mkdir -p .cache/telemetry
          if mise exec -- python python_app/tests/run_ci_speed_benchmark.py \
            --output .cache/telemetry/ci-speed-benchmark-nightly.json \
            --baseline-file .cache/telemetry/ci-speed-baseline-nightly.json \
            --max-regression-pct 20 \
            --period-hours 24 \
            --per-engine \
            --min-avg-cps 250 \
            --min-item-cps 90 \
            --min-engine-cps edge=350 \
            --min-engine-cps kokoro=160 \
            --min-engine-cps piper=80; then
            echo "Benchmark passed"
          elif [ -f .cache/telemetry/ci-speed-benchmark-nightly.json ]; then
            # Benchmark ran and produced results but detected regression
            touch .cache/telemetry/regression-detected
            echo "Real regression detected"
            exit 1
          else
            # Benchmark crashed (timeout, network error) — not a regression
            echo "Benchmark failed to run (likely Edge-TTS timeout); not a regression"
            exit 1
          fi

      - name: Telemetry baseline smoke check
        if: always()
        continue-on-error: true
        run: mise run benchmark:check

      - name: Save nightly baseline cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/telemetry/ci-speed-baseline-nightly.json
          key: nightly-benchmark-baseline-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-benchmark-${{ github.run_id }}
          path: |
            .cache/telemetry/ci-speed-benchmark-nightly.json
            .cache/telemetry/ci-speed-baseline-nightly.json

      - name: Create regression issue on real regression
        if: steps.nightly_benchmark.outcome == 'failure' && hashFiles('.cache/telemetry/regression-detected') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Nightly benchmark regression (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "Automated nightly benchmark detected a performance regression.",
              "",
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              "",
              "Check artifact `nightly-benchmark-<run_id>` for benchmark/baseline JSON files.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["performance", "regression", "automation"],
              });
            }
