name: Hosted legacy iOS signed archive metadata

on:
  push:
    branches: ['feature/hosted-legacy-ios-inventory']
    paths:
      - '.github/scripts/hosted-legacy-ios-archive.py'
      - '.github/scripts/test_hosted_legacy_ios_archive.py'
      - '.github/workflows/hosted-legacy-ios-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: python

concurrency:
  group: hosted-legacy-ios-archive
  cancel-in-progress: false

jobs:
  host-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mise.toml
            /.github/scripts/
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install only the project-pinned Python
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Exercise owned filesystem, process cancellation and fail-closed fixture boundaries
        run: mise exec -- python -m unittest discover -s .github/scripts -p 'test_hosted_legacy_ios_archive.py' -v
  archive-metadata:
    needs: host-safety
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Refuse a different execution context before touching the archive
        if: runner.environment != 'github-hosted' || runner.os != 'macOS' || runner.arch != 'ARM64'
        run: exit 1
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /mise.toml
            /.github/scripts/
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install only the project-pinned Python
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Inspect only the signed Apple archive and extracted metadata
        env:
          INVENTORY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          INVENTORY_RUNNER_ARCH: ${{ runner.arch }}
          INVENTORY_WORKFLOW_SHA: ${{ github.workflow_sha }}
          INVENTORY_EVENT_SHA: ${{ github.sha }}
        run: mise exec -- python .github/scripts/hosted-legacy-ios-archive.py
      - name: Recover only this job's owned mount and temporary tree
        if: always()
        run: mise exec -- python .github/scripts/hosted-legacy-ios-archive.py --cleanup-owned
      - name: Retain JSON and bounded command metadata logs only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-legacy-ios-signed-archive-metadata
          path: |
            ${{ runner.temp }}/legacy-ios-archive-report/*.json
            ${{ runner.temp }}/legacy-ios-archive-report/*.log
          if-no-files-found: warn
