name: Converter FFI portability

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - ".github/workflows/converter-ffi.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/converter-core/**"
      - "crates/converter-ffi/**"
      - "scripts/build_converter_ffi.py"
      - "scripts/validate_converter_ffi_targets.py"
      - "mise.toml"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/converter-ffi.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/converter-core/**"
      - "crates/converter-ffi/**"
      - "scripts/build_converter_ffi.py"
      - "scripts/validate_converter_ffi_targets.py"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-validation:
    name: Host target mapping and converter-ffi tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4.3.0

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Validate target mappings
        run: mise run converter-ffi:validate

      - name: Run converter-ffi tests
        run: mise exec -- cargo test -p converter-ffi

  artifact-build:
    name: Build converter-ffi native artifacts
    needs: host-validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            logical_target: android-arm64
            rust_target: aarch64-linux-android
          - os: macos-14
            logical_target: ios-device
            rust_target: aarch64-apple-ios
          - os: macos-14
            logical_target: ios-simulator-arm64
            rust_target: aarch64-apple-ios-sim
          - os: macos-14
            logical_target: ios-simulator-x64
            rust_target: x86_64-apple-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4.3.0

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Validate required Rust target is available
        id: prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::Rustup is unavailable on this runner. Use a runner/toolchain image that provides rustup and preinstall '${{ matrix.rust_target }}'."
            exit 1
          fi
          if ! rustup target list --installed | grep -Fxq '${{ matrix.rust_target }}'; then
            echo "::error::Required Rust target '${{ matrix.rust_target }}' is not installed. Add it to the runner/toolchain image (for example, 'rustup target add ${{ matrix.rust_target }}') and rerun CI. This workflow intentionally does not download targets or configure mobile SDKs."
            exit 1
          fi

      - name: Build converter-ffi artifact (verification only)
        run: mise run converter-ffi:build -- "${{ matrix.logical_target }}"

      - name: Verify expected artifact exists
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.rust_target }}' in
            *apple*) library=libconverter_ffi.dylib ;;
            *) library=libconverter_ffi.so ;;
          esac
          artifact="target/${{ matrix.rust_target }}/release/${library}"
          test -f "$artifact" || { echo "::error::Expected converter-ffi artifact was not produced: $artifact"; exit 1; }
          echo "Verified $artifact"
          echo "No release artifact is published by this workflow."
