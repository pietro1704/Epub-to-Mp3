name: Converter FFI portability

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converter-ffi-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}

jobs:
  host-validation:
    name: Host target mapping and converter-ffi tests
    env:
      MISE_ENABLE_TOOLS: rust,ruby
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Reuse host FFI compilation
        uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-host

      - name: Validate target mappings
        run: mise run converter-ffi:validate

      - name: Run converter-ffi tests
        run: mise exec -- cargo test -p converter-ffi

  # No `needs:` on host-validation: the macOS build uses nothing from it, and the
  # hosted macOS queue (minutes) now overlaps the Linux job instead of following
  # it. Both jobs still must pass for the workflow (and post-merge `ffi`) to pass.
  # One job builds both simulator targets in sequence: two jobs waited 8-13 minutes
  # each for one of the five hosted macOS runners.
  artifact-build:
    name: Build converter-ffi native artifacts
    env:
      MISE_ENABLE_TOOLS: rust,ruby
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Verify hosted Apple build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          echo "Hosted ARM64 build environment verified; no Simulator is started."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      # The actual iOS device app link belongs to CodeQL's iOS build scope and signed
      # release packaging, not this unsupported standalone cdylib route. Never report
      # it as skipped-success.
      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios-sim x86_64-apple-ios

      - name: Reuse simulator FFI compilation
        uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-ios-simulators

      - name: Build converter-ffi artifacts (verification only)
        run: |
          set -euo pipefail
          for rust_target in aarch64-apple-ios-sim x86_64-apple-ios; do
            mise exec -- ruby scripts/native_job.rb build -- cargo build --locked -p converter-ffi --release --target "$rust_target"
          done

      - name: Verify expected artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          for rust_target in aarch64-apple-ios-sim x86_64-apple-ios; do
            artifact="target/${rust_target}/release/libconverter_ffi.dylib"
            test -f "$artifact" || { echo "::error::Expected converter-ffi artifact was not produced: $artifact"; exit 1; }
            echo "Verified $artifact"
          done
          echo "No release artifact is published by this workflow."
