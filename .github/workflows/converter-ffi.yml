name: Converter FFI portability

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converter-ffi-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}

jobs:
  host-validation:
    name: Host target mapping and converter-ffi tests
    env:
      MISE_ENABLE_TOOLS: python,rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.9.14
          install: false

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Reuse host FFI compilation
        uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-host

      - name: Validate target mappings
        run: mise run converter-ffi:validate

      - name: Run converter-ffi tests
        run: mise exec -- cargo test -p converter-ffi

  artifact-build:
    name: Build converter-ffi native artifacts
    env:
      MISE_ENABLE_TOOLS: python,rust,ruby
      CARGO_BUILD_JOBS: '1'
    needs: host-validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The actual iOS device app link belongs to CodeQL's iOS
          # build-for-testing scope and signed release packaging, not this
          # unsupported standalone cdylib route. Never report it as skipped-success.
          - os: macos-15
            logical_target: ios-simulator-arm64
            rust_target: aarch64-apple-ios-sim
          - os: macos-15
            logical_target: ios-simulator-x64
            rust_target: x86_64-apple-ios

    steps:
      - name: Verify hosted Apple build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ARCH" = ARM64
          test "$(uname -m)" = arm64
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphonesimulator --show-sdk-path
          echo "Hosted ARM64 build environment verified; no Simulator is started."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.9.14
          install: false

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Install Rust target
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Reuse target FFI compilation
        uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-${{ matrix.rust_target }}

      - name: Build converter-ffi artifact (verification only)
        run: |
          mise exec -- ruby scripts/native_job.rb build -- cargo build --locked -p converter-ffi --release --jobs 1 --target "${{ matrix.rust_target }}"

      - name: Verify expected artifact exists
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.rust_target }}' in
            *apple*) library=libconverter_ffi.dylib ;;
            *) library=libconverter_ffi.so ;;
          esac
          artifact="target/${{ matrix.rust_target }}/release/${library}"
          test -f "$artifact" || { echo "::error::Expected converter-ffi artifact was not produced: $artifact"; exit 1; }
          echo "Verified $artifact"
          echo "No release artifact is published by this workflow."
