name: Converter FFI portability

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    paths:
      - ".github/workflows/converter-ffi.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/converter-core/**"
      - "crates/converter-ffi/**"
      - "scripts/build_converter_ffi.py"
      - "scripts/validate_converter_ffi_targets.py"
      - "mise.toml"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/converter-ffi.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/converter-core/**"
      - "crates/converter-ffi/**"
      - "scripts/build_converter_ffi.py"
      - "scripts/validate_converter_ffi_targets.py"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-validation:
    name: Host target mapping and converter-ffi tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4.3.0

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Validate target mappings
        run: mise run converter-ffi:validate

      - name: Run converter-ffi tests
        run: mise exec -- cargo test -p converter-ffi

  artifact-build:
    name: Build converter-ffi native artifacts
    needs: host-validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            logical_target: android-arm64
            rust_target: aarch64-linux-android
            build_task: converter-ffi:android-arm64
          - os: macos-14
            logical_target: ios-device
            rust_target: aarch64-apple-ios
            build_task: converter-ffi:build
          - os: macos-14
            logical_target: ios-simulator-arm64
            rust_target: aarch64-apple-ios-sim
            build_task: converter-ffi:build
          - os: macos-14
            logical_target: ios-simulator-x64
            rust_target: x86_64-apple-ios
            build_task: converter-ffi:build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4.3.0

      - name: Install project toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Install Rust target
        run: rustup target add "${{ matrix.rust_target }}"

      - name: Build converter-ffi artifact (verification only)
        run: |
          if [[ "${{ matrix.logical_target }}" == "android-arm64" ]]; then
            mise run converter-ffi:android-arm64
          else
            mise exec -- cargo build -p converter-ffi --release --target "${{ matrix.rust_target }}"
          fi

      - name: Verify expected artifact exists
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.rust_target }}' in
            *apple*) library=libconverter_ffi.dylib ;;
            *) library=libconverter_ffi.so ;;
          esac
          if [[ '${{ matrix.logical_target }}' == 'android-arm64' ]]; then
            artifact="target/piper-android/${{ matrix.rust_target }}/release/${library}"
          else
            artifact="target/${{ matrix.rust_target }}/release/${library}"
          fi
          test -f "$artifact" || { echo "::error::Expected converter-ffi artifact was not produced: $artifact"; exit 1; }
          echo "Verified $artifact"
          echo "No release artifact is published by this workflow."
