name: CHANGELOG drift

# Runs git-cliff against the current branch and warns when the generated
# output diverges from the committed CHANGELOG.md. Doesn't block — just
# a heads-up so an out-of-date CHANGELOG isn't discovered at release time.
#
# Triggered on PRs that modify python_app/, web/src/, or version files,
# i.e. anywhere a release-worthy change might land.

on:
  pull_request:
    paths:
      - "python_app/**"
      - "web/src/**"
      - "python_app/version.py"
      - "web/package.json"
      - "CHANGELOG.md"
      - "cliff.toml"
      - '.github/workflows/changelog-drift.yml'
      - '.github/scripts/changelog-drift.test.cjs'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    # Informational only — never gate merges on this job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        continue-on-error: true
        with:
          config: cliff.toml
          args: --output GENERATED_CHANGELOG.md

      - name: Compare against committed CHANGELOG
        id: diff
        continue-on-error: true
        run: |
          if [ ! -f GENERATED_CHANGELOG.md ]; then
            echo "drift=skip" >> "$GITHUB_OUTPUT"
            echo "git-cliff did not produce output; skipping comparison."
            echo "git-cliff did not produce output; skipping comparison. This check is informational." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if diff -q CHANGELOG.md GENERATED_CHANGELOG.md > /dev/null; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG drift."
            echo "No CHANGELOG drift." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md is out of sync with git-cliff output. Run 'mise run changelog' to regenerate."
            echo "CHANGELOG.md is out of sync with git-cliff output. Run 'mise run changelog' to regenerate, or update CHANGELOG.md manually for the release entry. This check is informational." >> "$GITHUB_STEP_SUMMARY"
            diff -u CHANGELOG.md GENERATED_CHANGELOG.md | head -100 || true
          fi
