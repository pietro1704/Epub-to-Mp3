name: Rollback HF Space

# Emergency rollback: publish the runtime snapshot of a previously validated commit.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to roll back to (leave empty for previous release tag)"
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sync-hf
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback HF Space
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted repository for target resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot trusted publication helper
        run: |
          cp scripts/validated_merge.mjs "$RUNNER_TEMP/validated_merge.mjs"
          cp scripts/hf_snapshot.rb "$RUNNER_TEMP/hf_snapshot.rb"
          cp scripts/hf_push.sh "$RUNNER_TEMP/hf_push.sh"

      - name: Resolve target commit
        id: target
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_COMMIT" ]]; then
            if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo '::error::Expected a hexadecimal commit SHA (7 to 40 characters).'
              exit 64
            fi
            SHA=$(git rev-parse --verify --end-of-options "${REQUESTED_COMMIT}^{commit}")
          else
            # Find the second-to-last version tag (skip current, use previous)
            TAGS=$(git ls-remote --tags --sort=-v:refname origin 'refs/tags/v*')
            PREV_TAG=$(printf '%s\n' "$TAGS" | sed -n '2p' | awk '{print $2}' | sed 's|refs/tags/||')
            if [ -z "$PREV_TAG" ]; then
              echo "::error::No previous version tag found"
              exit 1
            fi
            SHA=$(printf '%s\n' "$TAGS" | sed -n '2p' | awk '{print $1}')
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Resolved target is not a complete commit SHA.'
            exit 65
          fi
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'Rolling back to commit %s\n' "$SHA"

      - name: Require a previously validated master merge
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.target.outputs.sha }}
        run: node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --required-job "Publication surfaces validated"

      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.validated.outputs.sha }}
          lfs: false
          persist-credentials: false

      - name: Set up Ruby for the trusted snapshot helper
        uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: "4.0.7"

      - name: Build HF-only repo snapshot
        env:
          VALIDATED_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          HF_SYNC_DIR="$(mktemp -d "$RUNNER_TEMP/hf-rollback.XXXXXX")"
          echo "HF_SYNC_DIR=$HF_SYNC_DIR" >> "$GITHUB_ENV"
          ruby "$RUNNER_TEMP/hf_snapshot.rb" "$GITHUB_WORKSPACE" "$HF_SYNC_DIR"

      - name: Push rollback to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret not configured; cannot push."
            exit 1
          fi

          # Publish exactly as sync-hf does: HTTPS, the token only through GIT_ASKPASS, and
          # hf_push.sh so that the Git LFS pre-push hook uploads the binaries.
          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          cat > "$auth_dir/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' user ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$auth_dir/askpass"
          export GIT_ASKPASS="$auth_dir/askpass" GIT_TERMINAL_PROMPT=0
          node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$VALIDATED_SHA" --required-job "Publication surfaces validated"
          bash "$RUNNER_TEMP/hf_push.sh" "$HF_SYNC_DIR" https://huggingface.co/spaces/pi1704/epub-to-mp3

      - name: Remove owned snapshot
        if: always()
        run: |
          if [[ -n "${HF_SYNC_DIR:-}" && "$HF_SYNC_DIR" == "$RUNNER_TEMP/"* ]]; then
            rm -rf -- "$HF_SYNC_DIR"
          fi

      - name: Wait and verify rollback
        run: |
          sleep 30
          URL="https://pi1704-epub-to-mp3.hf.space/api/health"
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Rollback successful — HF Space is healthy"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 15s..."
            sleep 15
          done
          echo "::warning::HF Space may still be rebuilding after rollback"
