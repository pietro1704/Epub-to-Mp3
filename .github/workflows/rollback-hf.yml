name: Rollback HF Space

# Emergency rollback: re-syncs a known-good commit to HF Space.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to roll back to (leave empty for previous release tag)"
        required: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sync-hf
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback HF Space
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted repository for target resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot trusted publication helper
        run: cp scripts/validated_merge.mjs "$RUNNER_TEMP/validated_merge.mjs"

      - name: Resolve target commit
        id: target
        env:
          REQUESTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_COMMIT" ]]; then
            if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo '::error::Expected a hexadecimal commit SHA (7 to 40 characters).'
              exit 64
            fi
            SHA=$(git rev-parse --verify --end-of-options "${REQUESTED_COMMIT}^{commit}")
          else
            # Find the second-to-last version tag (skip current, use previous)
            TAGS=$(git ls-remote --tags --sort=-v:refname origin 'refs/tags/v*')
            PREV_TAG=$(printf '%s\n' "$TAGS" | sed -n '2p' | awk '{print $2}' | sed 's|refs/tags/||')
            if [ -z "$PREV_TAG" ]; then
              echo "::error::No previous version tag found"
              exit 1
            fi
            SHA=$(printf '%s\n' "$TAGS" | sed -n '2p' | awk '{print $1}')
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Resolved target is not a complete commit SHA.'
            exit 65
          fi
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'Rolling back to commit %s\n' "$SHA"

      - name: Require a previously validated master merge
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.target.outputs.sha }}
        run: node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF"

      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.validated.outputs.sha }}
          lfs: false
          persist-credentials: false

      - name: Build HF-only repo snapshot
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          HF_SYNC_DIR="$(mktemp -d)"
          echo "HF_SYNC_DIR=$HF_SYNC_DIR" >> "$GITHUB_ENV"
          rsync -a --delete ./ "$HF_SYNC_DIR/" \
            --exclude ".git" \
            --exclude "pretrained_models" \
            --exclude "voice_samples" \
            --exclude "output" \
            --exclude "node_modules" \
            --exclude "web/node_modules" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            --exclude ".mypy_cache" \
            --exclude ".ruff_cache" \
            --exclude ".cache" \
            --exclude "desktop"
          cd "$HF_SYNC_DIR"
          git init
          git config user.name "hf-rollback-bot"
          git config user.email "hf-rollback-bot@users.noreply.github.com"
          git add -A
          git commit -m "HF rollback to $TARGET_SHA"

      - name: Push rollback to Hugging Face
        env:
          HF_SSH_PRIVATE_KEY: ${{ secrets.HF_SSH_PRIVATE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -euo pipefail
          cd "$HF_SYNC_DIR"

          if [ -n "${HF_SSH_PRIVATE_KEY:-}" ]; then
            mkdir -p ~/.ssh
            echo "$HF_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_rsa
            ssh-keyscan hf.co >> ~/.ssh/known_hosts
            REMOTE_URL="git@hf.co:spaces/pi1704/epub-to-mp3"
          else
            if [ -z "${HF_TOKEN:-}" ]; then
              echo "::error::Neither HF_SSH_PRIVATE_KEY nor HF_TOKEN configured"
              exit 1
            fi
            git config --global url."https://user:${HF_TOKEN}@huggingface.co/".insteadOf "https://huggingface.co/"
            REMOTE_URL="https://huggingface.co/spaces/pi1704/epub-to-mp3"
          fi

          git remote add hf "$REMOTE_URL" || true
          node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$VALIDATED_SHA"
          git push --force hf "HEAD:refs/heads/main"

      - name: Wait and verify rollback
        run: |
          sleep 30
          URL="https://pi1704-epub-to-mp3.hf.space/api/health"
          for i in $(seq 1 20); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Rollback successful — HF Space is healthy"
              exit 0
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 15s..."
            sleep 15
          done
          echo "::warning::HF Space may still be rebuilding after rollback"
