name: Cleanup Old Files

# Run every 6 hours
on:
  schedule:
    - cron: '0 */6 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Maximum age of files in hours'
        required: false
        default: '48'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup via API
        env:
          API_URL: ${{ secrets.API_URL }}
          MAX_AGE: ${{ github.event.inputs.max_age_hours || '48' }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "⚠️ API_URL secret not configured - skipping cleanup"
            echo "Configure it in: Repository Settings > Secrets > Actions > New repository secret"
            echo "Name: API_URL"
            echo "Value: https://your-app.railway.app (your Railway backend URL)"
            exit 0
          fi
          
          echo "🧹 Calling cleanup API: $API_URL/api/cleanup?max_age_hours=$MAX_AGE"
          
          response=$(curl -s -w "\n%{http_code}" -X POST "$API_URL/api/cleanup?max_age_hours=$MAX_AGE")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          
          echo "Response code: $http_code"
          echo "Response body: $body"
          
          if [ "$http_code" -eq 200 ]; then
            echo "✅ Cleanup successful"
            exit 0
          else
            echo "❌ Cleanup failed with code $http_code"
            exit 1
          fi
