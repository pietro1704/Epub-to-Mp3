name: HF snapshot regression

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false
      - name: Install managed Ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install ruby
      - name: Select the runtime layout
        # The snapshot builder owns the rule: a tracked .hf-runtime marker, else
        # React (kept only so old revisions can be rolled back). The deployable
        # tree must select Rails.
        run: |
          set -euo pipefail
          layout="$(mise run hf:snapshot -- --layout "$GITHUB_WORKSPACE")"
          if [[ "$layout" != rails ]]; then
            echo "::error::The deployable tree must select the Rails runtime layout, got: $layout"
            exit 1
          fi
          echo "HF_LAYOUT=$layout" >> "$GITHUB_ENV"
          echo "HF runtime layout: $layout"
      - name: Exercise actual Git/LFS offline transport
        run: |
          git lfs version
          mise run hf:snapshot:test
      - name: Reconstruct the actual snapshot through local LFS transport
        run: |
          set -euo pipefail
          snapshot_root="$(mktemp -d "$RUNNER_TEMP/hf-regression.XXXXXX")"
          echo "HF_REGRESSION_ROOT=$snapshot_root" >> "$GITHUB_ENV"
          mise run hf:snapshot -- "$GITHUB_WORKSPACE" "$snapshot_root/source"
          git init --bare --initial-branch=master "$snapshot_root/transport.git"
          bash scripts/hf_push.sh "$snapshot_root/source" "file://$snapshot_root/transport.git"
          git clone --no-checkout "file://$snapshot_root/transport.git" "$snapshot_root/reconstructed"
          git -C "$snapshot_root/reconstructed" lfs install --local
          git -C "$snapshot_root/reconstructed" checkout master
          compared=(
            ruby_app/rails_gateway/Gemfile.lock
            ruby_app/rails_gateway/browser_runtime/workers/piper_worker.js
            ruby_app/rails_gateway/public/sample.epub
          )
          for path in "${compared[@]}"; do
            cmp "$path" "$snapshot_root/reconstructed/$path"
          done
      - name: Build Docker from the reconstructed snapshot
        run: docker build --tag hf-snapshot-regression "$HF_REGRESSION_ROOT/reconstructed"
      - name: Verify the Rails image with the regression shipped in the snapshot
        # Health (backend must be rails), the document, every referenced asset,
        # the runtime tree, the listener, the unprivileged user and the absence
        # of model weights and build tools, all against the deployable bytes.
        run: |
          set -euo pipefail
          IMAGE=hf-snapshot-regression bash "$HF_REGRESSION_ROOT/reconstructed/ruby_app/rails_gateway/bin/image-regression"
      - name: Retain bounded container diagnostics
        if: always()
        run: |
          docker logs --tail 100 hf-snapshot-regression 2>&1 || true
      - name: Remove owned container and snapshot fixtures
        if: always()
        run: |
          docker rm --force hf-snapshot-regression >/dev/null 2>&1 || true
          if [[ -n "${HF_REGRESSION_ROOT:-}" && "$HF_REGRESSION_ROOT" == "$RUNNER_TEMP/hf-regression."* ]]; then
            rm -rf -- "$HF_REGRESSION_ROOT"
          fi
