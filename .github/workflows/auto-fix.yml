name: Auto-fix on CI failure

# Triggers when the main CI workflow finishes red on a PR. Spawns a
# headless Claude Code session scoped to the PR branch with a tight
# allowlist (no Bash escape hatch, no commit/push from inside the
# agent — the user reviews the diff manually). The agent's job is
# narrow: read the failing test output, propose a patch, push it as
# a draft commit on the same branch.
#
# Manual trigger via `workflow_dispatch` lets you re-run on a known
# failed PR without having to retrigger CI.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to attempt to fix"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.pr_number }}" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            number=$(gh pr list --search "${{ github.event.workflow_run.head_sha }}" \
              --json number --jq '.[0].number' \
              -R "${{ github.repository }}")
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no PR
        if: steps.pr.outputs.number == ''
        run: |
          echo "No PR associated with this run; nothing to fix."
          exit 0

      - name: Checkout PR
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0

      - name: Capture failing logs
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run view "${{ github.event.workflow_run.id }}" \
            --log-failed > /tmp/ci-failure.log || true
          head -500 /tmp/ci-failure.log

      - name: Setup Node + Python
        if: steps.pr.outputs.number != ''
        uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - name: Run Claude Code in headless mode
        if: steps.pr.outputs.number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not configured — skipping auto-fix."
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code
          claude -p "The CI run for this PR failed. The failing log is at /tmp/ci-failure.log. Read it, identify the failing test or build step, and apply the smallest patch that makes it pass. Do not weaken assertions. Do not skip tests. Do not commit or push — leave changes unstaged so the human can review the diff." \
            --allowedTools "Read,Edit,Bash(npm test),Bash(npm run *),Bash(pytest *),Bash(cd web && *),Grep,Glob"

      - name: Push fix as draft commit
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Claude proposed no changes."
            exit 0
          fi
          git config user.name "claude-auto-fix"
          git config user.email "claude-auto-fix@users.noreply.github.com"
          git add -A
          git commit -m "auto-fix: candidate patch for CI failure (review before merge)"
          git push origin "HEAD:refs/heads/auto-fix/pr-${{ steps.pr.outputs.number }}-$(date +%s)"
          gh pr comment "${{ steps.pr.outputs.number }}" \
            --body "🤖 Auto-fix candidate pushed to a side branch — review and cherry-pick if useful."
