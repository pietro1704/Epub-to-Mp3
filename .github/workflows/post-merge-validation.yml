name: Post-merge validation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: post-merge-${{ github.ref }}
  # Finish the active validation; keep only the newest pending run.
  cancel-in-progress: false

jobs:
  merge:
    name: Confirm the integrated source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an actual merge into master
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post_merge_validation.mjs

  # Selects which platform validations this merge needs; see
  # scripts/post_merge_scope.mjs. Push only; workflow_dispatch runs everything.
  scope:
    name: Select post-merge scope
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.scope.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select validations from changes since the last successful ancestor validation
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post_merge_scope.mjs

  ci:
    needs: merge
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true

  codeql:
    needs: merge
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  ffi:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['ffi']
    uses: ./.github/workflows/converter-ffi.yml

  faber:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['faber']
    uses: ./.github/workflows/faber-integration.yml
    with:
      # The browser conversion runs once, as the browser job below.
      browser_runtime: false

  # Real-model browser conversion of the Rails Space, required for publication.
  browser:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['browser']
    uses: ./.github/workflows/rails-real-model.yml

  flutter:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['flutter']
    uses: ./.github/workflows/flutter-rust-faber.yml

  fallback:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['fallback']
    uses: ./.github/workflows/native-fallback.yml

  native:
    needs: merge
    uses: ./.github/workflows/native-hook-safety.yml

  rails-image:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['rails-image']
    uses: ./.github/workflows/rails-image-regression.yml

  snapshot:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['snapshot']
    uses: ./.github/workflows/hf-snapshot-regression.yml

  cli:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['cli']
    uses: ./.github/workflows/cli-faber-golden.yml

  linux:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['linux']
    uses: ./.github/workflows/linux-gui-artifact.yml

  isolation:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['isolation']
    uses: ./.github/workflows/native-ffi-test-isolation.yml

  audit:
    needs: merge
    uses: ./.github/workflows/rust-dependency-audit.yml

  ruby:
    needs: merge
    uses: ./.github/workflows/ruby-rust-integration.yml

  validated:
    name: Validated merged source
    if: always()
    needs: [merge, scope, ci, codeql, browser, ffi, faber, flutter, fallback, native, snapshot, rails-image, cli, linux, isolation, audit, ruby]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every runtime and security result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          node --input-type=module -e
          'import { assertValidationResults } from "./scripts/post_merge_validation.mjs";
          assertValidationResults(JSON.parse(process.env.NEEDS_JSON));'
      - name: Reconfirm merged ancestry before making publication eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post_merge_validation.mjs

  # The Hugging Face sync and rollback gates require this job, not the whole run:
  # see PUBLICATION_VALIDATIONS in scripts/post_merge_validation.mjs. Merge identity
  # was confirmed by the merge job and is rechecked by validated_merge.mjs.
  publication:
    name: Publication surfaces validated
    if: always()
    needs: [merge, scope, ci, codeql, audit, ruby, rails-image, snapshot, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every publication validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          node --input-type=module -e
          'import { assertValidationResults, PUBLICATION_VALIDATIONS } from "./scripts/post_merge_validation.mjs";
          assertValidationResults(JSON.parse(process.env.NEEDS_JSON), PUBLICATION_VALIDATIONS);'

  # Every master run (a push or a dispatch) starts the publishers itself; they have no
  # workflow_run trigger, so no skipped runs appear in the Actions tab. Each waits for
  # this run to complete and then applies its own validated_merge.mjs gate. Nothing is
  # started when master has already moved past this commit: the newer run owns it.
  release-followup:
    name: Start release follow-ups
    needs: validated
    if: always() && needs.validated.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Auto Release and Release Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Master advanced to $current; the newer validation owns the release."
            exit 0
          fi
          gh workflow run auto-release.yml --repo "$GITHUB_REPOSITORY" --ref master -f validation_run="$VALIDATION_RUN"
          gh workflow run release-pr.yml --repo "$GITHUB_REPOSITORY" --ref master -f validation_run="$VALIDATION_RUN"

  publication-followup:
    name: Start the Hugging Face sync
    # After validated too (any result), so every job has finished and the run completes now.
    needs: [publication, validated]
    if: always() && needs.publication.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the Hugging Face sync
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ github.run_id }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq .object.sha)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Master advanced to $current; the newer validation owns the sync."
            exit 0
          fi
          gh workflow run sync-hf.yml --repo "$GITHUB_REPOSITORY" --ref master -f validation_run="$VALIDATION_RUN"
