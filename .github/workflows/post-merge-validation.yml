name: Post-merge validation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: post-merge-${{ github.ref }}
  # Finish the active validation; keep only the newest pending run.
  cancel-in-progress: false

jobs:
  merge:
    name: Confirm the integrated source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require an actual merge into master
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post_merge_validation.mjs

  # Selects which platform validations this merge needs; see
  # scripts/post_merge_scope.mjs. Push only; workflow_dispatch runs everything.
  scope:
    name: Select post-merge scope
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.scope.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select validations from changes since the last successful ancestor validation
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post_merge_scope.mjs

  ci:
    needs: merge
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: true

  codeql:
    needs: merge
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  ffi:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['ffi']
    uses: ./.github/workflows/converter-ffi.yml

  faber:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['faber']
    uses: ./.github/workflows/faber-integration.yml

  flutter:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['flutter']
    uses: ./.github/workflows/flutter-rust-faber.yml

  fallback:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['fallback']
    uses: ./.github/workflows/native-fallback.yml

  native:
    needs: merge
    uses: ./.github/workflows/native-hook-safety.yml

  rails-image:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['rails-image']
    uses: ./.github/workflows/rails-image-regression.yml

  snapshot:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['snapshot']
    uses: ./.github/workflows/hf-snapshot-regression.yml

  cli:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['cli']
    uses: ./.github/workflows/cli-faber-golden.yml

  linux:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['linux']
    uses: ./.github/workflows/linux-gui-artifact.yml

  isolation:
    needs: [merge, scope]
    if: fromJSON(needs.scope.outputs.selection)['isolation']
    uses: ./.github/workflows/native-ffi-test-isolation.yml

  audit:
    needs: merge
    uses: ./.github/workflows/rust-dependency-audit.yml

  ruby:
    needs: merge
    uses: ./.github/workflows/ruby-rust-integration.yml

  validated:
    name: Validated merged source
    if: always()
    needs: [merge, scope, ci, codeql, ffi, faber, flutter, fallback, native, snapshot, rails-image, cli, linux, isolation, audit, ruby]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require every runtime and security result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: >-
          node --input-type=module -e
          'import { assertValidationResults } from "./scripts/post_merge_validation.mjs";
          assertValidationResults(JSON.parse(process.env.NEEDS_JSON));'
      - name: Reconfirm merged ancestry before making publication eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/post_merge_validation.mjs
