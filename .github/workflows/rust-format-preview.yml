name: Rust formatting preview

on:
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '.github/workflows/rust-format-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-format-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install repository Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Generate reviewable formatting patch on GitHub
        run: |
          mkdir -p "$RUNNER_TEMP/rust-format-preview"
          git rev-parse HEAD > "$RUNNER_TEMP/rust-format-preview/source-sha.txt"
          cargo +stable fmt --all
          git diff --binary -- ':(glob)**/*.rs' > "$RUNNER_TEMP/rust-format-preview/rustfmt.patch"
          git diff --exit-code -- ':(glob)**/*.rs'
      - name: Retain source identity and formatting patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-format-preview-${{ github.sha }}
          path: ${{ runner.temp }}/rust-format-preview/
          if-no-files-found: error
          retention-days: 7
