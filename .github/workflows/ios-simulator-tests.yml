name: iOS Simulator UIKit tests

# Runs the iOS-only XCTest cases (UIKit controllers, UIAlertController/UIMenu, #if os(iOS))
# on a booted iOS Simulator. macOS tests and an iOS compile do not execute this code
# (#1353 crashed on the first tap although both were green).
on:
  workflow_call:
    inputs:
      tests:
        description: Comma-separated EpubToMp3Tests classes; empty runs the default UIKit selection
        type: string
        default: ''
      seed_only:
        description: Build the Rust library to save its cache only; boot nothing, build no app, run no tests
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tests:
        description: Comma-separated EpubToMp3Tests classes; empty runs the default UIKit selection
        type: string
        default: ''
      seed_only:
        description: Build the Rust library to save its cache only; boot nothing, build no app, run no tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-simulator-tests-${{ github.ref }}-${{ inputs.seed_only == true && 'seed' || 'tests' }}
  # github.event_name is the caller's event: only superseded pull request runs are cancelled,
  # never master, scheduled seeding or manual branch-evidence runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-simulator:
    name: iOS Simulator UIKit tests
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MISE_ENABLE_TOOLS: rust,ruby
      # UIKit tests need no Piper/ONNX Runtime; skipping them keeps the Simulator Rust build small.
      CONVERTER_FFI_ENABLE_PIPER: '0'
      TEST_CLASSES: ${{ inputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false
      - run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- rustup target add aarch64-apple-ios-sim
      - uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-ios-sim-nopiper
      - name: Install the project generator
        run: brew install xcodegen
      - name: Build converter-ffi for the Simulator (no Piper)
        run: mise run converter-ffi:ios-simulator
      # The Mac build guard refuses to compile Rust while a Simulator is booted, so boot after it.
      - name: Pick an iPhone Simulator and start booting it (overlaps the Swift build)
        id: sim
        if: inputs.seed_only != true
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          # Xcode 16.4 only lists Simulators whose runtime is not newer than its SDK.
          udid="$(xcrun simctl list devices available -j | SDK_VERSION="$sdk_version" ruby -rjson -e '
            d = JSON.parse(STDIN.read)["devices"]
            max = ENV.fetch("SDK_VERSION").split(".").map(&:to_i)
            hit = d.select { |k, _| k.include?("iOS") && ((k[/iOS-([\d-]+)/, 1].split("-").map(&:to_i) <=> max) <= 0) }.sort_by { |k, _| k[/iOS-([\d-]+)/, 1].split("-").map(&:to_i) }.reverse
                   .flat_map { |_, v| v }.find { |x| x["name"].start_with?("iPhone") && x["isAvailable"] }
            abort "No iPhone Simulator" unless hit
            puts hit["udid"]')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "SDK $sdk_version -> $udid"
          xcrun simctl boot "$udid"
      - name: Generate the project
        if: inputs.seed_only != true
        working-directory: ios/EpubToMp3
        run: xcodegen generate
      - name: Build the Simulator tests once
        if: inputs.seed_only != true
        working-directory: ios/EpubToMp3
        run: |
          set -euo pipefail
          mkdir -p ../../.reports/ios-simulator
          # The project's ARCHS[sdk=iphonesimulator*] condition makes Xcode treat every concrete
          # Simulator as ineligible for -scheme destinations, so build for the generic Simulator
          # destination and run the xctestrun on the booted device. (Xcode compilation caching was tried
          # and gave no measurable gain on this job.)
          xcodebuild build-for-testing -project EpubToMp3.xcodeproj -scheme EpubToMp3-UnitTests -derivedDataPath .build/ios-sim \
            -jobs 3 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CONVERTER_FFI_ENABLE_PIPER=0 \
            -destination 'generic/platform=iOS Simulator' 2>&1 | tee ../../.reports/ios-simulator/build.log | tail -5
      - name: Wait for the Simulator
        if: inputs.seed_only != true
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Run iOS XCTest on the Simulator
        if: inputs.seed_only != true
        working-directory: ios/EpubToMp3
        run: |
          set -euo pipefail
          default='AppLaunchEnvironmentTests,InlineImageQuotingTests,PlaybackBindingStoreTests,NativeFormAccessibilityTests,ReaderProgressiveListeningTests,FullPlayerContentsTests,ReaderChapterPositionTests,ModelsScreenAlertTests,GlobalVoiceMigrationTests,ModelsRootViewTests,BookLanguageSheetSummaryTests,BookVoiceOverrideTests,LocalAudioSettingsScreenControllerTests,TocScreenControllerTests,IOSMainReaderControllerTests,IOSAppShellTests,ModelsByLanguageTests,ModelsLanguagePageTests,VoiceModelSettingsNavigationTests,PlatformSettingsCellTests,ReaderContentsSheetTests,ReaderChromeOverlayTests,FullPlayerFittingTests,SettingsStorageActionTests,ModelsLanguagesScreenIOSTests,ReaderSettingsScopeHeaderTests,ReaderFollowNarrationReaderTests,ReaderFollowNarrationTests,ReaderNarrationFollowerTests,LanguageModelPlaybackTests,ReaderLinkContrastTests,ReaderThemeContrastTests,WCAGContrastTests,NarrationPlanContractTests,ReaderHighlightContrastTests,TocDownloadRefreshTests'
          classes="${TEST_CLASSES:-$default}"
          only=()
          IFS=',' read -ra names <<< "$classes"
          for name in "${names[@]}"; do only+=("-only-testing:EpubToMp3Tests/${name// /}"); done
          report=../../.reports/ios-simulator
          set -o pipefail
          xctestrun="$(find .build/ios-sim/Build/Products -name '*.xctestrun' | head -n 1)"
          test -n "$xctestrun"
          echo "xctestrun: $xctestrun"
          xcodebuild test-without-building -xctestrun "$xctestrun" -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO -resultBundlePath "$report/result.xcresult" "${only[@]}" 2>&1 | tee "$report/test.log" | tail -40 || true
          grep -E "Executed [0-9]+ tests" "$report/test.log" | tail -2
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" "$report/test.log"
      - name: Shut the Simulator down
        if: always() && inputs.seed_only != true
        run: xcrun simctl shutdown all || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator-tests
          path: .reports/ios-simulator/
          if-no-files-found: warn
          retention-days: 7
