name: Auto Release

# Automatically creates a versioned release after CI passes on master.
# Uses conventional commits to determine the version bump type:
#   feat  → minor    fix/perf → patch    BREAKING CHANGE → major
# Skips release if no version-worthy commits since last tag.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  auto-release:
    name: Auto version + release
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version bump from conventional commits
        id: bump
        run: |
          set -euo pipefail

          # Find latest version tag
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            # First release — use current version from version.py, analyze only last 20 commits
            RANGE="HEAD~20..HEAD"
            CURRENT=$(python3 -c "
import re
with open('python_app/version.py') as f:
    print(re.search(r'__version__ = \"(.+)\"', f.read()).group(1))
")
          else
            RANGE="${LAST_TAG}..HEAD"
            CURRENT="${LAST_TAG#v}"
          fi

          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

          # Collect commit subjects since last tag
          COMMITS=$(git log --pretty=format:"%s" "$RANGE" 2>/dev/null || echo "")

          if [ -z "$COMMITS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits since $LAST_TAG — skipping release"
            exit 0
          fi

          # Determine bump type from conventional commits
          BUMP="none"
          while IFS= read -r msg; do
            # BREAKING CHANGE in footer or ! after type → major
            if echo "$msg" | grep -qiE "^[a-z]+(\(.+\))?!:|BREAKING.CHANGE"; then
              BUMP="major"
              break
            fi
            # feat → minor (don't break, major can still override)
            if echo "$msg" | grep -qE "^feat(\(.+\))?:"; then
              [ "$BUMP" != "major" ] && BUMP="minor"
            fi
            # fix, perf, refactor → patch
            if echo "$msg" | grep -qE "^(fix|perf|refactor)(\(.+\))?:"; then
              [ "$BUMP" = "none" ] && BUMP="patch"
            fi
            # ci, docs, chore, test, style → no bump on their own
          done <<< "$COMMITS"

          # Default to patch if any commits exist but none matched conventional types
          if [ "$BUMP" = "none" ]; then
            # Check if there are ANY non-skip commits (not just chore/ci/docs/test)
            HAS_CODE_CHANGES=$(echo "$COMMITS" | grep -cvE "^(chore|ci|docs|test|style)(\(.+\))?:" || true)
            if [ "$HAS_CODE_CHANGES" -gt 0 ]; then
              BUMP="patch"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Only chore/ci/docs/test commits — skipping release"
              exit 0
            fi
          fi

          # Calculate new version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEW="$((MAJOR + 1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP  $CURRENT → $NEW"

      - name: Update version files
        if: steps.bump.outputs.skip != 'true'
        env:
          NEW: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail

          # tauri.conf.json
          python3 - "$NEW" <<'PYEOF'
          import json, sys
          path = "desktop/src-tauri/tauri.conf.json"
          d = json.load(open(path))
          d["version"] = sys.argv[1]
          json.dump(d, open(path, "w"), indent=2)
          open(path, "a").write("\n")
          PYEOF

          # Cargo.toml (first occurrence only)
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$NEW\"/}" \
            desktop/src-tauri/Cargo.toml

          # web/package.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$NEW\"/" web/package.json

          # python_app/version.py
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW\"/" python_app/version.py

          # Flatpak metainfo
          TODAY=$(date +%Y-%m-%d)
          sed -i "s|<release version=\".*\" date=\".*\"/>|<release version=\"$NEW\" date=\"$TODAY\"/>|" \
            flatpak/io.github.pietro1704.EpubToMp3.metainfo.xml

      - name: Generate changelog for release body
        if: steps.bump.outputs.skip != 'true'
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: RELEASE_CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Build release body file
        if: steps.bump.outputs.skip != 'true'
        run: |
          # Truncate changelog to avoid "Argument list too long" on large histories
          if [ -f RELEASE_CHANGELOG.md ]; then
            head -200 RELEASE_CHANGELOG.md > RELEASE_BODY.md
          else
            echo "Release ${{ steps.bump.outputs.tag }}" > RELEASE_BODY.md
          fi

          cat >> RELEASE_BODY.md <<'FOOTER'

          ---

          ## Install

          | Platform | Install |
          |---|---|
          | macOS (Homebrew) | `brew install --cask epub-to-mp3` |
          | Windows (Winget) | `winget install Pietro1704.EpubToMp3` |
          | Linux (Flatpak) | Download `.flatpak` below |
          | Linux (Snap) | Download `.snap` below |
          | Docker | `docker pull ghcr.io/pietro1704/epub-to-mp3:TAG` |
          | Web | [HF Space](https://huggingface.co/spaces/pi1704/epub-to-mp3) |

          > Desktop and mobile binaries are built separately and attached by the Release Desktop workflow.
          FOOTER

          # Replace TAG placeholder with actual version
          sed -i "s|epub-to-mp3:TAG|epub-to-mp3:${{ steps.bump.outputs.version }}|" RELEASE_BODY.md

      - name: Update full CHANGELOG.md
        if: steps.bump.outputs.skip != 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit version bump + changelog
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            desktop/src-tauri/tauri.conf.json \
            desktop/src-tauri/Cargo.toml \
            web/package.json \
            python_app/version.py \
            flatpak/io.github.pietro1704.EpubToMp3.metainfo.xml \
            CHANGELOG.md
          git diff --quiet --cached && exit 0
          git commit -m "chore: release ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin master --tags

      - name: Create GitHub Release
        if: steps.bump.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: "Epub to Mp3 ${{ steps.bump.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: RELEASE_BODY.md
