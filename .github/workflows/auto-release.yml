name: Auto Release

# Tags and publishes a GitHub release (with generated notes) for the validated
# latest master commit once its committed version is newer than the last tag.
# The version is deliberate: scripts/bump.sh raises Cargo.toml, Cargo.lock,
# ruby_app/rails_gateway/VERSION and CHANGELOG.md in a pull request; this workflow never edits master. It does not
# build or attach artifacts itself: it starts the multi-platform Release Desktop
# run for the published tag.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Started by Post-merge validation once the whole run succeeded (it dispatches this
  # workflow with its run id), or manually for the current latest master commit.
  workflow_dispatch:
    inputs:
      validation_run:
        description: "Post-merge validation run that dispatched this one; wait for it to complete first"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  # Only to start Release Desktop for the new tag.
  actions: write

# One release publication at a time; never cancel a partially published release.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    name: Auto version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A manual run may only use master's workflow definition: this job holds a write token.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: publication-policy
          persist-credentials: false
      - name: Snapshot trusted publication helper
        run: |
          cp publication-policy/scripts/validated_merge.mjs "$RUNNER_TEMP/validated_merge.mjs"
          cp publication-policy/scripts/wait_for_validation.mjs "$RUNNER_TEMP/wait_for_validation.mjs"
      - name: Wait for the dispatching validation to complete
        if: inputs.validation_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: node "$RUNNER_TEMP/wait_for_validation.mjs" --repo "$GITHUB_REPOSITORY" --run "$VALIDATION_RUN"
      - name: Require validated current merge
        id: validated
        env:
          SKIP_SUPERSEDED: ${{ inputs.validation_run != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.sha }}
        run: node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --latest
      - name: Checkout
        if: steps.validated.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.validated.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate shared app version
        if: steps.validated.outputs.sha != ''
        id: version
        run: |
          set -euo pipefail
          ruby - <<'RUBY' >> "$GITHUB_OUTPUT"
          require "json"

          # The [workspace.package] version of the root Cargo.toml is the product version (D22).
          cargo = File.read("Cargo.toml", encoding: "UTF-8")
          product_version = cargo[/^\[workspace\.package\][^\[]*?^version = "([^"]+)"/m, 1]
          abort "Cargo.toml is missing [workspace.package] version" unless product_version
          gateway_version = File.read("ruby_app/rails_gateway/VERSION", encoding: "UTF-8").strip

          versions = {
            "Cargo.toml" => product_version,
            "ruby_app/rails_gateway/VERSION" => gateway_version
          }
          if versions.values.uniq.length != 1
            details = versions.map { |path, version| "#{path}=#{version}" }.join(", ")
            abort "Version mismatch across manifests: #{details}"
          end

          unless product_version.match?(/\A(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\z/)
            abort "Committed release version must be a numeric major.minor.patch"
          end

          changelog = File.read("CHANGELOG.md", encoding: "UTF-8")
          unless changelog.include?("## [#{product_version}]")
            abort "CHANGELOG.md is missing an entry for version #{product_version}"
          end

          puts "base_version=#{product_version}"
          RUBY

      - name: Determine next version
        if: steps.validated.outputs.sha != ''
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")

          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"

          NEW=$(ruby - "$BASE_VERSION" "$LAST_TAG" <<'RUBY'
          parse = ->(value) { value.split(".").map { |part| Integer(part, 10) } }

          base, tag = ARGV
          if tag.to_s.empty?
            puts base
            exit
          end

          puts((parse.call(base) <=> parse.call(tag[1..])) == 1 ? base : "")
          RUBY
          )

          if [[ -z "$NEW" ]]; then
            {
              echo "skip=true"
              echo "base_version=$BASE_VERSION"
              echo "last_tag=${LAST_TAG}"
              echo "range=${RANGE}"
            } >> "$GITHUB_OUTPUT"
            echo "Committed version ${BASE_VERSION} is not newer than ${LAST_TAG}; skipping release tag"
            exit 0
          fi

          # A tag without a GitHub release still gets its release; the publish step
          # refuses a tag that names another commit than the validated one.
          if gh release view "v${NEW}" >/dev/null 2>&1; then
            {
              echo "skip=true"
              echo "base_version=$BASE_VERSION"
              echo "last_tag=${LAST_TAG}"
              echo "range=${RANGE}"
            } >> "$GITHUB_OUTPUT"
            echo "Release v${NEW} already exists; skipping"
            exit 0
          fi

          {
            echo "skip=false"
            echo "base_version=$BASE_VERSION"
            echo "last_tag=${LAST_TAG}"
            echo "range=${RANGE}"
            echo "version=$NEW"
            echo "tag=v$NEW"
          } >> "$GITHUB_OUTPUT"
          echo "Version: ${BASE_VERSION} -> ${NEW} (last tag: ${LAST_TAG:-none})"

      - name: Require the official Android signing reference
        if: steps.bump.outputs.skip == 'false'
        env:
          ANDROID_SIGNING_AVAILABLE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 != '' && secrets.ANDROID_RELEASE_STORE_PASSWORD != '' && secrets.ANDROID_RELEASE_KEY_ALIAS != '' && secrets.ANDROID_RELEASE_KEY_PASSWORD != '' }}
        run: |
          if [[ "$ANDROID_SIGNING_AVAILABLE" != true ]]; then
            echo '::error::Official Android signing reference is unavailable.'
            exit 1
          fi

      - name: Revalidate immediately before creating a release tag
        if: steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.validated.outputs.sha }}
        run: node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --latest

      - name: Create release tag and GitHub release
        if: steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.bump.outputs.tag }}
          LAST_TAG: ${{ steps.bump.outputs.last_tag }}
          VALIDATED_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 64
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 65
          if git rev-parse --verify "refs/tags/${VERSION_TAG}^{commit}" >/dev/null 2>&1; then
            [[ "$(git rev-parse --verify "refs/tags/${VERSION_TAG}^{commit}")" == "$VALIDATED_SHA" ]] || exit 66
            echo "The existing tag already identifies the validated merge."
          fi
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Release ${VERSION_TAG} already exists; nothing to publish."
            exit 0
          fi
          args=(--target "$VALIDATED_SHA" --title "$VERSION_TAG" --generate-notes --latest)
          [[ -z "$LAST_TAG" ]] || args+=(--notes-start-tag "$LAST_TAG")
          gh release create "$VERSION_TAG" "${args[@]}"

      # The tag above is created with GITHUB_TOKEN, which starts no workflow, so the
      # release packages (Docker image, Android, macOS, Linux, Windows) are started
      # explicitly for exactly this tag. Release Desktop revalidates the tag itself.
      - name: Start the release packages
        if: steps.bump.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.bump.outputs.tag }}
        run: gh workflow run release-desktop.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag="$VERSION_TAG"

      - name: Report unchanged version without publishing
        if: steps.bump.outputs.skip == 'true'
        run: echo 'No new committed version; no tag or release was created.'
