name: Auto Release

# Automatically creates a new version tag after every successful CI run on master.
# The workflow must not push follow-up commits to master because the branch is
# protected by required checks. It only tags the already-validated HEAD commit.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  auto-release:
    name: Auto version tag
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate shared app version
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          python_version = re.search(
              r'__version__ = "(.+)"',
              Path("python_app/version.py").read_text(encoding="utf-8"),
          ).group(1)
          tauri_version = json.loads(
              Path("desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8")
          )["version"]
          web_version = json.loads(
              Path("web/package.json").read_text(encoding="utf-8")
          )["version"]

          versions = {
              "python_app/version.py": python_version,
              "desktop/src-tauri/tauri.conf.json": tauri_version,
              "web/package.json": web_version,
          }
          unique_versions = set(versions.values())
          if len(unique_versions) != 1:
              details = ", ".join(f"{path}={version}" for path, version in versions.items())
              raise SystemExit(f"Version mismatch across manifests: {details}")

          print(f"base_version={python_version}")
          PY

      - name: Determine next version
        id: bump
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")
          BASE_VERSION="${{ steps.version.outputs.base_version }}"

          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"

          NEW=$(python3 - <<'PY' "$BASE_VERSION" "$LAST_TAG"
          import sys

          def parse(value: str):
              return tuple(int(part) for part in value.split("."))

          base = parse(sys.argv[1])
          tag = sys.argv[2]

          if not tag:
              print(sys.argv[1])
              raise SystemExit

          last = parse(tag[1:])

          if base > last:
              print(sys.argv[1])
          else:
              major, minor, patch = last
              print(f"{major}.{minor}.{patch + 1}")
          PY
          )

          if git rev-parse "v${NEW}" >/dev/null 2>&1; then
            NEW=$(python3 - <<'PY' "$NEW"
          import sys
          major, minor, patch = (int(part) for part in sys.argv[1].split("."))
          print(f"{major}.{minor}.{patch + 1}")
          PY
            )
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"
          echo "Version: ${BASE_VERSION} -> ${NEW} (last tag: ${LAST_TAG:-none})"

      - name: Create release tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if git rev-parse "${{ steps.bump.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.bump.outputs.tag }} already exists — skipping"
            exit 0
          fi
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"
