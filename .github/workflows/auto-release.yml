name: Auto Release

# Releases are deliberate manual operations. Passing CI validates code only;
# it must not create tags, publish artifacts, or rebuild desktop releases.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  auto-release:
    name: Auto version tag
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@v7
        with:
          ref: master
          path: publication-policy
          persist-credentials: false
      - name: Snapshot trusted publication helper
        run: cp publication-policy/scripts/validated_merge.mjs "$RUNNER_TEMP/validated_merge.mjs"
      - name: Require validated current merge
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.sha }}
        run: node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --latest
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.validated.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate shared app version
        id: version
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          python_version = re.search(
              r'__version__ = "(.+)"',
              Path("python_app/version.py").read_text(encoding="utf-8"),
          ).group(1)
          web_version = json.loads(
              Path("web/package.json").read_text(encoding="utf-8")
          )["version"]

          versions = {
              "python_app/version.py": python_version,
              "web/package.json": web_version,
          }
          unique_versions = set(versions.values())
          if len(unique_versions) != 1:
              details = ", ".join(f"{path}={version}" for path, version in versions.items())
              raise SystemExit(f"Version mismatch across manifests: {details}")

          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", python_version):
              raise SystemExit("Committed release version must be a numeric major.minor.patch")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{python_version}]" not in changelog:
              raise SystemExit(
                  f"CHANGELOG.md is missing an entry for version {python_version}"
              )

          print(f"base_version={python_version}")
          PY

      - name: Determine next version
        id: bump
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")

          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"

          NEW=$(python3 - <<'PY' "$BASE_VERSION" "$LAST_TAG"
          import sys

          def parse(value: str):
              return tuple(int(part) for part in value.split("."))

          base = parse(sys.argv[1])
          tag = sys.argv[2]

          if not tag:
              print(sys.argv[1])
              raise SystemExit

          last = parse(tag[1:])

          if base > last:
              print(sys.argv[1])
          else:
              print("")
          PY
          )

          if [[ -z "$NEW" ]]; then
            {
              echo "skip=true"
              echo "base_version=$BASE_VERSION"
              echo "last_tag=${LAST_TAG}"
              echo "range=${RANGE}"
            } >> "$GITHUB_OUTPUT"
            echo "Committed version ${BASE_VERSION} is not newer than ${LAST_TAG}; skipping release tag"
            exit 0
          fi

          if git rev-parse "v${NEW}" >/dev/null 2>&1; then
            {
              echo "skip=true"
              echo "base_version=$BASE_VERSION"
              echo "last_tag=${LAST_TAG}"
              echo "range=${RANGE}"
            } >> "$GITHUB_OUTPUT"
            echo "Tag v${NEW} already exists; skipping"
            exit 0
          fi

          {
            echo "skip=false"
            echo "base_version=$BASE_VERSION"
            echo "last_tag=${LAST_TAG}"
            echo "range=${RANGE}"
            echo "version=$NEW"
            echo "tag=v$NEW"
          } >> "$GITHUB_OUTPUT"
          echo "Version: ${BASE_VERSION} -> ${NEW} (last tag: ${LAST_TAG:-none})"

      - name: Revalidate immediately before creating a release tag
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.validated.outputs.sha }}
        run: node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --latest

      - name: Create release tag
        if: steps.bump.outputs.skip != 'true'
        env:
          VERSION_TAG: ${{ steps.bump.outputs.tag }}
          VALIDATED_SHA: ${{ steps.validated.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 64
          [[ "$VALIDATED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 65
          if git rev-parse --verify "refs/tags/${VERSION_TAG}^{commit}" >/dev/null 2>&1; then
            [[ "$(git rev-parse --verify "refs/tags/${VERSION_TAG}^{commit}")" == "$VALIDATED_SHA" ]] || exit 66
            echo "The existing tag already identifies the validated merge."
            exit 0
          fi
          git tag -- "$VERSION_TAG" "$VALIDATED_SHA"
          git push origin "refs/tags/$VERSION_TAG"

      - name: Dispatch Release Desktop (new version)
        if: steps.bump.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release-desktop.yml \
            --ref master \
            -f tag="$VERSION_TAG"

      - name: Report unchanged version without rebuilding a historical tag
        if: steps.bump.outputs.skip == 'true'
        run: echo 'No new committed version; no tag or publication was requested.'
