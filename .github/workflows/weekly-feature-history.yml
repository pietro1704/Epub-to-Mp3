name: Weekly Feature History

env:
  MISE_ENABLE_TOOLS: python,node,npm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-history:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install toolchain via mise
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: mise run install

      - name: Restore rolling benchmark history cache
        id: history_restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/telemetry/feature-ab-history.json
          key: feature-ab-history-${{ github.run_id }}
          restore-keys: |
            feature-ab-history-

      - name: Run weekly A/B feature benchmark
        run: |
          mkdir -p .cache/telemetry
          mise exec -- python scripts/benchmark_feature_ab.py \
            --book web/public/sample.epub \
            --engine edge \
            --workers 1 \
            --output .cache/telemetry/feature-ab-weekly.json

      - name: Update weekly benchmark history
        run: |
          mise exec -- python scripts/update_benchmark_history.py \
            --report .cache/telemetry/feature-ab-weekly.json \
            --history .cache/telemetry/feature-ab-history.json \
            --max-entries 156

      - name: Check weekly trend regression
        continue-on-error: true
        run: |
          mise exec -- python scripts/check_benchmark_history_trend.py \
            --history .cache/telemetry/feature-ab-history.json \
            --recent-window 4 \
            --baseline-window 12 \
            --max-drop-pct 20

      - name: Render weekly history markdown
        run: |
          mise exec -- python scripts/render_benchmark_history_report.py \
            --history .cache/telemetry/feature-ab-history.json \
            --output .cache/telemetry/feature-ab-history.md \
            --max-rows 16

      - name: Publish weekly history summary
        if: always()
        run: |
          if [ -f .cache/telemetry/feature-ab-history.md ]; then
            cat .cache/telemetry/feature-ab-history.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run long stability smoke
        env:
          R2_OPTIONAL: "true"
          EDGE_MAX_CONCURRENCY: "1"
          EDGE_ENABLE_PARALLEL: "false"
          EDGE_AUTO_TUNE: "false"
          CHAPTER_PARALLEL_COUNT: "1"
        run: |
          mise exec -- python scripts/long_stability_smoke.py \
            --book web/public/sample.epub \
            --engine edge \
            --loops 3 \
            --max-failures 1 \
            --max-mem-growth-mb 700

      - name: Save rolling benchmark history cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/telemetry/feature-ab-history.json
          key: feature-ab-history-${{ github.run_id }}

      - name: Upload weekly history artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: weekly-feature-history-${{ github.run_id }}
          path: |
            .cache/telemetry/feature-ab-weekly.json
            .cache/telemetry/feature-ab-history.json
            .cache/telemetry/feature-ab-history.md
