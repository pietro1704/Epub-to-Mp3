name: Produce Intel macOS converter FFI artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converter-ffi-macos-intel-prebuilt
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      ORT_PREFER_DYNAMIC_LINK: '1'
      ONNXRUNTIME_MACOS_ARCH: x86_64
      CARGO_BUILD_JOBS: '1'
      MISE_ENABLE_TOOLS: rust
    steps:
      - name: Reject non-master dispatch before checkout or build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master || { echo '::error::This producer only runs from master.'; exit 1; }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select official Ruby 4.0.7
        uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1
        with:
          ruby-version: '4.0.7'

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false

      - name: Verify fixed Intel build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$RUNNER_ARCH" = X64
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
          test "$(xcrun --sdk macosx --show-sdk-version)" = '15.5'
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin
          rustc -Vv
          ruby --version

      - name: Identify compatible Intel Rust cache
        id: rust-cache-identity
        run: ruby scripts/intel_rust_cache_identity.rb --direct

      - name: Restore and retain compatible Intel Rust artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            target/release
            target/espeak-data
          key: faber-rust-macos-15-intel-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'mise.toml', 'scripts/native_job.rb', 'scripts/native_build_command.rb', 'scripts/fetch_onnxruntime_macos.rb', 'scripts/prepare_onnxruntime_macos.rb') }}-${{ hashFiles('crates/**/*.rs', 'native/**/*.rs', 'native/**/*.c', 'native/**/*.cc', 'native/**/*.cpp', 'native/**/*.h', 'native/vendor/espeak-rs-sys/espeak-ng/**') }}
          restore-keys: |
            faber-rust-macos-15-intel-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'mise.toml', 'scripts/native_job.rb', 'scripts/native_build_command.rb', 'scripts/fetch_onnxruntime_macos.rb', 'scripts/prepare_onnxruntime_macos.rb') }}-

      - name: Install checksum-pinned ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(ruby scripts/fetch_onnxruntime_macos.rb)"
          test -f "$runtime/libonnxruntime.dylib"
          echo "ORT_LIB_LOCATION=$runtime" >> "$GITHUB_ENV"

      - name: Build eSpeak NG runtime data
        run: ruby scripts/native_job.rb build -- cargo build --locked -p espeak-rs-sys --features compile-espeak-intonations --target-dir target/espeak-data --jobs 1

      - name: Build Intel converter FFI with Piper
        run: ruby scripts/native_job.rb build -- cargo build --locked -p converter-ffi --release --features piper-runtime --jobs 1

      - name: Package and verify artifact
        shell: bash
        run: |
          set -euo pipefail
          ruby scripts/package_converter_ffi_macos.rb identity --root "$GITHUB_WORKSPACE"
          ruby scripts/package_converter_ffi_macos.rb package \
            --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/converter-ffi-macos-intel-x86_64" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload verified Intel macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: converter-ffi-macos-intel-x86_64-v1
          path: ${{ runner.temp }}/converter-ffi-macos-intel-x86_64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
