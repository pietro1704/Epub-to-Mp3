name: Weekly Security Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.9.14
          install: false

      - name: Install toolchain
        run: mise install

      - name: pip-audit
        id: pip_audit
        continue-on-error: true
        run: |
          mise exec -- pip install pip-audit
          mise exec -- pip-audit -r requirements.txt --strict 2>&1 | tee pip-audit.log

      - name: npm audit
        id: npm_audit
        continue-on-error: true
        working-directory: web
        run: npm audit --audit-level=moderate 2>&1 | tee ../npm-audit.log

      - name: Open issue on failure
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const pip = fs.existsSync('pip-audit.log') ? fs.readFileSync('pip-audit.log', 'utf8') : '(no output)';
            const npmLog = fs.existsSync('npm-audit.log') ? fs.readFileSync('npm-audit.log', 'utf8') : '(no output)';
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              '## Weekly security audit failed',
              '',
              `Run: ${context.runId}`,
              `Date: ${today}`,
              '',
              '### pip-audit',
              '```',
              pip.slice(-3000),
              '```',
              '',
              '### npm audit',
              '```',
              npmLog.slice(-3000),
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security audit ${today} — vulnerabilities found`,
              body,
              labels: ['security', 'audit'],
            });

      - name: Fail job if any audit failed
        if: steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure'
        run: exit 1
