name: Weekly Security Audit

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # npm audit needs only Node and npm; installing every project tool took 163 s.
      MISE_ENABLE_TOOLS: node,npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Install toolchain
        run: mise install

      - name: npm audit
        id: npm_audit
        continue-on-error: true
        working-directory: ruby_app/rails_gateway/browser_runtime
        run: npm audit --audit-level=moderate 2>&1 | tee ../../../npm-audit.log

      - name: Open issue on failure
        if: steps.npm_audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const npmLog = fs.existsSync('npm-audit.log') ? fs.readFileSync('npm-audit.log', 'utf8') : '(no output)';
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              '## Weekly security audit failed',
              '',
              `Run: ${context.runId}`,
              `Date: ${today}`,
              '',
              '### npm audit',
              '```',
              npmLog.slice(-3000),
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security audit ${today} — vulnerabilities found`,
              body,
              labels: ['security', 'audit'],
            });

      - name: Fail job if any audit failed
        if: steps.npm_audit.outcome == 'failure'
        run: exit 1
