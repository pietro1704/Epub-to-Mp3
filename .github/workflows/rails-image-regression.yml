name: Rails web image regression

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
      - name: Build the Rails image and exercise its production HTTP contract
        run: ruby_app/rails_gateway/bin/image-regression
