name: Release Pull Request

# Opens the pull request that raises the product version when the validated latest
# master commit carries releasable Conventional Commits (feat, fix, perf, breaking)
# since the last tag. Merging it lets Auto Release tag and publish. The version
# stays committed (Cargo.toml, Cargo.lock, ruby_app/rails_gateway/VERSION,
# CHANGELOG.md), so this workflow never edits master directly.
#
# It never merges: the release pull request is merged like any other ready pull
# request, by the trusted `Merge eligible pull requests` workflow after its
# exact-head PR gate (or by a person).
#
# Needs the RELEASE_PR_TOKEN secret (a token allowed to push a branch and open a
# pull request). A pull request opened with the default GITHUB_TOKEN does not
# start the pull-request checks, so it could never satisfy the required ones.
# Without the secret the job only reports a notice.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Dispatched by Post-merge validation once the whole run succeeded, or manually.
  workflow_dispatch:
    inputs:
      validation_run:
        description: "Post-merge validation run that dispatched this one; wait for it to complete first"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Prepare release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A manual run may only use master's workflow definition: this job holds a write token.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: publication-policy
          persist-credentials: false
      - name: Snapshot trusted helpers
        run: |
          cp publication-policy/scripts/validated_merge.mjs "$RUNNER_TEMP/validated_merge.mjs"
          cp publication-policy/scripts/next_release_version.rb "$RUNNER_TEMP/next_release_version.rb"
          cp publication-policy/scripts/wait_for_validation.mjs "$RUNNER_TEMP/wait_for_validation.mjs"
      - name: Wait for the dispatching validation to complete
        if: inputs.validation_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: node "$RUNNER_TEMP/wait_for_validation.mjs" --repo "$GITHUB_REPOSITORY" --run "$VALIDATION_RUN"
      - name: Require validated current merge
        id: validated
        env:
          SKIP_SUPERSEDED: ${{ inputs.validation_run != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.sha }}
        run: node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --latest
      - name: Checkout
        if: steps.validated.outputs.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.validated.outputs.sha }}
          persist-credentials: false

      - name: Plan the next version
        if: steps.validated.outputs.sha != ''
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          set -euo pipefail
          emit() { echo "prepare=false" >> "$GITHUB_OUTPUT"; echo "$1"; }
          if [[ -z "${RELEASE_PR_TOKEN:-}" ]]; then
            emit "::notice::RELEASE_PR_TOKEN is not configured; no release pull request is opened."
            exit 0
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "")
          COMMITTED=$(ruby -e 'print File.read("Cargo.toml")[/^\[workspace\.package\][^\[]*?^version = "([^"]+)"/m, 1].to_s')
          [[ -n "$COMMITTED" ]] || { echo "::error::Cargo.toml has no [workspace.package] version"; exit 1; }
          RANGE="${LAST_TAG:+${LAST_TAG}..}HEAD"
          PLAN=$(git log "$RANGE" --format='%s%n%b%x00' | ruby "$RUNNER_TEMP/next_release_version.rb" --last-tag "$LAST_TAG" --committed "$COMMITTED")
          echo "$PLAN"
          BUMP=$(sed -n 's/^bump=//p' <<<"$PLAN")
          VERSION=$(sed -n 's/^version=//p' <<<"$PLAN")
          case "$BUMP" in
            none) emit "No releasable commit since ${LAST_TAG:-the start}; no release pull request."; exit 0 ;;
            committed) emit "Version ${VERSION} is already committed; Auto Release publishes it."; exit 0 ;;
          esac
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 64
          # An open release pull request for the same or a newer version blocks a new one;
          # a lower one is stale (the plan moved on) and is closed when the new one opens.
          SUPERSEDE=""
          while read -r NUMBER HEAD; do
            [[ -n "${NUMBER:-}" ]] || continue
            OPEN_VERSION="${HEAD#release/v}"
            [[ "$OPEN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            if [[ "$(ruby -e 'a, b = ARGV.map { |v| v.split(".").map(&:to_i) }; print(a <=> b)' "$OPEN_VERSION" "$VERSION")" != "-1" ]]; then
              emit "A release pull request is already open for ${OPEN_VERSION}; not opening another for ${VERSION}."
              exit 0
            fi
            SUPERSEDE="${SUPERSEDE:+$SUPERSEDE }$NUMBER"
          done < <(gh pr list --state open --limit 100 --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release/v")) | "\(.number) \(.headRefName)"')
          {
            echo "prepare=true"
            echo "version=$VERSION"
            echo "last_tag=$LAST_TAG"
            echo "supersede=$SUPERSEDE"
          } >> "$GITHUB_OUTPUT"

      - name: Raise the version and the changelog
        if: steps.plan.outputs.prepare == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v${VERSION}"
          # bump.sh edits Cargo.toml, Cargo.lock and VERSION, then commits and tags
          # locally. The tag is dropped; only the branch is pushed.
          bash scripts/bump.sh "$VERSION"
          git tag -d "v${VERSION}"
      - name: Generate the changelog
        if: steps.plan.outputs.prepare == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --tag v${{ steps.plan.outputs.version }} --output CHANGELOG.md
      - name: Commit the release
        if: steps.plan.outputs.prepare == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          grep -q "## \[${VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no entry for ${VERSION}"; exit 1; }
          git add CHANGELOG.md
          git commit --amend -q -m "chore(release): v${VERSION}"
          git diff --stat HEAD~1 | tail -8

      - name: Push the branch and open the pull request
        if: steps.plan.outputs.prepare == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          LAST_TAG: ${{ steps.plan.outputs.last_tag }}
          SUPERSEDE: ${{ steps.plan.outputs.supersede }}
        run: |
          set -euo pipefail
          # Close release pull requests for a lower version, with their branches.
          for number in ${SUPERSEDE:-}; do
            gh pr close "$number" --delete-branch \
              --comment "Superseded by the release pull request for v${VERSION}."
          done
          # A branch left by a closed pull request or by a run that stopped before
          # opening one is stale (no open pull request has this version): remove it.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/v${VERSION}" 2>/dev/null || true
          git -c credential.helper= -c "credential.helper=!gh auth git-credential" \
            push origin "HEAD:refs/heads/release/v${VERSION}"
          gh pr create --base master --head "release/v${VERSION}" \
            --title "chore(release): v${VERSION}" \
            --body "Raises the product version from ${LAST_TAG:-the previous release} to ${VERSION} (Cargo.toml, Cargo.lock, ruby_app/rails_gateway/VERSION, CHANGELOG.md) from the Conventional Commits since the last tag. Merging it lets Auto Release tag v${VERSION} and publish the GitHub release. Opened by the Release Pull Request workflow."
