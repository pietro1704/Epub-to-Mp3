name: Dependabot Flush

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: Report Dependabot PR status
    runs-on: ubuntu-latest
    steps:
      - name: Report open Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open --author "app/dependabot" \
            --json number,title,url,createdAt
