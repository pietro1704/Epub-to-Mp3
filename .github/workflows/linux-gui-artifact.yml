name: Normal Flutter Linux verification package

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-gui-artifact-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux-package:
    name: Build and audit the normal Linux app without launching it
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MISE_ENABLE_TOOLS: rust,ruby,flutter
      CARGO_BUILD_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      LC_ALL: C
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false
      - name: Install scoped project tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Identify the runner image for the apt package cache
        id: apt-image
        run: echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache downloaded apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-gtk-build
      - name: Install hosted desktop build and ELF inspection prerequisites
        timeout-minutes: 8
        env:
          CI_APT_ARCHIVES: ${{ runner.temp }}/apt-archives
        run: bash scripts/ci_apt_install.sh clang libclang-dev cmake ninja-build pkg-config libgtk-3-dev liblzma-dev binutils
      - name: Snapshot tracked generated-source provenance before building
        run: |
          mise exec -- ruby scripts/linux_gui_artifact_evidence.rb snapshot
      - name: Build the normal lib/main.dart app once through its guarded task
        run: |
          set -euo pipefail
          unset ORT_LIB_LOCATION ORT_DYLIB_PATH ORT_SKIP_DOWNLOAD ORT_PREFER_DYNAMIC_LINK LD_LIBRARY_PATH LD_PRELOAD
          mkdir -p .reports/linux-gui
          build_cpu="$(mise exec -- ruby scripts/linux_gui_artifact_evidence.rb build-cpu)"
          printf '%s\n' "$build_cpu" > .reports/linux-gui/build-cpu.txt
          taskset --cpu-list "$build_cpu" mise run flutter:build-linux 2>&1 | tee .reports/linux-gui/build.log
      - name: Audit and archive only the actual normal product bundle
        run: |
          set -euo pipefail
          unset ORT_LIB_LOCATION ORT_DYLIB_PATH ORT_SKIP_DOWNLOAD ORT_PREFER_DYNAMIC_LINK LD_LIBRARY_PATH LD_PRELOAD
          mise exec -- ruby scripts/linux_gui_artifact_evidence.rb audit
      - name: Retain the audited normal Linux product
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-linux-normal-product
          path: .reports/linux-gui-product
          if-no-files-found: error
          retention-days: 14
      - name: Retain build logs separately from the product
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-linux-normal-build-logs
          path: .reports/linux-gui
          if-no-files-found: warn
          retention-days: 14
