name: Faber runtime integration

on:
  workflow_call:
    inputs:
      macos_only:
        description: Run the ARM64 native app gate without other platform jobs
        type: boolean
        default: false
      physical_fixture_apk:
        type: boolean
        default: false
      browser_runtime:
        description: Run the real-model Rails browser conversion (post-merge runs it as its own job)
        type: boolean
        default: true
      native_host_tests:
        description: Also run the Mac host and native fixture regressions in the ARM64 job
        type: boolean
        default: false
      intel_prebuilt:
        description: Use the verified Intel macOS FFI artifact instead of compiling converter-ffi
        type: boolean
        default: false
      intel_prebuilt_run_id:
        description: Successful trusted producer workflow run ID
        type: string
        default: ''
      intel_prebuilt_run_attempt:
        description: Successful trusted producer workflow run attempt
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      physical_fixture_apk:
        description: Build the optional APK for manual physical-device verification
        type: boolean
        default: false
      intel_only:
        description: Run only the Intel macOS preferences and installation job
        type: boolean
        default: false
      native_host_tests:
        description: Also run the Mac host and native fixture regressions in the ARM64 job
        type: boolean
        default: true
      intel_prebuilt:
        description: Use the verified Intel macOS FFI artifact instead of compiling converter-ffi
        type: boolean
        default: false
      intel_prebuilt_run_id:
        description: Successful trusted producer workflow run ID
        type: string
        default: ''
      intel_prebuilt_run_attempt:
        description: Successful trusted producer workflow run attempt
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: faber-integration-${{ github.ref }}-${{ inputs.macos_only == true && 'app-gate' || github.event_name == 'workflow_dispatch' && inputs.intel_only == true && 'intel-only' || 'full' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ffi-jni:
    if: ${{ inputs.macos_only != true && !(github.event_name == 'workflow_dispatch' && inputs.intel_only == true) }}
    name: Faber FFI JNI contracts
    uses: ./.github/workflows/faber-jni-contracts.yml
    permissions:
      contents: read

  android-package:
    if: ${{ inputs.macos_only != true && !(github.event_name == 'workflow_dispatch' && inputs.intel_only == true) }}
    name: Faber Android APK and ARM64 ABI-translation inference
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MISE_ENABLE_TOOLS: rust,ruby,flutter,java,android-sdk,ninja
      ANDROID_VERIFICATION_MODE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable and require hosted Linux KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          id
          stat -c '%F %a %U:%G %n' /dev/kvm
          if ! { test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm; }; then
            echo '::error::Hosted Android inference requires readable/writable /dev/kvm.'
            exit 1
          fi
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false
      - name: Identify the runner image for the apt package cache
        id: apt-image
        run: echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache downloaded apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-debs-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt-image.outputs.image }}-clang-build
      - name: Install host build prerequisites
        timeout-minutes: 8
        env:
          CI_APT_ARCHIVES: ${{ runner.temp }}/apt-archives
        run: bash scripts/ci_apt_install.sh clang libclang-dev cmake pkg-config
      - run: mise install
      # Same identity as ci.yml android-jvm, which restores this entry on PRs.
      - name: Identify cached toolchain versions
        id: tool-versions
        run: |
          set -euo pipefail
          tools="$(mise ls --current --json)"
          echo "flutter=$(jq -er '.flutter[0].version' <<< "$tools")" >> "$GITHUB_OUTPUT"
          echo "java=$(jq -er '.java[0].version' <<< "$tools")" >> "$GITHUB_OUTPUT"
      - name: Restore Gradle dependency downloads
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.tool-versions.outputs.flutter }}-java-${{ steps.tool-versions.outputs.java }}-${{ hashFiles('flutter_app/android/**/*.gradle.kts', 'flutter_app/android/gradle.properties', 'flutter_app/android/gradle/wrapper/gradle-wrapper.properties', 'flutter_app/pubspec.lock') }}
          restore-keys: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Accept Android SDK licenses
        run: |
          set +o pipefail
          yes | mise exec -- sdkmanager --licenses
          result=${PIPESTATUS[1]}
          exit "$result"
      - name: Install project Android target dependencies
        run: |
          mise run android:embedded-deps
          mise exec -- rustup target add aarch64-linux-android
      - name: Build fresh Piper JNI and audited ARM64 APK
        id: main-ui-apk
        env:
          EPUB2MP3_ANDROID_VERIFICATION: "1"
          UI_PACKAGE: com.pietrocode.epubtomp3.flutter_app.verification
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mise run flutter:build-apk-debug
          apk="$GITHUB_WORKSPACE/flutter_app/build/app/outputs/flutter-apk/app-debug.apk"
          application_id="$(mise exec -- apkanalyzer manifest application-id "$apk")"
          test "$application_id" = "$UI_PACKAGE"
          evidence="$GITHUB_WORKSPACE/.reports/android-ui"
          mkdir -p "$evidence"
          cp "$apk" "$evidence/app-debug-ui-verification.apk"
          cp "$GITHUB_WORKSPACE/target/piper-android/aarch64-linux-android/release/libconverter_ffi.so.runtime.json" "$evidence/"
          mise exec -- ruby -rjson -rdigest -e '
            root = ENV.fetch("GITHUB_WORKSPACE")
            evidence = File.join(root, ".reports/android-ui")
            source = IO.popen(%w[git rev-parse HEAD], chdir: root, &:read).strip
            abort "Source identity differs from the requested head" unless source == ENV.fetch("PR_HEAD_SHA")
            runtime = JSON.parse(File.read(File.join(evidence, "libconverter_ffi.so.runtime.json")))
            metadata = {
              sourceCommit: source,
              runId: ENV.fetch("GITHUB_RUN_ID"),
              runAttempt: ENV.fetch("GITHUB_RUN_ATTEMPT"),
              target: "lib/main.dart",
              applicationId: ENV.fetch("UI_PACKAGE"),
              apkSha256: Digest::SHA256.file(File.join(evidence, "app-debug-ui-verification.apk")).hexdigest,
              nativeRuntime: runtime,
              physicalDeviceTestExecuted: false
            }
            File.write(File.join(evidence, "build-identity.json"), JSON.pretty_generate(metadata))
          '
      - name: Test Android background and selection adapters
        working-directory: flutter_app/android
        run: mise exec -- ./gradlew :app:testDebugUnitTest
      - name: Build the integration target as an audited ARM64-only APK
        working-directory: flutter_app
        run: |
          identity_only=false
          if [[ "$ANDROID_VERIFICATION_MODE" == identity ]]; then identity_only=true; fi
          mise exec -- ruby ../scripts/native_build_command.rb -- mise exec -- flutter build apk --debug --target-platform android-arm64 --target integration_test/android_piper_inference_test.dart --dart-define="ANDROID_JOB_IDENTITY_ONLY=$identity_only"
          mise exec -- ruby ../scripts/native_build_command.rb -- mise exec -- ruby ../scripts/package_converter_ffi_android.rb --audit --apk "$GITHUB_WORKSPACE/flutter_app/build/app/outputs/flutter-apk/app-debug.apk"
      - name: Save Gradle dependency downloads on master
        if: github.ref == 'refs/heads/master' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Run actual Piper inference in the packaged ARM64 app
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          # API 35 Google APIs x86_64 exposes arm64-v8a through libndk_translation.so.
          # Keep the guest x86_64 because hosted x86_64 QEMU rejects an ARM64 guest.
          arch: x86_64
          profile: pixel_2
          avd-name: faber-arm64-abi-translation
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio -no-boot-anim -accel on
          # The action otherwise installs the latest emulator. 37.2.13.0 (build 16740729)
          # passed post-merge 44567671401; 37.3.10.0 (16970787) exited about 33 s after
          # the test finished in both attempts of 44618870851, before the driver read results.
          emulator-build: '16740729'
          script: bash scripts/verify_android_piper_inference.sh "$ANDROID_VERIFICATION_MODE"
      - name: Retain APK, native identity and Android test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faber-android-package
          path: |
            flutter_app/build/app/outputs/flutter-apk/app-debug.apk
            target/piper-android/aarch64-linux-android/release/libconverter_ffi.so.runtime.json
            flutter_app/build/app/reports/tests
            flutter_app/build/app/test-results
            .reports/tts-preferences/android-inference.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build the private-fixture APK for physical Android verification
        id: device-fixture-apk
        if: inputs.physical_fixture_apk == true
        working-directory: flutter_app
        env:
          EPUB2MP3_ANDROID_VERIFICATION: "1"
          FIXTURE_PACKAGE: com.pietrocode.epubtomp3.flutter_app.verification
          FIXTURE_DIRECTORY: /data/user/0/com.pietrocode.epubtomp3.flutter_app.verification/files/test-fixtures
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          connected_devices="$(adb devices)"
          if printf '%s\n' "$connected_devices" | awk 'NR > 1 && $1 == "emulator-5554" { found = 1 } END { exit !found }'; then
            echo '::error::The inference emulator must be stopped before building the device fixture APK.'
            exit 1
          fi
          mise exec -- ruby ../scripts/native_build_command.rb -- mise exec -- flutter build apk \
            --debug --no-pub --target-platform android-arm64 \
            --target integration_test/android_real_books_inference_test.dart \
            --dart-define="REAL_BOOK_FIXTURE_MANIFEST=$FIXTURE_DIRECTORY/manifest.json" \
            --dart-define="FABER_FIXTURE_DIRECTORY=$FIXTURE_DIRECTORY/tts-models/pt_BR-faber-medium"
          apk="$GITHUB_WORKSPACE/flutter_app/build/app/outputs/flutter-apk/app-debug.apk"
          mise exec -- ruby ../scripts/native_build_command.rb -- mise exec -- ruby ../scripts/package_converter_ffi_android.rb --audit --apk "$apk"
          application_id="$(mise exec -- apkanalyzer manifest application-id "$apk")"
          test "$application_id" = "$FIXTURE_PACKAGE"
          evidence="$GITHUB_WORKSPACE/.reports/android-device-fixture"
          mkdir -p "$evidence"
          cp "$apk" "$evidence/app-debug-verification.apk"
          cp "$GITHUB_WORKSPACE/target/piper-android/aarch64-linux-android/release/libconverter_ffi.so.runtime.json" "$evidence/"
          mise exec -- ruby -rjson -rdigest -e '
            root = ENV.fetch("GITHUB_WORKSPACE")
            evidence = File.join(root, ".reports/android-device-fixture")
            source = IO.popen(%w[git rev-parse HEAD], chdir: root, &:read).strip
            abort "Source identity differs from the requested head" unless source == ENV.fetch("PR_HEAD_SHA")
            driver = "flutter_app/integration_test/android_real_books_inference_test.dart"
            runtime = JSON.parse(File.read(File.join(evidence, "libconverter_ffi.so.runtime.json")))
            metadata = {
              sourceCommit: source,
              runId: ENV.fetch("GITHUB_RUN_ID"),
              runAttempt: ENV.fetch("GITHUB_RUN_ATTEMPT"),
              target: "integration_test/android_real_books_inference_test.dart",
              driverSha256: Digest::SHA256.file(File.join(root, driver)).hexdigest,
              applicationId: ENV.fetch("FIXTURE_PACKAGE"),
              fixtureManifest: "#{ENV.fetch("FIXTURE_DIRECTORY")}/manifest.json",
              faberFixtureDirectory: "#{ENV.fetch("FIXTURE_DIRECTORY")}/tts-models/pt_BR-faber-medium",
              apkSha256: Digest::SHA256.file(File.join(evidence, "app-debug-verification.apk")).hexdigest,
              nativeRuntime: runtime,
              physicalDeviceTestExecuted: false
            }
            File.write(File.join(evidence, "build-identity.json"), JSON.pretty_generate(metadata))
          '
      - name: Retain the physical-device fixture APK and build identity
        if: success() && steps.device-fixture-apk.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faber-android-device-fixture
          path: .reports/android-device-fixture
          if-no-files-found: error
          retention-days: 14

      - name: Retain the normal Android UI APK and build identity
        if: success() && steps.main-ui-apk.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: faber-android-ui
          path: .reports/android-ui
          if-no-files-found: error
          retention-days: 14

  macos-preferences:
    name: Faber macOS preferences and installation (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos_only == true && '[{"os":"macos-15","arch":"arm64"}]' || github.event_name == 'workflow_dispatch' && inputs.intel_only == true && '[{"os":"macos-15-intel","arch":"x86_64"}]' || '[{"os":"macos-15","arch":"arm64"},{"os":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.macos_only == true && 30 || 60 }}
    env:
      # The Intel prebuilt path needs neither Rust nor mise Ruby; it enables only a small
      # pinned tool so the filter stays non-empty.
      MISE_ENABLE_TOOLS: ${{ matrix.arch == 'x86_64' && inputs.intel_prebuilt && 'aqua:git-lfs/git-lfs' || matrix.arch == 'x86_64' && 'rust' || 'rust,ruby' }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the canonical hosted Xcode 16.4 toolchain
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee "$RUNNER_TEMP/faber-xcode-version.txt"
          grep -Fx 'Xcode 16.4' "$RUNNER_TEMP/faber-xcode-version.txt"
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.3
          cache: false
          install: false
      - name: Install official prebuilt Ruby for Intel
        if: matrix.arch == 'x86_64'
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: '4.0.7'
          bundler-cache: false
      - run: mise install
      - name: Verify official Intel Ruby selection through mise
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          ruby -rrbconfig -e '
            abort "Ruby version mismatch: #{RUBY_VERSION}" unless RUBY_VERSION == "4.0.7"
            abort "Ruby architecture mismatch: #{RbConfig::CONFIG.fetch("host_cpu")}" unless RbConfig::CONFIG.fetch("host_cpu") == "x86_64"
            ruby_path = File.realpath(RbConfig.ruby)
            tool_cache = File.realpath(ENV.fetch("RUNNER_TOOL_CACHE")) + File::SEPARATOR
            abort "Ruby is outside RUNNER_TOOL_CACHE: #{ruby_path}" unless ruby_path.start_with?(tool_cache)
            puts "#{RUBY_VERSION}\t#{ruby_path}"
          ' > "$RUNNER_TEMP/faber-ruby-direct.txt"
          mise exec -- ruby -rrbconfig -e '
            abort "Ruby version mismatch: #{RUBY_VERSION}" unless RUBY_VERSION == "4.0.7"
            abort "Ruby architecture mismatch: #{RbConfig::CONFIG.fetch("host_cpu")}" unless RbConfig::CONFIG.fetch("host_cpu") == "x86_64"
            ruby_path = File.realpath(RbConfig.ruby)
            tool_cache = File.realpath(ENV.fetch("RUNNER_TOOL_CACHE")) + File::SEPARATOR
            abort "Ruby is outside RUNNER_TOOL_CACHE: #{ruby_path}" unless ruby_path.start_with?(tool_cache)
            puts "#{RUBY_VERSION}\t#{ruby_path}"
          ' > "$RUNNER_TEMP/faber-ruby-mise.txt"
          cmp "$RUNNER_TEMP/faber-ruby-direct.txt" "$RUNNER_TEMP/faber-ruby-mise.txt"
          cat "$RUNNER_TEMP/faber-ruby-direct.txt"
      # Formerly the separate Apple Foundation tests job: it shares this job's
      # Xcode 16.4 runner, so the PR app gate and post-merge arm64 run it here.
      - name: Test the Foundation-only Apple production seam
        if: matrix.arch == 'arm64'
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p .reports/tts-preferences
          mise run apple:foundation:test 2>&1 | tee .reports/tts-preferences/apple-foundation-test.log
      - name: Require the conversion history regression suite
        if: matrix.arch == 'arm64'
        shell: ruby {0}
        run: |
          log = File.read('.reports/tts-preferences/apple-foundation-test.log')
          suites = log.scan(/Test Suite 'ConversionHistoryReaderTests' passed[^\n]*\n\s*Executed (\d+) tests?, with 0 failures/)
          abort 'Foundation history must execute without failures or skips' if suites.empty? || suites.any? { |counts| counts.first.to_i.zero? }
          abort 'Foundation history contains a skipped or failing case' if log.match?(/Test Case '[^'\n]*ConversionHistoryReaderTests[^'\n]*' (?:skipped|failed)/)
          puts "FOUNDATION_HISTORY_XCTEST total=#{suites.sum { |counts| counts.first.to_i }} failed=0 skipped=0"
      # The former native-hook-safety job; the PR gate runs it when the change touches
      # the native scripts, storage budget or DeviceWorkflow package.
      - name: Install the host test dependency
        if: matrix.arch == 'arm64' && inputs.native_host_tests == true
        run: mise exec -- gem install minitest --version 6.1.0 --no-document --bindir "$RUNNER_TEMP/minitest-bin"
      - name: Verify real Mac filesystem, storage and native fixture contracts
        if: matrix.arch == 'arm64' && inputs.native_host_tests == true
        run: |
          mise exec -- ruby scripts/test_mac_build_budget.rb
          mise exec -- ruby scripts/test_native_job.rb
          mise exec -- ruby scripts/test_native_entrypoint_safety.rb
          mise exec -- ruby scripts/test_native_faber_entrypoints.rb
          mise exec -- ruby scripts/test_native_task_wiring.rb
          mise exec -- ruby scripts/test_native_simulator_session.rb
          mise exec -- ruby scripts/test_device_workflow_entrypoint.rb
      - name: Type-check inherited-lease adapter without launching it
        if: matrix.arch == 'arm64' && inputs.native_host_tests == true
        run: mise exec -- ruby scripts/native_job.rb build -- xcrun swiftc -typecheck scripts/ios_simulator_smoke.swift
      - name: Test the actual DeviceWorkflow Swift package
        if: matrix.arch == 'arm64' && inputs.native_host_tests == true
        run: mise exec -- ruby scripts/native_job.rb build -- xcrun swift test --package-path tools/DeviceWorkflow
      - name: Build the actual eSpeak dependency
        if: matrix.arch == 'arm64' && inputs.native_host_tests == true
        run: mise exec -- ruby scripts/native_job.rb build -- cargo check --locked -p espeak-rs-sys
      - name: Download and verify the pinned Intel converter-ffi artifact
        if: matrix.arch == 'x86_64' && inputs.intel_prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
          FFI_RUN_ID: ${{ inputs.intel_prebuilt_run_id }}
          FFI_RUN_ATTEMPT: ${{ inputs.intel_prebuilt_run_attempt }}
        run: |
          set -euo pipefail
          test -n "$FFI_RUN_ID"
          test -n "$FFI_RUN_ATTEMPT"
          mise run onnxruntime:host
          mise exec -- ruby scripts/download_converter_ffi_macos.rb \
            --run-id "$FFI_RUN_ID" --run-attempt "$FFI_RUN_ATTEMPT"
      - name: Test Intel FFI artifact downloader fixtures
        if: matrix.arch == 'x86_64'
        run: mise exec -- ruby scripts/test_download_converter_ffi_macos.rb
      - name: Install Xcode project generator
        run: brew install xcodegen
      # Both architectures reuse master's embedded runtime build; the Intel key
      # (matrix.os macos-15-intel) stays shared with the Intel FFI producer.
      # Hosted arm64 runners serve several weekly image builds at once with the
      # same Xcode, SDK, clang and Rust; keying on the image build split the arm64
      # cache three ways and most PRs rebuilt from scratch. arm64 replaces the
      # image build with the image tool the native build actually runs (cmake,
      # for eSpeak NG) next to rustc, cargo, Xcode build, SDK and the clang hash.
      # Intel keeps the producer's image-scoped identity, which it shares.
      - name: Identify Rust cache inputs
        if: matrix.arch != 'x86_64' || !inputs.intel_prebuilt
        id: rust-cache-identity
        env:
          IMAGE_BUILD_AGNOSTIC: ${{ matrix.arch == 'arm64' }}
        run: |
          if [ "$IMAGE_BUILD_AGNOSTIC" = true ]; then
            mise exec -- ruby -rdigest -r ./scripts/intel_rust_cache_identity -e '
              toolchain = IntelRustCacheIdentity.calculate(ENV.to_h.merge("ImageVersion" => "toolchain-scoped"))
              cmake = IO.popen(%w[cmake --version], &:read)
              abort "Cannot inspect cmake" unless $?.success? && !cmake.empty?
              File.write(ENV.fetch("GITHUB_OUTPUT"), "identity=#{Digest::SHA256.hexdigest("#{toolchain}\n#{cmake}")}\n", mode: "a")
            '
          else
            mise exec -- ruby scripts/intel_rust_cache_identity.rb
          fi
      - name: Restore Rust build cache
        if: matrix.arch != 'x86_64' || !inputs.intel_prebuilt
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target/release
            target/espeak-data
          key: faber-rust-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'mise.toml', 'scripts/native_job.rb', 'scripts/native_build_command.rb', 'scripts/fetch_onnxruntime_macos.rb', 'scripts/prepare_onnxruntime_macos.rb') }}-${{ hashFiles('native/**/*.c', 'native/**/*.cc', 'native/**/*.cpp', 'native/**/*.h', 'native/vendor/espeak-rs-sys/espeak-ng/**') }}
          restore-keys: |
            faber-rust-${{ matrix.os }}-${{ runner.arch }}-${{ steps.rust-cache-identity.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', 'mise.toml', 'scripts/native_job.rb', 'scripts/native_build_command.rb', 'scripts/fetch_onnxruntime_macos.rb', 'scripts/prepare_onnxruntime_macos.rb') }}-
      - name: Build embedded host runtime without Simulator
        id: ffi-build
        if: matrix.arch != 'x86_64' || !inputs.intel_prebuilt
        run: mise run converter-ffi:build
      - name: Verify actual FFI and pinned ORT architectures
        id: ffi-architecture
        run: |
          set -o pipefail
          mkdir -p .reports/tts-preferences
          ffi_arch="$(xcrun lipo -archs target/release/libconverter_ffi.dylib)"
          test "$ffi_arch" = "$EXPECTED_ARCH"
          runtime_root="target/onnxruntime-macos-prebuilt/$EXPECTED_ARCH"
          ort_arch="$(xcrun lipo -archs "$runtime_root/lib/libonnxruntime.dylib")"
          test "$ort_arch" = "$EXPECTED_ARCH"
          mise exec -- ruby -rjson -e '
            manifest = JSON.parse(File.read(ARGV.fetch(0)))
            actual = manifest.fetch("architecture")
            abort "ORT manifest architecture mismatch" unless actual == ARGV.fetch(1)
            puts "ORT manifest architecture: #{actual}"
          ' "$runtime_root/runtime.json" "$EXPECTED_ARCH"
          printf 'Host: %s\nFFI: %s\nORT: %s\n' "$(uname -m)" "$ffi_arch" "$ort_arch" > .reports/tts-preferences/native-architectures.log
          cat .reports/tts-preferences/native-architectures.log
      - name: Save Rust build cache on master
        if: success() && github.ref == 'refs/heads/master' && (matrix.arch != 'x86_64' || !inputs.intel_prebuilt) && steps.rust-cache.outputs.cache-hit != 'true' && steps.ffi-build.outcome == 'success' && steps.ffi-architecture.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target/release
            target/espeak-data
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Generate native project with actual FFI artifact
        working-directory: ios/EpubToMp3
        run: xcodegen generate
      - name: Provide the checksum-pinned native Faber test model
        uses: ./.github/actions/faber-test-model
        with:
          directory: ${{ runner.temp }}/faber-models
      - name: Expose the native Faber test model
        run: echo "EPUB2MP3_PIPER_TEST_MODEL_ROOT=$RUNNER_TEMP/faber-models" >> "$GITHUB_ENV"
      - name: Verify native Piper cancellation and subsequent inference
        if: matrix.arch == 'arm64'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          ORT_PREFER_DYNAMIC_LINK: '1'
        run: |
          set -euo pipefail
          export ORT_LIB_LOCATION="$PWD/target/onnxruntime-macos-prebuilt/$EXPECTED_ARCH/lib"
          export DYLD_LIBRARY_PATH="$ORT_LIB_LOCATION"
          piper_data_directory="$(mise exec -- ruby -e '
            table = Dir.glob("target/espeak-data/**/espeak-ng-data/phontab").find { |path| File.file?(File.join(File.dirname(path), "phondata")) }
            abort "Built eSpeak data is missing" unless table
            puts File.expand_path(File.dirname(File.dirname(table)))
          ')"
          export PIPER_ESPEAKNG_DATA_DIRECTORY="$piper_data_directory"
          # Cargo's test loader searches its target directory for dynamic libraries.
          ln -s "$ORT_LIB_LOCATION/libonnxruntime.dylib" target/release/deps/libonnxruntime.dylib
          # native_job.rb sets CARGO_BUILD_JOBS: the hosted-runner allowance here, 1 elsewhere.
          mise exec -- ruby scripts/native_job.rb build -- cargo test --locked -p piper-runtime --release --lib \
            --features onnxruntime,piper-inference,heavy-runtime-tests \
            piper_inference_generates_valid_wav_from_vendored_model -- --nocapture
      - name: Run real macOS preference and installation XCTest
        working-directory: ios/EpubToMp3
        run: |
          set -euo pipefail
          mkdir -p ../../.reports/tts-preferences
          test_arguments=(
            -project EpubToMp3.xcodeproj
            -scheme EpubToMp3-UnitTests -destination 'platform=macOS'
            -derivedDataPath .build/faber-ci
            -jobs 3 -parallel-testing-enabled NO
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
            "EPUB2MP3_PIPER_TEST_MODEL_ROOT=$EPUB2MP3_PIPER_TEST_MODEL_ROOT"
            -only-testing:EpubToMp3Tests/ConversionOptionsInteropTests
            -only-testing:EpubToMp3Tests/AppStartupTimingTests
            -only-testing:EpubToMp3Tests/AppWindowConfigurationTests
            -only-testing:EpubToMp3Tests/ConvertViewModelTests
            -only-testing:EpubToMp3Tests/ToolbarSettingsParityTests
            -only-testing:EpubToMp3Tests/PlatformSpeechSynthesizerTests
            -only-testing:EpubToMp3Tests/ReaderProgressiveListeningTests
            -only-testing:EpubToMp3Tests/PdfEmbeddedConversionTests
            -only-testing:EpubToMp3Tests/PdfMetadataReaderTests
            -only-testing:EpubToMp3Tests/MacReaderPDFViewportTests
            -only-testing:EpubToMp3Tests/MacReaderDiskCacheTests
            -only-testing:EpubToMp3Tests/MacConverterOCRMessageTests
            -only-testing:EpubToMp3Tests/MacSettingsLinuxLayoutTests
            -only-testing:EpubToMp3Tests/MacReaderToolbarVisibilityTests
            -only-testing:EpubToMp3Tests/MacReaderColumnsTests
            -only-testing:EpubToMp3Tests/MacReaderTextLayoutTests
            -only-testing:EpubToMp3Tests/MacReaderHeaderClearanceTests
            -only-testing:EpubToMp3Tests/InlineImageQuotingTests
            -only-testing:EpubToMp3Tests/MacPlayerBarAccessibilityTests
            -only-testing:EpubToMp3Tests/ConversionCallbackBoundaryTests
            -only-testing:EpubToMp3Tests/LibraryBookOpeningTests
            -only-testing:EpubToMp3Tests/LibraryPDFCoverRefreshTests
            -only-testing:EpubToMp3Tests/LibraryStoreTests
            -only-testing:EpubToMp3Tests/MacModelInstallationResponsivenessTests
            -only-testing:EpubToMp3Tests/MacSpeechModelProductActionsTests
            -only-testing:EpubToMp3Tests/AudioPlayerDivergenceTests
            -only-testing:EpubToMp3Tests/MacScrollableStackWindowTests
            -only-testing:EpubToMp3Tests/FaberNativeInferenceTests
          )
          mise exec -- ruby ../../scripts/native_job.rb build -- xcodebuild build-for-testing "${test_arguments[@]}" \
            | tee ../../.reports/tts-preferences/macos-prefs-build.log
          mise exec -- ruby ../../scripts/native_job.rb build -- xcodebuild test-without-building "${test_arguments[@]}" \
            -resultBundlePath ../../.reports/tts-preferences/macos-prefs.xcresult \
            | tee ../../.reports/tts-preferences/macos-prefs.log
          grep -F 'FABER_NATIVE firstChunkSeconds=' ../../.reports/tts-preferences/macos-prefs.log
      - name: Verify actual player seek execution in the shared XCTest result
        if: always()
        shell: ruby {0}
        run: |
          require 'json'
          root = '.reports/tts-preferences'
          result = File.join(root, 'macos-prefs.xcresult')
          summary_path = File.join(root, 'test-summary.json')
          abort 'No app-host XCTest result; player seek acceptance is unverified' unless File.directory?(result)
          abort 'Cannot read actual XCTest summary' unless system('xcrun', 'xcresulttool', 'get', 'test-results', 'summary', '--path', result, out: summary_path)
          summary = JSON.parse(File.read(summary_path))
          counts = summary.values_at('totalTestCount', 'passedTests', 'failedTests', 'skippedTests')
          abort 'Missing or invalid XCTest counts' unless counts.all? { |count| count.is_a?(Integer) && count >= 0 }
          total, passed, failed, skipped = counts
          abort 'App-host XCTest must pass with consistent execution counts' unless summary['result'] == 'Passed' && total >= 3 && passed >= 3 && passed + skipped == total && failed.zero?
          log = File.read(File.join(root, 'macos-prefs.log'))
          suite = log.match(/Test Suite 'AudioPlayerDivergenceTests' passed[^\n]*\n\s*Executed (\d+) tests?, with 0 failures/)
          abort 'The real player suite must execute at least three passing cases' unless suite && suite[1].to_i >= 3
          %w[testStopCancelsReaderPageSeekBeforeDurationArrives testReaderPageSeekCannotCrossJobsAtTheSameChapterIndex testPendingProportionalSeekAppliedOnceDurationLands].each do |name|
            abort "Player seek case did not pass: #{name}" unless log.match?(/Test Case '[^'\n]*AudioPlayerDivergenceTests[ .]#{Regexp.escape(name)}\]' passed/)
          end
          puts "PLAYER_SEEK_XCTEST total=#{suite[1]} failed=0 skipped=0 sharedResult=#{result}"
      - name: Verify packaging with real Apple tools and the built runtime
        run: |
          mise run mac:validate -- package --derived-data ios/EpubToMp3/.build/faber-ci \
            > .reports/tts-preferences/real-packaging.json
      # The former native-ffi-test-isolation job: the same bundled library and test
      # target, run as its own xcodebuild process (isolated from the other suites)
      # with no voice-weight location in the environment or build settings.
      - name: Run only adapter isolation XCTest with the real bundled library
        if: matrix.arch == 'arm64' && inputs.macos_only != true
        working-directory: ios/EpubToMp3
        run: |
          set -euo pipefail
          mkdir -p ../../.reports/ffi-test-isolation
          env -u EPUB2MP3_PIPER_TEST_MODEL_ROOT mise exec -- ruby ../../scripts/native_job.rb build -- xcodebuild test-without-building \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3-UnitTests -destination 'platform=macOS' \
            -derivedDataPath .build/faber-ci \
            -resultBundlePath ../../.reports/ffi-test-isolation/adapter.xcresult \
            -jobs 3 -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            -only-testing:EpubToMp3Tests/ConverterFFIAdapterTests \
            2>&1 | tee ../../.reports/ffi-test-isolation/xctest.log
          test -s .build/faber-ci/Build/Products/Debug/EpubToMp3.app/Contents/Frameworks/libconverter_ffi.dylib
      - name: Require all five adapter cases without skips and retain summary metadata
        if: matrix.arch == 'arm64' && inputs.macos_only != true
        run: |
          set -o pipefail
          xcrun xcresulttool get test-results summary \
            --path .reports/ffi-test-isolation/adapter.xcresult \
            > .reports/ffi-test-isolation/summary.json
          mise exec -- ruby -rjson -e '
            summary = JSON.parse(File.read(ARGV.fetch(0)))
            abort "Expected exactly five passing adapter cases" unless summary.fetch("passedTests") == 5 && summary.fetch("totalTestCount") == 5
            abort "Adapter isolation cannot skip or fail" unless summary.fetch("skippedTests") == 0 && summary.fetch("failedTests") == 0
          ' .reports/ffi-test-isolation/summary.json
      - name: Retain focused adapter isolation evidence
        if: always() && matrix.arch == 'arm64' && inputs.macos_only != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ffi-test-isolation
          path: .reports/ffi-test-isolation
          if-no-files-found: warn
          retention-days: 14
      - name: Capture sanitized existing test build metadata without execution
        if: always()
        env:
          INVENTORY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INVENTORY_EVENT_SHA: ${{ github.sha }}
          INVENTORY_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          export INVENTORY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export INVENTORY_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          if state=$(git status --porcelain --untracked-files=normal 2>/dev/null); then
            if [ -z "$state" ]; then
              export INVENTORY_WORKTREE_STATE=clean
            else
              export INVENTORY_WORKTREE_STATE=dirty
            fi
          else
            export INVENTORY_WORKTREE_STATE=unknown
          fi
          unset state
          mise exec -- ruby scripts/capture_native_test_metadata.rb \
            --products ios/EpubToMp3/.build/faber-ci/Build/Products \
            --output .reports/tts-preferences/test-metadata \
            --xcode-version-file "$RUNNER_TEMP/faber-xcode-version.txt"
      - name: Remove explicitly downloaded native test weights
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/faber-models/pt_BR-faber-medium.onnx" "$RUNNER_TEMP/faber-models/pt_BR-faber-medium.onnx.json"
      - name: Retain macOS XCTest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.macos_only == true && 'apple-app-gate' || 'faber-macos-prefs' }}-${{ matrix.arch }}
          path: .reports/tts-preferences
          if-no-files-found: warn
          retention-days: 14

  rails-browser-runtime:
    if: ${{ inputs.macos_only != true && inputs.browser_runtime != false && !(github.event_name == 'workflow_dispatch' && inputs.intel_only == true) }}
    uses: ./.github/workflows/rails-real-model.yml
