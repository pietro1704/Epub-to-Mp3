name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # A cancelled CodeQL run uploads an unsuccessful SARIF and leaves a
  # configuration error in code scanning. Queue newer pushes instead.
  cancel-in-progress: false

jobs:
  static-analysis:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  java-kotlin:
    name: CodeQL · java-kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Report Kotlin coverage scope
        run: |
          printf 'Kotlin source files compiled by the Android app target: '
          find flutter_app/android/app/src -type f -name '*.kt' | wc -l

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up native build tools
        uses: jdx/mise-action@v5
        env:
          MISE_ENABLE_TOOLS: ruby,ninja
        with:
          experimental: true

      - name: Install native Android prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config
          sdk_manager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Android app
        env:
          MISE_ENABLE_TOOLS: ruby,ninja
          MISE_EXPERIMENTAL: "1"
        run: mise run flutter:build-apk-debug

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  swift:
    name: CodeQL · swift (${{ matrix.coverage }} · ${{ matrix.platform }})
    runs-on: macos-latest
    env:
      # Nested mise exec calls in Xcode build phases must not install XcodeGen.
      # The project generator is installed separately through Homebrew below.
      MISE_ENABLE_TOOLS: python,rust,ruby
    # The observed 40-minute cap canceled successful Swift extraction during
    # TRAP finalization. Keep real builds and analysis within a bounded budget.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Bound the expanded Apple matrix instead of requesting seven Mac runners
      # at once while other native verification jobs are queued.
      max-parallel: 2
      matrix:
        include:
          # The production macOS build reaches every shared source that is
          # conditionally compiled for AppKit.
          - coverage: app
            platform: macOS
            destination: generic/platform=macOS
            derived_data: .build-codeql-macos
            scheme: EpubToMp3
            action: build
          # Preserve the historical category identities with real target builds.
          - coverage: unit-tests
            platform: macOS
            destination: platform=macOS
            derived_data: .build-codeql-macos-tests
            scheme: EpubToMp3-UnitTests
            action: build-for-testing
          # The iOS app dependency graph includes ShareExtension and Widget.
          # Device compilation traces UIKit-only code without booting Simulator.
          - coverage: unit-tests
            platform: iOS
            destination: generic/platform=iOS
            derived_data: .build-codeql-ios-tests
            scheme: EpubToMp3-UnitTests
            action: build-for-testing
          - coverage: ui-tests
            platform: iOS
            destination: generic/platform=iOS
            derived_data: .build-codeql-ios-ui-tests
            scheme: EpubToMp3-UITests
            action: build-for-testing
          # Historical app-only identities are backed by their original real
          # build scopes, not aliases of a different platform's SARIF.
          - coverage: legacy-app
            platform: macOS
            destination: generic/platform=macOS
            derived_data: .build-codeql-macos
            scheme: EpubToMp3
            action: build
            legacy_category: /language:swift/platform:macOS
            legacy_matrix: '{"derived_data":".build-codeql-macos","destination":"generic/platform=macOS","platform":"macOS"}'
          - coverage: legacy-app
            platform: iOS
            destination: generic/platform=iOS
            derived_data: .build-codeql-ios
            scheme: EpubToMp3
            action: build
            legacy_category: /language:swift/platform:iOS
            legacy_matrix: '{"derived_data":".build-codeql-ios","destination":"generic/platform=iOS","platform":"iOS"}'
          # The generic identity originally traced both builds into one DB.
          - coverage: legacy-combined-app
            platform: macOS+iOS
            destination: generic/platform=macOS
            derived_data: .build-codeql-legacy-combined
            scheme: EpubToMp3
            action: build
            legacy_category: /language:swift
            legacy_matrix: '{}'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Verify nested Apple toolchain scope
        working-directory: ios/EpubToMp3
        run: |
          set -o pipefail
          mise ls --current --json | mise exec -- python -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python", "rust", "ruby"}:
              sys.exit(f"Unexpected Swift CodeQL tools: {sorted(tools)}")
          print("Swift CodeQL nested tools: python, rust, ruby")
          '

      - name: Install XcodeGen
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: arch -arm64 brew install xcodegen

      - name: Test Swift build architecture and failure propagation
        run: mise exec -- ruby scripts/test_codeql_swift_build.rb

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          matrix: ${{ matrix.legacy_matrix || toJson(matrix) }}

      - name: Install Rust iOS target
        if: matrix.platform != 'macOS'
        run: mise exec -- rustup target add aarch64-apple-ios

      - name: Build actual embedded Rust library
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          if [[ '${{ matrix.platform }}' != 'macOS' ]]; then
            mise run converter-ffi:ios-device
            mise run converter-ffi:ios-device:verify
          fi
          if [[ '${{ matrix.platform }}' != 'iOS' ]]; then
            mise run converter-ffi:build
          fi

      - name: Generate Xcode project after native prerequisites exist
        working-directory: ios/EpubToMp3
        run: xcodegen generate

      - name: Build Rust macOS sidecar
        if: matrix.platform != 'iOS'
        run: mise run sidecar:build

      - name: Report Swift coverage scope
        working-directory: ios/EpubToMp3
        run: |
          printf 'Production Swift files: '
          find EpubToMp3 EpubToMp3ShareExtension EpubToMp3Widget -type f -name '*.swift' | wc -l
          printf 'Unit-test Swift files: '
          find EpubToMp3Tests -type f -name '*.swift' | wc -l
          printf 'UI-test Swift files: '
          find EpubToMp3UITests -type f -name '*.swift' | wc -l

      - name: Build Swift target
        working-directory: ios/EpubToMp3
        run: |
          destinations=('${{ matrix.destination }}')
          if [[ '${{ matrix.platform }}' == 'macOS+iOS' ]]; then
            destinations=('generic/platform=macOS' 'generic/platform=iOS')
          fi
          for destination in "${destinations[@]}"; do
            derived_data='${{ matrix.derived_data }}'
            if [[ '${{ matrix.platform }}' == 'macOS+iOS' ]]; then
              derived_data="${derived_data}-${destination##*=}"
            fi
            bash ../../scripts/codeql_swift_build.sh \
              "$destination" '${{ matrix.scheme }}' "$derived_data" '${{ matrix.action }}'
          done

      - name: Analyze
        id: swift-analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ matrix.legacy_category || format('/language:swift/coverage:{0}/platform:{1}', matrix.coverage, matrix.platform) }}
          matrix: ${{ matrix.legacy_matrix || toJson(matrix) }}
          upload: ${{ matrix.legacy_category && 'failure-only' || 'always' }}

      - name: Upload actual historical-scope analysis with its original identity
        if: matrix.legacy_category
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.swift-analysis.outputs.sarif-output }}
          category: ${{ matrix.legacy_category }}
          matrix: ${{ matrix.legacy_matrix }}

  ios-bundling-signing-contracts:
    name: iOS build-only dylib signing contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install
      - name: Exercise signing policy with owned artifact and signing fixtures
        run: |
          set -o pipefail
          mkdir -p .reports/ios-bundle-signing
          mise exec -- ruby scripts/test_ios_bundle_signing.rb | tee .reports/ios-bundle-signing/contracts.log
      - name: Exercise Swift build architecture and failure propagation
        run: |
          set -o pipefail
          mise exec -- ruby scripts/test_codeql_swift_build.rb | tee .reports/ios-bundle-signing/swift-build.log
      - name: Retain signing contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-only-signing-contracts
          path: .reports/ios-bundle-signing
          if-no-files-found: warn
