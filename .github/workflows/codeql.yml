name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  static-analysis:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  java-kotlin:
    name: CodeQL · java-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Bootstrap Android Python sources
        run: bash flutter_app/scripts/bootstrap-android-python.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Build Android app
        working-directory: flutter_app
        env:
          PYTHON_EXE: ${{ env.pythonLocation }}/bin/python3.13
        run: |
          flutter pub get
          flutter build apk --debug -Pchaquopy.buildPython="${PYTHON_EXE}"

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

  swift:
    name: CodeQL · swift
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bootstrap embedded Python runtime
        run: bash ios/EpubToMp3/scripts/bootstrap-ios-python.sh

      - name: Generate Xcode project
        working-directory: ios/EpubToMp3
        run: xcodegen generate

      - name: Build macOS and iOS Swift targets
        working-directory: ios/EpubToMp3
        run: |
          xcodebuild \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3 \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            -derivedDataPath .build-codeql \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild \
            -project EpubToMp3.xcodeproj \
            -scheme EpubToMp3 \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath .build-codeql-ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
