name: CodeQL

on:
  workflow_call:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # A cancelled CodeQL run uploads an unsuccessful SARIF and leaves a
  # configuration error in code scanning. Queue newer pushes instead.
  cancel-in-progress: false

jobs:
  static-analysis:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  java-kotlin:
    name: CodeQL · java-kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        id: android-java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Report Kotlin coverage scope
        run: |
          printf 'Kotlin source files compiled by the Android app target: '
          find flutter_app/android/app/src -type f -name '*.kt' | wc -l

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android

      - name: Set up native build tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        env:
          MISE_ENABLE_TOOLS: ruby,ninja,flutter
        with:
          experimental: true

      - name: Identify Flutter SDK version
        id: android-flutter
        env:
          MISE_ENABLE_TOOLS: flutter
        run: |
          set -o pipefail
          version="$(mise ls --current --json | jq -er '.flutter[0].version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Reuse Android CI downloads across Java 21 patches. Keep the traced build clean.
      - name: Restore Gradle dependency downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.android-flutter.outputs.version }}-java-${{ steps.android-java.outputs.version }}-${{ hashFiles('flutter_app/android/**/*.gradle.kts', 'flutter_app/android/gradle.properties', 'flutter_app/android/gradle/wrapper/gradle-wrapper.properties', 'flutter_app/pubspec.lock') }}
          restore-keys: android-jvm-downloads-${{ runner.os }}-${{ runner.arch }}-flutter-${{ steps.android-flutter.outputs.version }}-

      - name: Install native Android prerequisites
        timeout-minutes: 12
        run: |
          bash scripts/ci_apt_install.sh --install-recommends clang libclang-dev cmake pkg-config
          sdk_manager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Android app
        env:
          MISE_ENABLE_TOOLS: ruby,ninja,flutter
          MISE_EXPERIMENTAL: "1"
        run: mise exec -- ruby scripts/codeql_android_build.rb -- mise run flutter:build-apk-debug

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:java-kotlin

  swift:
    name: CodeQL · swift (${{ matrix.coverage }} · ${{ matrix.platform }})
    # Xcode 16.4 is available on macOS 15; newer images may omit it.
    runs-on: macos-15
    env:
      # Nested mise exec calls in Xcode build phases must not install XcodeGen.
      # The project generator is installed separately through Homebrew below.
      MISE_ENABLE_TOOLS: rust,ruby
    # The observed 40-minute cap canceled successful Swift extraction during
    # TRAP finalization. Keep real builds and analysis within a bounded budget.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Analyze shipping platform graphs. Runtime tests remain in their own jobs.
      max-parallel: 2
      matrix:
        include:
          - coverage: app
            platform: macOS
            destination: generic/platform=macOS
            derived_data: .build-codeql-macos
            scheme: EpubToMp3
            action: build
          - coverage: app
            platform: iOS
            destination: generic/platform=iOS
            derived_data: .build-codeql-ios
            scheme: EpubToMp3
            action: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Verify nested Apple toolchain scope
        working-directory: ios/EpubToMp3
        run: |
          set -o pipefail
          tools="$(mise ls --current --json | jq -c 'keys')"
          if [ "$tools" != '["ruby","rust"]' ]; then
            echo "Unexpected Swift CodeQL tools: $tools" >&2
            exit 1
          fi
          echo "Swift CodeQL nested tools: ruby, rust"

      - name: Install XcodeGen
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: arch -arm64 brew install xcodegen

      - name: Test Swift build architecture and failure propagation
        run: mise exec -- ruby scripts/test_codeql_swift_build.rb

      - name: Install Rust iOS target
        if: matrix.platform != 'macOS'
        run: mise exec -- rustup target add aarch64-apple-ios

      - name: Identify compatible Apple dependency artifacts
        id: apple-cache
        shell: bash
        run: |
          set -euo pipefail
          identity=$({
            mise exec -- rustc -vV
            mise exec -- xcodebuild -version
            mise exec -- xcrun --sdk macosx --show-sdk-path
            mise exec -- xcrun --sdk iphoneos --show-sdk-path
            printf '%s\n' "${RUSTFLAGS:-}" "${CARGO_ENCODED_RUSTFLAGS:-}" "${RUSTC_WRAPPER:-}"
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # GitHub scopes PR-written caches to their merge ref. No test results,
      # app objects or CodeQL databases are restored; this HEAD is still built.
      - name: Reuse compatible Rust dependencies across Apple jobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apple-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-cache.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'mise.toml', 'scripts/apple_target_clang.sh', 'native/vendor/espeak-rs-sys/espeak-ng/cmake/**', 'native/vendor/espeak-rs-sys/espeak-ng/src/sonic/**') }}-${{ matrix.platform }}
          restore-keys: |
            apple-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-cache.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'mise.toml', 'scripts/apple_target_clang.sh', 'native/vendor/espeak-rs-sys/espeak-ng/cmake/**', 'native/vendor/espeak-rs-sys/espeak-ng/src/sonic/**') }}-

      # The embedded Rust library and the Xcode project are built before the
      # tracer starts: only the Swift target needs extraction, and an untraced
      # Rust build can use the hosted-runner job limit from native_job.rb.
      - name: Build actual embedded Rust library
        run: |
          if [[ '${{ matrix.platform }}' != 'macOS' ]]; then
            mise run converter-ffi:ios-device
            mise run converter-ffi:ios-device:verify
          fi
          if [[ '${{ matrix.platform }}' != 'iOS' ]]; then
            mise run converter-ffi:build
          fi

      - name: Generate Xcode project after native prerequisites exist
        working-directory: ios/EpubToMp3
        run: xcodegen generate

      - name: Report Swift coverage scope
        working-directory: ios/EpubToMp3
        run: |
          printf 'Production Swift files: '
          find EpubToMp3 EpubToMp3ShareExtension EpubToMp3Widget -type f -name '*.swift' | wc -l

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: swift
          build-mode: manual
          matrix: ${{ toJson(matrix) }}

      - name: Build Swift target
        working-directory: ios/EpubToMp3
        env:
          # Hosted macOS runners have 3 cores; extraction stays bounded by the
          # job timeout and this value is the only knob if it regresses.
          CODEQL_SWIFT_BUILD_JOBS: '3'
        run: |
          bash ../../scripts/codeql_swift_build.sh \
            '${{ matrix.destination }}' '${{ matrix.scheme }}' \
            '${{ matrix.derived_data }}' '${{ matrix.action }}'

      - name: Analyze
        id: swift-analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: ${{ format('/language:swift/coverage:{0}/platform:{1}', matrix.coverage, matrix.platform) }}
          matrix: ${{ toJson(matrix) }}

  ios-bundling-signing-contracts:
    name: iOS build-only dylib signing contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false
      - run: mise install
      - name: Exercise signing policy with owned artifact and signing fixtures
        run: |
          set -o pipefail
          mkdir -p .reports/ios-bundle-signing
          mise exec -- ruby scripts/test_ios_bundle_signing.rb | tee .reports/ios-bundle-signing/contracts.log
      - name: Exercise Swift build architecture and failure propagation
        run: |
          set -o pipefail
          mise exec -- ruby scripts/test_codeql_swift_build.rb | tee .reports/ios-bundle-signing/swift-build.log
      - name: Retain signing contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-only-signing-contracts
          path: .reports/ios-bundle-signing
          if-no-files-found: warn
          retention-days: 14
