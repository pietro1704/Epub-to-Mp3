name: CodeQL

on:
  workflow_call:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  # A cancelled CodeQL run uploads an unsuccessful SARIF and leaves a
  # configuration error in code scanning. Queue newer pushes instead.
  cancel-in-progress: false

jobs:
  static-analysis:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}

  java-kotlin:
    name: CodeQL · java-kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Report Kotlin coverage scope
        run: |
          printf 'Kotlin source files compiled by the Android app target: '
          find flutter_app/android/app/src -type f -name '*.kt' | wc -l

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - name: Set up native build tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        env:
          MISE_ENABLE_TOOLS: ruby,ninja,flutter
        with:
          experimental: true

      - name: Install native Android prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config
          sdk_manager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build Android app
        env:
          MISE_ENABLE_TOOLS: ruby,ninja,flutter
          MISE_EXPERIMENTAL: "1"
        run: mise run flutter:build-apk-debug

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:java-kotlin

  swift:
    name: CodeQL · swift (${{ matrix.coverage }} · ${{ matrix.platform }})
    # Xcode 16.4 is available on macOS 15; newer images may omit it.
    runs-on: macos-15
    env:
      # Nested mise exec calls in Xcode build phases must not install XcodeGen.
      # The project generator is installed separately through Homebrew below.
      MISE_ENABLE_TOOLS: python,rust,ruby
    # The observed 40-minute cap canceled successful Swift extraction during
    # TRAP finalization. Keep real builds and analysis within a bounded budget.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Analyze shipping platform graphs. Runtime tests remain in their own jobs.
      max-parallel: 2
      matrix:
        include:
          - coverage: app
            platform: macOS
            destination: generic/platform=macOS
            derived_data: .build-codeql-macos
            scheme: EpubToMp3
            action: build
          - coverage: app
            platform: iOS
            destination: generic/platform=iOS
            derived_data: .build-codeql-ios
            scheme: EpubToMp3
            action: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false

      - name: Install toolchain
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Verify nested Apple toolchain scope
        working-directory: ios/EpubToMp3
        run: |
          set -o pipefail
          mise ls --current --json | mise exec -- python -c '
          import json, sys
          tools = set(json.load(sys.stdin))
          if tools != {"python", "rust", "ruby"}:
              sys.exit(f"Unexpected Swift CodeQL tools: {sorted(tools)}")
          print("Swift CodeQL nested tools: python, rust, ruby")
          '

      - name: Install XcodeGen
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: arch -arm64 brew install xcodegen

      - name: Test Swift build architecture and failure propagation
        run: mise exec -- ruby scripts/test_codeql_swift_build.rb

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: swift
          build-mode: manual
          matrix: ${{ toJson(matrix) }}

      - name: Install Rust iOS target
        if: matrix.platform != 'macOS'
        run: mise exec -- rustup target add aarch64-apple-ios

      - name: Identify compatible Apple dependency artifacts
        id: apple-cache
        shell: bash
        run: |
          set -euo pipefail
          identity=$({
            mise exec -- rustc -vV
            mise exec -- xcodebuild -version
            mise exec -- xcrun --sdk macosx --show-sdk-path
            mise exec -- xcrun --sdk iphoneos --show-sdk-path
            printf '%s\n' "${RUSTFLAGS:-}" "${CARGO_ENCODED_RUSTFLAGS:-}" "${RUSTC_WRAPPER:-}"
          } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # GitHub scopes PR-written caches to their merge ref. No test results,
      # app objects or CodeQL databases are restored; this HEAD is still built.
      - name: Reuse compatible Rust dependencies across Apple jobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: apple-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-cache.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'mise.toml', 'scripts/apple_target_clang.sh') }}-${{ hashFiles('crates/**/*.rs', 'native/**/*.rs') }}-${{ matrix.platform }}
          restore-keys: |
            apple-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-cache.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'mise.toml', 'scripts/apple_target_clang.sh') }}-${{ hashFiles('crates/**/*.rs', 'native/**/*.rs') }}-
            apple-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.apple-cache.outputs.identity }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'mise.toml', 'scripts/apple_target_clang.sh') }}-

      - name: Build actual embedded Rust library
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          if [[ '${{ matrix.platform }}' != 'macOS' ]]; then
            mise run converter-ffi:ios-device
            mise run converter-ffi:ios-device:verify
          fi
          if [[ '${{ matrix.platform }}' != 'iOS' ]]; then
            mise run converter-ffi:build
          fi

      - name: Generate Xcode project after native prerequisites exist
        working-directory: ios/EpubToMp3
        run: xcodegen generate

      - name: Report Swift coverage scope
        working-directory: ios/EpubToMp3
        run: |
          printf 'Production Swift files: '
          find EpubToMp3 EpubToMp3ShareExtension EpubToMp3Widget -type f -name '*.swift' | wc -l

      - name: Build Swift target
        working-directory: ios/EpubToMp3
        run: |
          bash ../../scripts/codeql_swift_build.sh \
            '${{ matrix.destination }}' '${{ matrix.scheme }}' \
            '${{ matrix.derived_data }}' '${{ matrix.action }}'

      - name: Analyze
        id: swift-analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: ${{ format('/language:swift/coverage:{0}/platform:{1}', matrix.coverage, matrix.platform) }}
          matrix: ${{ toJson(matrix) }}

  ios-bundling-signing-contracts:
    name: iOS build-only dylib signing contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install
      - name: Exercise signing policy with owned artifact and signing fixtures
        run: |
          set -o pipefail
          mkdir -p .reports/ios-bundle-signing
          mise exec -- ruby scripts/test_ios_bundle_signing.rb | tee .reports/ios-bundle-signing/contracts.log
      - name: Exercise Swift build architecture and failure propagation
        run: |
          set -o pipefail
          mise exec -- ruby scripts/test_codeql_swift_build.rb | tee .reports/ios-bundle-signing/swift-build.log
      - name: Retain signing contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-build-only-signing-contracts
          path: .reports/ios-bundle-signing
          if-no-files-found: warn
