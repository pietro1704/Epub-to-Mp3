name: PR repair safety regressions
on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/pr-repair-*.cjs'
      - '.github/workflows/pr-autofix*.yml'
      - '.github/workflows/pr-repair-safety-regression.yml'
  pull_request:
    paths:
      - '.github/scripts/pr-repair-*.cjs'
      - '.github/workflows/pr-autofix*.yml'
      - '.github/workflows/pr-repair-safety-regression.yml'
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: node,ruby
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install managed host test tools
        run: mise install node ruby
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - name: Verify repair confinement with real Git and fake API
        run: mise exec -- node --test .github/scripts/pr-repair-safety.test.cjs
