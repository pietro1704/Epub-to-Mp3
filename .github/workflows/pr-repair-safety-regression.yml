name: PR repair safety regressions
on:
  push:
    branches: ['feature/pr-repair-safety', master]
    paths: ['.github/scripts/pr-repair-*.cjs', '.github/workflows/pr-autofix*.yml', '.github/workflows/pr-repair-safety-regression.yml']
  pull_request:
    paths: ['.github/scripts/pr-repair-*.cjs', '.github/workflows/pr-autofix*.yml', '.github/workflows/pr-repair-safety-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install ruby
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- node --test .github/scripts/pr-repair-safety.test.cjs
