name: Feature A/B cache contracts

on:
  pull_request:
    paths:
      - 'scripts/benchmark_feature_ab.py'
      - 'python_app/tests/test_feature_ab_cache_isolation.py'
      - '.github/workflows/feature-ab-cache-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENABLE_TOOLS: python

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install only project-pinned Python
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install
      - name: Exercise existing orchestration with fake CLI children and owned caches
        run: mise exec -- python python_app/tests/test_feature_ab_cache_isolation.py -v
