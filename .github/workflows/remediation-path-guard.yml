name: Remediation publication path contracts

on:
  push:
    branches: [master, feature/remediation-path-guard]
    paths:
      - 'scripts/guard_remediation_changes.py'
      - 'scripts/test_guard_remediation_changes.py'
      - '.github/workflows/*remediation*.yml'
  pull_request:
    paths:
      - 'scripts/guard_remediation_changes.py'
      - 'scripts/test_guard_remediation_changes.py'
      - '.github/workflows/*remediation*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-paths:
    name: Git publication path and trusted guard regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Exercise actual workflow guard with owned Git fixtures
        run: /usr/bin/python3 -I scripts/test_guard_remediation_changes.py -v
