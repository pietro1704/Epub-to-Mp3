name: Sync to Hugging Face Space

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Dispatched by Post-merge validation once its publication job succeeded
  # ("Publication surfaces validated"; unrelated platform failures do not block it),
  # or run manually (see post-merge-validation.yml).
  workflow_dispatch:
    inputs:
      validation_run:
        description: "Post-merge validation run that dispatched this one; wait for it to complete first"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sync-hf
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Wait for the dispatching validation to complete
        if: inputs.validation_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: node "scripts/wait_for_validation.mjs" --repo "$GITHUB_REPOSITORY" --run "$VALIDATION_RUN"
      - name: Require validated current merge
        id: validated
        env:
          SKIP_SUPERSEDED: ${{ inputs.validation_run != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.sha }}
        run: node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --latest --required-job "Publication surfaces validated"

  sync:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: publication-policy
          persist-credentials: false
      - name: Snapshot trusted publication helper
        run: cp publication-policy/scripts/validated_merge.mjs "$RUNNER_TEMP/validated_merge.mjs"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Avoid LFS fetch (budget exceeded)
          lfs: false
          persist-credentials: false
          # The job only syncs the exact trusted revision after successful post-merge validation.
          ref: ${{ needs.gate.outputs.sha }}

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        env:
          MISE_ENABLE_TOOLS: ruby
        with:
          version: 2026.11.3
          cache: false
          install: false

      - name: Install managed Ruby
        env:
          MISE_ENABLE_TOOLS: ruby
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install ruby

      - name: Build HF-only repo snapshot with local LFS
        env:
          MISE_ENABLE_TOOLS: ruby
        run: |
          set -euo pipefail
          HF_SYNC_DIR="$(mktemp -d "$RUNNER_TEMP/hf-snapshot.XXXXXX")"
          echo "HF_SYNC_DIR=$HF_SYNC_DIR" >> "$GITHUB_ENV"
          mise run hf:snapshot -- "$GITHUB_WORKSPACE" "$HF_SYNC_DIR"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret not configured; cannot push."
            exit 1
          fi

          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          cat > "$auth_dir/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' user ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$auth_dir/askpass"
          export GIT_ASKPASS="$auth_dir/askpass" GIT_TERMINAL_PROMPT=0
          node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$VALIDATED_SHA" --latest --required-job "Publication surfaces validated"
          bash scripts/hf_push.sh "$HF_SYNC_DIR" https://huggingface.co/spaces/pi1704/epub-to-mp3

      - name: Remove owned snapshot
        if: always()
        run: |
          if [[ -n "${HF_SYNC_DIR:-}" && "$HF_SYNC_DIR" == "$RUNNER_TEMP/"* ]]; then
            rm -rf -- "$HF_SYNC_DIR"
          fi

      - name: Wait for HF Space rebuild
        run: sleep 30

      - name: Health check HF Space
        id: healthcheck
        run: |
          set -euo pipefail
          MAX_RETRIES=20
          RETRY_DELAY=15
          URL="https://pi1704-epub-to-mp3.hf.space/api/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/hf_health.json -w "%{http_code}" "$URL" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "HF Space is healthy"
              cat /tmp/hf_health.json
              exit 0
            fi
            echo "Got HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          echo "::error::HF Space health check failed after $MAX_RETRIES attempts"
          exit 1
