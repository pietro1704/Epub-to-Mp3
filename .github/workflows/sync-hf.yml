name: Sync to Hugging Face Space

on:
  # Auto-sync after CI completes
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  # Manual trigger to avoid skipped runs
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Run automatically on successful CI for master, or manually via dispatch
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://huggingface.co/spaces/pi1704/epub-to-mp3 || true
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN não configurado; abortando push para evitar falha"
            exit 1
          fi
          TARGET_BRANCH="master"
          git push --force https://user:$HF_TOKEN@huggingface.co/spaces/pi1704/epub-to-mp3 "HEAD:refs/heads/${TARGET_BRANCH}"
          # Clean up old default branch on HF Space if it exists
          git push https://user:$HF_TOKEN@huggingface.co/spaces/pi1704/epub-to-mp3 --delete main || true
