name: Sync to Hugging Face Space

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Auto-sync only after post-merge validation succeeds on master
  workflow_run:
    workflows: ["Post-merge validation"]
    types: [completed]
  # Manual trigger only if needed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: sync-hf
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.validated.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false
      - name: Require validated current merge
        id: validated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/validated_merge.mjs --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" --latest

  sync:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted publication policy
        uses: actions/checkout@v7
        with:
          ref: master
          path: publication-policy
          persist-credentials: false
      - name: Snapshot trusted publication helper
        run: cp publication-policy/scripts/validated_merge.mjs "$RUNNER_TEMP/validated_merge.mjs"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Avoid LFS fetch (budget exceeded)
          lfs: false
          persist-credentials: false
          # The job only syncs the exact trusted revision after successful post-merge validation.
          ref: ${{ needs.gate.outputs.sha }}

      - uses: jdx/mise-action@v5
        env:
          MISE_ENABLE_TOOLS: ruby
        with:
          version: 2026.9.14
          install: false

      - name: Install managed Ruby
        env:
          MISE_ENABLE_TOOLS: ruby
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install ruby

      - name: Build HF-only repo snapshot with local LFS
        env:
          MISE_ENABLE_TOOLS: ruby
        run: |
          set -euo pipefail
          HF_SYNC_DIR="$(mktemp -d "$RUNNER_TEMP/hf-snapshot.XXXXXX")"
          echo "HF_SYNC_DIR=$HF_SYNC_DIR" >> "$GITHUB_ENV"
          mise run hf:snapshot -- "$GITHUB_WORKSPACE" "$HF_SYNC_DIR"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret not configured; cannot push."
            exit 1
          fi

          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          cat > "$auth_dir/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' user ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$auth_dir/askpass"
          export GIT_ASKPASS="$auth_dir/askpass" GIT_TERMINAL_PROMPT=0
          node "$RUNNER_TEMP/validated_merge.mjs" --repo "$GITHUB_REPOSITORY" --ref "$VALIDATED_SHA" --latest
          bash scripts/hf_push.sh "$HF_SYNC_DIR" https://huggingface.co/spaces/pi1704/epub-to-mp3

      - name: Remove owned snapshot
        if: always()
        run: |
          if [[ -n "${HF_SYNC_DIR:-}" && "$HF_SYNC_DIR" == "$RUNNER_TEMP/"* ]]; then
            rm -rf -- "$HF_SYNC_DIR"
          fi

      - name: Wait for HF Space rebuild
        run: sleep 30

      - name: Health check HF Space
        id: healthcheck
        run: |
          set -euo pipefail
          MAX_RETRIES=20
          RETRY_DELAY=15
          URL="https://pi1704-epub-to-mp3.hf.space/api/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/hf_health.json -w "%{http_code}" "$URL" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "HF Space is healthy"
              cat /tmp/hf_health.json
              exit 0
            fi
            echo "Got HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          echo "::error::HF Space health check failed after $MAX_RETRIES attempts"
          exit 1
