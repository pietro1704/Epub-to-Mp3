name: Sync to Hugging Face Space

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Auto-sync only after CI succeeds on master
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Manual trigger only if needed
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Run automatically on successful CI for master; allow manual override
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Avoid LFS fetch (budget exceeded)
          lfs: false
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Build HF-only repo snapshot
        run: |
          set -euo pipefail
          HF_SYNC_DIR="$(mktemp -d)"
          echo "HF_SYNC_DIR=$HF_SYNC_DIR" >> "$GITHUB_ENV"
          rsync -a --delete ./ "$HF_SYNC_DIR/" \
            --exclude ".git" \
            --exclude "pretrained_models" \
            --exclude "voice_samples" \
            --exclude "output" \
            --exclude "node_modules" \
            --exclude "web/node_modules" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            --exclude ".mypy_cache" \
            --exclude ".ruff_cache" \
            --exclude ".cache" \
            --exclude "desktop"
          cd "$HF_SYNC_DIR"
          git init
          git config user.name "hf-sync-bot"
          git config user.email "hf-sync-bot@users.noreply.github.com"
          git add -A
          git commit -m "HF snapshot"

      - name: Push to Hugging Face (prefer SSH, fallback token)
        env:
          HF_SSH_PRIVATE_KEY: ${{ secrets.HF_SSH_PRIVATE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          TARGET_BRANCH="master"
          cd "$HF_SYNC_DIR"

          if [ -n "${HF_SSH_PRIVATE_KEY:-}" ]; then
            mkdir -p ~/.ssh
            echo "$HF_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_rsa
            ssh-keyscan hf.co >> ~/.ssh/known_hosts
            REMOTE_URL="git@hf.co:spaces/pi1704/epub-to-mp3"
          else
            if [ -z "${HF_TOKEN:-}" ]; then
              echo "Nem HF_SSH_PRIVATE_KEY nem HF_TOKEN configurados; abortando push."
              exit 1
            fi
            # Avoid leaking token in logs by configuring insteadOf
            git config --global url."https://user:${HF_TOKEN}@huggingface.co/".insteadOf "https://huggingface.co/"
            REMOTE_URL="https://huggingface.co/spaces/pi1704/epub-to-mp3"
          fi

          git remote add hf "$REMOTE_URL" || true
          git push --force hf "HEAD:refs/heads/${TARGET_BRANCH}"
          # Also update main for backward compatibility
          git push --force hf "HEAD:refs/heads/main"

      - name: Wait for HF Space rebuild
        run: sleep 90

      - name: Health check HF Space
        id: healthcheck
        continue-on-error: true
        run: |
          set -euo pipefail
          MAX_RETRIES=10
          RETRY_DELAY=30
          URL="https://pi1704-epub-to-mp3.hf.space/api/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/hf_health.json -w "%{http_code}" "$URL" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "HF Space is healthy"
              cat /tmp/hf_health.json
              VERSION=$(python3 -c "import json; print(json.load(open('/tmp/hf_health.json')).get('version', 'unknown'))" 2>/dev/null || echo "unknown")
              echo "Deployed version: $VERSION"
              exit 0
            fi
            echo "Got HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          echo "::error::HF Space health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Close deploy-failure issues on success
        if: steps.healthcheck.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
              per_page: 10,
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Resolved — deploy health check passed.\n\nCommit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }

      - name: Notify on health check failure
        if: steps.healthcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'HF Space deploy health check failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
              per_page: 5,
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `HF Space failed health check after deploy.\n\nCommit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nConsider running the **Rollback HF Space** workflow.`,
              labels: ['deploy-failure'],
            });
