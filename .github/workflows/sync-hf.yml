name: Sync to Hugging Face Space

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Auto-sync only after CI succeeds on master
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Manual trigger only if needed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-hf
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      should_sync: ${{ steps.paths.outputs.should_sync }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          lfs: false
          persist-credentials: false
          # Check out the exact successful CI revision, not whichever commit
          # happens to be current on master when this workflow starts.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Detect Space-relevant changes
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # A successful CI workflow_run is already the trust boundary.
            # Do not re-derive changed paths from a shallow checkout.
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=$(git rev-parse HEAD^)
          changed=$(git diff --name-only "$base" HEAD)
          if grep -Eq '^(crates/|Cargo\.toml$|Cargo\.lock$|web/|Dockerfile$|\.github/workflows/sync-hf\.yml$)' <<< "$changed"; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: changes
    runs-on: ubuntu-24.04
    # Run automatically on successful CI for master; allow manual override
    if: >
      ((github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.should_sync == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Avoid LFS fetch (budget exceeded)
          lfs: false
          persist-credentials: false
          # The job only syncs the exact trusted revision after successful CI.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: jdx/mise-action@v5
        env:
          MISE_ENABLE_TOOLS: ruby
        with:
          version: 2026.9.14
          install: false

      - name: Install managed Ruby
        env:
          MISE_ENABLE_TOOLS: ruby
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install ruby

      - name: Build HF-only repo snapshot with local LFS
        env:
          MISE_ENABLE_TOOLS: ruby
        run: |
          set -euo pipefail
          HF_SYNC_DIR="$(mktemp -d "$RUNNER_TEMP/hf-snapshot.XXXXXX")"
          echo "HF_SYNC_DIR=$HF_SYNC_DIR" >> "$GITHUB_ENV"
          mise run hf:snapshot -- "$GITHUB_WORKSPACE" "$HF_SYNC_DIR"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret not configured; cannot push."
            exit 1
          fi

          auth_dir="$(mktemp -d)"
          trap 'rm -rf "$auth_dir"' EXIT
          cat > "$auth_dir/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' user ;;
            *Password*) printf '%s\n' "$HF_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$auth_dir/askpass"
          export GIT_ASKPASS="$auth_dir/askpass" GIT_TERMINAL_PROMPT=0
          bash scripts/hf_push.sh "$HF_SYNC_DIR" https://huggingface.co/spaces/pi1704/epub-to-mp3

      - name: Remove owned snapshot
        if: always()
        run: |
          if [[ -n "${HF_SYNC_DIR:-}" && "$HF_SYNC_DIR" == "$RUNNER_TEMP/"* ]]; then
            rm -rf -- "$HF_SYNC_DIR"
          fi

      - name: Wait for HF Space rebuild
        run: sleep 30

      - name: Health check HF Space
        id: healthcheck
        run: |
          set -euo pipefail
          MAX_RETRIES=20
          RETRY_DELAY=15
          URL="https://pi1704-epub-to-mp3.hf.space/api/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/hf_health.json -w "%{http_code}" "$URL" --max-time 15 || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "HF Space is healthy"
              cat /tmp/hf_health.json
              exit 0
            fi
            echo "Got HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          echo "::error::HF Space health check failed after $MAX_RETRIES attempts"
          exit 1
