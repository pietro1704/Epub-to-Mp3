name: Sync to Hugging Face Space

on:
  # Auto-sync after CI completes
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  # Manual trigger to avoid skipped runs
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Run automatically on successful CI for master, or manually via dispatch
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configure SSH (preferred) or fallback to HTTPS
        env:
          HF_SSH_PRIVATE_KEY: ${{ secrets.HF_SSH_PRIVATE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          TARGET_BRANCH="master"
          if [ -n "$HF_SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$HF_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_rsa
            ssh-keyscan hf.co >> ~/.ssh/known_hosts
            git remote add hf git@hf.co:spaces/pi1704/epub-to-mp3 || true
            git push --force git@hf.co:spaces/pi1704/epub-to-mp3 "HEAD:refs/heads/${TARGET_BRANCH}"
            git push git@hf.co:spaces/pi1704/epub-to-mp3 --delete main || true
          else
            if [ -z "$HF_TOKEN" ]; then
              echo "Nem HF_SSH_PRIVATE_KEY nem HF_TOKEN configurados; abortando push."
              exit 1
            fi
            git remote add hf https://huggingface.co/spaces/pi1704/epub-to-mp3 || true
            git push --force https://user:$HF_TOKEN@huggingface.co/spaces/pi1704/epub-to-mp3 "HEAD:refs/heads/${TARGET_BRANCH}"
            git push https://user:$HF_TOKEN@huggingface.co/spaces/pi1704/epub-to-mp3 --delete main || true
