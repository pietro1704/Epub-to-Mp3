name: CHANGELOG drift contracts

on:
  pull_request:
    paths:
      - '.github/workflows/changelog-drift.yml'
      - '.github/workflows/changelog-drift-contracts.yml'
      - '.github/scripts/changelog-drift.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exercise the actual comparison Bash and read-only workflow boundaries
        run: node --test .github/scripts/changelog-drift.test.cjs
