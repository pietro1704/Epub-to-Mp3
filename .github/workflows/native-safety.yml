name: Native safety regressions

on:
  pull_request:
    paths:
      - '.github/workflows/native-safety.yml'
      - '.claude/hooks/**'
      - 'scripts/native_job.rb'
      - 'scripts/native_build_preflight.rb'
      - 'scripts/device-workflow.sh'
      - 'scripts/ios_simulator_smoke.swift'
      - 'scripts/test_native_*.rb'
      - 'mise.toml'
  push:
    branches: [master, feature/intel-gpu-quarantine]
    paths:
      - '.github/workflows/native-safety.yml'
      - '.claude/hooks/**'
      - 'scripts/native_job.rb'
      - 'scripts/native_build_preflight.rb'
      - 'scripts/device-workflow.sh'
      - 'scripts/ios_simulator_smoke.swift'
      - 'scripts/test_native_*.rb'
      - 'mise.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-safety:
    name: Native safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install host test library
        run: gem install minitest --version '~> 5.0' --no-document
      - name: Exercise supervisor, preflight and notification-only hooks
        run: |
          ruby scripts/test_native_build_preflight.rb
          ruby scripts/test_native_job.rb
          ruby scripts/test_native_hook_safety.rb
          ruby scripts/test_native_entrypoint_safety.rb
          ruby scripts/test_native_task_wiring.rb
      - name: Check shell and Ruby syntax
        run: |
          bash -n scripts/device-workflow.sh .claude/hooks/swift_test_after_edit.sh .claude/hooks/xcode_build_smoke.sh
          ruby -c scripts/native_job.rb
          ruby -c scripts/native_build_preflight.rb
      - name: Type-check the inherited-lease Swift adapter without launching it
        if: runner.os == 'macOS'
        run: xcrun swiftc -typecheck scripts/ios_simulator_smoke.swift
