name: HF workflow snapshot contracts

on:
  push:
    branches: ['feature/hf-workflow-lfs-regression', 'feature/hf-binary-sync']
    paths:
      - '.github/workflows/hf-workflow-lfs-contracts.yml'
      - '.github/workflows/sync-hf.yml'
      - 'scripts/hf_snapshot.rb'
      - 'scripts/test_hf_snapshot_workflow.rb'
      - 'mise.toml'
  pull_request:
    paths:
      - '.github/workflows/hf-workflow-lfs-contracts.yml'
      - '.github/workflows/sync-hf.yml'
      - 'scripts/hf_snapshot.rb'
      - 'scripts/test_hf_snapshot_workflow.rb'
      - 'mise.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-workflow-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-generation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_ENABLE_TOOLS: ruby
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - name: Install managed Ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise install ruby
      - name: Verify snapshot generation through the actual workflow command
        run: |
          git lfs version
          mise exec -- ruby scripts/test_hf_snapshot_workflow.rb
      - name: Verify snapshot transport and rejection regressions
        run: mise run hf:snapshot:test
