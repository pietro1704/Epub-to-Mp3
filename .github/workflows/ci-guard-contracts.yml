name: Compatibility guard contracts

on:
  pull_request:
    paths:
      - 'python_app/tests/test_guard_ios_simulator_resources.py'
      - 'python_app/tests/test_heavy_job_guard.py'
      - 'python_app/tests/test_select_ios_simulator.py'
      - 'scripts/guard_ios_simulator_resources.py'
      - 'scripts/heavy_job_guard.py'
      - 'scripts/select_ios_simulator.py'
      - '.github/workflows/ci-guard-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated host test dependency
        run: python -m pip install pytest
      - name: Exercise compatibility, child lease and selector identity contracts
        run: python -m pytest -q python_app/tests/test_guard_ios_simulator_resources.py python_app/tests/test_heavy_job_guard.py python_app/tests/test_select_ios_simulator.py
