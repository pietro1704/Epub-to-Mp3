name: Rust Dependency Audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.9.14
          install: false
      - name: Install Rust toolchain
        run: mise install
      - name: Reuse dependency audit compilation
        uses: ./.github/actions/rust-build-cache
        with:
          namespace: dependency-audit
      - name: Verify ZIP compatibility in the shared runtime
        run: mise exec -- cargo test --locked -p converter-core --lib epub::tests
      - name: Check optional Sherpa bindings without native downloads
        env:
          DOCS_RS: '1'
        run: mise exec -- cargo check --locked -p converter-core --features kokoro-sherpa-runtime
      - name: Verify locked dependency resolution
        run: mise exec -- cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Cache pinned auditor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-0.22.2
      - name: Install pinned auditor
        run: mise exec -- cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit exact checked-out lockfile
        id: audit
        run: |
          mkdir -p audit-report
          jq -n --arg commit "$(git rev-parse HEAD)" \
            --arg workflow_sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            '{commit: $commit, workflow_sha: $workflow_sha, run_id: $run_id}' \
            > audit-report/provenance.json
          mise exec -- cargo audit --json > audit-report/cargo-audit.json
      - name: Verify targeted rustls advisories are absent
        if: always() && steps.audit.outcome != 'skipped'
        run: |
          jq -e '
            (.vulnerabilities.list | type == "array") and
            ([.vulnerabilities.list[] | .advisory.id |
              select(. == "RUSTSEC-2026-0346" or . == "RUSTSEC-2026-0347" or
                     . == "RUSTSEC-2026-0348" or . == "RUSTSEC-2026-0349")]
             | length == 0)
          ' audit-report/cargo-audit.json
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-dependency-audit-${{ github.sha }}
          path: audit-report/
          if-no-files-found: error
          retention-days: 14
