name: Rust Dependency Audit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.3
          cache: false
          install: false
      - name: Install Rust toolchain
        run: mise install
      - name: Reuse dependency audit compilation
        uses: ./.github/actions/rust-build-cache
        with:
          namespace: dependency-audit
      - name: Verify ZIP compatibility in the shared runtime
        run: mise exec -- cargo test --locked -p converter-core --lib epub::tests
      - name: Check the shared runtime
        run: mise exec -- cargo check --locked -p converter-core
      - name: Verify locked dependency resolution
        run: mise exec -- cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      # The published static binary replaces a 5 minute source build of the auditor that was never
      # cached while the audit job failed. The digest is the release asset's sha256,
      # re-computed from the downloaded file.
      - name: Install checksum-pinned auditor
        run: |
          set -euo pipefail
          version=0.22.2
          asset="cargo-audit-x86_64-unknown-linux-musl-v$version.tgz"
          sha256=7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
          curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors --max-time 120 \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv$version/$asset" -o "$RUNNER_TEMP/$asset"
          printf '%s  %s\n' "$sha256" "$RUNNER_TEMP/$asset" | sha256sum --check --status
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$HOME/.cargo/bin" --strip-components=1 "${asset%.tgz}/cargo-audit"
          mise exec -- cargo audit --version
      - name: Audit exact checked-out lockfile
        id: audit
        run: |
          mkdir -p audit-report
          jq -n --arg commit "$(git rev-parse HEAD)" \
            --arg workflow_sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            '{commit: $commit, workflow_sha: $workflow_sha, run_id: $run_id}' \
            > audit-report/provenance.json
          mise exec -- cargo audit --json > audit-report/cargo-audit.json
      - name: Verify targeted rustls advisories are absent
        if: always() && steps.audit.outcome != 'skipped'
        run: |
          jq -e '
            (.vulnerabilities.list | type == "array") and
            ([.vulnerabilities.list[] | .advisory.id |
              select(. == "RUSTSEC-2026-0346" or . == "RUSTSEC-2026-0347" or
                     . == "RUSTSEC-2026-0348" or . == "RUSTSEC-2026-0349")]
             | length == 0)
          ' audit-report/cargo-audit.json
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-dependency-audit-${{ github.sha }}
          path: audit-report/
          if-no-files-found: error
          retention-days: 14
