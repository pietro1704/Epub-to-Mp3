name: CI failure diagnose

# When CI completes with failure on a PR or master push, fetch the failing
# step's tail and post it as a PR comment (or as a GitHub issue for master
# pushes). The goal is for the human author / Claude Code session to find
# the diagnosis already on the PR without manually running `gh run view`.
#
# This is informational only — never blocks a merge, never auto-fixes.

on:
  workflow_run:
    workflows: ["CI", "Release Desktop"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Fetch failed run summary
        id: summary
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.workflow_run.id }}"
          # Capture failed-job names + last 80 lines of the first failing
          # step's log. GitHub can expose workflow completion before logs are
          # available, so retry before creating a diagnostic with no evidence.
          gh run view "$RUN_ID" --json jobs \
            -q '.jobs[] | select(.conclusion=="failure") | "- " + .name + " (id=" + (.databaseId|tostring) + ")"' \
            > failed_jobs.txt
          FAILED_LOG=$(gh run view "$RUN_ID" --log-failed 2>/dev/null | awk 'BEGIN{n=0} {lines[n%80]=$0; n++} END{start=(n>80?n-80:0); for(i=start;i<n;i++) print lines[i%80]}')
          {
            echo "log<<DIAG_EOF"
            echo "$FAILED_LOG"
            echo "DIAG_EOF"
            echo "jobs<<JOBS_EOF"
            cat failed_jobs.txt
            echo "JOBS_EOF"
            echo "url=${{ github.event.workflow_run.html_url }}"
            echo "name=${{ github.event.workflow_run.name }}"
          } >> "$GITHUB_OUTPUT"

      - name: Find associated PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # workflow_run gives us the head SHA — find any PR with that head.
          SHA="${{ github.event.workflow_run.head_sha }}"
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" -q '.[0].number' 2>/dev/null || true)
          echo "number=${PR_NUMBER:-}" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v9
        env:
          SUMMARY_NAME: ${{ steps.summary.outputs.name }}
          SUMMARY_JOBS: ${{ steps.summary.outputs.jobs }}
          SUMMARY_LOG: ${{ steps.summary.outputs.log }}
          SUMMARY_URL: ${{ steps.summary.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const body = `🔴 **CI failure: ${process.env.SUMMARY_NAME}**

            Failed jobs:
            ${process.env.SUMMARY_JOBS}

            <details><summary>Last 80 lines of the failing step</summary>

            \`\`\`
            ${process.env.SUMMARY_LOG}
            \`\`\`

            </details>

            Full log: ${process.env.SUMMARY_URL}
            `;
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      - name: Open issue for master failures
        if: steps.pr.outputs.number == '' && github.event.workflow_run.head_branch == 'master'
        uses: actions/github-script@v9
        env:
          SUMMARY_NAME: ${{ steps.summary.outputs.name }}
          SUMMARY_JOBS: ${{ steps.summary.outputs.jobs }}
          SUMMARY_LOG: ${{ steps.summary.outputs.log }}
          SUMMARY_URL: ${{ steps.summary.outputs.url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const body = `Workflow **${process.env.SUMMARY_NAME}** failed on master push.

            Failed jobs:
            ${process.env.SUMMARY_JOBS}

            <details><summary>Last 80 lines of the failing step</summary>

            \`\`\`
            ${process.env.SUMMARY_LOG}
            \`\`\`

            </details>

            Full log: ${process.env.SUMMARY_URL}
            `;
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: `CI failure on master: ${process.env.SUMMARY_NAME} (run ${process.env.RUN_ID})`,
              body,
              labels: ["ci-failure", "automated"],
            });
