name: Rollback target contracts

on:
  pull_request:
    paths:
      - '.github/workflows/rollback-hf.yml'
      - '.github/workflows/rollback-target-contracts.yml'
      - '.github/scripts/rollback-target.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Exercise target selection with fake Git and no deployment
        run: node --test .github/scripts/rollback-target.test.cjs
