name: Merge eligible pull requests

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-queue
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Merge only after required exact-head checks succeed
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted merge policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Verify server protection read access
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/pr_gate_policy.mjs --repo "$REPO"

      - name: Merge all eligible ready pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_PROTECTION_READ_TOKEN: ${{ secrets.DEPENDABOT_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --state open --base master --limit 1000 \
            --json number,isDraft,author,headRepository,headRefName,headRefOid,mergeStateStatus | \
            jq -c '[.[] | select(.isDraft | not)] | sort_by(.number)')
          while IFS=$'\t' read -r pr head_sha; do
            if node scripts/guarded_pr_merge.mjs --repo "$REPO" --pr "$pr" --head "$head_sha" --merge; then
              :
            else
              result=$?
              if (( result != 1 )); then
                echo "::error::Cannot verify merge metadata for PR #$pr; queue stopped."
                exit "$result"
              fi
              echo "PR #$pr is not verifiably green at the inspected head; left unchanged."
              continue
            fi
            # GITHUB_TOKEN merges do not emit a new push-triggered run.
            # Confirm delivery before dispatching the existing post-merge gate.
            delivered=$(gh pr view "$pr" --repo "$REPO" --json state,headRefOid,mergeCommit)
            if jq -e --arg head "$head_sha" '.state == "MERGED" and .headRefOid == $head and (.mergeCommit.oid | test("^[0-9a-f]{40}$"))' <<< "$delivered" >/dev/null; then
              gh workflow run post-merge-validation.yml --repo "$REPO" --ref master
            else
              echo "PR #$pr merge delivery is unconfirmed; no post-merge validation dispatched."
            fi
          done < <(jq -r '.[] | [.number, .headRefOid] | @tsv' <<< "$prs")
