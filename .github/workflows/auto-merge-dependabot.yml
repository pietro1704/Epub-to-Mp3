name: Auto-merge eligible pull requests

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge after required checks
    runs-on: ubuntu-24.04
    steps:
      - name: Enable squash auto-merge for eligible internal pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --state open \
            --json number,isDraft,author,headRepository | \
            jq -r --arg owner "${REPO%%/*}" --arg repo "$REPO" \
              '.[] | select(.isDraft | not) | select(.author.login == $owner or .author.login == "app/dependabot" or .author.login == "dependabot[bot]") | select(.headRepository.nameWithOwner == $repo) | .number')
          for pr in $prs; do
            gh pr merge "$pr" --repo "$REPO" --auto --squash --delete-branch || true
          done
