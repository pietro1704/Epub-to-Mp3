name: Auto-merge Dependabot

on:
  pull_request:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and merge dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'check_suite'
    steps:
      - name: Find and merge dependabot PRs where CI passed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          is_major_bump() {
            local title="$1"
            # Extract "from X to Y" where X and Y start with different major numbers
            local from to
            from=$(echo "$title" | grep -oE 'from [0-9]+' | grep -oE '[0-9]+' | head -1)
            to=$(echo "$title"   | grep -oE 'to [0-9]+'   | grep -oE '[0-9]+' | head -1)
            [ -n "$from" ] && [ -n "$to" ] && [ "$from" != "$to" ]
          }

          PRS=$(gh pr list \
            --repo "$REPO" \
            --author "app/dependabot" \
            --json number,title,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "CLEAN") | "\(.number)\t\(.title)"')

          if [ -z "$PRS" ]; then
            echo "No dependabot PRs ready to merge"
            exit 0
          fi

          while IFS=$'\t' read -r PR TITLE; do
            if is_major_bump "$TITLE"; then
              echo "Skipping major bump PR #$PR: $TITLE"
              continue
            fi
            echo "Approving PR #$PR: $TITLE"
            gh pr review "$PR" --repo "$REPO" --approve || true
            echo "Merging PR #$PR..."
            gh pr merge "$PR" --repo "$REPO" --squash --admin --delete-branch || true
          done <<< "$PRS"
