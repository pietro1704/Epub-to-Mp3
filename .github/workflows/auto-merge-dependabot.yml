name: Auto-merge Dependabot

on:
  pull_request:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and merge dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event_name == 'check_suite'
    steps:
      - name: Find and merge dependabot PRs where CI passed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Get all open dependabot PRs
          PRS=$(gh pr list \
            --repo "$REPO" \
            --author "app/dependabot" \
            --json number,url,mergeable,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "CLEAN") | .number')

          if [ -z "$PRS" ]; then
            echo "No dependabot PRs ready to merge"
            exit 0
          fi

          for PR in $PRS; do
            echo "Approving PR #$PR..."
            gh pr review "$PR" --repo "$REPO" --approve || true
            echo "Merging PR #$PR..."
            gh pr merge "$PR" --repo "$REPO" --squash --admin --delete-branch || true
          done
