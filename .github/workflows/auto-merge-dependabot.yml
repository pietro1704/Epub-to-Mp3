name: Inspect pull request merge eligibility

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: auto-merge-queue
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Inspect required checks without mutations
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted merge policy
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Inspect exact-head merge eligibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --state open --base master --limit 100 \
            --json number,isDraft,author,headRepository,headRefName,headRefOid,mergeStateStatus | \
            jq -c --arg owner "${REPO%%/*}" --arg repo "$REPO" \
              '[.[] | select(.isDraft | not) | select(.author.login == $owner or .author.login == "app/dependabot" or .author.login == "dependabot[bot]") | select(.headRepository.nameWithOwner == $repo)] | sort_by(.number)')
          while IFS=$'\t' read -r pr head_sha; do
            if ! node scripts/guarded_pr_merge.mjs --repo "$REPO" --pr "$pr" --head "$head_sha"; then
              echo "PR #$pr is not verifiably green at the inspected head; left unchanged."
            fi
          done < <(jq -r '.[] | [.number, .headRefOid] | @tsv' <<< "$prs")
