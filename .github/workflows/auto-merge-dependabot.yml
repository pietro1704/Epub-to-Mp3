name: Auto-merge eligible pull requests

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-queue
  cancel-in-progress: false

jobs:
  auto-merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Enable auto-merge after required checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted merge policy
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Merge only verified green heads and refresh one outdated branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --state open --base master --limit 100 \
            --json number,isDraft,author,headRepository,headRefName,headRefOid,mergeStateStatus | \
            jq -c --arg owner "${REPO%%/*}" --arg repo "$REPO" \
              '[.[] | select(.isDraft | not) | select(.author.login == $owner or .author.login == "app/dependabot" or .author.login == "dependabot[bot]") | select(.headRepository.nameWithOwner == $repo)] | sort_by(.number)')
          while IFS=$'\t' read -r pr head_sha; do
            if ! node scripts/guarded_pr_merge.mjs --repo "$REPO" --pr "$pr" --head "$head_sha" --merge; then
              echo "PR #$pr is not verifiably green at the inspected head; left unchanged."
            fi
          done < <(jq -r '.[] | [.number, .headRefOid] | @tsv' <<< "$prs")
          next=$(jq -r '[.[] | select(.mergeStateStatus == "BEHIND")][0] | if . == null then empty else [.number, .headRefOid, .headRefName] | @tsv end' <<< "$prs")
          if [[ -n "$next" ]]; then
            IFS=$'\t' read -r pr head_sha head_ref <<< "$next"
            if gh api --method PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$head_sha"; then
              # GITHUB_TOKEN branch updates do not start unattended PR checks.
              gh workflow run ci.yml --repo "$REPO" --ref "$head_ref"
            else
              echo "::warning::Could not refresh PR #$pr; retrying on the next event."
            fi
          fi
