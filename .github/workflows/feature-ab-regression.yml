name: Feature A/B Regression

env:
  MISE_ENABLE_TOOLS: python,node,npm
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Legacy network benchmarks require an explicit operator decision.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master') }}

jobs:
  ab-regression:
    runs-on: ubuntu-24.04
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.9.14
          install: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install toolchain via mise
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: mise run install

      - name: Run feature A/B benchmark
        run: |
          mkdir -p .cache/telemetry
          mise exec -- python scripts/benchmark_feature_ab.py \
            --book web/public/sample.epub \
            --engine edge \
            --workers 2 \
            --output .cache/telemetry/feature-ab-ci.json

      - name: Validate regression thresholds
        run: |
          mise exec -- python scripts/check_feature_ab_regression.py \
            --report .cache/telemetry/feature-ab-ci.json \
            --max-stage-loss-pct 25 \
            --max-pool-loss-pct 35

      - name: Upload A/B artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feature-ab-regression-${{ github.run_id }}
          path: .cache/telemetry/feature-ab-ci.json
