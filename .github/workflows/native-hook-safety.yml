name: Native hook safety

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-host-contracts:
    name: Mac storage, lease and native host regressions
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MISE_ENABLE_TOOLS: python,ruby,rust
      CARGO_BUILD_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install python ruby rust
      - run: mise exec -- gem install minitest --version 6.0.6 --no-document --bindir "$RUNNER_TEMP/minitest-bin"
      - name: Verify real Mac filesystem, storage and native fixture contracts
        run: |
          mise exec -- ruby scripts/test_mac_build_budget.rb
          mise exec -- ruby scripts/test_native_job.rb
          mise exec -- ruby scripts/test_native_build_preflight.rb
          mise exec -- ruby scripts/test_native_hook_safety.rb
          mise exec -- ruby scripts/test_native_entrypoint_safety.rb
          mise exec -- ruby scripts/test_native_faber_entrypoints.rb
          mise exec -- ruby scripts/test_native_task_wiring.rb
          mise exec -- ruby scripts/test_native_codex_tool_guard.rb
          mise exec -- ruby scripts/test_native_simulator_session.rb
          mise exec -- ruby scripts/test_device_workflow_entrypoint.rb
      - name: Verify resource monitor contracts and style without Apple execution
        run: |
          mise exec -- python -m pip install --disable-pip-version-check ruff==0.6.9
          mise exec -- ruff check scripts/simulator_resource_monitor.py scripts/test_simulator_resource_monitor.py
          mise exec -- ruff format --check scripts/simulator_resource_monitor.py scripts/test_simulator_resource_monitor.py
          mise exec -- python scripts/test_simulator_resource_monitor.py
      - name: Type-check inherited-lease adapter without launching it
        run: mise exec -- ruby scripts/native_job.rb build -- xcrun swiftc -typecheck scripts/ios_simulator_smoke.swift
      - name: Test the actual DeviceWorkflow Swift package serially
        run: mise exec -- ruby scripts/native_job.rb build -- xcrun swift test --package-path tools/DeviceWorkflow --jobs 1
      - name: Build the actual eSpeak dependency serially
        run: mise exec -- ruby scripts/native_job.rb build -- cargo check --locked -p espeak-rs-sys --jobs 1
