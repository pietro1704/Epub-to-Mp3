name: Repository Health Watchdog regression

on:
  pull_request:
    paths:
      - '.github/scripts/repository-health-watchdog*.cjs'
      - '.github/workflows/repository-health-watchdog*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Run monitor and workflow boundary regressions on GitHub
        run: node --test .github/scripts/repository-health-watchdog.test.cjs
