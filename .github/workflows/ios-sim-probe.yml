name: iOS sim probe
on:
  push:
    branches: [ci/ios-simulator-tests]
    paths: [".github/workflows/ios-sim-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - run: |
          mkdir -p /tmp/tiny/Sources /tmp/tiny/Tests && cd /tmp/tiny
          cat > project.yml <<'YML'
          name: Tiny
          options:
            deploymentTarget:
              iOS: "15.0"
          targets:
            Tiny:
              type: application
              platform: iOS
              sources: [Sources]
              settings:
                base:
                  GENERATE_INFOPLIST_FILE: YES
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.tiny
            TinyTests:
              type: bundle.unit-test
              platform: iOS
              sources: [Tests]
              dependencies: [{target: Tiny}]
              settings:
                base:
                  GENERATE_INFOPLIST_FILE: YES
          schemes:
            Tiny:
              build: {targets: {Tiny: all}}
              test: {targets: [TinyTests]}
          YML
          echo 'import UIKit
          @main class A: UIResponder, UIApplicationDelegate {}' | sed 's/^          //' > Sources/A.swift
          echo 'import XCTest
          final class T: XCTestCase { func testOK() { XCTAssertTrue(true) } }' | sed 's/^          //' > Tests/T.swift
          xcodegen generate
          echo "== tiny"
          xcrun simctl list devices available | head -12
          sleep 30
          xcodebuild -project Tiny.xcodeproj -scheme Tiny -showdestinations 2>&1 | grep -E "platform:iOS Sim|error" | cut -c1-140
          echo "== tiny test by name"
          xcodebuild test -project Tiny.xcodeproj -scheme Tiny -destination "platform=iOS Simulator,name=iPhone 16,OS=18.5" CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Executed|TEST (SUCC|FAIL)|error|Unable|platform:iOS Sim" | cut -c1-160 | head -12
          echo "== tiny test by id"
          udid=$(xcrun simctl list devices available -j | ruby -rjson -e 'd=JSON.parse(STDIN.read)["devices"]; puts d["com.apple.CoreSimulator.SimRuntime.iOS-18-5"].find{|x|x["name"]=="iPhone 16"}["udid"]')
          xcodebuild test -project Tiny.xcodeproj -scheme Tiny -destination "id=$udid" CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "Executed|TEST (SUCC|FAIL)|error|Unable|platform:iOS Sim" | cut -c1-160 | head -12
