name: iOS sim probe
on:
  push:
    branches: [ci/ios-simulator-tests]
    paths: [".github/workflows/ios-sim-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - working-directory: ios/EpubToMp3
        run: |
          show() { xcodegen generate >/dev/null; xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3-UnitTests -showdestinations 2>&1 | grep -E "platform:iOS Sim" | cut -c1-120; }
          cp project.yml /tmp/project.orig
          echo "== v1 drop ARCHS sdk line"
          grep -v 'ARCHS\[sdk=iphonesimulator' /tmp/project.orig > project.yml; show
          echo "== v2 drop ONLY_ACTIVE_ARCH sim line too"
          grep -v 'ARCHS\[sdk=iphonesimulator' /tmp/project.orig | grep -v 'ONLY_ACTIVE_ARCH\[sdk' > project.yml; show
          echo "== v3 drop macosx from SUPPORTED_PLATFORMS"
          sed 's/iphoneos iphonesimulator macosx/iphoneos iphonesimulator/' /tmp/project.orig > project.yml; show
          echo "== v4 SDKROOT-free: drop DEVELOPMENT_TEAM"
          grep -v 'DEVELOPMENT_TEAM' /tmp/project.orig > project.yml; show
          cp /tmp/project.orig project.yml
