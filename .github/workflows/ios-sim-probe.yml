name: iOS sim probe
on:
  push:
    branches: [ci/ios-simulator-tests]
    paths: [".github/workflows/ios-sim-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - working-directory: ios/EpubToMp3
        run: |
          sw_vers -productVersion; ls -d /Applications/Xcode*; xcode-select -p
          xcodegen generate
          for x in /Applications/Xcode_*.app; do
            case "$x" in *beta*|*Beta*|*16.[0-3]*|*15*) continue;; esac
            echo "== $x"
            DEVELOPER_DIR=$x/Contents/Developer xcodebuild -version | head -1
            DEVELOPER_DIR=$x/Contents/Developer xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3-UnitTests -showdestinations 2>&1 | grep -E "platform:iOS Sim"
          done
