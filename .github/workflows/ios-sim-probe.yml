name: iOS sim probe
on:
  push:
    branches: [ci/ios-simulator-tests]
    paths: [".github/workflows/ios-sim-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - working-directory: ios/EpubToMp3
        run: |
          xcodegen generate >/dev/null
          t() { echo "== $*"; xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -destination "platform=iOS Simulator,name=iPhone 16,OS=18.5" -dry-run build "$@" 2>&1 | grep -E "Unable|error:|BUILD" | cut -c1-120 | head -3; }
          t ARCHS=arm64
          t ONLY_ACTIVE_ARCH=NO
          t NATIVE_ARCH_ACTUAL=arm64
          t 'ARCHS[sdk=iphonesimulator*]=arm64'
          xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -sdk iphonesimulator -showBuildSettings 2>&1 | grep -E "^\s+(ARCHS|NATIVE_ARCH|NATIVE_ARCH_ACTUAL|NATIVE_ARCH_64_BIT|VALID_ARCHS) " | sort -u
