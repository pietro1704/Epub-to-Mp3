name: iOS sim probe
on:
  push:
    branches: [ci/ios-simulator-tests]
    paths: [".github/workflows/ios-sim-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - working-directory: ios/EpubToMp3
        run: |
          cp project.yml /tmp/project.orig
          t() { echo "== $1"; xcodegen generate >/dev/null; xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -destination "platform=iOS Simulator,name=iPhone 16,OS=18.5" -dry-run build 2>&1 | grep -E "Unable|error:|BUILD" | cut -c1-120 | head -3; }
          grep -v 'ARCHS\[sdk=iphonesimulator' /tmp/project.orig > project.yml; t "v1 no ARCHS sim line"
          sed 's/iphoneos iphonesimulator macosx/iphoneos iphonesimulator/' /tmp/project.orig > project.yml; t "v3 no macosx platform"
          sed 's/"iphoneos iphonesimulator macosx"/"iphoneos iphonesimulator"/; s/supportedDestinations: \[iOS, macOS\]/supportedDestinations: [iOS]/' /tmp/project.orig > project.yml; t "v5 iOS-only destinations"
          grep -v 'DEVELOPMENT_TEAM' /tmp/project.orig > project.yml; t "v4 no team"
          cp /tmp/project.orig project.yml; t "v0 original"
