name: iOS sim probe
on:
  push:
    branches: [ci/ios-simulator-tests]
    paths: [".github/workflows/ios-sim-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen
      - working-directory: ios/EpubToMp3
        run: |
          xcodegen generate >/dev/null
          t() { echo "== $1 | $2"; xcodebuild -project EpubToMp3.xcodeproj -scheme "$1" -destination "$2" -dry-run test 2>&1 | grep -E "Unable|platform:iOS Sim|error:|TEST|Ineligible" | cut -c1-170 | head -6; }
          t EpubToMp3-UnitTests "platform=iOS Simulator,name=iPhone 16,OS=18.5"
          t EpubToMp3-UnitTests "platform=iOS Simulator,name=iPhone 16,OS=18.5,arch=arm64"
          t EpubToMp3 "platform=iOS Simulator,name=iPhone 16,OS=18.5"
          t EpubToMp3-IntegrationTests "platform=iOS Simulator,name=iPhone 16,OS=18.5"
          echo "== build-for-testing generic -dry-run"
          xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3-UnitTests -destination "generic/platform=iOS Simulator" -dry-run build-for-testing 2>&1 | grep -E "Unable|error:|BUILD|TEST" | head -5
