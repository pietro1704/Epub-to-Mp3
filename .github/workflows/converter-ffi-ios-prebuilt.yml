name: Produce physical iOS converter FFI artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: converter-ffi-ios-prebuilt
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MISE_ENABLE_TOOLS: rust,ruby
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Require hosted master dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = ARM64
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- rustup target add aarch64-apple-ios
      - uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-ios-device-piper
      - name: Test package identity and integrity boundaries
        run: mise exec -- ruby scripts/test_converter_ffi_ios_package.rb
      - name: Build physical-device runtime through guarded task
        run: mise run converter-ffi:ios-device
      - name: Verify and retain source-matched package
        run: mise exec -- ruby scripts/package_converter_ffi_ios.rb package "$GITHUB_WORKSPACE" "$RUNNER_TEMP/converter-ffi-ios-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: converter-ffi-ios-arm64-v1
          path: ${{ runner.temp }}/converter-ffi-ios-arm64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
