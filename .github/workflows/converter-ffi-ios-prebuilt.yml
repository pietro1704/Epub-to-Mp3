name: Produce physical iOS converter FFI artifact

on:
  workflow_dispatch:
    inputs:
      build_app_only:
        description: Build an unsigned validation archive instead of producing a trusted runtime package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.build_app_only && format('ios-validation-app-{0}', github.ref) || 'converter-ffi-ios-prebuilt' }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.build_app_only }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MISE_ENABLE_TOOLS: rust,ruby
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Require hosted master dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = ARM64
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: mise exec -- rustup target add aarch64-apple-ios
      - uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-ios-device-piper
      - name: Test package identity and integrity boundaries
        run: mise exec -- ruby scripts/test_converter_ffi_ios_package.rb
      - name: Build physical-device runtime through guarded task
        run: mise run converter-ffi:ios-device
      - name: Verify and retain source-matched package
        run: mise exec -- ruby scripts/package_converter_ffi_ios.rb package "$GITHUB_WORKSPACE" "$RUNNER_TEMP/converter-ffi-ios-arm64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: converter-ffi-ios-arm64-v1
          path: ${{ runner.temp }}/converter-ffi-ios-arm64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  validation-app:
    if: ${{ inputs.build_app_only }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MISE_ENABLE_TOOLS: rust,ruby
      CARGO_BUILD_JOBS: '1'
    steps:
      - name: Require an explicit hosted branch dispatch
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_ARCH" = ARM64
          [[ "$GITHUB_REF" == refs/heads/* ]]
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
        with:
          version: 2026.9.14
          install: false
      - run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - name: Install the project generator
        run: mise exec -- ruby scripts/native_job.rb build -- brew install xcodegen
      - run: mise exec -- rustup target add aarch64-apple-ios
      - uses: ./.github/actions/rust-build-cache
        with:
          namespace: ffi-ios-device-piper
      - name: Verify archive contracts and storage
        run: |
          set -euo pipefail
          mise exec -- ruby scripts/test_ios_validation_archive.rb
          mise run build:storage
          mise run clean:build
          mise exec -- ruby scripts/package_ios_validation_archive.rb identity "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/ios-app-source-identity"
      - name: Build the embedded device runtime
        run: mise run converter-ffi:ios-device
      - name: Archive the application without signing or launching devices
        run: |
          mise exec -- ruby scripts/native_job.rb build -- bash -euo pipefail -s <<'IOS_ARCHIVE'
          cd ios/EpubToMp3
          xcodegen generate
          xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/ios/EpubToMp3/.build" \
            -archivePath "$RUNNER_TEMP/EpubToMp3.xcarchive" -jobs 1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            archive
          IOS_ARCHIVE
      - name: Verify and package the source-matched validation archive
        run: |
          mise exec -- ruby scripts/package_ios_validation_archive.rb package \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/EpubToMp3.xcarchive" \
            "$RUNNER_TEMP/ios-validation-app" "$(cat "$RUNNER_TEMP/ios-app-source-identity")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-device-validation-app-v1
          path: ${{ runner.temp }}/ios-validation-app/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
