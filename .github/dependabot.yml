version: 2

updates:
  # ── Python ────────────────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps):"
    # Security updates are always opened regardless of this limit
    groups:
      python-non-security:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # ── npm ───────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore(deps):"
    groups:
      npm-non-security:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps):"
    groups:
      actions:
        patterns: ["*"]

  # ── Docker / Dockerfile ───────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps):"

  # ── Cargo (Tauri desktop) ─────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps):"
    groups:
      cargo-non-security:
        dependency-type: "production"
        update-types: ["minor", "patch"]
