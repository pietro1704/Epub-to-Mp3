name: EpubToMp3
options:
  bundleIdPrefix: com.pietrocode
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, pt-BR, es]
  # Xcode 26 reads `attributes.LastUpgradeCheck` to decide whether
  # the project has been audited against the current recommended-
  # settings list. Stale values (e.g. 1430 = Xcode 14.3) trigger the
  # "Update to recommended settings" dialog on every open. Bump to
  # 2630 (Xcode 26.3) so xcodegen regeneration writes a fresh value
  # and the dialog disappears.
  xcodeVersion: "2630"

settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: com.pietrocode.epubtomp3
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "HHRZ35A37Y"
    CODE_SIGN_STYLE: Automatic
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
    # Build-speed: Intel Macs benefit from a single-arch Debug build
    # (skip x86_64h and any cross-compile to arm64). Release stays
    # universal so a CI-built artefact runs on Apple Silicon too.
    ONLY_ACTIVE_ARCH: YES
    # Faster Swift incremental compiles. The whole-module mode is
    # locked in for Release for runtime speed.
    SWIFT_COMPILATION_MODE: incremental
    SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    DEBUG_INFORMATION_FORMAT: dwarf
    GCC_OPTIMIZATION_LEVEL: 0
    # Disable index-while-building during xcodebuild CLI runs (Xcode
    # GUI uses its own index regardless). Cuts ~25% off cold builds.
    COMPILER_INDEX_STORE_ENABLE: NO
    ENABLE_TESTABILITY: YES
    # Strip nothing in Debug — speeds linker; Release strips debug.
    STRIP_INSTALLED_PRODUCT: NO
    # Treat warnings as warnings (not errors). User pivoted: too many
    # SwiftUI/iOS 17 deprecations during the embed work were blocking
    # iteration. CI lint still surfaces them; just don't fail the
    # build over them.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    # Stricter Swift warnings worth promoting.
    SWIFT_STRICT_CONCURRENCY: minimal
    # Custom launch storyboard (was UILaunchScreen_Generation=YES auto).
    # The storyboard lives at EpubToMp3/Resources/LaunchScreen.storyboard
    # and is picked up automatically by xcodegen's group recursion (not
    # excluded). macOS ignores this key — UILaunchStoryboardName only
    # affects the iOS / iPadOS launch sequence.
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIBackgroundModes: "audio"
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    # NSAppTransportSecurity is a dict — INFOPLIST_KEY_* only supports
    # scalar/list values, so the dict goes in a real Info.plist file
    # merged via INFOPLIST_FILE. xcodegen merges this with the
    # auto-generated INFOPLIST_KEY_* entries at build time.
    INFOPLIST_FILE: EpubToMp3/Resources/Info.plist
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Pietro Pugliesi"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
    # Intel Macs with discrete + integrated GPU: tell macOS we don't
    # need the dGPU. The integrated Intel renders SwiftUI without
    # spinning fans up. NS_KEY_CONTENT below.
    INFOPLIST_KEY_NSSupportsAutomaticGraphicsSwitching: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    # Xcode 26 recommended-settings (auto-applied via "Perform Changes"
    # dialog). Promoted here so xcodegen regeneration doesn't undo them.
    # - Dead-code stripping: smaller binaries.
    # - Symbol stripping defaults: smaller release binary.
    # - User-script sandboxing: build correctness — scripts can only
    #   touch files they declare.
    # - String catalog symbol generation: Swift code-gen for localised
    #   strings.
    # --- Xcode 26 "Perform Changes" recommended settings ----------
    # Pre-applied here so the dialog stops nagging on every regenerate.
    DEAD_CODE_STRIPPING: YES
    STRIP_STYLE: all
    STRIP_SWIFT_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    LOCALIZED_STRING_MACRO_NAMES: "String LocalizedStringResource"
    # Whole-module optimisation in Release was the dialog's #1 ask.
    # Already locked per-config below; setting it at base level too so
    # the dialog stops listing it.
    SWIFT_COMPILATION_MODE_release: wholemodule
    # Xcode 26 recommends explicit module verification + ARC-explicit
    # warnings on the modernisation track. Defaults at the project
    # level so any new file inherits them.
    ENABLE_MODULE_VERIFIER: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    GCC_NO_COMMON_BLOCKS: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    # Mac Catalyst stays off (we ship native macOS via the same target);
    # but the recommended-settings dialog asks for an explicit answer.
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    # Asset catalogue colour space stays sRGB (default) — set explicitly
    # to silence the dialog.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    # Performance / debug correctness defaults the dialog flips on:
    CLANG_ENABLE_MODULE_DEBUGGING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    # --- Base build hygiene (perf + correctness) -----------------------
    # Pure-Swift app: skip Objective-C generated header. Cuts a tool
    # invocation per module and avoids copying the .h into Frameworks/.
    SWIFT_INSTALL_OBJC_HEADER: NO
    # Bitcode was deprecated in Xcode 14 and removed in 15+. Explicit NO
    # keeps the project file deterministic on a clean machine.
    ENABLE_BITCODE: NO
    # Default already NO but pin it — user paths in framework search slow
    # the dependency scanner and have caused odd misses in the past.
    ALWAYS_SEARCH_USER_PATHS: NO

  configs:
    Debug:
      # Skip the codesign / framework validation pass on every Debug build.
      # Saves ~2-5s per incremental rebuild; Release still validates.
      VALIDATE_BUILT_PRODUCT: NO
      # Correctness over speed in Debug — keep Swift safety checks ON
      # (overflow / array bounds / nil-deref). Pinned so Xcode's
      # "recommended settings" auto-applier doesn't flip it.
      SWIFT_DISABLE_SAFETY_CHECKS: NO
    Release:
      # ThinLTO: cross-module inlining without full LTO's link-time cost.
      # Typical 5-8% runtime win in Swift-heavy apps + ~10-15% smaller binary.
      LLVM_LTO: YES_THIN
      # NOTE: ENABLE_PREVIEWS stays ON (inherited from base) for Release.
      # The codebase has #Preview blocks that reference fixtures gated by
      # `#if DEBUG` (Views/PreviewFixtures.swift). Flipping previews off
      # in Release would compile the #Preview body but strip the symbols
      # it depends on, breaking the Release link. The metadata overhead
      # is negligible vs the breakage risk.
      # @testable expands the exported symbol surface; off in Release
      # shrinks the binary and removes a re-export pass at link time.
      ENABLE_TESTABILITY: NO
      # Optimise asset catalogue for binary size (xcassets). Slightly
      # slower compile, smaller .car payload on disk + in RAM.
      ASSETCATALOG_COMPILER_OPTIMIZATION: space

# SPIKE (feat/ios-python-embed): PythonKit bridges Swift <-> the embedded
# CPython interpreter loaded from Python.xcframework. The xcframework +
# stdlib + site-packages are produced by
# `ios/EpubToMp3/scripts/bootstrap-ios-python.sh` and gitignored.
packages:
  PythonKit:
    url: https://github.com/pvieito/PythonKit.git
    from: "0.4.0"
  # swift-snapshot-testing — pointfree's view-snapshot harness. Used by
  # the regression suite under EpubToMp3Tests/Snapshots/. Pinned to the
  # 1.17 line which still supports iOS 13 / macOS 10.15 deployment
  # (we target iOS 15 / macOS 12). Renders SwiftUI to UIKit/AppKit
  # hosting and writes/compares PNGs on disk.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: "1.17.0"

targets:
  EpubToMp3:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "15.0"
      macOS: "12.0"
    sources:
      - path: EpubToMp3
        excludes:
          - "Resources/EpubToMp3.entitlements"
          - "Resources/EpubToMp3-Debug.entitlements"
          - "Resources/Info.plist"
          - "Resources/LaunchScreen.storyboard"
          # Vendor/ is referenced explicitly below as folder-refs (opaque).
          # Without this exclude, xcodegen recurses into it from the parent
          # `path: EpubToMp3` and adds every .py as an individual resource,
          # causing duplicate-output errors on common names (helpers.py,
          # exceptions.py, etc.).
          - "Vendor"
      # Vendored Python stdlib + slim site-packages (iOS spike).
      # Bundled as resources so `Bundle.main.path(forResource:)` finds
      # them at runtime. `type: folder` is xcodegen's "blue folder
      # reference" — opaque, preserves directory hierarchy verbatim
      # (vs `type: group` which would flatten every nested .py into
      # the .app root and collide on common names like `helpers.py`).
      # Missing dirs are OK on a fresh clone — the bootstrap script
      # populates them. xcodegen tolerates missing optional paths.
      - path: Vendor/python-stdlib
        optional: true
        buildPhase: resources
        type: folder
        createIntermediateGroups: true
      - path: Vendor/site-packages
        optional: true
        buildPhase: resources
        type: folder
        createIntermediateGroups: true
    dependencies:
      # Python.xcframework is iOS-only (Beeware ships no macOS slice).
      # We exclude it from the macOS link via EXCLUDED_SOURCE_FILE_NAMES
      # below — macOS uses the PyInstaller sidecar embedded by the
      # post-build script and shares `python_app/src/` via runtime IPC.
      - framework: Vendor/Python/Python.xcframework
        embed: true
        codeSign: true
      - package: PythonKit
      # Widget extension — embedded in the main app bundle so iOS can
      # offer it in the widget gallery. iOS-only.
      - target: EpubToMp3Widget
        embed: true
        platforms: [iOS]
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        # PythonKit dlopens libpython at runtime — the embedded
        # xcframework lives under Frameworks/. Default @rpath covers
        # this on iOS, but make it explicit for the simulator.
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # Python.xcframework has no macOS slice — exclude the framework
        # from the macOS link line entirely so xcodebuild stops yelling
        # "no library for this platform was found".
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": "Python.xcframework"
        # Both run-script phases on this target (the pre-build bootstrap
        # and the post-build sidecar embed) write into directories that
        # the sandbox cannot pre-declare (e.g. download caches under
        # ~/.cache, the repo-rooted dist/ folder, large recursive copies
        # into Vendor/). Disable script sandboxing for THIS TARGET only —
        # the test target inherits the project-level YES.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          # Unsigned local Debug builds can't activate the App Sandbox,
          # so we ship a sandbox-disabled entitlement file. Without
          # this, every `bookmarkData(.withSecurityScope)` fails and
          # imports break silently.
          CODE_SIGN_ENTITLEMENTS: EpubToMp3/Resources/EpubToMp3-Debug.entitlements
          # iOS device builds REQUIRE a valid signature — Apple's launchd
          # refuses to install unsigned IPAs (LaunchExecutableValidationError).
          # macOS local Debug + iOS Simulator stay unsigned for App-Sandbox
          # off + faster turnaround; iOS device falls back to Automatic
          # signing with whatever Development Team is configured in Xcode.
          "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
          "CODE_SIGNING_REQUIRED[sdk=macosx*]": NO
          "CODE_SIGNING_ALLOWED[sdk=macosx*]": NO
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
          "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
          "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": YES
          "CODE_SIGNING_ALLOWED[sdk=iphoneos*]": YES
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
          # On a 2018 Intel Mac the discrete Radeon Pro draws the
          # window even in Debug; force dGPU so SwiftUI render is
          # smooth. (No effect on Apple Silicon — they have one GPU.)
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_ENTITLEMENTS: EpubToMp3/Resources/EpubToMp3.entitlements
          CODE_SIGN_STYLE: Automatic
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GCC_OPTIMIZATION_LEVEL: s
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          STRIP_INSTALLED_PRODUCT: YES
    preBuildScripts:
      - name: "Bootstrap Python.xcframework"
        # Runs before Compile Sources / Link. If Vendor/Python/Python.xcframework
        # already exists this is a fast no-op (echo + exit). Otherwise it invokes
        # the canonical bootstrap script which downloads the Beeware Python-Apple-
        # support tarball, splices iOS+macOS slices, and seeds Vendor/python-stdlib
        # plus Vendor/site-packages/python_app. Idempotent and safe to re-run.
        # `basedOnDependencyAnalysis: false` forces Xcode to evaluate the script
        # every build (the existence check below handles the no-op fast path).
        shell: /bin/bash
        # No inputFiles/outputFiles: declaring Info.plist as an output causes
        # a cycle because the ProcessXCFramework step reads the same path as
        # its input. `basedOnDependencyAnalysis: false` already forces the
        # script to evaluate on every build; the existence check below is
        # the fast-path. `alwaysOutOfDate: true` is the Xcode 14+ way of
        # saying "always run, don't try to resolve I/O dependencies".
        basedOnDependencyAnalysis: false
        alwaysOutOfDate: true
        script: |
          set -euo pipefail
          XCF="${SRCROOT}/Vendor/Python/Python.xcframework"
          if [ -d "${XCF}" ]; then
            echo "==> Python.xcframework already vendored — skipping bootstrap"
            exit 0
          fi
          echo "==> Python.xcframework missing — running bootstrap"
          bash "${SRCROOT}/scripts/bootstrap-ios-python.sh"
    postBuildScripts:
      - name: "Embed Python sidecar (macOS only)"
        runOnlyWhenInstalling: false
        shell: /bin/bash
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/epub-to-mp3-server"
        script: |
          set -euo pipefail
          if [[ "${PLATFORM_NAME}" != "macosx" ]]; then
            echo "Skipping sidecar embed for ${PLATFORM_NAME}"
            exit 0
          fi
          REPO_ROOT="${SRCROOT}/../.."
          # The PyInstaller sidecar is produced by `mise run sidecar:build`
          # into dist/epub-to-mp3-server. The mac:build mise task chains the
          # sidecar build immediately before invoking xcodebuild.
          SIDECAR_SRC="${REPO_ROOT}/dist/epub-to-mp3-server"
          if [[ ! -x "$SIDECAR_SRC" ]]; then
            echo "warning: sidecar binary not found at ${SIDECAR_SRC}. Run 'mise run sidecar:build' first, or use 'mise run mac:build' to build sidecar+app together. App will start in remote-backend mode only."
            exit 0
          fi
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/epub-to-mp3-server"
          mkdir -p "$(dirname "${DEST}")"
          cp "${SIDECAR_SRC}" "${DEST}"
          chmod +x "${DEST}"
          echo "Embedded sidecar: ${SIDECAR_SRC} → ${DEST}"

  EpubToMp3Tests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "15.0"
      macOS: "12.0"
    sources:
      - path: EpubToMp3Tests
    dependencies:
      - target: EpubToMp3
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EpubToMp3.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/EpubToMp3"

  EpubToMp3Widget:
    type: app-extension
    # WidgetKit runs only on iOS 14+ / macOS 11+. We target iOS 17 /
    # macOS 14 (minimum for `.containerBackground`).
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: EpubToMp3Widget
        excludes:
          - "Resources/EpubToMp3Widget.entitlements"
      # Shared with the main app target. Same Codable shape on both ends —
      # ActivityKit serialises by name + Codable, not nominal cross-module.
      - path: EpubToMp3/Models/ConversionActivityAttributes.swift
    dependencies: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pietrocode.epubtomp3.widget
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: EpubToMp3Widget/Resources/EpubToMp3Widget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        # Widget extensions must not import UIKit directly — WidgetKit
        # provides the rendering surface; SwiftUI handles layout.
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
          "CODE_SIGNING_REQUIRED[sdk=iphoneos*]": YES
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
          "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        Release:
          CODE_SIGN_STYLE: Automatic
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  EpubToMp3:
    build:
      targets:
        EpubToMp3: all
        EpubToMp3Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EpubToMp3Tests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
