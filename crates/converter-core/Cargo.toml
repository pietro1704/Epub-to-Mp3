[package]
name = "converter-core"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Core domain types for EPUB to MP3 conversion"

[features]
default = []

[dependencies]
quick-xml = "0.41"
scraper = { version = "0.24", default-features = false }
base64 = "0.22"
percent-encoding = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
unicode-segmentation = "1.13.3"
whatlang = "0.18.0"
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
zip = { workspace = true, features = ["deflate"] }
rusty_mp3 = "1.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
unicode-normalization = "0.1"
pdf-extract = "0.12.1"
tempfile.workspace = true
sha1 = "0.10"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
rustls.workspace = true
rustls-native-certs = "0.8"
webpki-roots = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
futures-util.workspace = true
http = "1"
id3 = "1.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "tiff"] }
tiff = "0.11.3"
symphonia = { version = "0.5.5", default-features = false, features = ["all"] }
rand = "0.9"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
