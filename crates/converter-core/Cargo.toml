[package]
name = "converter-core"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Core domain types for EPUB to MP3 conversion"

[dependencies]
hex = "0.4"
tempfile = "3"
quick-xml = "0.37"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zip = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "time", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
http = "1"
rand = "0.9"
url = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
