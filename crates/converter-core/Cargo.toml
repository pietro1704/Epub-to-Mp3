[package]
name = "converter-core"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Core domain types for EPUB to MP3 conversion"

[features]
default = []
kokoro-runtime = []
kokoro-tract-runtime = ["dep:tract-onnx", "dep:misaki-rs"]



[dependencies]
hex = "0.4"
tempfile = "3"
quick-xml = "0.37"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zip = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "time", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
edge-tts-rust = "0.1.3"
futures-util = "0.3"
rayon = "1"
http = "1"
rand = "0.9"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tract-onnx = { version = "0.23.8", default-features = false, optional = true }
misaki-rs = { version = "0.6", default-features = false, optional = true }



[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
