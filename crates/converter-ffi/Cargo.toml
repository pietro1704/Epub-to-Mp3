[package]
name = "converter-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Stable C ABI for embedded conversion"

[features]
default = []
android-jni = ["dep:jni"]
piper-runtime = ["dep:piper_runtime"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
converter-core = { path = "../converter-core" }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
jni = { version = "0.21", optional = true }
piper_runtime = { package = "piper-runtime", path = "../../native/piper-runtime", optional = true, features = ["onnxruntime", "piper-inference"] }
rustls.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "sync"] }

[dev-dependencies]
tempfile.workspace = true
zip = { workspace = true, default-features = true }
