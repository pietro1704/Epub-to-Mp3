[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "web/node_modules",
  "web/dist",
  "output",
  "models",
  ".cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"python_app/tests/**/*.py" = ["F841", "E731"]
"test_*.py" = ["F841", "E731"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mutmut]
source_paths = ["python_app/src"]
only_mutate = [
    "python_app/src/error_classifier.py",
    "python_app/src/_env_utils.py",
]
also_copy = ["python_app/tests"]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = [
    "python_app/tests/test_error_classifier.py",
    "python_app/tests/test_env_utils.py",
]
