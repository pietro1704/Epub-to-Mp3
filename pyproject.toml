[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "web/node_modules",
  "web/dist",
  "output",
  "models",
  ".cache",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"python_app/tests/**/*.py" = ["F841", "E731"]
"test_*.py" = ["F841", "E731"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
