[tasks."hooks:check"]
description = "Check Git hook syntax and executability (focused)"
run = """
#!/bin/bash
set -euo pipefail

ok=0
fail=0
for script in .githooks/*; do
    [[ -e "$script" ]] || continue
    name=$(basename "$script")
    if [[ ! -x "$script" ]]; then
        echo "❌ $name: not executable"
        ((fail++)) || true
        continue
    fi
    if bash -n "$script"; then
        echo "✅ $name: OK"
        ((ok++)) || true
    else
        echo "❌ $name: syntax error"
        ((fail++)) || true
    fi
done
echo ""
echo "Result: $ok OK, $fail failed"
[[ $fail -eq 0 ]]
"""

