[tools]
python = "3.12.10"
# Node LTS for frontend (Vite 8.x requires >=20.19.0)
node = "lts"
npm = "latest"
# Runtimes required by the cargo:git-cliff and cocoapods backends below.
rust = "stable"
ruby = "4.0.7"
# Changelog generator (conventional commits → CHANGELOG.md)
"cargo:git-cliff" = "latest"
# WASM toolchain for the direct Rust web adapter.
"cargo:wasm-bindgen-cli" = "latest"
# Flutter SDK for the cross-platform companion app under flutter_app/.
flutter = "3.41.9"
# CocoaPods is used by the Capacitor iOS build (web/ → web/ios/App/),
# NOT by Flutter — Flutter does not target iOS/macOS in this repo.
cocoapods = "1.16.2"
# Java + Android SDK for the Flutter Android target. android-sdk plugin
# requires JAVA_HOME to be set; mise handles that when java is in [tools].
java = "21.0.2"
android-sdk = "11.0"
ninja = "latest"

[env]
# Keep the project virtualenv managed by mise without the deprecated tool option.
_.python.venv = { path = ".venv", create = true }

[tasks.dev]
description = "Start the Rust converter server and frontend (Vite) together"
run = "./scripts/dev.sh"

[tasks."rust:health"]
description = "Run the Rust health-only CLI"
run = "mise exec -- cargo run -p converter-cli"

[tasks."rust:server"]
description = "Run the Rust Axum health and metadata server"
run = "PIPER_BINARY=\"$MISE_PROJECT_ROOT/.venv/bin/piper\" PIPER_MODEL=\"$MISE_PROJECT_ROOT/models/piper/en_US-lessac-medium.onnx\" mise exec -- cargo run -p converter-server"

[tasks.convert]
description = "Run the canonical Rust conversion CLI"
run = "mise exec -- cargo run --release -p converter-cli --bin converter-cli --"

[tasks."web:wasm-build"]
description = "Build and verify the direct Rust EPUB WASM adapter"
run = "bash scripts/build_web_wasm.sh"

[tasks."migration:product-boundary-audit"]
description = "Audit remaining web and Flutter HTTP/Python product boundaries"
run = "bash scripts/check_direct_runtime_boundary.sh"

[tasks."branches:cleanup-preview"]
description = "Preview safe remote branch cleanup without deleting anything"
run = "bash scripts/cleanup_remote_branches.sh --remote origin"

[tasks."guard:no-python-production"]
description = "Fail if production packaging reintroduces the legacy Python runtime or bridge"
run = "bash scripts/guard_no_python_production.sh"

[tasks."migration:build-and-gate"]
description = "Build Rust production artifacts and run the migration readiness gate"
run = "mise exec -- cargo build -p converter-cli -p converter-server --release && mkdir -p dist && cp target/release/converter-server dist/epub-to-mp3-server && mise run migration:gate"

[tasks."migration:gate"]
description = "Report Rust migration readiness, packaging artifacts, and remaining blockers"
run = "bash scripts/check_rust_migration_gate.sh"

[tasks."check:rust-migration"]
description = "Check Rust migration readiness, packaging artifacts, and remaining blockers"
run = "bash scripts/check_rust_migration_gate.sh"

[tasks."converter-ffi:validate"]
description = "Validate converter-ffi native target mapping and artifact names on the host"
run = "mise exec -- python scripts/validate_converter_ffi_targets.py"

[tasks."converter-ffi:targets"]
description = "List converter-ffi native target mappings and exact output paths"
run = "mise exec -- python scripts/build_converter_ffi.py --list"

[tasks."converter-ffi:build"]
description = "Build the shared converter-ffi Rust library for the host"
run = "mise exec -- cargo build -p converter-ffi --release"

[tasks."converter-ffi:android-arm64"]
description = "Build converter-ffi for Android arm64 with mise-managed Rust and NDK"
run = "NDK=\"${ANDROID_NDK_HOME:-$HOME/.local/share/mise/installs/android-sdk/11.0/ndk/28.2.13676358}\"; TOOLCHAIN=\"$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin\"; SYSROOT=\"$NDK/toolchains/llvm/prebuilt/darwin-x86_64/sysroot\"; NINJA=\"$HOME/.local/share/mise/installs/ninja/1.13.2/ninja\"; export ANDROID_NDK_HOME=\"$NDK\" ANDROID_NDK_ROOT=\"$NDK\" PATH=\"$TOOLCHAIN:$HOME/.local/share/mise/installs/ninja/1.13.2:$HOME/.cargo/bin:$PATH\"; export CC_aarch64_linux_android=\"$TOOLCHAIN/aarch64-linux-android24-clang\" CXX_aarch64_linux_android=\"$TOOLCHAIN/aarch64-linux-android24-clang++\" AR_aarch64_linux_android=\"$TOOLCHAIN/llvm-ar\" CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=\"$TOOLCHAIN/aarch64-linux-android24-clang\" BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=\"--target=aarch64-linux-android24 --sysroot=$SYSROOT -I$SYSROOT/usr/include -include stdio.h\" BINDGEN_EXTRA_CLANG_ARGS=\"--target=aarch64-linux-android24 --sysroot=$SYSROOT -I$SYSROOT/usr/include -include stdio.h\" CFLAGS_aarch64_linux_android=\"--sysroot=$SYSROOT\" CMAKE_TOOLCHAIN_FILE=\"$NDK/build/cmake/android.toolchain.cmake\" CMAKE_GENERATOR=Ninja CMAKE_MAKE_PROGRAM=\"$NINJA\" TARGET_CC=\"$TOOLCHAIN/aarch64-linux-android24-clang\" CC=\"$TOOLCHAIN/aarch64-linux-android24-clang\" RUSTUP_TOOLCHAIN=stable; cargo build -p converter-ffi --features android-jni --release --target aarch64-linux-android --target-dir target/edge-android"

[tasks."converter-ffi:ios-device"]
description = "Build converter-ffi for iOS device with the Xcode SDK deployment target"
run = '''IPHONEOS_DEPLOYMENT_TARGET=15.0 SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path) mise exec -- cargo build -p converter-ffi --release --target aarch64-apple-ios'''

[tasks."converter-ffi:ios-device:verify"]
description = "Verify the iOS converter-ffi Mach-O architecture, platform, and exported ABI"
run = "bash scripts/verify_converter_ffi_ios.sh"

[tasks."converter-ffi:android-check"]
description = "Check Android converter-ffi without linking unsupported Piper inference dependencies"
run = "env -u CC -u CFLAGS -u CXX -u AR -u CMAKE_TOOLCHAIN_FILE -u CMAKE_GENERATOR -u CMAKE_MAKE_PROGRAM mise exec -- cargo check -p converter-ffi --features android-jni"

[tasks."converter-ffi:android-install"]
description = "Install the cached Android arm64 converter-ffi artifact into the APK source tree"
run = "mkdir -p flutter_app/android/app/src/main/jniLibs/arm64-v8a && cp target/edge-android/aarch64-linux-android/release/libconverter_ffi.so flutter_app/android/app/src/main/jniLibs/arm64-v8a/libconverter_ffi.so"

[tasks."android:embedded-deps"]
description = "Install Android NDK dependencies through mise-managed sdkmanager"
run = "SDKMANAGER=\"$HOME/.local/share/mise/installs/android-sdk/11.0/cmdline-tools/11.0/bin/sdkmanager\"; test -x \"$SDKMANAGER\"; \"$SDKMANAGER\" \"platform-tools\" \"platforms;android-35\" \"build-tools;35.0.0\" \"ndk;28.2.13676358\"; mise install ninja@latest"

[tasks."android:runtime-audit"]
description = "Audit the optional embedded Piper Android runtime"
run = "mise exec -- bash -lc 'set -e; test -d flutter_app/android/app/src/main/jniLibs/arm64-v8a; if find flutter_app/android/app/src/main/jniLibs -type f -name \"libpiper_runtime.so\" -print -quit | grep -q .; then echo \"optional Piper runtime present\"; else echo \"Piper runtime absent: Edge-only Android artifact is active\"; fi'"

[tasks."piper:android-arm64"]
description = "Build Piper Embedded runtime for Android arm64 with the mise-managed NDK"
run = "NDK=\"${ANDROID_NDK_HOME:-$HOME/.local/share/mise/installs/android-sdk/11.0/ndk/28.2.13676358}\"; TOOLCHAIN=\"$NDK/toolchains/llvm/prebuilt/darwin-x86_64/bin\"; SYSROOT=\"$NDK/toolchains/llvm/prebuilt/darwin-x86_64/sysroot\"; NINJA=\"$HOME/.local/share/mise/installs/ninja/1.13.2/ninja\"; export ANDROID_NDK_HOME=\"$NDK\" ANDROID_NDK_ROOT=\"$NDK\" PATH=\"$TOOLCHAIN:$HOME/.local/share/mise/installs/ninja/1.13.2:$HOME/.cargo/bin:$PATH\"; export CC_aarch64_linux_android=\"$TOOLCHAIN/aarch64-linux-android24-clang\" CXX_aarch64_linux_android=\"$TOOLCHAIN/aarch64-linux-android24-clang++\" AR_aarch64_linux_android=\"$TOOLCHAIN/llvm-ar\" CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=\"$TOOLCHAIN/aarch64-linux-android24-clang\" BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=\"--target=aarch64-linux-android24 --sysroot=$SYSROOT -I$SYSROOT/usr/include -include stdio.h\" BINDGEN_EXTRA_CLANG_ARGS=\"--target=aarch64-linux-android24 --sysroot=$SYSROOT -I$SYSROOT/usr/include -include stdio.h\" CFLAGS_aarch64_linux_android=\"--sysroot=$SYSROOT\" CMAKE_TOOLCHAIN_FILE=\"$NDK/build/cmake/android.toolchain.cmake\" CMAKE_GENERATOR=Ninja CMAKE_MAKE_PROGRAM=\"$NINJA\" TARGET_CC=\"$TOOLCHAIN/aarch64-linux-android24-clang\" CC=\"$TOOLCHAIN/aarch64-linux-android24-clang\" RUSTUP_TOOLCHAIN=stable; cargo build -p piper-runtime --features onnxruntime,piper-inference --release --target aarch64-linux-android --target-dir target/piper-android"

[tasks.clean]
description = "Clean backend cache, pycache, and completed outputs"
run = """
#!/bin/bash
set -e

echo "🧹 Cleaning backend cache..."

# Remove __pycache__ directories
echo "  → Removing __pycache__..."
find python_app -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
find . -maxdepth 1 -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

# Remove .pyc files
echo "  → Removing .pyc files..."
find python_app -type f -name "*.pyc" -delete 2>/dev/null || true
find . -maxdepth 2 -type f -name "*.pyc" -delete 2>/dev/null || true

# Remove pytest cache
echo "  → Removing .pytest_cache..."
rm -rf .pytest_cache 2>/dev/null || true
rm -rf python_app/.pytest_cache 2>/dev/null || true

# Remove output directory (completed conversions) and job metadata/uploads
# Note: output/.* contains jobs, uploads, inputs that need to be cleaned
echo "  → Removing output files and jobs..."
rm -rf output/* 2>/dev/null || true
rm -rf output/.jobs output/.uploads output/.job_inputs output/.source_backups 2>/dev/null || true
rm -rf output/.cover_cache 2>/dev/null || true
# Also clean from root (may exist from older versions)
rm -rf .jobs .uploads .job_inputs 2>/dev/null || true

# Remove cached books but keep downloaded models
echo "  → Cleaning book cache (preserving models)..."
PYTHONPATH=python_app python - <<'PY'
from src.cache_manager import CacheManager

try:
    manager = CacheManager()
    removed = manager.clear_cache()
    msg = "    Book cache cleared." if removed else "    No book cache found."
    print(msg)
except Exception as exc:
    print(f"    ⚠️ Failed to clear cache: {exc}")
PY

# Remove mise cache
echo "  → Removing .mise-cache..."
rm -rf .mise-cache 2>/dev/null || true

echo "✅ Clean complete!"
echo ""
echo "Cleaned directories:"
echo "  - __pycache__"
echo "  - .pyc files"
echo "  - .pytest_cache"
echo "  - output/*"
echo "  - book cache (.cache/<book>), models preserved"
echo "  - .mise-cache"
"""

[tasks."clean:build"]
description = "Reclaim disk from iOS/macOS/Flutter build artifacts (DerivedData, .build, dist, flutter build/) — run periodically or when disk is low, NOT wired into mac:build itself since mac:run/CI consume its .build output immediately after."
run = """
#!/bin/bash
set -e

echo "🧹 Cleaning build artifacts..."

# xcodebuild -derivedDataPath output for the headless mac:build/ios:build
# tasks. Not auto-run after mac:build/mac:build:dev — mac:run and other
# immediate consumers read the just-built .app straight out of here.
echo "  → Removing ios/EpubToMp3/.build..."
rm -rf ios/EpubToMp3/.build 2>/dev/null || true

# Xcode.app's own DerivedData for this project, only if Xcode.app was ever
# opened directly on it (headless builds above never populate this — see
# "Build Artifact Hygiene" in CLAUDE.md: don't let two build caches for the
# same project accumulate in parallel).
echo "  → Removing Xcode DerivedData for EpubToMp3..."
rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/EpubToMp3-* 2>/dev/null || true

echo "  → Removing Rust sidecar dist/..."
rm -rf dist 2>/dev/null || true

echo "  → Removing flutter_app/build..."
rm -rf flutter_app/build 2>/dev/null || true

echo "✅ Build artifacts cleaned!"
"""

[tasks."clean:build:if-low"]
description = "Run clean:build only when free disk is below threshold and no build is active. Invoked every 6h by the com.pietro.epub-to-mp3-disk-guard LaunchAgent (~/bin/epub-to-mp3-disk-guard.sh)."
run = """
#!/bin/bash
set -e

THRESHOLD_GB="${DISK_GUARD_THRESHOLD_GB:-20}"
# /System/Volumes/Data, not /: `df /` reports the sealed System snapshot
# (barely moves regardless of real usage) — actual builds/caches live on
# the Data volume. Checking `/` made this threshold nearly meaningless.
AVAIL_GB="$(df -g /System/Volumes/Data | tail -1 | awk '{print $4}')"

echo "Available: ${AVAIL_GB}Gi (threshold: ${THRESHOLD_GB}Gi)"

if [ "$AVAIL_GB" -ge "$THRESHOLD_GB" ]; then
  echo "Above threshold — nothing to do."
  exit 0
fi

# Never delete a build's own output out from under it.
if pgrep -f xcodebuild >/dev/null 2>&1; then
  echo "xcodebuild is running — skipping this cycle."
  exit 0
fi

echo "Below threshold — running clean:build"
mise run clean:build
"""

