[tools]
python = "3.12.10"
# Node LTS for frontend (Vite 8.x requires >=20.19.0)
node = "lts"
npm = "latest"
# Changelog generator (conventional commits → CHANGELOG.md)
"cargo:git-cliff" = "latest"
# Flutter SDK for the cross-platform companion app under flutter_app/.
flutter = "3.41.9"
# CocoaPods is used by the Capacitor iOS build (web/ → web/ios/App/),
# NOT by Flutter — Flutter does not target iOS/macOS in this repo.
cocoapods = "1.16.2"
# Java + Android SDK for the Flutter Android target. android-sdk plugin
# requires JAVA_HOME to be set; mise handles that when java is in [tools].
java = "21.0.2"
android-sdk = "11.0"

[env]
# Keep the project virtualenv managed by mise without the deprecated tool option.
_.python.venv = { path = ".venv", create = true }

[tasks.dev]
description = "Start backend (uvicorn) and frontend (Vite) together"
run = "./scripts/dev.sh"

[tasks.clean]
description = "Clean backend cache, pycache, and completed outputs"
run = """
#!/bin/bash
set -e

echo "🧹 Cleaning backend cache..."

# Remove __pycache__ directories
echo "  → Removing __pycache__..."
find python_app -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
find . -maxdepth 1 -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

# Remove .pyc files
echo "  → Removing .pyc files..."
find python_app -type f -name "*.pyc" -delete 2>/dev/null || true
find . -maxdepth 2 -type f -name "*.pyc" -delete 2>/dev/null || true

# Remove pytest cache
echo "  → Removing .pytest_cache..."
rm -rf .pytest_cache 2>/dev/null || true
rm -rf python_app/.pytest_cache 2>/dev/null || true

# Remove output directory (completed conversions) and job metadata/uploads
# Note: output/.* contains jobs, uploads, inputs that need to be cleaned
echo "  → Removing output files and jobs..."
rm -rf output/* 2>/dev/null || true
rm -rf output/.jobs output/.uploads output/.job_inputs output/.source_backups 2>/dev/null || true
rm -rf output/.cover_cache 2>/dev/null || true
# Also clean from root (may exist from older versions)
rm -rf .jobs .uploads .job_inputs 2>/dev/null || true

# Remove cached books but keep downloaded models
echo "  → Cleaning book cache (preserving models)..."
PYTHONPATH=python_app python - <<'PY'
from src.cache_manager import CacheManager

try:
    manager = CacheManager()
    removed = manager.clear_cache()
    msg = "    Book cache cleared." if removed else "    No book cache found."
    print(msg)
except Exception as exc:
    print(f"    ⚠️ Failed to clear cache: {exc}")
PY

# Remove mise cache
echo "  → Removing .mise-cache..."
rm -rf .mise-cache 2>/dev/null || true

echo "✅ Clean complete!"
echo ""
echo "Cleaned directories:"
echo "  - __pycache__"
echo "  - .pyc files"
echo "  - .pytest_cache"
echo "  - output/*"
echo "  - book cache (.cache/<book>), models preserved"
echo "  - .mise-cache"
"""

[tasks."clean:build"]
description = "Reclaim disk from iOS/macOS/Flutter build artifacts (DerivedData, .build, dist, flutter build/) — run periodically or when disk is low, NOT wired into mac:build itself since mac:run/CI consume its .build output immediately after."
run = """
#!/bin/bash
set -e

echo "🧹 Cleaning build artifacts..."

# xcodebuild -derivedDataPath output for the headless mac:build/ios:build
# tasks. Not auto-run after mac:build/mac:build:dev — mac:run and other
# immediate consumers read the just-built .app straight out of here.
echo "  → Removing ios/EpubToMp3/.build..."
rm -rf ios/EpubToMp3/.build 2>/dev/null || true

# Xcode.app's own DerivedData for this project, only if Xcode.app was ever
# opened directly on it (headless builds above never populate this — see
# "Build Artifact Hygiene" in CLAUDE.md: don't let two build caches for the
# same project accumulate in parallel).
echo "  → Removing Xcode DerivedData for EpubToMp3..."
rm -rf "$HOME/Library/Developer/Xcode/DerivedData"/EpubToMp3-* 2>/dev/null || true

echo "  → Removing PyInstaller sidecar dist/..."
rm -rf dist 2>/dev/null || true

echo "  → Removing flutter_app/build..."
rm -rf flutter_app/build 2>/dev/null || true

echo "✅ Build artifacts cleaned!"
"""

[tasks."clean:build:if-low"]
description = "Run clean:build only when free disk is below threshold and no build is active. Invoked every 6h by the com.pietro.epub-to-mp3-disk-guard LaunchAgent (~/bin/epub-to-mp3-disk-guard.sh)."
run = """
#!/bin/bash
set -e

THRESHOLD_GB="${DISK_GUARD_THRESHOLD_GB:-20}"
# /System/Volumes/Data, not /: `df /` reports the sealed System snapshot
# (barely moves regardless of real usage) — actual builds/caches live on
# the Data volume. Checking `/` made this threshold nearly meaningless.
AVAIL_GB="$(df -g /System/Volumes/Data | tail -1 | awk '{print $4}')"

echo "Available: ${AVAIL_GB}Gi (threshold: ${THRESHOLD_GB}Gi)"

if [ "$AVAIL_GB" -ge "$THRESHOLD_GB" ]; then
  echo "Above threshold — nothing to do."
  exit 0
fi

# Never delete a build's own output out from under it.
if pgrep -f xcodebuild >/dev/null 2>&1; then
  echo "xcodebuild is running — skipping this cycle."
  exit 0
fi

echo "Below threshold — running clean:build"
mise run clean:build
"""

[tasks.install]
description = "Install Python and web dependencies (venv + npm)"
run = """
#!/bin/bash
set -euo pipefail

echo "📦 Installing dependencies with mise..."
mise install

echo "🐍 Creating .venv (Python managed by mise) if missing..."
if [ ! -x ".venv/bin/python" ]; then
  mise exec -- python -m venv .venv
fi

echo "🐍 Installing Python dependencies (root)..."
.venv/bin/python -m pip install --upgrade pip
.venv/bin/python -m pip install -r requirements.txt

echo "🐍 Installing Python dependencies (python_app)..."
.venv/bin/python -m pip install -r python_app/requirements.txt

echo "🔍 Installing lint/format tools..."
.venv/bin/python -m pip install ruff pre-commit

echo "🎙️ Configuring native Piper..."
bash scripts/install_piper_binary.sh

echo "🌐 Installing web dependencies..."
(cd web && mise exec -- npm install)
"""

[tasks.test]
description = "Run unit + integration + web tests"
run = """
#!/bin/bash
set -euo pipefail

mise run test:unit
mise run test:integration
mise run test:web
"""

[tasks."test:unit"]
description = "Run Python unit tests (excluding benchmarks)"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests test_ambiguous_languages.py test_new_features.py -k "not benchmark"
"""

[tasks."test:integration"]
description = "Run Python integration/benchmark-style tests"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests -k "benchmark"
"""

[tasks."trim-log"]
description = "Trim conversions.jsonl to last 500 entries to keep it fast"
run = """
#!/bin/bash
set -euo pipefail

LOG_FILE=".logs/conversions.jsonl"
if [[ ! -f "$LOG_FILE" ]]; then
    echo "No log file found at $LOG_FILE"
    exit 0
fi

python3 - "$LOG_FILE" <<'PY'
import sys, json
path = sys.argv[1]
records = []
with open(path, encoding="utf-8") as f:
    for line in f:
        line = line.strip()
        if line:
            try:
                records.append(json.loads(line))
            except Exception:
                pass
if len(records) <= 500:
    print(f"Log has {len(records)} entries — no trim needed.")
    sys.exit(0)
keep = records[-500:]
with open(path, "w", encoding="utf-8") as f:
    for r in keep:
        f.write(json.dumps(r, ensure_ascii=False) + "\\n")
print(f"Trimmed {len(records)} → 500 entries.")
PY
"""

[tasks.audit]
description = "Scan Python and npm dependencies for known CVEs"
run = """
#!/bin/bash
set -euo pipefail

echo "🔍 Python CVE scan (PyPI service — installed env)..."
if ! .venv/bin/python -m pip show pip-audit &>/dev/null; then
    echo "Installing pip-audit..."
    .venv/bin/python -m pip install pip-audit --quiet
fi
# Scans the *installed* environment, which catches stale local pins
# requirements.txt has already addressed but which pip install
# --upgrade would clear. PyPI service replaced OSV because OSV
# advisories without a `ranges` field crash pip-audit 2.10
# (KeyError 'ranges' on certain malicious-package alerts).
.venv/bin/python -m pip_audit -s pypi || {
    echo ""
    echo "⚠️  CVEs surfaced. Common cause: local venv is stale relative to requirements.txt."
    echo "💡 Try: source .venv/bin/activate && pip install --upgrade -r requirements.txt"
    exit 1
}
echo "✅ Python: no known vulnerabilities."

echo ""
echo "🔍 npm CVE scan..."
(cd web && mise exec -- npm audit --audit-level=moderate)
echo "✅ npm: no known vulnerabilities."
"""

[tasks."logs-perf"]
description = "Show recent perf/error/freeze events from .logs/events.jsonl"
run = """
#!/bin/bash
set -euo pipefail

EVENTS_FILE=".logs/events.jsonl"
if [[ ! -f "$EVENTS_FILE" ]]; then
    echo "No events log at $EVENTS_FILE"
    exit 0
fi

LIMIT="${1:-30}"
.venv/bin/python scripts/print_events.py "$EVENTS_FILE" "$LIMIT"
"""

[tasks."analyze-logs"]
description = "Harvest conversion + CI logs, surface anomalies (slow chapters, fallbacks, language mismatches)"
run = "python scripts/analyze_logs.py"

[tasks."hooks-test"]
description = "Validate Claude Code hook scripts are syntactically valid and executable"
run = """
#!/bin/bash
set -euo pipefail

HOOKS_DIR=".claude/hooks"
ok=0
fail=0
for script in "$HOOKS_DIR"/*.sh; do
    name=$(basename "$script")
    if [[ ! -x "$script" ]]; then
        echo "❌ $name: not executable"
        ((fail++)) || true
        continue
    fi
    if bash -n "$script" 2>/tmp/hook_syntax_err; then
        echo "✅ $name: OK"
        ((ok++)) || true
    else
        echo "❌ $name: syntax error"
        cat /tmp/hook_syntax_err
        ((fail++)) || true
    fi
done
echo ""
echo "Result: $ok OK, $fail failed"
[[ $fail -eq 0 ]]
"""

[tasks."benchmark:check"]
description = "Compare live telemetry throughput against benchmarks/baseline.json"
run = """
#!/bin/bash
set -euo pipefail
.venv/bin/python scripts/benchmark_regression.py "$@"
"""

# ── Embedded Python + native macOS build ─────────────────────────────────────
# The native AppKit app links the bundled Python.xcframework directly.

[tasks."vendor:python"]
description = "Download + splice Beeware Python.xcframework into ios/EpubToMp3/Vendor (idempotent; iOS embed)"
# `sources` + `outputs` let mise skip re-running when the xcframework is
# already present and the bootstrap script itself hasn't changed.
sources = ["ios/EpubToMp3/scripts/bootstrap-ios-python.sh"]
outputs = ["ios/EpubToMp3/Vendor/Python/Python.xcframework/Info.plist"]
run = "bash ios/EpubToMp3/scripts/bootstrap-ios-python.sh"

[tasks."mac:build"]
description = "Build native AppKit macOS app with embedded Python runtime (MAC_BUILD_CONFIG=Release|Debug, default Release)"
# Ensure Python.xcframework is on disk before xcodebuild evaluates the
# `Vendor/Python/Python.xcframework` framework dependency. The Xcode
# pre-build run-script phase is a second safety net (covers users who
# open the .xcodeproj directly in Xcode without going through mise).
depends = ["vendor:python"]
run = """
#!/bin/bash
set -euo pipefail
# PyInstaller probes the host architecture through the system `arch`
# utility. Put macOS system directories first so a user-level helper with
# the same name cannot intercept `arch -x86_64` during isolated analysis.
export PATH="/usr/bin:/bin:/usr/sbin:/sbin:${PATH}"
# Default stays Release so this task keeps producing the same distributable
# artifact release-desktop.yml expects. Debug (wholemodule/-O/ThinLTO/dSYM
# all skipped — see project.yml's own Debug tuning) is dramatically faster
# for local iteration; use `mise run mac:build:dev` or set the var directly.
CONFIG="${MAC_BUILD_CONFIG:-Release}"

# Build the AppKit/UIKit app headlessly via xcodebuild.
cd ios/EpubToMp3
# Ensure project.yml is materialized to .xcodeproj.
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen"
  exit 1
fi
xcodegen generate
# Slice 18 preflight: widget must be embedded in the app bundle.
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"
# Hold the single-heavy-job lock around xcodebuild (CPU CATERR / PCIe panic
# guard on constrained Intel Macs — never let it race another heavy job).
python3 "${MISE_PROJECT_ROOT:-../..}/scripts/heavy_job_guard.py" mac:build -- \\
xcodebuild \\
  -project EpubToMp3.xcodeproj \\
  -scheme EpubToMp3 \\
  -configuration "$CONFIG" \\
  -destination 'platform=macOS' \\
  -derivedDataPath ./.build \\
  -showBuildTimingSummary \\
  build | tail -20

APP_OUT=".build/${CONFIG}/EpubToMp3.app"
if [[ ! -d "$APP_OUT" && -d ".build/Build/Products/${CONFIG}/EpubToMp3.app" ]]; then
  APP_OUT=".build/Build/Products/${CONFIG}/EpubToMp3.app"
fi
if [[ -d "$APP_OUT" ]]; then
  echo ""
  echo "Built ($CONFIG): $APP_OUT"
  echo ""
  echo "To install, copy to /Applications:"
  echo "   cp -R \\"$APP_OUT\\" /Applications/"
else
  echo "error: build did not produce $APP_OUT"
  exit 1
fi
"""

[tasks."mac:build:dev"]
description = "Fast local-iteration macOS build (Debug config — incremental, -Onone, no LTO/dSYM). Not for distribution."
run = "MAC_BUILD_CONFIG=Debug mise run mac:build"

[tasks."mac:run"]
description = "Build and launch the native macOS app in Debug for local development"
run = """
#!/bin/bash
set -euo pipefail
mise run mac:build:dev
APP_PATH="ios/EpubToMp3/.build/Debug/EpubToMp3.app"
if [[ ! -d "$APP_PATH" ]]; then
  APP_PATH="ios/EpubToMp3/.build/Build/Products/Debug/EpubToMp3.app"
fi
if [[ ! -d "$APP_PATH" ]]; then
  echo "mac:run error: Debug app was not produced." >&2
  exit 1
fi
APP_EXECUTABLE="$APP_PATH/Contents/MacOS/EpubToMp3"
# `open -n` starts another copy on every run. That leaves duplicate AppKit
# windows competing for resources.
if pgrep -f "$APP_EXECUTABLE" >/dev/null 2>&1; then
  pkill -TERM -f "$APP_EXECUTABLE" || true
  for _ in {1..20}; do
    pgrep -f "$APP_EXECUTABLE" >/dev/null 2>&1 || break
    sleep 0.1
  done
fi
open "$APP_PATH"
"""

[tasks."ios:build"]
description = "Build native UIKit iOS app on the best installed iOS Simulator with embedded Python.xcframework"
# vendor:python must finish before xcodebuild resolves the framework
# dependency declared in project.yml.
depends = ["vendor:python"]
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
cd ios/EpubToMp3
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen"
  exit 1
fi
xcodegen generate

# Local low-resource Intel Macs have kernel-panicked under recent iOS
# Simulator/CoreSimulator load. Refuse local simulator builds by default on
# those machines; CI and explicitly opted-in developers can override.
python3 ../../scripts/guard_ios_simulator_resources.py

# Slice 18 preflight: confirm the widget extension is wired into the
# app bundle. xcodegen has silently dropped this dependency in the past,
# producing a release .app with no PlugIns/EpubToMp3Widget.appex and
# zero widgets in the gallery.
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"

# Preflight: confirm the scheme actually has an iOS Simulator
# destination. Xcode 26.x ships the iOS Simulator SDK but the
# matching iOS runtime must be downloaded separately. Without it,
# xcodebuild fails with a generic "Unable to find a destination
# matching..." 50 seconds into the run — surface the real cause now
# instead.
if ! xcodebuild \\
       -project EpubToMp3.xcodeproj \\
       -scheme EpubToMp3 \\
       -showdestinations 2>&1 \\
     | grep -q "platform:iOS Simulator,"; then
  cat >&2 <<'EOF'
ios:build error: no iOS Simulator destination is eligible for the scheme.

Likely cause: the iOS Simulator runtime matching the installed iOS
Simulator SDK is missing. Xcode 26.x ships SDK iOS 26.x but no runtime
by default. The pre-existing iOS 17.2 simulator volume (if any) is
ABI-incompatible with the 26.x SDK and is therefore listed as
"Ineligible".

Fix on this Mac:
  mise run ios:device:run             # install/launch an existing iphoneos build on the paired iPhone
  mise run mac:build                  # validate the Apple app without iOS simulator work

No local simulator download is required for the normal Hermes loop. Do not run
`xcodebuild -downloadPlatform ...` or open Xcode Components unless the user
explicitly asks to install a simulator/runtime. Use CI for simulator validation.

CI (release-desktop.yml) installs the runtime before building, so this
guard only fires for local simulator builds on developer machines without it.
EOF
  exit 2
fi

# Pick the simulator destination dynamically — the previous hard-coded
# `name=iPhone SE,OS=17.2` broke silently when the installed runtime was
# named, e.g., `iPhone SE (2nd generation),OS=17.2`. The Python selector
# is unit-tested (`test_select_ios_simulator.py`) and reads
# `xcrun simctl list -j devices available`. Override with `IOS_DEST` to
# pin a specific target in CI.
if [ -n "${IOS_DEST:-}" ]; then
  DEST="${IOS_DEST}"
else
  DEST=$(python3 ../../scripts/select_ios_simulator.py)
fi
echo "ios:build → destination: ${DEST}"

BUILD_LOG="${TMPDIR:-/tmp}/epub-to-mp3-ios-build.log"
if ! xcodebuild \\
       -project EpubToMp3.xcodeproj \\
       -scheme EpubToMp3 \\
       -configuration Debug \\
       -destination "${DEST}" \\
       -derivedDataPath ./.build \\
       -showBuildTimingSummary \\
       build >"${BUILD_LOG}" 2>&1; then
  echo "** BUILD FAILED **"
  echo "Build log: ${BUILD_LOG}"
  grep -nE "error:|fatal error:|BUILD FAILED|SwiftCompile|SwiftEmitModule" "${BUILD_LOG}" | tail -200 || true
  exit 65
fi
tail -20 "${BUILD_LOG}"
"""

[tasks."ios:device:run"]
description = "Install and launch the newest existing iphoneos EpubToMp3.app on the paired iPhone; never downloads or boots simulators"
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
cd ios/EpubToMp3
# Keep the generated .xcodeproj in sync with project.yml before locating the
# built app (harmless when only launching a prebuilt .app, cheap otherwise).
if command -v xcodegen >/dev/null 2>&1; then xcodegen generate; fi
DEVICE="${IOS_DEVICE_ID:-44B2CFBD-2193-5086-8E8D-BF7A2876C321}"
BUNDLE_ID="com.pietrocode.epubtomp3"
APP_PATH="${IOS_APP_PATH:-}"
if [[ -z "$APP_PATH" ]]; then
  APP_PATH=$(python3 - <<'PY'
from pathlib import Path
apps = [p for p in Path('.').glob('.build*/Build/Products/*-iphoneos/EpubToMp3.app') if p.is_dir()]
if not apps:
    raise SystemExit(1)
apps.sort(key=lambda p: p.stat().st_mtime, reverse=True)
print(apps[0])
PY
  ) || {
    echo "ios:device:run error: no existing iphoneos EpubToMp3.app found." >&2
    echo "Build on CI/release workflow or provide IOS_APP_PATH=/path/to/EpubToMp3.app." >&2
    echo "This task intentionally does not download simulator runtimes or boot CoreSimulator." >&2
    exit 2
  }
fi
if [[ ! -d "$APP_PATH" ]]; then
  echo "ios:device:run error: app not found: $APP_PATH" >&2
  exit 2
fi
echo "ios:device:run → device: $DEVICE"
echo "ios:device:run → app: $APP_PATH"
xcrun devicectl device install app --device "$DEVICE" "$APP_PATH"
SEED_LAUNCH=0
if [[ "${IOS_DEVELOPMENT_SEED_BOOK:-1}" != "0" ]]; then
  if python3 ../../scripts/seed_ios_development_book.py --target device --identifier "$DEVICE"; then
    SEED_LAUNCH=1
  else
    SEED_STATUS=$?
    if [[ "$SEED_STATUS" -ne 3 ]]; then
      exit "$SEED_STATUS"
    fi
  fi
fi
if [[ "$SEED_LAUNCH" == "1" ]]; then
  xcrun devicectl device process launch --device "$DEVICE" --terminate-existing "$BUNDLE_ID" -developmentSeedBook
else
  xcrun devicectl device process launch --device "$DEVICE" --terminate-existing "$BUNDLE_ID"
fi
"""

[tasks."ios:device:build"]
description = "Build the native iOS app for a connected physical device without using CoreSimulator"
depends = ["vendor:python"]
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
cd ios/EpubToMp3
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "ios:device:build error: xcodegen is required. Install it through mise or the project toolchain." >&2
  exit 1
fi
DEVICE="${IOS_DEVICE_ID:-}"
if [[ -z "$DEVICE" ]]; then
  echo "ios:device:build error: set IOS_DEVICE_ID to the connected iPhone UDID." >&2
  echo "Find it with: xcrun devicectl list devices" >&2
  exit 2
fi
# CoreDevice uses a stable device identifier while xcodebuild expects the
# traditional hardware UDID. Resolve the latter from the paired CoreDevice so
# callers can use the same IOS_DEVICE_ID for build, install, and launch.
XCODE_DEVICE="${IOS_XCODE_DEVICE_ID:-}"
if [[ -z "$XCODE_DEVICE" ]]; then
  XCODE_DEVICE=$(xcrun devicectl device info details --device "$DEVICE" 2>/dev/null \
    | awk -F': ' '/• udid:/ { print $2 }')
fi
if [[ -z "$XCODE_DEVICE" ]]; then
  echo "ios:device:build error: could not resolve xcodebuild UDID for device $DEVICE." >&2
  echo "Set IOS_XCODE_DEVICE_ID to the physical device UDID from xcrun xctrace list devices." >&2
  exit 2
fi
xcodegen generate
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"
BUILD_LOG="${TMPDIR:-/tmp}/epub-to-mp3-ios-device-build.log"
if ! xcodebuild \\
       -project EpubToMp3.xcodeproj \\
       -scheme EpubToMp3 \\
       -configuration Debug \\
       -destination "id=$XCODE_DEVICE" \\
       -derivedDataPath ./.build-device \\
       -showBuildTimingSummary \\
       build >"${BUILD_LOG}" 2>&1; then
  echo "** DEVICE BUILD FAILED **"
  echo "Build log: ${BUILD_LOG}"
  grep -nE "error:|fatal error:|BUILD FAILED|SwiftCompile|SwiftEmitModule" "${BUILD_LOG}" | tail -200 || true
  exit 65
fi
tail -20 "${BUILD_LOG}"
"""

[tasks."ios:run"]
description = "Build and launch the iOS app in Debug; physical iPhone by default, use IOS_TARGET=simulator for Simulator"
run = """
#!/bin/bash
set -euo pipefail
TARGET="${IOS_TARGET:-device}"
case "$TARGET" in
  device)
    DEVICE="${IOS_DEVICE_ID:-44B2CFBD-2193-5086-8E8D-BF7A2876C321}"
    IOS_DEVICE_ID="$DEVICE" mise run ios:device:build
    IOS_DEVICE_ID="$DEVICE" mise run ios:device:run
    ;;
  simulator)
    mise run ios:build
    mise run ios:simulator:run
    ;;
  *)
    echo "ios:run error: IOS_TARGET must be device or simulator." >&2
    exit 2
    ;;
esac
"""

[tasks."ios:simulator:run"]
description = "Install and launch an existing iphonesimulator EpubToMp3.app; never builds or downloads runtimes"
run = """
#!/bin/bash
set -euo pipefail

# This task intentionally launches only an existing artifact. Use
# `mise run ios:build` separately when a new simulator build is required.
python3 "${MISE_PROJECT_ROOT:-.}/scripts/guard_ios_simulator_resources.py"
cd ios/EpubToMp3

if [[ -n "${IOS_APP_PATH:-}" ]]; then
  APP_PATH="$IOS_APP_PATH"
else
  APP_PATH=$(python3 - <<'PY'
from pathlib import Path

apps = []
for pattern in (".build/Build/Products/*-iphonesimulator/EpubToMp3.app", ".build/*-iphonesimulator/EpubToMp3.app"):
    apps.extend(path for path in Path(".").glob(pattern) if path.is_dir())
if not apps:
    raise SystemExit(1)
apps.sort(key=lambda path: path.stat().st_mtime, reverse=True)
print(apps[0])
PY
  ) || {
    echo "ios:simulator:run error: no existing iphonesimulator EpubToMp3.app found." >&2
    echo "Run `mise run ios:build` first, or provide IOS_APP_PATH=/path/to/EpubToMp3.app." >&2
    exit 2
  }
fi
if [[ ! -d "$APP_PATH" ]]; then
  echo "ios:simulator:run error: app not found: $APP_PATH" >&2
  exit 2
fi

if [[ -n "${IOS_SIMULATOR_UDID:-}" ]]; then
  UDID="$IOS_SIMULATOR_UDID"
  DEST="id=$UDID"
else
  DEST="${IOS_DEST:-$(python3 ../../scripts/select_ios_simulator.py)}"
  UDID="${DEST##*id=}"
fi
if [[ -z "$UDID" || "$UDID" == "$DEST" ]]; then
  echo "ios:simulator:run error: could not resolve a simulator UDID." >&2
  exit 2
fi

echo "ios:simulator:run → device: $UDID"
echo "ios:simulator:run → app: $APP_PATH"
xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
xcrun simctl bootstatus "$UDID" -b
xcrun simctl install "$UDID" "$APP_PATH"
SEED_LAUNCH=0
if [[ "${IOS_DEVELOPMENT_SEED_BOOK:-1}" != "0" ]]; then
  if python3 ../../scripts/seed_ios_development_book.py --target simulator --identifier "$UDID"; then
    SEED_LAUNCH=1
  else
    SEED_STATUS=$?
    if [[ "$SEED_STATUS" -ne 3 ]]; then
      exit "$SEED_STATUS"
    fi
  fi
fi
if [[ "$SEED_LAUNCH" == "1" ]]; then
  xcrun simctl launch "$UDID" com.pietrocode.epubtomp3 -developmentSeedBook
else
  xcrun simctl launch "$UDID" com.pietrocode.epubtomp3
fi
"""

[tasks."ios:simulator:resume"]
description = "Launch the EpubToMp3 app already installed in a selected Simulator; never builds or installs an artifact"
run = """
#!/bin/bash
set -euo pipefail

# This task is deliberately distinct from `ios:run`: it is useful when a
# legacy simulator can boot an already-installed build but the selected Xcode
# cannot compile current source for that runtime.
python3 "${MISE_PROJECT_ROOT:-.}/scripts/guard_ios_simulator_resources.py"
cd ios/EpubToMp3

BUNDLE_ID="com.pietrocode.epubtomp3"
if [[ -n "${IOS_SIMULATOR_UDID:-}" ]]; then
  UDID="$IOS_SIMULATOR_UDID"
  DEST="id=$UDID"
else
  DEST="${IOS_DEST:-$(python3 ../../scripts/select_ios_simulator.py)}"
  UDID="${DEST##*id=}"
fi
if [[ -z "$UDID" || "$UDID" == "$DEST" ]]; then
  echo "ios:simulator:resume error: could not resolve a simulator UDID." >&2
  exit 2
fi

echo "ios:simulator:resume → device: $UDID"
xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
xcrun simctl bootstatus "$UDID" -b

APP_PATH=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app 2>/dev/null) || {
  echo "ios:simulator:resume error: $BUNDLE_ID is not installed on $UDID." >&2
  echo "Use a build-capable simulator with `mise run ios:run`, or install an existing app with `mise run ios:simulator:run`." >&2
  exit 2
}
if [[ ! -d "$APP_PATH" ]]; then
  echo "ios:simulator:resume error: installed app container is missing: $APP_PATH" >&2
  exit 2
fi

BUILT_WITH_XCODE=$(/usr/libexec/PlistBuddy -c 'Print :DTXcode' "$APP_PATH/Info.plist" 2>/dev/null || true)
if [[ -n "$BUILT_WITH_XCODE" ]]; then
  echo "ios:simulator:resume warning: launching installed build made with Xcode $BUILT_WITH_XCODE; current source was not rebuilt."
fi
open -a Simulator
xcrun simctl launch "$UDID" "$BUNDLE_ID"
"""

[tasks."ios:simulator:test"]
description = "Build and run iOS XCTest/UI tests on a selected Simulator. Set IOS_TESTS=Target/Class or Target/Class/test."
depends = ["vendor:python"]
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
python3 "${MISE_PROJECT_ROOT:-.}/scripts/guard_ios_simulator_resources.py"
cd ios/EpubToMp3

if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen" >&2
  exit 1
fi
xcodegen generate

if [[ -n "${IOS_SIMULATOR_UDID:-}" ]]; then
  DEST="id=${IOS_SIMULATOR_UDID}"
else
  DEST="${IOS_DEST:-$(python3 ../../scripts/select_ios_simulator.py)}"
fi
UDID="${DEST##*id=}"
if [[ -z "$UDID" || "$UDID" == "$DEST" ]]; then
  echo "ios:simulator:test error: could not resolve a simulator UDID." >&2
  exit 2
fi
xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
xcrun simctl bootstatus "$UDID" -b
# iOS 26 may report Booted before testmanagerd has established its socket.
sleep 5

DD="${IOS_DERIVED_DATA_PATH:-./.build}"
run_simulator_tests() {
  local only=()
  if [[ -n "${IOS_TESTS:-}" ]]; then
    local tests=()
    IFS=',' read -r -a tests <<< "$IOS_TESTS"
    for test in "${tests[@]}"; do
      only+=("-only-testing:$test")
    done
  fi
  if [[ "${IOS_SKIP_BUILD:-0}" != "1" ]]; then
    xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
      -destination "$DEST" -derivedDataPath "$DD" build-for-testing
  fi
  if [[ -n "${IOS_TESTS:-}" ]]; then
    xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
      -destination "$DEST" -derivedDataPath "$DD" -parallel-testing-enabled NO \
      test-without-building "${only[@]}"
    return
  fi
  if [[ "${IOS_TEST_SHARDS:-4}" =~ ^[1-9][0-9]*$ ]]; then
    local shard_count="${IOS_TEST_SHARDS:-4}"
    local shard_index
    local -a unit_classes=()
    local -a ui_classes=()
    if [[ -z "${IOS_TESTS:-}" ]]; then
      while IFS= read -r -d '' file; do
        while read -r class_name; do
          [[ -n "$class_name" ]] && unit_classes+=("EpubToMp3Tests/$class_name")
        done < <(sed -nE 's/^[[:space:]]*(final[[:space:]]+)?class[[:space:]]+([A-Za-z0-9_]+):[[:space:]]*XCTestCase.*/\\2/p' "$file")
      done < <(find EpubToMp3Tests -maxdepth 1 -name '*.swift' -print0 | sort -z)
    fi
    if [[ -z "${IOS_TESTS:-}" ]]; then
      while IFS= read -r -d '' file; do
        while read -r class_name; do
          [[ -n "$class_name" ]] && ui_classes+=("EpubToMp3UITests/$class_name")
        done < <(sed -nE 's/^[[:space:]]*(final[[:space:]]+)?class[[:space:]]+([A-Za-z0-9_]+):[[:space:]]*XCTestCase.*/\\2/p' "$file")
      done < <(find EpubToMp3UITests -maxdepth 1 -name '*.swift' -print0 | sort -z)
    fi
    local -a isolated_classes=()
    local -a grouped_classes=()
    local class_name
    for class_name in "${unit_classes[@]}" "${ui_classes[@]}"; do
      if [[ "$class_name" == *Audiobook* || "$class_name" == *AudioPlayerStreamingTests || "$class_name" == *AudioPlayerSleepTimerTests || "$class_name" == *AudioPlayerSpeechFallbackTests || "$class_name" == *AudioUITests ]]; then
        isolated_classes+=("$class_name")
      else
        grouped_classes+=("$class_name")
      fi
    done
    for class_name in "${isolated_classes[@]}"; do
      echo "ios:simulator:test → isolated $class_name"
      xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
        -destination "$DEST" -derivedDataPath "$DD" -parallel-testing-enabled NO \
        test-without-building "-only-testing:$class_name"
    done
    local -a all_classes=("${grouped_classes[@]}")
    for ((shard_index=0; shard_index<shard_count; shard_index++)); do
      local -a shard_only=()
      local class_position
      for class_position in "${!all_classes[@]}"; do
        if (( class_position % shard_count == shard_index )); then
          shard_only+=("-only-testing:${all_classes[$class_position]}")
        fi
      done
      if [[ -n "${shard_only[*]}" ]]; then
        echo "ios:simulator:test → shard $((shard_index + 1))/$shard_count"
        xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
          -destination "$DEST" -derivedDataPath "$DD" \
          -parallel-testing-enabled NO test-without-building "${shard_only[@]}"
      fi
    done
    return 0
  fi
  xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
    -destination "$DEST" -derivedDataPath "$DD" test-without-building "${only[@]}"
}

export DEST DD IOS_SKIP_BUILD
export -f run_simulator_tests
python3 ../../scripts/heavy_job_guard.py ios:simulator:test -- bash -e -c run_simulator_tests
"""

[tasks."ios:device:test"]
description = "Build-for-testing + run UITests on the paired iPhone (real device). Set IOS_TESTS=... to filter, e.g. EpubToMp3UITests/ReaderFlickerUITests"
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
cd ios/EpubToMp3
# The .xcodeproj is generated (project.yml is the source of truth) and is
# gitignored — regenerate it here so a device test never builds against a
# stale project (e.g. a file deleted in project.yml but lingering in an old
# .xcodeproj → "Build input file cannot be found").
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen"
  exit 1
fi
xcodegen generate
# Constrained Intel Macs panic under concurrent load — serialize this and warn.
python3 ../../scripts/guard_ios_simulator_resources.py --device-test || exit $?
DEVICE="${IOS_XCODE_DEVICE_ID:-${IOS_DEVICE_ID:-00008140-001128A022BA801C}}"
# `devicectl` accepts either the CoreDevice identifier or hardware UDID, while
# `xcodebuild` only accepts the latter. Keep the test task aligned with the
# build task so the one device identifier works consistently across the iOS
# workflow.
if [[ -z "${IOS_XCODE_DEVICE_ID:-}" ]]; then
  RESOLVED_DEVICE=$(xcrun devicectl device info details --device "$DEVICE" 2>/dev/null | awk -F': ' '/• udid:/ { print $2 }')
  if [[ -n "$RESOLVED_DEVICE" ]]; then
    DEVICE="$RESOLVED_DEVICE"
  fi
fi
DD="./.build"
ONLY=""
if [[ -n "${IOS_TESTS:-}" ]]; then
  IFS=',' read -ra T <<< "$IOS_TESTS"
  for t in "${T[@]}"; do ONLY+=" -only-testing:$t"; done
fi
echo "ios:device:test → device: $DEVICE"
run_device_tests() {
  set -euo pipefail
  if [[ "${IOS_SKIP_BUILD:-0}" != "1" ]]; then
    BUILD_LOG="${TMPDIR:-/tmp}/epub-to-mp3-ios-device-test-build.log"
    if ! xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \\
      -destination "id=$DEVICE" -derivedDataPath "$DD" -showBuildTimingSummary \\
      build-for-testing >"$BUILD_LOG" 2>&1; then
      echo "** DEVICE TEST BUILD FAILED **" >&2
      echo "Build log: $BUILD_LOG" >&2
      grep -nE "error:|fatal error:|BUILD FAILED|SwiftCompile|SwiftEmitModule" "$BUILD_LOG" | tail -200 || true
      return 65
    fi
    tail -40 "$BUILD_LOG"
  fi
  TEST_LOG="${TMPDIR:-/tmp}/epub-to-mp3-ios-device-test-run.log"
  # shellcheck disable=SC2086
  if ! xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 \\
    -destination "id=$DEVICE" -derivedDataPath "$DD" $ONLY \\
    test-without-building >"$TEST_LOG" 2>&1; then
    echo "** DEVICE TESTS FAILED **" >&2
    echo "Test log: $TEST_LOG" >&2
    grep -iE "Test Suite|Test Case|passed|failed|error:|XCTAssert|skip|flicker" "$TEST_LOG" | tail -300 || true
    return 65
  fi
  grep -iE "Test Suite|Test Case|passed|failed|error:|XCTAssert|skip|flicker" "$TEST_LOG" | tail -300 || true
}
export -f run_device_tests
# The test runner executes in a child shell; export the destination so the
# function cannot silently turn `id=$DEVICE` into the invalid `id=`.
export DEVICE DD ONLY
# Hold the single-heavy-job lock for the whole device run (PCIe panic guard).
python3 ../../scripts/heavy_job_guard.py ios:device:test -- bash -c run_device_tests
"""

[tasks."ios:test"]
description = "Run all iOS XCTest/UI tests on a connected device, falling back to Simulator only when no device is available"
run = """
#!/bin/bash
set -euo pipefail
ROOT="${MISE_PROJECT_ROOT:-.}"
if [[ -n "${IOS_DEVICE_ID:-}" ]]; then
  IOS_DEVICE_ID="$IOS_DEVICE_ID" mise run ios:device:test
  exit $?
fi

DEVICE=$(xcrun devicectl list devices 2>/dev/null | awk '$4 == "available" { print $3; exit }')
if [[ -n "$DEVICE" ]]; then
  echo "ios:test → physical device available; using the Xcode destination configured by ios:device:test"
  mise run ios:device:test
  exit $?
fi

echo "ios:test → no available physical device; falling back to Simulator" >&2
IOS_ALLOW_LOW_RESOURCE_SIMULATOR=1 mise run ios:simulator:test
"""

