[tasks."trim-log"]
description = "Trim conversions.jsonl to last 500 entries to keep it fast"
run = """
#!/bin/bash
set -euo pipefail

LOG_FILE=".logs/conversions.jsonl"
if [[ ! -f "$LOG_FILE" ]]; then
    echo "No log file found at $LOG_FILE"
    exit 0
fi

python3 - "$LOG_FILE" <<'PY'
import sys, json
path = sys.argv[1]
records = []
with open(path, encoding="utf-8") as f:
    for line in f:
        line = line.strip()
        if line:
            try:
                records.append(json.loads(line))
            except Exception:
                pass
if len(records) <= 500:
    print(f"Log has {len(records)} entries — no trim needed.")
    sys.exit(0)
keep = records[-500:]
with open(path, "w", encoding="utf-8") as f:
    for r in keep:
        f.write(json.dumps(r, ensure_ascii=False) + "\\n")
print(f"Trimmed {len(records)} → 500 entries.")
PY
"""

[tasks.audit]
description = "Scan Python and npm dependencies for known CVEs"
run = """
#!/bin/bash
set -euo pipefail

echo "🔍 Python CVE scan (PyPI service — declared requirements)..."
# Resolve in a temporary Python 3.12 environment because the project requires
# numpy 2.5+ and the managed project venv intentionally has no pip.
UV_BIN="${UV_BIN:-$HOME/.hermes/bin/uv}"
AUDIT_TMP="$(mktemp -d "${TMPDIR:-/tmp}/epub-audit.XXXXXX")"
trap 'rm -rf "$AUDIT_TMP"' EXIT
"$UV_BIN" venv --python 3.12 "$AUDIT_TMP/venv" >/dev/null
"$UV_BIN" pip install --python "$AUDIT_TMP/venv/bin/python" \
    -r requirements.txt -r python_app/requirements.txt >/dev/null
"$UV_BIN" tool run --from pip-audit pip-audit --path \
    "$AUDIT_TMP/venv/lib/python3.12/site-packages" -s pypi || {
    echo ""
    echo "⚠️ CVEs surfaced in the resolved Python dependencies."
    exit 1
}
echo "✅ Python: no known vulnerabilities."

echo ""
echo "🔍 npm CVE scan..."
(cd web && mise exec -- npm audit --audit-level=moderate)
echo "✅ npm: no known vulnerabilities."
"""

