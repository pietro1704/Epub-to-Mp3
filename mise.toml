[tasks."mac:build"]
description = "Build native AppKit macOS app with the Rust converter-server sidecar (MAC_BUILD_CONFIG=Release|Debug, default Release)"
depends = ["sidecar:build", "converter-ffi:build"]
run = """
#!/bin/bash
set -euo pipefail
export PATH="/usr/bin:/bin:/usr/sbin:/sbin:${PATH}"
# Default stays Release so this task keeps producing the same distributable
# artifact release-desktop.yml expects. Debug (wholemodule/-O/ThinLTO/dSYM
# all skipped — see project.yml's own Debug tuning) is dramatically faster
# for local iteration; use `mise run mac:build:dev` or set the var directly.
CONFIG="${MAC_BUILD_CONFIG:-Release}"

# Build the AppKit/UIKit app headlessly via xcodebuild.
cd ios/EpubToMp3
# Ensure project.yml is materialized to .xcodeproj.
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen"
  exit 1
fi
xcodegen generate
# Slice 18 preflight: widget must be embedded in the app bundle.
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"
# Hold the single-heavy-job lock around xcodebuild (CPU CATERR / PCIe panic
# guard on constrained Intel Macs — never let it race another heavy job).
python3 "${MISE_PROJECT_ROOT:-../..}/scripts/heavy_job_guard.py" mac:build -- \\
xcodebuild \\
  -project EpubToMp3.xcodeproj \\
  -scheme EpubToMp3 \\
  -configuration "$CONFIG" \\
  -destination 'platform=macOS' \\
  -derivedDataPath ./.build \\
  -showBuildTimingSummary \\
  build | tail -20

APP_OUT=".build/${CONFIG}/EpubToMp3.app"
if [[ ! -d "$APP_OUT" && -d ".build/Build/Products/${CONFIG}/EpubToMp3.app" ]]; then
  APP_OUT=".build/Build/Products/${CONFIG}/EpubToMp3.app"
fi
if [[ -d "$APP_OUT" ]]; then
  echo ""
  echo "Built ($CONFIG): $APP_OUT"
  echo ""
  echo "To install, copy to /Applications:"
  echo "   cp -R \\"$APP_OUT\\" /Applications/"
else
  echo "error: build did not produce $APP_OUT"
  exit 1
fi
"""

[tasks."mac:build:dev"]
description = "Fast local-iteration macOS build (Debug config — incremental, -Onone, no LTO/dSYM). Not for distribution."
run = "MAC_BUILD_CONFIG=Debug mise run mac:build"

[tasks."mac:run"]
description = "Build and launch the native macOS app in Debug for local development"
run = """
#!/bin/bash
set -euo pipefail
mise run mac:build:dev
APP_PATH="ios/EpubToMp3/.build/Debug/EpubToMp3.app"
if [[ ! -d "$APP_PATH" ]]; then
  APP_PATH="ios/EpubToMp3/.build/Build/Products/Debug/EpubToMp3.app"
fi
if [[ ! -d "$APP_PATH" ]]; then
  echo "mac:run error: Debug app was not produced." >&2
  exit 1
fi
APP_EXECUTABLE="$APP_PATH/Contents/MacOS/EpubToMp3"
# `open -n` starts another copy on every run. That leaves duplicate AppKit
# windows competing for resources.
if pgrep -f "$APP_EXECUTABLE" >/dev/null 2>&1; then
  pkill -TERM -f "$APP_EXECUTABLE" || true
  for _ in {1..20}; do
    pgrep -f "$APP_EXECUTABLE" >/dev/null 2>&1 || break
    sleep 0.1
  done
fi
open "$APP_PATH"
"""

[tasks."ios:build"]
description = "Build native UIKit iOS app on the best installed iOS Simulator"
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
cd ios/EpubToMp3
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen"
  exit 1
fi
xcodegen generate

# Local low-resource Intel Macs have kernel-panicked under recent iOS
# Simulator/CoreSimulator load. Refuse local simulator builds by default on
# those machines; CI and explicitly opted-in developers can override.
python3 ../../scripts/guard_ios_simulator_resources.py

# Slice 18 preflight: confirm the widget extension is wired into the
# app bundle. xcodegen has silently dropped this dependency in the past,
# producing a release .app with no PlugIns/EpubToMp3Widget.appex and
# zero widgets in the gallery.
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"

# Preflight: confirm the scheme actually has an iOS Simulator
# destination. Xcode 26.x ships the iOS Simulator SDK but the
# matching iOS runtime must be downloaded separately. Without it,
# xcodebuild fails with a generic "Unable to find a destination
# matching..." 50 seconds into the run — surface the real cause now
# instead.
if ! xcodebuild \\
       -project EpubToMp3.xcodeproj \\
       -scheme EpubToMp3 \\
       -showdestinations 2>&1 \\
     | grep -q "platform:iOS Simulator,"; then
  cat >&2 <<'EOF'
ios:build error: no iOS Simulator destination is eligible for the scheme.

Likely cause: the iOS Simulator runtime matching the installed iOS
Simulator SDK is missing. Xcode 26.x ships SDK iOS 26.x but no runtime
by default. The pre-existing iOS 17.2 simulator volume (if any) is
ABI-incompatible with the 26.x SDK and is therefore listed as
"Ineligible".

Fix on this Mac:
  mise run ios:device:run             # install/launch an existing iphoneos build on the paired iPhone
  mise run mac:build                  # validate the Apple app without iOS simulator work

No local simulator download is required for the normal Hermes loop. Do not run
`xcodebuild -downloadPlatform ...` or open Xcode Components unless the user
explicitly asks to install a simulator/runtime. Use CI for simulator validation.

CI (release-desktop.yml) installs the runtime before building, so this
guard only fires for local simulator builds on developer machines without it.
EOF
  exit 2
fi

# Pick the simulator destination dynamically — the previous hard-coded
# `name=iPhone SE,OS=17.2` broke silently when the installed runtime was
# named, e.g., `iPhone SE (2nd generation),OS=17.2`. The Python selector
# is unit-tested (`test_select_ios_simulator.py`) and reads
# `xcrun simctl list -j devices available`. Override with `IOS_DEST` to
# pin a specific target in CI.
if [ -n "${IOS_DEST:-}" ]; then
  DEST="${IOS_DEST}"
else
  DEST=$(python3 ../../scripts/select_ios_simulator.py)
fi
echo "ios:build → destination: ${DEST}"

BUILD_LOG="${TMPDIR:-/tmp}/epub-to-mp3-ios-build.log"
if ! xcodebuild \\
       -project EpubToMp3.xcodeproj \\
       -scheme EpubToMp3 \\
       -configuration Debug \\
       -destination "${DEST}" \\
       -derivedDataPath ./.build \\
       -showBuildTimingSummary \\
       build >"${BUILD_LOG}" 2>&1; then
  echo "** BUILD FAILED **"
  echo "Build log: ${BUILD_LOG}"
  grep -nE "error:|fatal error:|BUILD FAILED|SwiftCompile|SwiftEmitModule" "${BUILD_LOG}" | tail -200 || true
  exit 65
fi
tail -20 "${BUILD_LOG}"
"""

[tasks."ios:device:run"]
description = "Install and launch the newest existing iphoneos EpubToMp3.app on the paired iPhone; never downloads or boots simulators"
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
cd ios/EpubToMp3
# Keep the generated .xcodeproj in sync with project.yml before locating the
# built app (harmless when only launching a prebuilt .app, cheap otherwise).
if command -v xcodegen >/dev/null 2>&1; then xcodegen generate; fi
DEVICE="${IOS_DEVICE_ID:-44B2CFBD-2193-5086-8E8D-BF7A2876C321}"
BUNDLE_ID="com.pietrocode.epubtomp3"
APP_PATH="${IOS_APP_PATH:-}"
if [[ -z "$APP_PATH" ]]; then
  APP_PATH=$(python3 - <<'PY'
from pathlib import Path
apps = [p for p in Path('.').glob('.build*/Build/Products/*-iphoneos/EpubToMp3.app') if p.is_dir()]
if not apps:
    raise SystemExit(1)
apps.sort(key=lambda p: p.stat().st_mtime, reverse=True)
print(apps[0])
PY
  ) || {
    echo "ios:device:run error: no existing iphoneos EpubToMp3.app found." >&2
    echo "Build on CI/release workflow or provide IOS_APP_PATH=/path/to/EpubToMp3.app." >&2
    echo "This task intentionally does not download simulator runtimes or boot CoreSimulator." >&2
    exit 2
  }
fi
if [[ ! -d "$APP_PATH" ]]; then
  echo "ios:device:run error: app not found: $APP_PATH" >&2
  exit 2
fi
BUNDLE_ID_FROM_PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" 2>/dev/null || true)
if [[ "$BUNDLE_ID_FROM_PLIST" != "$BUNDLE_ID" ]]; then
  echo "ios:device:run error: invalid bundle identifier: ${BUNDLE_ID_FROM_PLIST:-missing} (expected $BUNDLE_ID)" >&2
  exit 2
fi
if ! codesign --verify --strict --verbose=2 "$APP_PATH" >/tmp/epubtomp3-codesign.log 2>&1; then
  echo "ios:device:run error: app is not signed for device installation: $APP_PATH" >&2
  sed -n '1,12p' /tmp/epubtomp3-codesign.log >&2
  echo "Build with signing enabled before running this task." >&2
  exit 2
fi
echo "ios:device:run → device: $DEVICE"
echo "ios:device:run → app: $APP_PATH"
xcrun devicectl device install app --device "$DEVICE" "$APP_PATH"
SEED_LAUNCH=0
if [[ "${IOS_DEVELOPMENT_SEED_BOOK:-1}" != "0" ]]; then
  if python3 ../../scripts/seed_ios_development_book.py --target device --identifier "$DEVICE"; then
    SEED_LAUNCH=1
  else
    SEED_STATUS=$?
    if [[ "$SEED_STATUS" -ne 3 ]]; then
      exit "$SEED_STATUS"
    fi
  fi
fi
RETRY_SECONDS="${IOS_LAUNCH_RETRY_SECONDS:-10}"
if ! [[ "$RETRY_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
  echo "ios:device:run error: IOS_LAUNCH_RETRY_SECONDS must be a positive integer." >&2
  exit 2
fi

# A physical device rejects launches while locked. The app is already installed,
# so keep this inexpensive launch queue alive until the listener unlocks it.
while true; do
  if [[ "$SEED_LAUNCH" == "1" ]]; then
    if xcrun devicectl device process launch --device "$DEVICE" --terminate-existing "$BUNDLE_ID" -- -developmentSeedBook; then
      break
    fi
  elif xcrun devicectl device process launch --device "$DEVICE" --terminate-existing "$BUNDLE_ID"; then
    break
  fi
  echo "ios:device:run → launch deferred; retrying in ${RETRY_SECONDS}s (unlock the iPhone to continue)." >&2
  sleep "$RETRY_SECONDS"
done
"""

[tasks."ios:device:build"]
description = "Build the native iOS app for a connected physical device using persistent incremental cache"
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
cd ios/EpubToMp3
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "ios:device:build error: xcodegen is required. Install it through mise or the project toolchain." >&2
  exit 1
fi
DEVICE="${IOS_DEVICE_ID:-}"
if [[ -z "$DEVICE" ]]; then
  echo "ios:device:build error: set IOS_DEVICE_ID to the connected iPhone UDID." >&2
  echo "Find it with: xcrun devicectl list devices" >&2
  exit 2
fi
# CoreDevice uses a stable device identifier while xcodebuild expects the
# traditional hardware UDID. Resolve the latter from the paired CoreDevice so
# callers can use the same IOS_DEVICE_ID for build, install, and launch.
XCODE_DEVICE="${IOS_XCODE_DEVICE_ID:-}"
if [[ -z "$XCODE_DEVICE" ]]; then
  XCODE_DEVICE=$(xcrun devicectl device info details --device "$DEVICE" 2>/dev/null \
    | awk -F': ' '/• udid:/ { print $2 }')
fi
if [[ -z "$XCODE_DEVICE" ]]; then
  echo "ios:device:build error: could not resolve xcodebuild UDID for device $DEVICE." >&2
  echo "Set IOS_XCODE_DEVICE_ID to the physical device UDID from xcrun xctrace list devices." >&2
  exit 2
fi
PROJECT_YML="project.yml"
GENERATED_PROJECT="EpubToMp3.xcodeproj/EpubToMp3.xcodeproj/project.pbxproj"
if [[ ! -f "$GENERATED_PROJECT" || "$PROJECT_YML" -nt "$GENERATED_PROJECT" ]]; then
  xcodegen generate
else
  echo "ios:device:build → reusing generated Xcode project"
fi
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"
BUILD_LOG="${TMPDIR:-/tmp}/epub-to-mp3-ios-device-build.log"
if ! xcodebuild \\
       -project EpubToMp3.xcodeproj \\
       -scheme EpubToMp3 \\
       -configuration Debug \\
       -destination "id=$XCODE_DEVICE" \\
       -derivedDataPath ./.build-device \\
       -parallelizeTargets \\
       -showBuildTimingSummary \\
       build >"${BUILD_LOG}" 2>&1; then
  echo "** DEVICE BUILD FAILED **"
  echo "Build log: ${BUILD_LOG}"
  grep -nE "error:|fatal error:|BUILD FAILED|SwiftCompile|SwiftEmitModule" "${BUILD_LOG}" | tail -200 || true
  exit 65
fi
tail -20 "${BUILD_LOG}"
"""

