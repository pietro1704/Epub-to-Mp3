[tools]
python = { version = "3.12.10", virtualenv = ".venv" }
# Node LTS for frontend (Vite 7.x requires >=20.19.0)
node = "latest"
npm = "latest"
# Changelog generator (conventional commits → CHANGELOG.md)
"cargo:git-cliff" = "latest"
# Flutter SDK for the cross-platform companion app under flutter_app/.
flutter = "3.41.9"
# CocoaPods is used by the Capacitor iOS build (web/ → web/ios/App/),
# NOT by Flutter — Flutter does not target iOS/macOS in this repo.
cocoapods = "1.16.2"
# Java + Android SDK for the Flutter Android target. android-sdk plugin
# requires JAVA_HOME to be set; mise handles that when java is in [tools].
java = "21.0.2"
android-sdk = "11.0"

[tasks.dev]
description = "Start backend (uvicorn) and frontend (Vite) together"
run = "./scripts/dev.sh"

[tasks.clean]
description = "Clean backend cache, pycache, and completed outputs"
run = """
#!/bin/bash
set -e

echo "🧹 Cleaning backend cache..."

# Remove __pycache__ directories
echo "  → Removing __pycache__..."
find python_app -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
find . -maxdepth 1 -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

# Remove .pyc files
echo "  → Removing .pyc files..."
find python_app -type f -name "*.pyc" -delete 2>/dev/null || true
find . -maxdepth 2 -type f -name "*.pyc" -delete 2>/dev/null || true

# Remove pytest cache
echo "  → Removing .pytest_cache..."
rm -rf .pytest_cache 2>/dev/null || true
rm -rf python_app/.pytest_cache 2>/dev/null || true

# Remove output directory (completed conversions) and job metadata/uploads
# Note: output/.* contains jobs, uploads, inputs that need to be cleaned
echo "  → Removing output files and jobs..."
rm -rf output/* 2>/dev/null || true
rm -rf output/.jobs output/.uploads output/.job_inputs output/.source_backups 2>/dev/null || true
rm -rf output/.cover_cache 2>/dev/null || true
# Also clean from root (may exist from older versions)
rm -rf .jobs .uploads .job_inputs 2>/dev/null || true

# Remove cached books but keep downloaded models
echo "  → Cleaning book cache (preserving models)..."
PYTHONPATH=python_app python - <<'PY'
from src.cache_manager import CacheManager

try:
    manager = CacheManager()
    removed = manager.clear_cache()
    msg = "    Book cache cleared." if removed else "    No book cache found."
    print(msg)
except Exception as exc:
    print(f"    ⚠️ Failed to clear cache: {exc}")
PY

# Remove mise cache
echo "  → Removing .mise-cache..."
rm -rf .mise-cache 2>/dev/null || true

echo "✅ Clean complete!"
echo ""
echo "Cleaned directories:"
echo "  - __pycache__"
echo "  - .pyc files"
echo "  - .pytest_cache"
echo "  - output/*"
echo "  - book cache (.cache/<book>), models preserved"
echo "  - .mise-cache"
"""

[tasks.install]
description = "Install Python and web dependencies (venv + npm)"
run = """
#!/bin/bash
set -euo pipefail

echo "📦 Installing dependencies with mise..."
mise install

echo "🐍 Creating .venv (Python managed by mise) if missing..."
if [ ! -x ".venv/bin/python" ]; then
  mise exec -- python -m venv .venv
fi

echo "🐍 Installing Python dependencies (root)..."
.venv/bin/python -m pip install -r requirements.txt

echo "🐍 Installing Python dependencies (python_app)..."
.venv/bin/python -m pip install -r python_app/requirements.txt

echo "🔍 Installing lint/format tools..."
.venv/bin/python -m pip install ruff pre-commit

echo "🎙️ Configuring native Piper..."
bash scripts/install_piper_binary.sh

echo "🌐 Installing web dependencies..."
(cd web && mise exec -- npm install)
"""

[tasks.test]
description = "Run unit + integration + web tests"
run = """
#!/bin/bash
set -euo pipefail

mise run test:unit
mise run test:integration
mise run test:web
"""

[tasks."test:unit"]
description = "Run Python unit tests (excluding benchmarks)"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests test_ambiguous_languages.py test_new_features.py -k "not benchmark"
"""

[tasks."test:integration"]
description = "Run Python integration/benchmark-style tests"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests -k "benchmark"
"""

[tasks."trim-log"]
description = "Trim conversions.jsonl to last 500 entries to keep it fast"
run = """
#!/bin/bash
set -euo pipefail

LOG_FILE=".logs/conversions.jsonl"
if [[ ! -f "$LOG_FILE" ]]; then
    echo "No log file found at $LOG_FILE"
    exit 0
fi

python3 - "$LOG_FILE" <<'PY'
import sys, json
path = sys.argv[1]
records = []
with open(path, encoding="utf-8") as f:
    for line in f:
        line = line.strip()
        if line:
            try:
                records.append(json.loads(line))
            except Exception:
                pass
if len(records) <= 500:
    print(f"Log has {len(records)} entries — no trim needed.")
    sys.exit(0)
keep = records[-500:]
with open(path, "w", encoding="utf-8") as f:
    for r in keep:
        f.write(json.dumps(r, ensure_ascii=False) + "\\n")
print(f"Trimmed {len(records)} → 500 entries.")
PY
"""

[tasks.audit]
description = "Scan Python and npm dependencies for known CVEs"
run = """
#!/bin/bash
set -euo pipefail

echo "🔍 Python CVE scan (PyPI service — installed env)..."
if ! .venv/bin/python -m pip show pip-audit &>/dev/null; then
    echo "Installing pip-audit..."
    .venv/bin/python -m pip install pip-audit --quiet
fi
# Scans the *installed* environment, which catches stale local pins
# requirements.txt has already addressed but which pip install
# --upgrade would clear. PyPI service replaced OSV because OSV
# advisories without a `ranges` field crash pip-audit 2.10
# (KeyError 'ranges' on certain malicious-package alerts).
.venv/bin/python -m pip_audit -s pypi || {
    echo ""
    echo "⚠️  CVEs surfaced. Common cause: local venv is stale relative to requirements.txt."
    echo "💡 Try: source .venv/bin/activate && pip install --upgrade -r requirements.txt"
    exit 1
}
echo "✅ Python: no known vulnerabilities."

echo ""
echo "🔍 npm CVE scan..."
(cd web && mise exec -- npm audit --audit-level=moderate)
echo "✅ npm: no known vulnerabilities."
"""

[tasks."logs-perf"]
description = "Show recent perf/error/freeze events from .logs/events.jsonl"
run = """
#!/bin/bash
set -euo pipefail

EVENTS_FILE=".logs/events.jsonl"
if [[ ! -f "$EVENTS_FILE" ]]; then
    echo "No events log at $EVENTS_FILE"
    exit 0
fi

LIMIT="${1:-30}"
.venv/bin/python scripts/print_events.py "$EVENTS_FILE" "$LIMIT"
"""

[tasks."analyze-logs"]
description = "Harvest conversion + CI logs, surface anomalies (slow chapters, fallbacks, language mismatches)"
run = "python scripts/analyze_logs.py"

[tasks."hooks-test"]
description = "Validate Claude Code hook scripts are syntactically valid and executable"
run = """
#!/bin/bash
set -euo pipefail

HOOKS_DIR=".claude/hooks"
ok=0
fail=0
for script in "$HOOKS_DIR"/*.sh; do
    name=$(basename "$script")
    if [[ ! -x "$script" ]]; then
        echo "❌ $name: not executable"
        ((fail++)) || true
        continue
    fi
    if bash -n "$script" 2>/tmp/hook_syntax_err; then
        echo "✅ $name: OK"
        ((ok++)) || true
    else
        echo "❌ $name: syntax error"
        cat /tmp/hook_syntax_err
        ((fail++)) || true
    fi
done
echo ""
echo "Result: $ok OK, $fail failed"
[[ $fail -eq 0 ]]
"""

[tasks."benchmark:check"]
description = "Compare live telemetry throughput against benchmarks/baseline.json"
run = """
#!/bin/bash
set -euo pipefail
.venv/bin/python scripts/benchmark_regression.py "$@"
"""

# ── Python sidecar + native macOS build ───────────────────────────────────────
# The PyInstaller sidecar binary is consumed by the SwiftUI macOS app
# (ios/EpubToMp3/) via its post-build script. Linux/Windows users run the
# Flutter app under flutter_app/ — Flutter builds its own native packages.

[tasks."vendor:python"]
description = "Download + splice Beeware Python.xcframework into ios/EpubToMp3/Vendor (idempotent; iOS embed)"
# `sources` + `outputs` let mise skip re-running when the xcframework is
# already present and the bootstrap script itself hasn't changed.
sources = ["ios/EpubToMp3/scripts/bootstrap-ios-python.sh"]
outputs = ["ios/EpubToMp3/Vendor/Python/Python.xcframework/Info.plist"]
run = "bash ios/EpubToMp3/scripts/bootstrap-ios-python.sh"

[tasks."sidecar:build"]
description = "Build PyInstaller sidecar binary (epub-to-mp3-server, Edge-TTS only) into dist/"
run = """
#!/bin/bash
set -euo pipefail
source .venv/bin/activate
pip install pyinstaller -q
pip install -r requirements-desktop.txt -q
pyinstaller desktop.spec --noconfirm --clean
echo "Sidecar ready: dist/epub-to-mp3-server"
"""

[tasks."mac:build"]
description = "Build SwiftUI macOS app with embedded Python sidecar"
# Ensure Python.xcframework is on disk before xcodebuild evaluates the
# `Vendor/Python/Python.xcframework` framework dependency. The Xcode
# pre-build run-script phase is a second safety net (covers users who
# open the .xcodeproj directly in Xcode without going through mise).
depends = ["vendor:python"]
run = """
#!/bin/bash
set -euo pipefail
# 1. Regenerate the Python sidecar (PyInstaller onefile).
mise run sidecar:build

# 2. Build the SwiftUI app headlessly via xcodebuild.
cd ios/EpubToMp3
# Ensure project.yml is materialized to .xcodeproj.
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen"
  exit 1
fi
xcodegen generate
# Slice 18 preflight: widget must be embedded in the app bundle.
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"
xcodebuild \\
  -project EpubToMp3.xcodeproj \\
  -scheme EpubToMp3 \\
  -configuration Release \\
  -destination 'platform=macOS' \\
  -derivedDataPath ./.build \\
  SYMROOT=$(pwd)/.build \\
  build | tail -20

APP_OUT=".build/Release/EpubToMp3.app"
if [[ ! -d "$APP_OUT" && -d ".build/Build/Products/Release/EpubToMp3.app" ]]; then
  APP_OUT=".build/Build/Products/Release/EpubToMp3.app"
fi
if [[ -d "$APP_OUT" ]]; then
  echo ""
  echo "Built: $APP_OUT"
  echo "   Sidecar embedded: $(ls -lh "$APP_OUT/Contents/Resources/epub-to-mp3-server" 2>/dev/null | awk '{print $5}')"
  echo ""
  echo "To install, copy to /Applications:"
  echo "   cp -R \\"$APP_OUT\\" /Applications/"
else
  echo "error: build did not produce $APP_OUT"
  exit 1
fi
"""

[tasks."ios:build"]
description = "Build SwiftUI iOS app on the best installed iOS Simulator with embedded Python.xcframework"
# vendor:python must finish before xcodebuild resolves the framework
# dependency declared in project.yml.
depends = ["vendor:python"]
run = """
#!/bin/bash
set -euo pipefail
cd ios/EpubToMp3
if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen"
  exit 1
fi
xcodegen generate

# Local low-resource Intel Macs have kernel-panicked under recent iOS
# Simulator/CoreSimulator load. Refuse local simulator builds by default on
# those machines; CI and explicitly opted-in developers can override.
python3 ../../scripts/guard_ios_simulator_resources.py

# Slice 18 preflight: confirm the widget extension is wired into the
# app bundle. xcodegen has silently dropped this dependency in the past,
# producing a release .app with no PlugIns/EpubToMp3Widget.appex and
# zero widgets in the gallery.
"${MISE_PROJECT_ROOT:-../..}/scripts/verify_widget_embedded.sh"

# Preflight: confirm the scheme actually has an iOS Simulator
# destination. Xcode 26.x ships the iOS Simulator SDK but the
# matching iOS runtime must be downloaded separately. Without it,
# xcodebuild fails with a generic "Unable to find a destination
# matching..." 50 seconds into the run — surface the real cause now
# instead.
if ! xcodebuild \\
       -project EpubToMp3.xcodeproj \\
       -scheme EpubToMp3 \\
       -showdestinations 2>&1 \\
     | grep -q "platform:iOS Simulator,"; then
  cat >&2 <<'EOF'
ios:build error: no iOS Simulator destination is eligible for the scheme.

Likely cause: the iOS Simulator runtime matching the installed iOS
Simulator SDK is missing. Xcode 26.x ships SDK iOS 26.x but no runtime
by default. The pre-existing iOS 17.2 simulator volume (if any) is
ABI-incompatible with the 26.x SDK and is therefore listed as
"Ineligible".

Fix on this Mac:
  mise run ios:device:run             # install/launch an existing iphoneos build on the paired iPhone
  mise run mac:build                  # validate the Apple app without iOS simulator work

No local simulator download is required for the normal Hermes loop. Do not run
`xcodebuild -downloadPlatform ...` or open Xcode Components unless the user
explicitly asks to install a simulator/runtime. Use CI for simulator validation.

CI (release-desktop.yml) installs the runtime before building, so this
guard only fires for local simulator builds on developer machines without it.
EOF
  exit 2
fi

# Pick the simulator destination dynamically — the previous hard-coded
# `name=iPhone SE,OS=17.2` broke silently when the installed runtime was
# named, e.g., `iPhone SE (2nd generation),OS=17.2`. The Python selector
# is unit-tested (`test_select_ios_simulator.py`) and reads
# `xcrun simctl list -j devices available`. Override with `IOS_DEST` to
# pin a specific target in CI.
if [ -n "${IOS_DEST:-}" ]; then
  DEST="${IOS_DEST}"
else
  DEST=$(python3 ../../scripts/select_ios_simulator.py)
fi
echo "ios:build → destination: ${DEST}"

xcodebuild \\
  -project EpubToMp3.xcodeproj \\
  -scheme EpubToMp3 \\
  -configuration Debug \\
  -destination "${DEST}" \\
  -derivedDataPath ./.build \\
  build | tail -20
"""

[tasks."ios:device:run"]
description = "Install and launch the newest existing iphoneos EpubToMp3.app on the paired iPhone; never downloads or boots simulators"
run = """
#!/bin/bash
set -euo pipefail
cd ios/EpubToMp3
DEVICE="${IOS_DEVICE_ID:-44B2CFBD-2193-5086-8E8D-BF7A2876C321}"
BUNDLE_ID="com.pietrocode.epubtomp3"
APP_PATH="${IOS_APP_PATH:-}"
if [[ -z "$APP_PATH" ]]; then
  APP_PATH=$(python3 - <<'PY'
from pathlib import Path
apps = [p for p in Path('.').glob('.build*/Build/Products/*-iphoneos/EpubToMp3.app') if p.is_dir()]
if not apps:
    raise SystemExit(1)
apps.sort(key=lambda p: p.stat().st_mtime, reverse=True)
print(apps[0])
PY
  ) || {
    echo "ios:device:run error: no existing iphoneos EpubToMp3.app found." >&2
    echo "Build on CI/release workflow or provide IOS_APP_PATH=/path/to/EpubToMp3.app." >&2
    echo "This task intentionally does not download simulator runtimes or boot CoreSimulator." >&2
    exit 2
  }
fi
if [[ ! -d "$APP_PATH" ]]; then
  echo "ios:device:run error: app not found: $APP_PATH" >&2
  exit 2
fi
echo "ios:device:run → device: $DEVICE"
echo "ios:device:run → app: $APP_PATH"
xcrun devicectl device install app --device "$DEVICE" "$APP_PATH"
xcrun devicectl device process launch --device "$DEVICE" --terminate-existing "$BUNDLE_ID"
"""

[tasks."ios:device:test"]
description = "Build-for-testing + run UITests on the paired iPhone (real device). Set IOS_TESTS=... to filter, e.g. EpubToMp3UITests/ReaderFlickerUITests"
run = """
#!/bin/bash
set -euo pipefail
cd ios/EpubToMp3
DEVICE="${IOS_DEVICE_ID:-00008140-001128A022BA801C}"
DD="./.build-device"
ONLY=""
if [[ -n "${IOS_TESTS:-}" ]]; then
  IFS=',' read -ra T <<< "$IOS_TESTS"
  for t in "${T[@]}"; do ONLY+=" -only-testing:$t"; done
fi
echo "ios:device:test → device: $DEVICE"
if [[ "${IOS_SKIP_BUILD:-0}" != "1" ]]; then
  xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \\
    -destination "id=$DEVICE" -derivedDataPath "$DD" build-for-testing | tail -5
fi
# shellcheck disable=SC2086
xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 \\
  -destination "id=$DEVICE" -derivedDataPath "$DD" $ONLY \\
  test-without-building 2>&1 | grep -iE "Test Suite|Test Case|passed|failed|error:|XCTAssert|skip|flicker" || true
"""

# ── Docker ───────────────────────────────────────────────────────────────────────

[tasks."docker:build"]
description = "Build Docker image for self-hosting (same as HF Spaces)"
run = "docker build -t epub-to-mp3:local ."

[tasks."docker:run"]
description = "Run Docker image locally on port 7860"
run = "docker run --rm -p 7860:7860 epub-to-mp3:local"

# ── Mobile (Capacitor) ──────────────────────────────────────────────────────────

[tasks."mobile:build"]
description = "Build mobile web bundle (HF Spaces backend) — no Xcode/Android Studio needed locally"
dir = "web"
run = "npm run build:mobile"

[tasks."mobile:init"]
description = "Initialize Capacitor platforms (run once; native .ipa/.apk built by CI, not locally)"
dir = "web"
run = """
#!/bin/bash
set -euo pipefail
npm install
npx cap add ios || true
npx cap add android || true
npm run build:mobile
"""

# ── Tests ────────────────────────────────────────────────────────────────────────

[tasks."test:web"]
description = "Run web lint + test + build"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

(cd web && mise exec -- npm run lint)
(cd web && mise exec -- npm run test)
(cd web && mise exec -- npm run build)
"""

# ── Release ───────────────────────────────────────────────────────────────────────

[tasks.bump]
description = "Bump version (major|minor|patch|X.Y.Z), update changelog, commit and tag"
run = "bash scripts/bump.sh ${1:-patch}"

[tasks.changelog]
description = "Regenerate CHANGELOG.md from git history using git-cliff"
run = "git-cliff -o CHANGELOG.md"

[tasks."flutter:run"]
description = "Run the Flutter companion app on the connected device"
run = "cd flutter_app && flutter run"

[tasks."flutter:test"]
description = "Run Flutter unit + widget tests"
run = "cd flutter_app && flutter test"

[tasks."flutter:analyze"]
description = "Static analysis of the Flutter app (lints + type errors)"
run = "cd flutter_app && flutter analyze"

[tasks."flutter:build-apk-debug"]
description = "Build a debug APK for Android"
run = "cd flutter_app && flutter build apk --debug"

[tasks."flutter:build-linux"]
description = "Build the Flutter Linux desktop app (release)"
run = "cd flutter_app && flutter build linux --release"

[tasks."flutter:build-windows"]
description = "Build the Flutter Windows desktop app (release)"
run = "cd flutter_app && flutter build windows --release"

[tasks."flutter:build-apk"]
description = "Build the Flutter Android APK (release)"
run = "cd flutter_app && flutter build apk --release"

[tasks."android:bootstrap-python"]
description = "Sync python_app/src into the Flutter Android Chaquopy source set"
run = "bash flutter_app/scripts/bootstrap-android-python.sh"

[tasks."desktop:bootstrap-python"]
description = "Sync python_app/src into flutter_app/assets/python_app for Linux/Windows desktop builds"
run = "bash flutter_app/scripts/bootstrap-desktop-python.sh"

[tasks."flutter:run-desktop"]
description = "Run the Flutter desktop app on the host platform (Linux/Windows only)"
run = "cd flutter_app && flutter run -d $(uname | tr '[:upper:]' 'a-z')"
