[tools]
# Latest stable Node accepted by the Rails browser runtime tooling.
node = "26.13.0"
npm = "12.2.2"
# Project-managed Codex CLI; invoke through mise independently of app installs.
# Update from the repository root with: mise use --pin npm:@openai/codex@latest
# Do not use Codex's global npm/pnpm updater for this mise-owned installation.
"npm:@openai/codex" = "latest"
# Match the published compiler, target libraries and build receipts.
rust = "1.99.1"
ruby = "4.0.7"
# Changelog generator (conventional commits → CHANGELOG.md)
"aqua:orhun/git-cliff" = "2.14.2"
# Git LFS is required by the offline host/CI transport contracts.
"aqua:git-lfs/git-lfs" = "3.8.1"
# WASM CLI schema must match wasm-bindgen in Cargo.lock; update both together.
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
# Flutter SDK for the cross-platform companion app under flutter_app/.
flutter = { version = "3.47.9", os = ["linux", "windows"] }
# Java + Android SDK for the Flutter Android target. android-sdk plugin
# requires JAVA_HOME to be set; mise handles that when java is in [tools].
java = { version = "21.0.2", os = ["linux"] }
android-sdk = { version = "11.0", os = ["linux"] }
ninja = "1.13.2"

[settings]
# Provision project tools only from published binaries.
all_compile = false
node.compile = false
ruby.compile = false

[env]
# Development uses Xcode 16 without changing the system selection used by Homebrew.
DEVELOPER_DIR = "{% if os() == 'macos' %}{{ exec(command='ruby scripts/xcode_build_paths.rb developer') }}{% else %}{{ env.DEVELOPER_DIR | default(value='') }}{% endif %}"
# Reuse the GUI workspace cache; SDK/configuration subdirectories stay isolated.
APPLE_DERIVED_DATA_PATH = "{% if os() == 'macos' %}{{ exec(command='ruby scripts/xcode_build_paths.rb derived-data') }}{% else %}{{ config_root }}/ios/EpubToMp3/.build{% endif %}"

[tasks."hf:snapshot"]
description = "Prepare an allowlisted Space snapshot with snapshot-local Git LFS"
run = "ruby scripts/hf_snapshot.rb"

[tasks."hf:snapshot:test"]
description = "Exercise actual offline Git/LFS transport and snapshot rejection"
run = "ruby scripts/test_hf_snapshot.rb"

[tasks.dev]
description = "Start the Rails web client (port 3000); DEV_RUST_SERVER=1 also starts the optional Rust converter server"
run = "./scripts/dev.sh"

[tasks."rust:health"]
description = "Run the Rust health-only CLI"
run = "mise exec -- ruby scripts/native_build_command.rb -- mise exec -- cargo run -p converter-cli"

[tasks."rust:server"]
description = "Run the Rust Axum health and metadata server"
run = "PIPER_MODEL=\"$MISE_PROJECT_ROOT/models/piper/en_US-lessac-medium.onnx\" bash scripts/dev_backend.sh"

[tasks.convert]
description = "Build/package and run the native Rust CLI with its own runtime and phonemizer assets"
run = "mise exec -- ruby scripts/package_rust_cli.rb --run --"

[tasks."cli:package"]
description = "Package the native Rust CLI; macOS preserves deployment target 12 and needs no Python runtime"
run = "mise exec -- ruby scripts/package_rust_cli.rb --package-only"

[tasks."rails:web:runtime-build"]
description = "Build the Rails web client's generated runtime tree (Rust/WASM and pinned TTS libraries) under the native build supervisor"
run = '''
set -eu
tool_dirs="$(mise bin-paths ruby node npm rust github:wasm-bindgen/wasm-bindgen | paste -sd: -)"
mise exec -- ruby scripts/native_build_command.rb --build-dir "${CARGO_TARGET_DIR:-${CARGO_BUILD_TARGET_DIR:-target}}" --build-dir ruby_app/rails_gateway/public/runtime -- env PATH="$tool_dirs:$PATH" bash ruby_app/rails_gateway/bin/build-runtime
'''

[tasks."rails:web:test"]
description = "Run the Rails web client tests with at most two workers; uses the fixture runtime unless CONVERTER_RUNTIME=built"
dir = "{{config_root}}/ruby_app/rails_gateway"
run = '''
set -eu
# $0 is the prefix that runs one tool; its words are split on purpose.
suite='$0 ruby bin/rails test:all && $0 node --import ./browser_runtime/importmap_resolver.mjs --test --test-concurrency=2 "browser_runtime/*.test.mjs"'
# Rails system tests drive Chromium: on macOS they are one heavy job under the
# shared host lease. The shell that runs the suite keeps the
# lease; the test runners start without it, so a browser left behind by a
# cancelled run cannot hold it. Other hosts run the suite as before.
if [ "$(uname -s)" = Darwin ]; then
  exec mise exec -- ruby ../../scripts/native_job.rb heavy -- sh -euc "$suite" "mise exec -- ruby ../../scripts/without_native_lease.rb"
fi
sh -euc "$suite" "mise exec --"
'''

[tasks."migration:product-boundary-audit"]
description = "Exercise embedded Flutter runtime contracts"
run = "bash scripts/check_direct_runtime_boundary.sh"

[tasks."guard:no-python-production"]
description = "Fail if production packaging reintroduces the legacy Python runtime or bridge"
run = "bash scripts/guard_no_python_production.sh"

[tasks."migration:build-and-gate"]
description = "Build Rust production artifacts and run the migration readiness gate"
run = "mise exec -- ruby scripts/native_build_command.rb -- mise exec -- cargo build -p converter-cli -p converter-server --release && mise run check:rust-migration"

[tasks."check:rust-migration"]
description = "Check Rust migration readiness, packaging artifacts, and remaining blockers"
run = "bash scripts/check_rust_migration_gate.sh"

[tasks."converter-ffi:validate"]
description = "Validate converter-ffi native target mapping and artifact names on the host"
run = "mise exec -- ruby scripts/validate_converter_ffi_targets.rb"

[tasks."converter-ffi:targets"]
description = "List converter-ffi native target mappings and exact output paths"
run = "mise exec -- ruby scripts/build_converter_ffi.rb --list"

[tasks."native:build:preflight"]
description = "Report Mac or Arch free disk space for native compilation; advisory, never blocks"
run = "ruby scripts/mac_build_budget.rb check"

[tasks."native:status"]
description = "Show who holds the heavy-job lease and the current host readings with their advisory notes; read-only"
run = "mise exec -- ruby scripts/native_job.rb status"

[tasks."models:catalog:test"]
description = "Verify model catalog and atomic/checksummed installation contracts without downloading models"
run = "ruby scripts/native_job.rb build -- mise exec -- cargo test -p converter-core --lib model_ --jobs 1"

[tasks."host:workflow:test"]
description = "Run fail-fast host workflow regressions with exact logs; no native build or Simulator"
run = "ruby scripts/run_host_checks.rb"

[tasks."tts:benchmark:test"]
description = "Verify isolated terminal TTS measurement, cancellation, export and report tooling"
run = "ruby scripts/run_host_checks.rb --suite scripts/test_tts_book_benchmark.rb --suite scripts/test_tts_parallel_benchmark.rb --suite scripts/test_tts_mp3_export_probe.rb --suite scripts/test_tts_pocket_http_probe.rb --suite scripts/test_tts_gradio_probe.rb --suite scripts/test_tts_chapter_benchmark.rb --suite scripts/test_tts_seek_benchmark.rb --suite scripts/test_tts_chapter_finalize.rb --suite scripts/test_tts_benchmark_consolidate.rb"

[tasks."git:hygiene:test"]
description = "Verify ignore rules and index-only cleanup through real Git in temporary repositories"
run = "ruby scripts/test_git_hygiene.rb"

[tasks."ios:simulator:supervised"]
description = "Bounded Intel iOS 15.2 SE launch with resource notes, deadlines and verified cleanup"
run = "ruby scripts/simulator_safe_run.rb"

[tasks."ios:simulator:safety:test"]
description = "Verify Simulator resource refusal, deadlines, ownership and watchdog cleanup without booting"
run = "ruby scripts/run_host_checks.rb --suite scripts/test_simulator_resources.rb --suite scripts/test_simulator_session.rb --suite scripts/test_simulator_backend.rb --suite scripts/test_simulator_cli.rb --suite scripts/test_onnxruntime_simulator_jobs.rb --suite scripts/test_simulator_test_backend.rb"

[tasks."converter-ffi:build"]
description = "Build the shared converter-ffi Rust library for the host"
depends = ["onnxruntime:host"]
run = '''
mise exec -- ruby scripts/native_build_command.rb --build-dir "${CARGO_TARGET_DIR:-${CARGO_BUILD_TARGET_DIR:-target}}" --build-dir "target/espeak-data" -- mise exec -- ruby -r ./scripts/native_job.rb -e '
if RUBY_PLATFORM.include?("darwin")
  runtime = IO.popen(["mise", "exec", "--", "ruby", "scripts/prepare_onnxruntime_macos.rb"], NativeJob.child_options, &:read).strip
  abort "Failed to prepare Intel ONNX Runtime" unless $?.success? && runtime.start_with?("/")
  ENV["ORT_LIB_LOCATION"] = runtime
  ENV["ORT_PREFER_DYNAMIC_LINK"] = "1"
  ENV["MACOSX_DEPLOYMENT_TARGET"] = "12.0"
  ENV.delete("SDKROOT")
end
commands = [
  ["cargo", "build", "-p", "espeak-rs-sys", "--features", "compile-espeak-intonations", "--target-dir", "target/espeak-data", "--jobs", NativeJob.build_jobs.to_s],
  ["cargo", "build", "-p", "converter-ffi", "--release", "--features", "piper-runtime", "--jobs", NativeJob.build_jobs.to_s]
]
commands.each { |command| exit($?.exitstatus || 1) unless system("mise", "exec", "--", *command) }
if RUBY_PLATFORM.include?("darwin")
  require "rubygems/version"
  load_commands = IO.popen(["xcrun", "otool", "-l", "target/release/libconverter_ffi.dylib"], &:read)
  minimum = load_commands[/\bminos\s+(\S+)/, 1] || load_commands[/LC_VERSION_MIN_MACOSX\s+cmdsize\s+\d+\s+version\s+(\S+)/m, 1]
  abort "converter-ffi exceeds the macOS 12 deployment target: #{minimum.inspect}" unless minimum && Gem::Version.new(minimum) <= Gem::Version.new("12.0")
end

'
'''

[tasks."converter-ffi:build:local"]
description = "Local-only host converter-ffi for the Debug Mac loop (target/local-dev, never release); skips cargo when Rust inputs are unchanged"
depends = ["onnxruntime:host"]
run = "mise exec -- ruby scripts/converter_ffi_local_build.rb"

[tasks."piper:phonemes:test"]
description = "Test Piper punctuation and voice isolation with embedded eSpeak, without ONNX or a model"
run = "mise exec -- ruby scripts/native_build_command.rb -- mise exec -- cargo test -p espeak-rs --locked --jobs 1"

[tasks."native-tts:rust:test"]
description = "Verify platform speech policy, native PCM encoding and C callback under the shared lease"
run = '''
mise exec -- ruby scripts/native_build_command.rb --build-dir "${CARGO_TARGET_DIR:-${CARGO_BUILD_TARGET_DIR:-target}}" -- mise exec -- ruby -e '
commands = [
  ["cargo", "test", "-p", "converter-core", "--lib", "platform_tts", "--jobs", "1"],
  ["cargo", "test", "-p", "converter-core", "--lib", "worker::tests", "--jobs", "1"],
  ["cargo", "test", "-p", "converter-ffi", "--lib", "platform_callback", "--jobs", "1"],
  ["cargo", "test", "-p", "converter-ffi", "--lib", "--features", "android-jni", "platform_chunk", "--jobs", "1"],
  ["cargo", "build", "-p", "converter-ffi", "--jobs", "1"]
]
commands.each { |command| exit($?.exitstatus || 1) unless system("mise", "exec", "--", *command) }
'
'''

[tasks."tts:preferences:test"]
description = "Verify shared TTS selection, provider policy, CLI and FFI regressions serially"
depends = ["onnxruntime:host"]
run = "mise exec -- ruby scripts/verify_tts_preferences.rb"

[tasks."onnxruntime:macos12"]
description = "Explicit source-build fallback for the CPU inference runtime on macOS 12"
run = "mise exec -- bash scripts/build_onnxruntime_macos.sh"

[tasks."onnxruntime:host"]
description = "Install the verified prebuilt host inference runtime without compiling ONNX"
run = "mise exec -- ruby -r ./scripts/native_job.rb -e 'exit(0) unless RUBY_PLATFORM.include?(\"darwin\"); exit NativeJob.run(phase: \"build\", command: [RbConfig.ruby, \"scripts/fetch_onnxruntime_macos.rb\"])'"

[tasks."tts:portable:test"]
description = "Verify portable Rust audio, WASM, web and Flutter paths with retained logs"
run = "mise exec -- ruby scripts/verify_portable_tts.rb"

[tasks."converter-ffi:android-arm64"]
description = "Build embedded Piper and JNI for Android ARM64 under the native lease"
run = "mise exec -- ruby scripts/build_converter_ffi_android.rb"

[tasks."converter-ffi:ios-device"]
description = "Build converter-ffi for iOS device with the Xcode SDK deployment target"
run = '''
exec mise exec -- ruby scripts/native_job.rb --build-dir "${CARGO_TARGET_DIR:-${CARGO_BUILD_TARGET_DIR:-target}}" --build-dir "target/espeak-data" build -- bash -euo pipefail <<'NATIVE_BUILD'
# Build architecture-independent phonemizer assets with the host SDK, before
# configuring any device compiler variables. Preserve the device build below.
MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path)
HOST_CLANG=$(xcrun --sdk macosx --find clang)
HOST_CLANGXX=$(xcrun --sdk macosx --find clang++)
env -u SDKROOT -u IPHONEOS_DEPLOYMENT_TARGET -u CARGO_BUILD_TARGET \
  -u RUSTFLAGS -u CARGO_ENCODED_RUSTFLAGS -u CMAKE_TOOLCHAIN_FILE \
  -u EPUB2MP3_APPLE_SDK -u EPUB2MP3_APPLE_CLANG_TARGET \
  -u BINDGEN_EXTRA_CLANG_ARGS -u BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios \
  SDKROOT="$MACOS_SDK" MACOSX_DEPLOYMENT_TARGET=12.0 \
  CC="$HOST_CLANG" CXX="$HOST_CLANGXX" CFLAGS="-isysroot $MACOS_SDK" CXXFLAGS="-isysroot $MACOS_SDK" \
  CC_x86_64_apple_darwin="$HOST_CLANG" CFLAGS_x86_64_apple_darwin="-isysroot $MACOS_SDK" \
  CC_aarch64_apple_darwin="$HOST_CLANG" CFLAGS_aarch64_apple_darwin="-isysroot $MACOS_SDK" \
  RUSTC="$(mise exec -- rustup which rustc)" \
  mise exec -- cargo build -p espeak-rs-sys --features compile-espeak-intonations \
  --target-dir "$MISE_PROJECT_ROOT/target/espeak-data" --jobs 1 || exit $?
MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path) && HOST_CLANG=$(xcrun --sdk macosx --find clang) && SDK=$(xcrun --sdk iphoneos --show-sdk-path) && CLANG_DIR=$(dirname "$(xcrun --sdk iphoneos --find clang)") && CLANG_WRAPPER="$MISE_PROJECT_ROOT/scripts/apple_target_clang.sh" && IPHONEOS_DEPLOYMENT_TARGET=15.0 EPUB2MP3_APPLE_SDK=iphoneos EPUB2MP3_APPLE_CLANG_TARGET=arm64-apple-ios15.0 CC_x86_64_apple_darwin="$HOST_CLANG" CFLAGS_x86_64_apple_darwin="-isysroot $MACOS_SDK" CC_aarch64_apple_darwin="$HOST_CLANG" CFLAGS_aarch64_apple_darwin="-isysroot $MACOS_SDK" CC_aarch64_apple_ios="$CLANG_WRAPPER" CFLAGS_aarch64_apple_ios="-target arm64-apple-ios15.0 -isysroot $SDK" RUSTC=$(mise exec -- rustup which rustc) BINDGEN_EXTRA_CLANG_ARGS="--target=arm64-apple-ios15.0 --sysroot=$SDK -include stdio.h" BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="--target=arm64-apple-ios15.0 --sysroot=$SDK -include stdio.h" PATH="$CLANG_DIR:$PATH" mise exec -- cargo --config 'target.aarch64-apple-ios.linker="clang"' --config "target.aarch64-apple-ios.rustflags=[\"-C\",\"link-arg=-isysroot\",\"-C\",\"link-arg=$SDK\"]" build -p converter-ffi --release --features piper-runtime --target aarch64-apple-ios --jobs 1
NATIVE_BUILD
'''

[tasks."converter-ffi:ios-device:verify"]
description = "Verify the iOS converter-ffi Mach-O architecture, platform, and exported ABI"
run = "bash scripts/verify_converter_ffi_ios.sh"

[tasks."converter-ffi:ios-simulator"]
description = "Build host iOS Simulator Rust under shared lease; Debug by default, CONVERTER_FFI_BUILD_PROFILE=release for Release"
run = '''
# Xcode exports its selected iOS Simulator SDK as SDKROOT to build phases.
# This driver is a host-side Swift script; let Swift select the macOS SDK.
mise exec -- ruby scripts/native_job.rb --build-dir "${CARGO_TARGET_DIR:-${CARGO_BUILD_TARGET_DIR:-target}}" --build-dir "target/espeak-data" build -- env -u SDKROOT xcrun swift -e '
import Foundation
import Darwin
let simulator = Process()
simulator.executableURL = URL(fileURLWithPath: "/usr/bin/xcrun")
simulator.arguments = ["simctl", "list", "devices", "booted", "-j"]
let pipe = Pipe(); simulator.standardOutput = pipe
try simulator.run()
let data = pipe.fileHandleForReading.readDataToEndOfFile()
simulator.waitUntilExit()
guard simulator.terminationStatus == 0,
      let json = try JSONSerialization.jsonObject(with: data) as? [String: Any],
      let devices = json["devices"] as? [String: [[String: Any]]],
      devices.values.flatMap({ $0 }).isEmpty else {
    fputs("Shut down Simulator before compiling Rust.\n", stderr); exit(75)
}
#if arch(x86_64)
let target = "x86_64-apple-ios"
#else
let target = "aarch64-apple-ios-sim"
#endif
let child = Process()
child.executableURL = URL(fileURLWithPath: "/usr/bin/env")
child.arguments = ["mise", "exec", "--", "rustup", "run", "stable", "cargo", "build", "--locked", "-p", "converter-ffi", "--target", target, "--jobs", "1"]
if ProcessInfo.processInfo.environment["CONVERTER_FFI_ENABLE_PIPER"] != "0" {
    child.arguments?.insert(contentsOf: ["--features", "piper-runtime"], at: 8)
}
var environment = ProcessInfo.processInfo.environment
switch environment["CONVERTER_FFI_BUILD_PROFILE"] ?? "debug" {
case "debug": break
case "release": child.arguments?.append("--release")
default: fputs("Unsupported Rust build profile.\n", stderr); exit(2)
}
let compiler = Process()
compiler.executableURL = URL(fileURLWithPath: "/usr/bin/env")
compiler.arguments = ["mise", "exec", "--", "rustup", "which", "rustc"]
let compilerPipe = Pipe(); compiler.standardOutput = compilerPipe
try compiler.run()
let compilerPath = String(data: compilerPipe.fileHandleForReading.readDataToEndOfFile(), encoding: .utf8)?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
compiler.waitUntilExit()
guard compiler.terminationStatus == 0 && compilerPath.hasPrefix("/") else { exit(2) }
environment["RUSTC"] = compilerPath
environment["IPHONEOS_DEPLOYMENT_TARGET"] = "15.0"
let root = ProcessInfo.processInfo.environment["MISE_PROJECT_ROOT"] ?? FileManager.default.currentDirectoryPath
if ProcessInfo.processInfo.environment["CONVERTER_FFI_ENABLE_PIPER"] != "0" {
    let dataBuilder = Process()
    dataBuilder.executableURL = URL(fileURLWithPath: "/usr/bin/env")
    dataBuilder.arguments = ["mise", "-C", root, "exec", "--", "cargo", "build", "-p", "espeak-rs-sys", "--features", "compile-espeak-intonations", "--target-dir", root + "/target/espeak-data"]
    var dataEnvironment = ProcessInfo.processInfo.environment
    dataEnvironment["RUSTC"] = compilerPath
    dataBuilder.environment = dataEnvironment
    try dataBuilder.run(); dataBuilder.waitUntilExit()
    guard dataBuilder.terminationStatus == 0 else { exit(dataBuilder.terminationStatus) }
}
// A caller may supply an authenticated, platform-verified ONNX library.
// Keep source compilation as the fallback when no library was supplied.
if target == "x86_64-apple-ios" && ProcessInfo.processInfo.environment["CONVERTER_FFI_ENABLE_PIPER"] != "0"
    && (environment["ORT_LIB_LOCATION"] ?? "").isEmpty {
    let runtimeBuilder = Process()
    runtimeBuilder.executableURL = URL(fileURLWithPath: "/usr/bin/env")
    runtimeBuilder.arguments = ["bash", root + "/scripts/build_onnxruntime_ios_simulator.sh"]
    let runtimePipe = Pipe(); runtimeBuilder.standardOutput = runtimePipe
    try runtimeBuilder.run()
    let runtimePath = String(data: runtimePipe.fileHandleForReading.readDataToEndOfFile(), encoding: .utf8)?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
    runtimeBuilder.waitUntilExit()
    guard runtimeBuilder.terminationStatus == 0 && runtimePath.hasPrefix("/") else { exit(2) }
    // ort-sys rc11 expects the directory containing the shared library itself.
    environment["ORT_LIB_LOCATION"] = runtimePath + "/Release-iphonesimulator"
    environment["ORT_PREFER_DYNAMIC_LINK"] = "1"
    environment["ORT_SKIP_DOWNLOAD"] = "1"
}
let sdk = Process()
sdk.executableURL = URL(fileURLWithPath: "/usr/bin/xcrun")
sdk.arguments = ["--sdk", "iphonesimulator", "--show-sdk-path"]
let sdkPipe = Pipe(); sdk.standardOutput = sdkPipe
try sdk.run()
let sdkPath = String(data: sdkPipe.fileHandleForReading.readDataToEndOfFile(), encoding: .utf8)?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
sdk.waitUntilExit()
guard sdk.terminationStatus == 0 && sdkPath.hasPrefix("/") else { exit(2) }
let clangTarget = target == "aarch64-apple-ios-sim" ? "arm64-apple-ios15.0-simulator" : "x86_64-apple-ios15.0-simulator"
environment["BINDGEN_EXTRA_CLANG_ARGS"] = "--target=\(clangTarget) --sysroot=\(sdkPath) -I\(sdkPath)/usr/include -include stdio.h"
let clang = Process()
clang.executableURL = URL(fileURLWithPath: "/usr/bin/xcrun")
clang.arguments = ["--sdk", "iphonesimulator", "--find", "clang"]
let clangPipe = Pipe(); clang.standardOutput = clangPipe
try clang.run()
let clangPath = String(data: clangPipe.fileHandleForReading.readDataToEndOfFile(), encoding: .utf8)?.trimmingCharacters(in: .whitespacesAndNewlines) ?? ""
clang.waitUntilExit()
guard clang.terminationStatus == 0 && clangPath.hasPrefix("/") else { exit(2) }
environment["EPUB2MP3_APPLE_SDK"] = "iphonesimulator"
environment["EPUB2MP3_APPLE_CLANG_TARGET"] = clangTarget
environment["CC_\(target.replacingOccurrences(of: "-", with: "_"))"] = clangPath
environment["CFLAGS_\(target.replacingOccurrences(of: "-", with: "_"))"] = "-target \(clangTarget) --sysroot=\(sdkPath)"
let cargoConfig = "target.\(target).rustflags=[\"-C\",\"link-arg=-isysroot\",\"-C\",\"link-arg=\(sdkPath)\"]"
child.arguments?.insert(contentsOf: ["--config", "target.\(target).linker=\"clang\"", "--config", cargoConfig], at: 7)
environment["PATH"] = URL(fileURLWithPath: clangPath).deletingLastPathComponent().path + ":" + (environment["PATH"] ?? "")
child.environment = environment
try child.run(); child.waitUntilExit(); exit(child.terminationStatus)
'
'''

[tasks."apple:chapter-callback:test"]
description = "Run focused native macOS chapter-event path/delivery regressions, one job under the shared lease"
run = '''
mise exec -- ruby scripts/native_job.rb --build-dir "$APPLE_DERIVED_DATA_PATH" build -- xcrun swift -e '
import Foundation
import Darwin
let child = Process()
child.executableURL = URL(fileURLWithPath: "/usr/bin/xcrun")
child.arguments = ["xcodebuild", "-quiet", "-project", "ios/EpubToMp3/EpubToMp3.xcodeproj",
"-scheme", "EpubToMp3Mac", "-destination", "platform=macOS", "-derivedDataPath", ProcessInfo.processInfo.environment["APPLE_DERIVED_DATA_PATH"]!,
"-jobs", "1", "-parallel-testing-enabled", "NO",
"-only-testing:EpubToMp3Tests/RustConversionCoordinatorTests/testChapterEventPreservesLiteralLocalAudioPath",
"-only-testing:EpubToMp3Tests/RustConversionCoordinatorTests/testValidatedChapterEventMapsToPlayableLocalSnapshot",
"-only-testing:EpubToMp3Tests/DeviceConversionBenchmarkTests/testChapterDeliveryRejectionExplainsEveryGuardWithoutNetwork", "test"]
if let filters = ProcessInfo.processInfo.environment["APPLE_NATIVE_TESTS"] {
    let selections = filters.split(separator: ",").map(String.init)
    guard !selections.isEmpty && selections.allSatisfy({ $0.hasPrefix("EpubToMp3Tests/") }) else { exit(2) }
    child.arguments = Array(child.arguments!.dropLast(4)) + selections.map { "-only-testing:\($0)" } + ["test"]
}
if ProcessInfo.processInfo.environment["APP_FOUNDATION_LIVE_EDGE"] == "1",
   let library = ProcessInfo.processInfo.environment["APP_FOUNDATION_FFI_LIBRARY"], !library.isEmpty {
    child.arguments?.insert(contentsOf: [
        "APP_FOUNDATION_LIVE_EDGE=1", "APP_FOUNDATION_FFI_LIBRARY=\(library)"
    ], at: child.arguments!.count - 1)
}
if ProcessInfo.processInfo.environment["EPUB2MP3_NATIVE_TTS_TEST"] == "1" {
    child.arguments?.insert("EPUB2MP3_NATIVE_TTS_TEST=1", at: child.arguments!.count - 1)
}
for key in ["EPUB2MP3_PIPER_TEST_MODEL_ROOT", "APP_FOUNDATION_FFI_LIBRARY"] {
    if let value = ProcessInfo.processInfo.environment[key], !value.isEmpty {
        child.arguments?.insert("\(key)=\(value)", at: child.arguments!.count - 1)
    }
}
try child.run(); child.waitUntilExit(); exit(child.terminationStatus)
'
'''

[tasks."converter-ffi:ios-packaging:test"]
description = "Verify real device/Simulator artifacts, reject wrong platforms and exercise signed bundling under native host safeguards"
run = """
#!/bin/bash
set -euo pipefail
mise exec -- ruby "${MISE_PROJECT_ROOT:-.}/scripts/native_job.rb" build -- bash "${MISE_PROJECT_ROOT:-.}/scripts/test_converter_ffi_ios_packaging.sh"
"""

[tasks."converter-ffi:android-check"]
description = "Check JNI and embedded Piper adapter on the host; Android ELF validation is a separate packaging gate"
