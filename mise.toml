[tasks.changelog]
description = "Regenerate CHANGELOG.md from git history using git-cliff"
run = "git-cliff -o CHANGELOG.md"

[tasks."flutter:run"]
description = "Run Flutter in Debug on a connected Android device, or start the lightest available AVD"
run = """
#!/bin/bash
set -euo pipefail
SELECTOR="${MISE_PROJECT_ROOT:-.}/scripts/select_android_target.py"
DEVICE="${FLUTTER_DEVICE_ID:-}"
if [[ -z "$DEVICE" ]]; then
  DEVICES_JSON="$(mise exec -- flutter devices --machine)"
  DEVICE="$(printf '%s' "$DEVICES_JSON" | mise exec -- python "$SELECTOR" --devices-json || true)"
fi
if [[ -z "$DEVICE" ]]; then
  AVD="$(mise exec -- python "$SELECTOR" --lightest-avd)" || {
    echo "flutter:run error: no Android device or AVD is available." >&2
    exit 2
  }
  echo "flutter:run → starting lightest AVD: $AVD"
  mise exec -- emulator -avd "$AVD" -no-boot-anim -no-snapshot >/tmp/epub-to-mp3-android-emulator.log 2>&1 &
  for _ in $(seq 1 90); do
    DEVICES_JSON="$(mise exec -- flutter devices --machine)"
    DEVICE="$(printf '%s' "$DEVICES_JSON" | mise exec -- python "$SELECTOR" --devices-json || true)"
    [[ -n "$DEVICE" ]] && break
    sleep 2
  done
fi
if [[ -z "$DEVICE" ]]; then
  echo "flutter:run error: Android emulator did not become available within 180 seconds." >&2
  exit 1
fi
echo "flutter:run → device: $DEVICE"
cd flutter_app
mise exec -- flutter run -d "$DEVICE"
"""

[tasks."flutter:test"]
description = "Run Flutter unit + widget tests"
run = "cd flutter_app && flutter test"

[tasks."flutter:analyze"]
description = "Static analysis of the Flutter app (lints + type errors)"
run = "cd flutter_app && flutter analyze"

[tasks."flutter:build-apk-debug"]
description = "Build a debug APK for Android using Flutter's incremental build cache"
run = "cd flutter_app && flutter build apk --debug --build-number=${FLUTTER_BUILD_NUMBER:-1} --no-pub"

[tasks."flutter:build-linux"]
description = "Build the Flutter Linux desktop app (release)"
run = "cd flutter_app && flutter build linux --release"

[tasks."flutter:build-windows"]
description = "Build the Flutter Windows desktop app (release)"
run = "cd flutter_app && flutter build windows --release"

[tasks."flutter:build-apk"]
description = "Build the Flutter Android APK (release)"
run = "cd flutter_app && flutter build apk --release --no-pub"

[tasks."flutter:build-apk-debug:clean"]
description = "Explicitly clean Flutter Android artifacts before a debug build"
run = "cd flutter_app && flutter clean && flutter build apk --debug --build-number=${FLUTTER_BUILD_NUMBER:-1}"

[tasks."android:bootstrap-python"]
description = "Sync python_app/src into the Flutter Android Chaquopy source set"
run = "bash flutter_app/scripts/bootstrap-android-python.sh"

[tasks."desktop:bootstrap-python"]
description = "Sync python_app/src into flutter_app/assets/python_app for Linux/Windows desktop builds"
run = "bash flutter_app/scripts/bootstrap-desktop-python.sh"

[tasks."flutter:run-desktop"]
description = "Run the Flutter desktop app on the host platform (Linux/Windows only)"
run = "cd flutter_app && flutter run -d $(uname | tr '[:upper:]' 'a-z')"
[tasks."piper:build-runtime"]
description = "Build the native Piper Embedded runtime without external executable fallback"
run = "mise exec -- cargo build -p piper-runtime --features onnxruntime,piper-inference --release"
