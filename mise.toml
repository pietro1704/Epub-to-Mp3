[tasks."hooks-test"]
description = "Validate repository and Claude Code hook scripts"
run = """
#!/bin/bash
set -euo pipefail

HOOKS_DIR=".claude/hooks"
ok=0
fail=0
for script in "$HOOKS_DIR"/*.sh .githooks/* scripts/reader-change-check.sh; do
    [[ -e "$script" ]] || continue
    name=$(basename "$script")
    if [[ ! -x "$script" ]]; then
        echo "❌ $name: not executable"
        ((fail++)) || true
        continue
    fi
    if bash -n "$script" 2>/tmp/hook_syntax_err; then
        echo "✅ $name: OK"
        ((ok++)) || true
    else
        echo "❌ $name: syntax error"
        cat /tmp/hook_syntax_err
        ((fail++)) || true
    fi
done
./scripts/test_reader_change_check.sh
echo ""
echo "Result: $ok OK, $fail failed"
[[ $fail -eq 0 ]]
"""

