[tools]
# Exact Python version required for Coqui TTS (requires 3.11)
python = { version = "3.11.11", virtualenv = ".venv" }
# Node LTS for frontend (Vite 7.x requires >=20.19.0)
node = "latest"
npm = "latest"
# Rust toolchain for Tauri desktop builds
rust = "stable"
# Tauri CLI — installed via mise npm backend, available as `tauri` globally
"npm:@tauri-apps/cli" = "2"
# Changelog generator (conventional commits → CHANGELOG.md)
"cargo:git-cliff" = "latest"
# Flutter SDK for the cross-platform companion app under flutter_app/.
flutter = "3.41.9"
# CocoaPods for the Flutter iOS target.
cocoapods = "1.16.2"
# Java + Android SDK for the Flutter Android target. android-sdk plugin
# requires JAVA_HOME to be set; mise handles that when java is in [tools].
java = "21.0.2"
android-sdk = "11.0"

[tasks.dev]
description = "Start backend (uvicorn) and frontend (Vite) together"
run = "./scripts/dev.sh"

[tasks.clean]
description = "Clean backend cache, pycache, and completed outputs"
run = """
#!/bin/bash
set -e

echo "🧹 Cleaning backend cache..."

# Remove __pycache__ directories
echo "  → Removing __pycache__..."
find python_app -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
find . -maxdepth 1 -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

# Remove .pyc files
echo "  → Removing .pyc files..."
find python_app -type f -name "*.pyc" -delete 2>/dev/null || true
find . -maxdepth 2 -type f -name "*.pyc" -delete 2>/dev/null || true

# Remove pytest cache
echo "  → Removing .pytest_cache..."
rm -rf .pytest_cache 2>/dev/null || true
rm -rf python_app/.pytest_cache 2>/dev/null || true

# Remove output directory (completed conversions) and job metadata/uploads
# Note: output/.* contains jobs, uploads, inputs that need to be cleaned
echo "  → Removing output files and jobs..."
rm -rf output/* 2>/dev/null || true
rm -rf output/.jobs output/.uploads output/.job_inputs output/.source_backups 2>/dev/null || true
rm -rf output/.cover_cache 2>/dev/null || true
# Also clean from root (may exist from older versions)
rm -rf .jobs .uploads .job_inputs 2>/dev/null || true

# Remove cached books but keep downloaded models
echo "  → Cleaning book cache (preserving models)..."
PYTHONPATH=python_app python - <<'PY'
from src.cache_manager import CacheManager

try:
    manager = CacheManager()
    removed = manager.clear_cache()
    msg = "    Book cache cleared." if removed else "    No book cache found."
    print(msg)
except Exception as exc:
    print(f"    ⚠️ Failed to clear cache: {exc}")
PY

# Remove mise cache
echo "  → Removing .mise-cache..."
rm -rf .mise-cache 2>/dev/null || true

echo "✅ Clean complete!"
echo ""
echo "Cleaned directories:"
echo "  - __pycache__"
echo "  - .pyc files"
echo "  - .pytest_cache"
echo "  - output/*"
echo "  - book cache (.cache/<book>), models preserved"
echo "  - .mise-cache"
"""

[tasks.install]
description = "Install Python and web dependencies (venv + npm)"
run = """
#!/bin/bash
set -euo pipefail

echo "📦 Installing dependencies with mise..."
mise install

echo "🐍 Creating .venv (Python managed by mise) if missing..."
if [ ! -x ".venv/bin/python" ]; then
  mise exec -- python -m venv .venv
fi

echo "🐍 Installing Python dependencies (root)..."
.venv/bin/python -m pip install -r requirements.txt

echo "🐍 Installing Python dependencies (python_app)..."
.venv/bin/python -m pip install -r python_app/requirements.txt

echo "🔍 Installing lint/format tools..."
.venv/bin/python -m pip install ruff pre-commit

echo "🎙️ Configuring native Piper..."
bash scripts/install_piper_binary.sh

echo "🌐 Installing web dependencies..."
(cd web && mise exec -- npm install)
"""

[tasks.test]
description = "Run unit + integration + web tests"
run = """
#!/bin/bash
set -euo pipefail

mise run test:unit
mise run test:integration
mise run test:desktop
mise run test:web
"""

[tasks."test:unit"]
description = "Run Python unit tests (excluding benchmarks)"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests test_ambiguous_languages.py test_new_features.py -k "not benchmark"
"""

[tasks."test:integration"]
description = "Run Python integration/benchmark-style tests"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests -k "benchmark"
"""

[tasks."trim-log"]
description = "Trim conversions.jsonl to last 500 entries to keep it fast"
run = """
#!/bin/bash
set -euo pipefail

LOG_FILE=".logs/conversions.jsonl"
if [[ ! -f "$LOG_FILE" ]]; then
    echo "No log file found at $LOG_FILE"
    exit 0
fi

python3 - "$LOG_FILE" <<'PY'
import sys, json
path = sys.argv[1]
records = []
with open(path, encoding="utf-8") as f:
    for line in f:
        line = line.strip()
        if line:
            try:
                records.append(json.loads(line))
            except Exception:
                pass
if len(records) <= 500:
    print(f"Log has {len(records)} entries — no trim needed.")
    sys.exit(0)
keep = records[-500:]
with open(path, "w", encoding="utf-8") as f:
    for r in keep:
        f.write(json.dumps(r, ensure_ascii=False) + "\\n")
print(f"Trimmed {len(records)} → 500 entries.")
PY
"""

[tasks.audit]
description = "Scan Python and npm dependencies for known CVEs"
run = """
#!/bin/bash
set -euo pipefail

echo "🔍 Python CVE scan (OSV service — installed env)..."
if ! .venv/bin/python -m pip show pip-audit &>/dev/null; then
    echo "Installing pip-audit..."
    .venv/bin/python -m pip install pip-audit --quiet
fi
# OSV service avoids pip-audit's broken venv-creation path on local
# macOS installs (subprocess SIGABRT on ensurepip). Scans the *installed*
# environment, which catches stale local pins requirements.txt has
# already addressed but which pip install --upgrade would clear.
.venv/bin/python -m pip_audit -s osv || {
    echo ""
    echo "⚠️  CVEs surfaced. Common cause: local venv is stale relative to requirements.txt."
    echo "💡 Try: source .venv/bin/activate && pip install --upgrade -r requirements.txt"
    exit 1
}
echo "✅ Python: no known vulnerabilities."

echo ""
echo "🔍 npm CVE scan..."
(cd web && mise exec -- npm audit --audit-level=moderate)
echo "✅ npm: no known vulnerabilities."
"""

[tasks."logs-perf"]
description = "Show recent perf/error/freeze events from .logs/events.jsonl"
run = """
#!/bin/bash
set -euo pipefail

EVENTS_FILE=".logs/events.jsonl"
if [[ ! -f "$EVENTS_FILE" ]]; then
    echo "No events log at $EVENTS_FILE"
    exit 0
fi

LIMIT="${1:-30}"
.venv/bin/python scripts/print_events.py "$EVENTS_FILE" "$LIMIT"
"""

[tasks."analyze-logs"]
description = "Harvest conversion + CI logs, surface anomalies (slow chapters, fallbacks, language mismatches)"
run = "python scripts/analyze_logs.py"

[tasks."hooks-test"]
description = "Validate Claude Code hook scripts are syntactically valid and executable"
run = """
#!/bin/bash
set -euo pipefail

HOOKS_DIR=".claude/hooks"
ok=0
fail=0
for script in "$HOOKS_DIR"/*.sh; do
    name=$(basename "$script")
    if [[ ! -x "$script" ]]; then
        echo "❌ $name: not executable"
        ((fail++)) || true
        continue
    fi
    if bash -n "$script" 2>/tmp/hook_syntax_err; then
        echo "✅ $name: OK"
        ((ok++)) || true
    else
        echo "❌ $name: syntax error"
        cat /tmp/hook_syntax_err
        ((fail++)) || true
    fi
done
echo ""
echo "Result: $ok OK, $fail failed"
[[ $fail -eq 0 ]]
"""

[tasks."benchmark:check"]
description = "Compare live telemetry throughput against benchmarks/baseline.json"
run = """
#!/bin/bash
set -euo pipefail
.venv/bin/python scripts/benchmark_regression.py "$@"
"""

# ── Desktop (Tauri) ────────────────────────────────────────────────────────────

[tasks."desktop:server"]
description = "Start Python backend sidecar locally (Edge-TTS, port 47860)"
run = """
#!/bin/bash
set -euo pipefail
source .venv/bin/activate
DISABLE_PIPER_FALLBACK=1 python python_app/desktop_main.py
"""

[tasks."desktop:sidecar"]
description = "Build PyInstaller sidecar binary (Edge-TTS only) and place in binaries/"
run = """
#!/bin/bash
set -euo pipefail
source .venv/bin/activate
pip install pyinstaller -q
pip install -r requirements-desktop.txt -q
pyinstaller desktop.spec --noconfirm --clean

TRIPLE=$(rustc -Vv | grep "^host" | cut -d' ' -f2)
mkdir -p desktop/src-tauri/binaries
cp dist/epub-to-mp3-server "desktop/src-tauri/binaries/epub-to-mp3-server-${TRIPLE}"
chmod +x "desktop/src-tauri/binaries/epub-to-mp3-server-${TRIPLE}"
echo "Sidecar ready: desktop/src-tauri/binaries/epub-to-mp3-server-${TRIPLE}"
"""

[tasks."desktop:web"]
description = "Build React frontend for desktop (loads .env.desktop → VITE_API_BASE=127.0.0.1:47860)"
dir = "web"
run = """
#!/bin/bash
set -euo pipefail
npm run build:desktop
# Postbuild guard: the bundle MUST contain the sidecar URL, otherwise the
# webview will fall back to relative /api and report "backend offline".
if ! grep -lqr "127.0.0.1:47860/api" dist/assets/*.js; then
  echo "FATAL: dist bundle does not contain 127.0.0.1:47860/api — VITE_API_BASE was not applied."
  echo "Check web/.env.desktop and that vite is loaded with --mode desktop."
  exit 1
fi
echo "Desktop bundle OK (VITE_API_BASE baked into dist/assets/)"
"""

[tasks."desktop:icons"]
description = "Generate all icon sizes from desktop/icon-source/icon.png"
dir = "desktop"
run = "tauri icon icon-source/icon.png"

[tasks."desktop:build"]
description = "Full desktop build for current platform + install + open"
run = """
#!/bin/bash
set -euo pipefail
case "$(uname)" in
  Darwin) mise run desktop:build:mac ;;
  Linux)  mise run desktop:build:linux && mise run desktop:run:linux ;;
  *)      mise run desktop:build:windows ;;
esac
"""

[tasks."desktop:dev"]
description = "Open Tauri dev window (run mise run desktop:server in another terminal first)"
dir = "desktop"
run = "VITE_API_BASE=http://127.0.0.1:47860/api tauri dev"

[tasks."desktop:run"]
description = "Launch the last built desktop app for current platform"
run = """
#!/bin/bash
set -euo pipefail
case "$(uname)" in
  Darwin) mise run desktop:run:mac ;;
  Linux)  mise run desktop:run:linux ;;
  *)      echo "Use the .exe in desktop/src-tauri/target/release/ on Windows" ;;
esac
"""

# ── Desktop — build per platform ──────────────────────────────────────────────
# macOS: mise run desktop:build → mise run desktop:run
# Dev:   terminal 1: mise run desktop:server  |  terminal 2: mise run desktop:dev

[tasks."desktop:build:mac"]
description = "Build macOS desktop app (.app + .dmg)"
run = """
#!/bin/bash
set -euo pipefail
mise run desktop:sidecar
mise run desktop:web
TRIPLE=$(rustc -Vv | grep "^host" | cut -d' ' -f2)
# Load updater signing key if available locally
KEY_FILE="$HOME/.config/epub-to-mp3/updater.key"
if [[ -f "$KEY_FILE" && -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
  export TAURI_SIGNING_PRIVATE_KEY=$(cat "$KEY_FILE")
  export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
fi
# Build only the .app (skip DMG to avoid macOS opening Finder)
cd desktop && tauri build --target "$TRIPLE" --bundles app
echo ""
echo "Done! Installing to /Applications and opening..."
cd ..
mise run desktop:run:mac
"""

[tasks."desktop:build:linux"]
description = "Build Linux desktop app (.AppImage + .deb)"
run = """
#!/bin/bash
set -euo pipefail
mise run desktop:sidecar
mise run desktop:web
KEY_FILE="$HOME/.config/epub-to-mp3/updater.key"
if [[ -f "$KEY_FILE" && -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
  export TAURI_SIGNING_PRIVATE_KEY=$(cat "$KEY_FILE")
  export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
fi
cd desktop && tauri build
echo ""
echo "Done! Artifacts:"
find desktop/src-tauri/target -name '*.AppImage' -o -name '*.deb' 2>/dev/null | head -5
"""

[tasks."desktop:build:windows"]
description = "Build Windows desktop app (.msi + .exe) — run on Windows or cross-compile"
run = """
#!/bin/bash
set -euo pipefail
mise run desktop:sidecar
mise run desktop:web
KEY_FILE="$HOME/.config/epub-to-mp3/updater.key"
if [[ -f "$KEY_FILE" && -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
  export TAURI_SIGNING_PRIVATE_KEY=$(cat "$KEY_FILE")
  export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
fi
cd desktop && tauri build
echo ""
echo "Done! Artifacts:"
find desktop/src-tauri/target -name '*.msi' -o -name '*-setup.exe' 2>/dev/null | head -5
"""

[tasks."desktop:run:mac"]
description = "Install built .app to /Applications (removing quarantine) and open it"
run = """
#!/bin/bash
set -euo pipefail
APP=$(find desktop/src-tauri/target -name "Epub to Mp3.app" -type d 2>/dev/null | grep -v "[.]cargo" | head -1)
if [[ -z "$APP" || ! -d "$APP" ]]; then
  echo "No .app found. Run: mise run desktop:build:mac"
  exit 1
fi
DEST="/Applications/Epub to Mp3.app"
# Kill existing instance so macOS actually launches the new binary
echo "Stopping any running instance..."
osascript -e 'tell application "Epub to Mp3" to quit' 2>/dev/null || true
sleep 1
# Kill main app binary + sidecar server (both match "epub-to-mp3" or "epub-to-m3")
pkill -9 -f "epub-to-mp3" 2>/dev/null || true
# Also kill by port in case sidecar is orphaned
lsof -ti :47860 2>/dev/null | xargs kill -9 2>/dev/null || true
sleep 1
echo "Installing to $DEST ..."
rm -rf "$DEST"
cp -r "$APP" "$DEST"
# Remove macOS quarantine so the app opens without Gatekeeper prompts
xattr -rd com.apple.quarantine "$DEST" 2>/dev/null || true
echo "Opening $DEST"
open "$DEST"
"""

[tasks."desktop:run:linux"]
description = "Run the built Linux binary"
run = """
#!/bin/bash
set -euo pipefail
BIN="desktop/src-tauri/target/release/epub-to-mp3"
if [[ ! -f "$BIN" ]]; then
  echo "Binary not found. Run: mise run desktop:build:linux"
  exit 1
fi
"$BIN" &
"""

# ── Generate all binaries (local build) ──────────────────────────────────────
# Android/iOS/Linux/Windows are built by CI (GitHub Actions).

[tasks."generate-binaries"]
description = "Build all locally-buildable binaries: desktop app + Docker image; copies artifacts to releases/"
run = """
#!/bin/bash
set -euo pipefail

RELEASES_DIR="$(pwd)/releases"
mkdir -p "$RELEASES_DIR"

echo "Building desktop app..."
mise run desktop:build

echo ""
echo "Copying desktop artifacts to releases/..."
if [[ "$(uname)" == "Darwin" ]]; then
  DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
  if [[ -n "$DMG" ]]; then
    cp "$DMG" "$RELEASES_DIR/"
    echo "  $(basename "$DMG") → releases/"
  fi
fi

echo ""
echo "Building Docker image..."
mise run docker:build

echo ""
echo "Done! Artifacts in releases/:"
ls -lh "$RELEASES_DIR/" 2>/dev/null || echo "  (empty)"
echo "Docker image → epub-to-mp3:local  (run: mise run docker:run)"
"""

# ── Docker ───────────────────────────────────────────────────────────────────────

[tasks."docker:build"]
description = "Build Docker image for self-hosting (same as HF Spaces)"
run = "docker build -t epub-to-mp3:local ."

[tasks."docker:run"]
description = "Run Docker image locally on port 7860"
run = "docker run --rm -p 7860:7860 epub-to-mp3:local"

# ── Mobile (Capacitor) ──────────────────────────────────────────────────────────

[tasks."mobile:build"]
description = "Build mobile web bundle (HF Spaces backend) — no Xcode/Android Studio needed locally"
dir = "web"
run = "npm run build:mobile"

[tasks."mobile:init"]
description = "Initialize Capacitor platforms (run once; native .ipa/.apk built by CI, not locally)"
dir = "web"
run = """
#!/bin/bash
set -euo pipefail
npm install
npx cap add ios || true
npx cap add android || true
npm run build:mobile
"""

# ── Tests ────────────────────────────────────────────────────────────────────────

[tasks."test:web"]
description = "Run web lint + test + build"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

(cd web && mise exec -- npm run lint)
(cd web && mise exec -- npm run test)
(cd web && mise exec -- npm run build)
"""

[tasks."test:desktop"]
description = "Run desktop/Tauri unit tests"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -d "desktop/src-tauri" ]; then
  echo "desktop/src-tauri not found"
  exit 1
fi

case "$(uname -s)-$(uname -m)" in
  Darwin-arm64) target_triple="aarch64-apple-darwin" ;;
  Darwin-x86_64) target_triple="x86_64-apple-darwin" ;;
  Linux-x86_64) target_triple="x86_64-unknown-linux-gnu" ;;
  *)
    echo "Unsupported desktop test target: $(uname -s)-$(uname -m)"
    exit 1
    ;;
esac

sidecar_path="desktop/src-tauri/binaries/epub-to-mp3-server-${target_triple}"
if [ ! -f "$sidecar_path" ]; then
  mkdir -p "$(dirname "$sidecar_path")"
  cat > "$sidecar_path" <<'SH'
#!/bin/sh
exit 0
SH
  chmod +x "$sidecar_path"
fi

(cd desktop/src-tauri && mise exec -- cargo test --lib)
"""

# ── Release ───────────────────────────────────────────────────────────────────────

[tasks.bump]
description = "Bump version (major|minor|patch|X.Y.Z), update changelog, commit and tag"
run = "bash scripts/bump.sh ${1:-patch}"

[tasks.changelog]
description = "Regenerate CHANGELOG.md from git history using git-cliff"
run = "git-cliff -o CHANGELOG.md"

[tasks."flutter:run"]
description = "Run the Flutter companion app on the connected device"
run = "cd flutter_app && flutter run"

[tasks."flutter:test"]
description = "Run Flutter unit + widget tests"
run = "cd flutter_app && flutter test"

[tasks."flutter:analyze"]
description = "Static analysis of the Flutter app (lints + type errors)"
run = "cd flutter_app && flutter analyze"

[tasks."flutter:build-apk"]
description = "Build a debug APK for Android"
run = "cd flutter_app && flutter build apk --debug"
