[tasks."ios:simulator:test"]
description = "Build and run iOS XCTest/UI tests on a selected Simulator. Set IOS_TESTS=Target/Class or Target/Class/test."
depends = ["vendor:python"]
run = """
#!/bin/bash
set -euo pipefail
"${MISE_PROJECT_ROOT:-.}/scripts/ios_disk_guard.sh"
python3 "${MISE_PROJECT_ROOT:-.}/scripts/guard_ios_simulator_resources.py"
cd ios/EpubToMp3

if ! command -v xcodegen >/dev/null 2>&1; then
  echo "error: xcodegen not installed. Install via: brew install xcodegen" >&2
  exit 1
fi
xcodegen generate

if [[ -n "${IOS_SIMULATOR_UDID:-}" ]]; then
  DEST="id=${IOS_SIMULATOR_UDID}"
else
  DEST="${IOS_DEST:-$(python3 ../../scripts/select_ios_simulator.py)}"
fi
UDID="${DEST##*id=}"
if [[ -z "$UDID" || "$UDID" == "$DEST" ]]; then
  echo "ios:simulator:test error: could not resolve a simulator UDID." >&2
  exit 2
fi
xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
xcrun simctl bootstatus "$UDID" -b
# iOS 26 may report Booted before testmanagerd has established its socket.
sleep 5

DD="${IOS_DERIVED_DATA_PATH:-./.build}"
run_simulator_tests() {
  local only=()
  if [[ -n "${IOS_TESTS:-}" ]]; then
    local tests=()
    IFS=',' read -r -a tests <<< "$IOS_TESTS"
    for test in "${tests[@]}"; do
      only+=("-only-testing:$test")
    done
  fi
  if [[ "${IOS_SKIP_BUILD:-0}" != "1" ]]; then
    xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
      -destination "$DEST" -derivedDataPath "$DD" build-for-testing
  fi
  if [[ -n "${IOS_TESTS:-}" ]]; then
    xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
      -destination "$DEST" -derivedDataPath "$DD" -parallel-testing-enabled NO \
      test-without-building "${only[@]}"
    return
  fi
  if [[ "${IOS_TEST_SHARDS:-4}" =~ ^[1-9][0-9]*$ ]]; then
    local shard_count="${IOS_TEST_SHARDS:-4}"
    local shard_index
    local -a unit_classes=()
    local -a ui_classes=()
    if [[ -z "${IOS_TESTS:-}" ]]; then
      while IFS= read -r -d '' file; do
        while read -r class_name; do
          [[ -n "$class_name" ]] && unit_classes+=("EpubToMp3Tests/$class_name")
        done < <(sed -nE 's/^[[:space:]]*(final[[:space:]]+)?class[[:space:]]+([A-Za-z0-9_]+):[[:space:]]*XCTestCase.*/\\2/p' "$file")
      done < <(find EpubToMp3Tests -maxdepth 1 -name '*.swift' -print0 | sort -z)
    fi
    if [[ -z "${IOS_TESTS:-}" ]]; then
      while IFS= read -r -d '' file; do
        while read -r class_name; do
          [[ -n "$class_name" ]] && ui_classes+=("EpubToMp3UITests/$class_name")
        done < <(sed -nE 's/^[[:space:]]*(final[[:space:]]+)?class[[:space:]]+([A-Za-z0-9_]+):[[:space:]]*XCTestCase.*/\\2/p' "$file")
      done < <(find EpubToMp3UITests -maxdepth 1 -name '*.swift' -print0 | sort -z)
    fi
    local -a isolated_classes=()
    local -a grouped_classes=()
    local class_name
    for class_name in "${unit_classes[@]}" "${ui_classes[@]}"; do
      if [[ "$class_name" == *Audiobook* || "$class_name" == *AudioPlayerStreamingTests || "$class_name" == *AudioPlayerSleepTimerTests || "$class_name" == *AudioPlayerSpeechFallbackTests || "$class_name" == *AudioUITests ]]; then
        isolated_classes+=("$class_name")
      else
        grouped_classes+=("$class_name")
      fi
    done
    for class_name in "${isolated_classes[@]}"; do
      echo "ios:simulator:test → isolated $class_name"
      xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
        -destination "$DEST" -derivedDataPath "$DD" -parallel-testing-enabled NO \
        test-without-building "-only-testing:$class_name"
    done
    local -a all_classes=("${grouped_classes[@]}")
    for ((shard_index=0; shard_index<shard_count; shard_index++)); do
      local -a shard_only=()
      local class_position
      for class_position in "${!all_classes[@]}"; do
        if (( class_position % shard_count == shard_index )); then
          shard_only+=("-only-testing:${all_classes[$class_position]}")
        fi
      done
      if [[ -n "${shard_only[*]}" ]]; then
        echo "ios:simulator:test → shard $((shard_index + 1))/$shard_count"
        xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
          -destination "$DEST" -derivedDataPath "$DD" \
          -parallel-testing-enabled NO test-without-building "${shard_only[@]}"
      fi
    done
    return 0
  fi
  xcodebuild -project EpubToMp3.xcodeproj -scheme EpubToMp3 -configuration Debug \
    -destination "$DEST" -derivedDataPath "$DD" test-without-building "${only[@]}"
}

export DEST DD IOS_SKIP_BUILD
export -f run_simulator_tests
python3 ../../scripts/heavy_job_guard.py ios:simulator:test -- bash -e -c run_simulator_tests
"""

