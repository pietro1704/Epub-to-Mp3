[tools]
# Exact Python version required for Coqui TTS (requires 3.11)
python = { version = "3.11.11", virtualenv = ".venv" }
# Node LTS for frontend (Vite 7.x requires >=20.19.0)
node = "latest"
npm = "latest"
# Rust toolchain for Tauri desktop builds
rust = "stable"
# Tauri CLI — installed via mise npm backend, available as `tauri` globally
"npm:@tauri-apps/cli" = "2"
# Changelog generator (conventional commits → CHANGELOG.md)
"cargo:git-cliff" = "latest"

[tasks.dev]
description = "Start backend (uvicorn) and frontend (Vite) together"
run = "./scripts/dev.sh"

[tasks.clean]
description = "Clean backend cache, pycache, and completed outputs"
run = """
#!/bin/bash
set -e

echo "🧹 Cleaning backend cache..."

# Remove __pycache__ directories
echo "  → Removing __pycache__..."
find python_app -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
find . -maxdepth 1 -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

# Remove .pyc files
echo "  → Removing .pyc files..."
find python_app -type f -name "*.pyc" -delete 2>/dev/null || true
find . -maxdepth 2 -type f -name "*.pyc" -delete 2>/dev/null || true

# Remove pytest cache
echo "  → Removing .pytest_cache..."
rm -rf .pytest_cache 2>/dev/null || true
rm -rf python_app/.pytest_cache 2>/dev/null || true

# Remove output directory (completed conversions) and job metadata/uploads
# Note: output/.* contains jobs, uploads, inputs that need to be cleaned
echo "  → Removing output files and jobs..."
rm -rf output/* 2>/dev/null || true
rm -rf output/.jobs output/.uploads output/.job_inputs output/.source_backups 2>/dev/null || true
rm -rf output/.cover_cache 2>/dev/null || true
# Also clean from root (may exist from older versions)
rm -rf .jobs .uploads .job_inputs 2>/dev/null || true

# Remove cached books but keep downloaded models
echo "  → Cleaning book cache (preserving models)..."
PYTHONPATH=python_app python - <<'PY'
from src.cache_manager import CacheManager

try:
    manager = CacheManager()
    removed = manager.clear_cache()
    msg = "    Book cache cleared." if removed else "    No book cache found."
    print(msg)
except Exception as exc:
    print(f"    ⚠️ Failed to clear cache: {exc}")
PY

# Remove mise cache
echo "  → Removing .mise-cache..."
rm -rf .mise-cache 2>/dev/null || true

echo "✅ Clean complete!"
echo ""
echo "Cleaned directories:"
echo "  - __pycache__"
echo "  - .pyc files"
echo "  - .pytest_cache"
echo "  - output/*"
echo "  - book cache (.cache/<book>), models preserved"
echo "  - .mise-cache"
"""

[tasks.install]
description = "Install Python and web dependencies (venv + npm)"
run = """
#!/bin/bash
set -euo pipefail

echo "📦 Installing dependencies with mise..."
mise install

echo "🐍 Creating .venv (Python managed by mise) if missing..."
if [ ! -x ".venv/bin/python" ]; then
  mise exec -- python -m venv .venv
fi

echo "🐍 Installing Python dependencies (root)..."
.venv/bin/python -m pip install -r requirements.txt

echo "🐍 Installing Python dependencies (python_app)..."
.venv/bin/python -m pip install -r python_app/requirements.txt

echo "🔍 Installing lint/format tools..."
.venv/bin/python -m pip install ruff pre-commit

echo "🎙️ Configuring native Piper..."
bash scripts/install_piper_binary.sh

echo "🌐 Installing web dependencies..."
(cd web && mise exec -- npm install)
"""

[tasks.test]
description = "Run unit + integration + web tests"
run = """
#!/bin/bash
set -euo pipefail

mise run test:unit
mise run test:integration
mise run test:web
"""

[tasks."test:unit"]
description = "Run Python unit tests (excluding benchmarks)"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests test_ambiguous_languages.py test_new_features.py -k "not benchmark"
"""

[tasks."test:integration"]
description = "Run Python integration/benchmark-style tests"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

.venv/bin/python -m pytest python_app/tests -k "benchmark"
"""

[tasks."trim-log"]
description = "Trim conversions.jsonl to last 500 entries to keep it fast"
run = """
#!/bin/bash
set -euo pipefail

LOG_FILE=".logs/conversions.jsonl"
if [[ ! -f "$LOG_FILE" ]]; then
    echo "No log file found at $LOG_FILE"
    exit 0
fi

python3 - "$LOG_FILE" <<'PY'
import sys, json
path = sys.argv[1]
records = []
with open(path, encoding="utf-8") as f:
    for line in f:
        line = line.strip()
        if line:
            try:
                records.append(json.loads(line))
            except Exception:
                pass
if len(records) <= 500:
    print(f"Log has {len(records)} entries — no trim needed.")
    sys.exit(0)
keep = records[-500:]
with open(path, "w", encoding="utf-8") as f:
    for r in keep:
        f.write(json.dumps(r, ensure_ascii=False) + "\\n")
print(f"Trimmed {len(records)} → 500 entries.")
PY
"""

[tasks.audit]
description = "Scan Python and npm dependencies for known CVEs"
run = """
#!/bin/bash
set -euo pipefail

echo "🔍 Python CVE scan..."
if ! .venv/bin/python -m pip show pip-audit &>/dev/null; then
    echo "Installing pip-audit..."
    .venv/bin/python -m pip install pip-audit --quiet
fi
.venv/bin/python -m pip_audit --requirement requirements.txt --requirement python_app/requirements.txt
echo "✅ Python: no known vulnerabilities."

echo ""
echo "🔍 npm CVE scan..."
(cd web && mise exec -- npm audit --audit-level=moderate)
echo "✅ npm: no known vulnerabilities."
"""

[tasks."hooks-test"]
description = "Validate Claude Code hook scripts are syntactically valid and executable"
run = """
#!/bin/bash
set -euo pipefail

HOOKS_DIR=".claude/hooks"
ok=0
fail=0
for script in "$HOOKS_DIR"/*.sh; do
    name=$(basename "$script")
    if [[ ! -x "$script" ]]; then
        echo "❌ $name: not executable"
        ((fail++)) || true
        continue
    fi
    if bash -n "$script" 2>/tmp/hook_syntax_err; then
        echo "✅ $name: OK"
        ((ok++)) || true
    else
        echo "❌ $name: syntax error"
        cat /tmp/hook_syntax_err
        ((fail++)) || true
    fi
done
echo ""
echo "Result: $ok OK, $fail failed"
[[ $fail -eq 0 ]]
"""

# ── Desktop (Tauri) ────────────────────────────────────────────────────────────

[tasks."desktop:server"]
description = "Start Python backend sidecar locally (Edge-TTS, port 47860)"
run = """
#!/bin/bash
set -euo pipefail
source .venv/bin/activate
DISABLE_PIPER_FALLBACK=1 python python_app/desktop_main.py
"""

[tasks."desktop:sidecar"]
description = "Build PyInstaller sidecar binary (Edge-TTS only) and place in binaries/"
run = """
#!/bin/bash
set -euo pipefail
source .venv/bin/activate
pip install pyinstaller -q
pip install -r requirements-desktop.txt -q
pyinstaller desktop.spec --noconfirm --clean

TRIPLE=$(rustc -Vv | grep "^host" | cut -d' ' -f2)
mkdir -p desktop/src-tauri/binaries
cp dist/epub-to-mp3-server "desktop/src-tauri/binaries/epub-to-mp3-server-${TRIPLE}"
chmod +x "desktop/src-tauri/binaries/epub-to-mp3-server-${TRIPLE}"
echo "Sidecar ready: desktop/src-tauri/binaries/epub-to-mp3-server-${TRIPLE}"
"""

[tasks."desktop:web"]
description = "Build React frontend for desktop (VITE_API_BASE=localhost:47860)"
dir = "web"
run = "VITE_API_BASE=http://127.0.0.1:47860/api npm run build"

[tasks."desktop:icons"]
description = "Generate all icon sizes from desktop/icon-source/icon.png"
dir = "desktop"
run = "tauri icon icon-source/icon.png"

[tasks."desktop:build"]
description = "Full desktop build: sidecar + web frontend + Tauri package"
run = """
#!/bin/bash
set -euo pipefail
mise run desktop:sidecar
mise run desktop:web
cd desktop && tauri build
"""

[tasks."desktop:dev"]
description = "Open Tauri dev window (run mise run desktop:server in another terminal first)"
dir = "desktop"
run = "VITE_API_BASE=http://127.0.0.1:47860/api tauri dev"

[tasks."desktop:run"]
description = "Launch the last built desktop app bundle"
run = """
#!/bin/bash
set -euo pipefail
if [[ "$(uname)" == "Darwin" ]]; then
  APP="desktop/src-tauri/target/release/bundle/macos/Epub to Mp3.app"
  if [[ ! -d "$APP" ]]; then
    echo "App bundle not found. Run: mise run desktop:build"
    exit 1
  fi
  open "$APP"
elif [[ "$(uname)" == "Linux" ]]; then
  BIN="desktop/src-tauri/target/release/epub-to-mp3"
  if [[ ! -f "$BIN" ]]; then
    echo "Binary not found. Run: mise run desktop:build"
    exit 1
  fi
  "$BIN" &
else
  echo "Use the .exe in desktop/src-tauri/target/release/ on Windows"
fi
"""

# ── Generate all binaries (local build, macOS only) ──────────────────────────────
# Android/iOS/Linux/Windows are built by CI (GitHub Actions) and uploaded to Releases.
# Output locations after this command:
#   macOS .app/.dmg  → desktop/src-tauri/target/release/bundle/macos/
#   Docker image     → local Docker daemon (epub-to-mp3:local)

[tasks."generate-binaries"]
description = "Build all locally-buildable binaries: desktop app + Docker image; copies artifacts to releases/"
run = """
#!/bin/bash
set -euo pipefail

RELEASES_DIR="$(pwd)/releases"
mkdir -p "$RELEASES_DIR"

echo "▶ Building desktop app (macOS)..."
mise run desktop:build

echo ""
echo "▶ Copying desktop artifacts to releases/..."
if [[ "$(uname)" == "Darwin" ]]; then
  DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -1)
  if [[ -n "$DMG" ]]; then
    cp "$DMG" "$RELEASES_DIR/"
    echo "   Copied: $(basename "$DMG") → releases/"
  fi
  APP_TAR="$RELEASES_DIR/Epub-to-Mp3-macOS.tar.gz"
  APP_DIR="desktop/src-tauri/target/release/bundle/macos"
  if [[ -d "$APP_DIR" ]]; then
    tar -czf "$APP_TAR" -C "$APP_DIR" .
    echo "   Copied: Epub-to-Mp3-macOS.tar.gz → releases/"
  fi
fi

echo ""
echo "▶ Building Docker image..."
mise run docker:build

echo ""
echo "✅ Done! All artifacts in releases/:"
ls -lh "$RELEASES_DIR/" 2>/dev/null || echo "   (empty)"
echo ""
echo "   Docker image → epub-to-mp3:local  (run: mise run docker:run)"
echo ""
echo "Android/iOS/Linux/Windows are built by CI on every push to master."
echo "Download from: https://github.com/pietro1704/Epub-to-Mp3/releases"
"""

# ── Docker ───────────────────────────────────────────────────────────────────────

[tasks."docker:build"]
description = "Build Docker image for self-hosting (same as HF Spaces)"
run = "docker build -t epub-to-mp3:local ."

[tasks."docker:run"]
description = "Run Docker image locally on port 7860"
run = "docker run --rm -p 7860:7860 epub-to-mp3:local"

# ── Mobile (Capacitor) ──────────────────────────────────────────────────────────

[tasks."mobile:build"]
description = "Build mobile web bundle (HF Spaces backend) — no Xcode/Android Studio needed locally"
dir = "web"
run = "npm run build:mobile"

[tasks."mobile:init"]
description = "Initialize Capacitor platforms (run once; native .ipa/.apk built by CI, not locally)"
dir = "web"
run = """
#!/bin/bash
set -euo pipefail
npm install
npx cap add ios || true
npx cap add android || true
npm run build:mobile
"""

# ── Tests ────────────────────────────────────────────────────────────────────────

[tasks."test:web"]
description = "Run web lint + test + build"
run = """
#!/bin/bash
set -euo pipefail

if [ ! -x ".venv/bin/python" ]; then
  mise run install
fi

(cd web && mise exec -- npm run lint)
(cd web && mise exec -- npm run test)
(cd web && mise exec -- npm run build)
"""

# ── Release ───────────────────────────────────────────────────────────────────────

[tasks.bump]
description = "Bump version (major|minor|patch|X.Y.Z), update changelog, commit and tag"
run = "bash scripts/bump.sh ${1:-patch}"

[tasks.changelog]
description = "Regenerate CHANGELOG.md from git history using git-cliff"
run = "git-cliff -o CHANGELOG.md"
