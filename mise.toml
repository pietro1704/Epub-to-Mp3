[tasks."apple:foundation:test"]
description = "Run focused XCTest on the app's actual Foundation production files without launching an app"
run = '''
mise exec -- ruby scripts/native_job.rb build -- xcrun swift -e '
import Foundation
import Darwin
let taskRoot = ProcessInfo.processInfo.environment["MISE_PROJECT_ROOT"] ?? FileManager.default.currentDirectoryPath
let ffiEnabled = ProcessInfo.processInfo.environment["APP_FOUNDATION_FFI_TESTS"] == "1"
if ffiEnabled {
    let build = Process()
    build.currentDirectoryURL = URL(fileURLWithPath: taskRoot)
    build.executableURL = URL(fileURLWithPath: "/usr/bin/env")
    build.arguments = ["mise", "exec", "--", "cargo", "build", "-p", "converter-ffi", "--jobs", "1"]
    try build.run()
    build.waitUntilExit()
    guard build.terminationStatus == 0 else { exit(build.terminationStatus) }
}
let child = Process()
child.executableURL = URL(fileURLWithPath: "/usr/bin/xcrun")
child.arguments = ["swift", "test", "--package-path", taskRoot + "/ios/EpubToMp3",
                   "--scratch-path", ProcessInfo.processInfo.environment["APPLE_DERIVED_DATA_PATH"]! + "/Build/AppFoundation", "--jobs", "1"]
var environment = ProcessInfo.processInfo.environment
if ffiEnabled {
    environment["APP_FOUNDATION_FFI_LIBRARY"] = taskRoot + "/target/debug/libconverter_ffi.dylib"
}
if environment["APP_FOUNDATION_FFI_FIXTURE"] == nil {
    environment["APP_FOUNDATION_FFI_FIXTURE"] = taskRoot + "/ruby_app/rails_gateway/public/sample.epub"
}
child.environment = environment
try child.run()
child.waitUntilExit()
exit(child.terminationStatus)
'
'''

