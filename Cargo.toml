[workspace]
resolver = "2"
members = [
    "crates/converter-core",
    "crates/converter-ffi",
    "crates/converter-server",
    "crates/converter-cli",
    "crates/converter-wasm",
    "native/piper-runtime",
    "native/vendor/espeak-rs-sys",
    "native/vendor/espeak-rs",
    "benches",
]

[workspace.package]
edition = "2021"
license = "MIT"
# Product version: the single release version source (ruby_app/rails_gateway/VERSION mirrors it).
version = "0.11.0"

[workspace.dependencies]
serde = "1"
serde_json = "1"
tokio = "1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "9.0.5", default-features = false }
tempfile = "3"
futures-util = "0.3"

[patch.crates-io]
piper-rs = { path = "native/vendor/piper-rs" }
espeak-rs = { path = "native/vendor/espeak-rs" }
espeak-rs-sys = { path = "native/vendor/espeak-rs-sys" }

[profile.dev]
# Keep source lines and symbol names without full dependency type metadata.
debug = "line-tables-only"
strip = "none"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

