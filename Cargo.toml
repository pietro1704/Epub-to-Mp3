[workspace]
resolver = "2"
exclude = ["native/vendor/sherpa-onnx-sys"]
members = [
    "crates/converter-core",
    "crates/converter-ffi",
    "crates/converter-server",
    "crates/converter-cli",
    "crates/converter-wasm",
    "native/piper-runtime",
    "native/vendor/espeak-rs-sys",
    "benches",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]

[patch.crates-io]
# Published 1.13.8 source with the upstream ZIP security dependency fix:
# https://github.com/k2-fsa/sherpa-onnx/commit/1a9d234ab95567eba8c2e89873a87d70b79633e2
sherpa-onnx-sys = { path = "native/vendor/sherpa-onnx-sys" }
espeak-rs = { path = "native/vendor/espeak-rs" }
espeak-rs-sys = { path = "native/vendor/espeak-rs-sys" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

