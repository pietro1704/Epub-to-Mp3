[workspace]
resolver = "3"
members = [
    "crates/converter-core",
    "crates/converter-ffi",
    "crates/epub2mp3-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
