# Nixpacks configuration for Railway
# Railway uses Nixpacks by default to build Python applications

[phases.setup]
nixPkgs = ["python311", "ffmpeg"]

[phases.install]
cmds = ["pip install -r python_app/requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "cd python_app && uvicorn server:app --host 0.0.0.0 --port $PORT"
