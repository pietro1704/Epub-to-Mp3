<!DOCTYPE html>
<html>
<head>
    <title>Test Formatting</title>
</head>
<body>
    <h1>Teste de Formatação</h1>

    <p>Este é um parágrafo normal.</p>

    <p>Este parágrafo contém <i>texto em itálico</i> e <b>texto em negrito</b>.</p>

    <p>Aqui temos <em>ênfase</em> e <strong>texto forte</strong>.</p>

    <p>Código: <code>printf("Hello World");</code></p>

    <blockquote>Esta é uma citação em bloco.</blockquote>

    <p>Texto normal, <i>itálico</i>, <b>negrito</b>, e <code>código</code> misturados.</p>
</body>
</html>
