[tools]
python = { version = "3.11", virtualenv = "python_app/.venv" }
node = "20"

[tasks."python:install"]
run = "python -m pip install -r python_app/requirements.txt"

[tasks."python:test"]
run = "pytest"

[tasks."python:server"]
dir = "python_app"
run = "uvicorn server:app --reload --host 0.0.0.0 --port 8000"

[tasks."web:install"]
dir = "web"
run = "npm install"

[tasks."web:test"]
dir = "web"
run = "npm run test"

[tasks."web:build"]
dir = "web"
run = "npm run build"

[tasks."web:dev"]
dir = "web"
env = { VITE_API_BASE = "http://localhost:8000" }
run = "npm run dev"

[tasks."dev"]
description = "Start both Python server and web frontend"
depends = ["python:server", "web:dev"]
