[tools]
python = "3.11"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Instala dependências do projeto"
run = """
pip install --upgrade pip
pip install -r python_app/requirements.txt
"""

[tasks.convert]
description = "Converte EPUB para MP3"
run = "python python_app/convert \"$@\""

[tasks.server]
description = "Inicia o servidor FastAPI"
run = "python python_app/server.py"

[tasks.test]
description = "Executa testes"
run = "pytest python_app/tests/ -v -W ignore::DeprecationWarning"
